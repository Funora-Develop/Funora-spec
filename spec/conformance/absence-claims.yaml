# Утверждения об ОТСУТСТВИИ и снимки, на которых они проверены.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ ЗАВЕДЁН 31.08.2026. Сверка контракта с независимой реализацией
# того же протокола нашла около сорока мест, где спецификация утверждала «этого
# на странице нет», а наблюдение лежало в наших же записях.
#
# У всех сорока один и тот же механизм, и он не про небрежность. Снимок
# пересняли - он стал богаче, - а утверждение об отсутствии осталось прежним, и
# перечитывать его было некому. Ворота сторожат, чтобы объявленное было
# написано. Обратного они не сторожили: чтобы утверждение об отсутствии не
# пережило наблюдение, которое его опровергает.
#
# Самое дорогое из сорока: «кода валюты страница не даёт». Утверждение стояло в
# шести местах и держало Money, Lot, события рынка и валюту заказа - то есть
# самый крупный затор проекта. Держало три недели.
#
# КАК ЭТОТ ФАЙЛ РАБОТАЕТ. Каждое утверждение об отсутствии называет снимки, на
# которых проверено, и ОТПЕЧАТОК каждого снимка. Проверка в реализации считает
# отпечатки заново.
#
# Пересняли снимок - отпечаток разошёлся - проверка упала, и упала ИМЕННО на том
# утверждении, которое надо перечитать. Не на всех сразу и не молча.
#
# ПОЧЕМУ ОТПЕЧАТОК, А НЕ ДАТА. Дата снимка не меняется при выгрузке из хранилища
# истории, а время правки файла меняется от одного git checkout. Отпечаток
# содержимого не врёт ни в ту, ни в другую сторону.
#
# ЧЕГО ЭТОТ ФАЙЛ НЕ ДЕЛАЕТ. Он не проверяет, что утверждение ВЕРНО - для этого
# нужен человек, читающий снимок. Он делает единственное: не даёт утверждению
# пережить пересъёмку молча.

version_note: >-
  Собственной версии у файла нет: ось одна, см. spec/version.yaml.

# --- Где живут снимки -------------------------------------------------------
snapshots_live_in: >-
  Funora-python: tests/fixtures. Каталог observations там закрыт от репозитория
  намеренно - это рабочая площадка сборщика, куда попадает и сырая разметка, -
  и потому улика, на которой стоит утверждение, кладётся в фикстуры ПОИМЁННО.

  Утверждение, опирающееся на файл вне репозитория, проверяется только у того,
  у кого этот файл есть. У прочих проверка проходит молча и не проверяет
  ничего - то есть становится театром.

  Проверка отпечатков выполняется там же: tests/test_absence_claims.py.

  Перенести проверку сюда имело бы смысл при второй реализации; до тех пор
  дублировать снимки незачем.

# --- Правило для новых утверждений ------------------------------------------
rule_for_new_claims: >-
  Утверждение об отсутствии, вносимое в spec/extraction или в
  spec/conformance/not-implemented.yaml, обязано появиться и здесь - со
  снимками, на которых проверено.

  Утверждение без снимка проверить нечем, и от выдумки оно неотличимо ровно так
  же, как правило извлечения без evidence.

# --- Сами утверждения -------------------------------------------------------
claims:
  currency_code_from_symbol:
    asserts: >-
      СНЯТО 31.08.2026. Утверждение звучало так: «соответствие между знаком
      валюты и её кодом не однозначно, и приписать код значило бы приписать
      чужую валюту».
    verdict: refuted
    refuted_by: >-
      Набор валют площадки замкнут тремя, и замкнутость наблюдена дважды
      независимо: ключи eur/rub/usd в настройках вывода и переключатель, всякий
      раз дающий ровно две альтернативы. Знаков в span.unit наблюдалось тоже
      три, столкновений нет.
    lived_for: >-
      Три недели, в шести местах контракта сразу. Держало Money, Lot, события
      рынка и валюту заказа.
    checked_against:
      - file: tests/fixtures/pages/account-balance.v9.logged.ru.skeleton.txt
        digest: "0aafa6ec2b5635de"
    asserted_at: "2026-08-31"

  lot_visibility_marker:
    asserts: >-
      СНЯТО 31.08.2026. Утверждение звучало так: «признака показа лота в выдаче
      на странице своих лотов нет ни одного, все строки структурно одинаковы».
    verdict: refuted
    refuted_by: >-
      Выключенная строка несёт класс warning. Строки одинаковы, пока все лоты
      включены, - а у владельца все и были включены, и снимок вышел однородным.
    lived_for: >-
      Три недели. Утверждение сторожила ПРОВЕРКА, требовавшая, чтобы поля
      is_active в модели не было: неправду повторяли хором модель, проверка и
      документация.
    checked_against:
      - file: tests/fixtures/pages/lots-trade.off.logged.ru.skeleton.txt
        digest: "ad87befa0fced33c"
    asserted_at: "2026-08-31"

  lot_save_request_unobserved:
    asserts: >-
      СНЯТО 31.08.2026. Утверждение звучало так: «форма наблюдена, ЗАПРОС нет;
      неизвестно, чем площадка отвечает на сохранение».
    verdict: refuted
    refuted_by: >-
      Запрос наблюдён дважды, и на нём уже работала правка цены. Ответ приходит
      объектом с ключами done, error, errors, url.
    lived_for: >-
      Неделю - ровно столько запись отставала от собственной реализации.
    checked_against:
      - file: tests/fixtures/network/network.lot-save-form.json
        digest: "c579dd44b7e5680a"
    asserted_at: "2026-08-31"

  amount_stays_text:
    asserts: >-
      Разделитель дробной части в сумме НЕ наблюдается, и потому текст суммы не
      переводится в минорные единицы Money.
    verdict: standing
    positive_marker: >-
      Ячейка .tc-price.tc-seller-sum подписана T4:dp - четыре знака, цифры И
      ПУНКТУАЦИЯ. То есть знак пунктуации в сумме ЕСТЬ, а какой именно, подпись
      не говорит: она сохраняет состав, а не значение.

      Это положительный признак, а не молчание: утверждение опирается на то, что
      в снимке ВИДНО, а не на то, чего в нём не нашлось.
    what_would_refute_it: >-
      Снимок суммы, у которой известны и написание, и числовое значение. Проще
      всего - собственный лот с ценой, которую мы сами и ставили.
    checked_against:
      - file: tests/fixtures/pages/orders-trade.logged.ru.skeleton.txt
        digest: "63a117e2367b1ba5"
    asserted_at: "2026-08-31"

  unchecked_flag_shape:
    asserts: >-
      Вид запроса при СНЯТОМ флажке active нами не наблюдался.
    verdict: standing
    positive_marker: >-
      Оба наших снимка сохранения лота содержат поле active, то есть сняты с
      ОТМЕЧЕННЫМ флажком. Это положительный признак: мы утверждаем не «поля
      нигде нет», а «оба имеющихся снимка сняты в одном положении».
    what_would_refute_it: >-
      Запись сохранения с выключенным лотом. Наблюдение обратимое: флажок
      возвращается тем же действием.
    checked_against:
      - file: tests/fixtures/network/network.lot-save-form.json
        digest: "c579dd44b7e5680a"
    asserted_at: "2026-08-31"

  promote_success_shape:
    asserts: >-
      Успешный ответ на поднятие нами не наблюдался.
    verdict: standing
    positive_marker: >-
      Единственная запись поднятия несёт unlock_at и wait - то есть срок до
      следующей попытки. Ответ со сроком ожидания есть положительный признак
      ОТКАЗА по остыванию, а не молчание о том, чего не нашлось.
    what_would_refute_it: >-
      Запись поднятия, сделанная после истечения остывания. Второй попытки в тот
      же день не делать: предел невосполним.
    checked_against:
      - file: tests/fixtures/network/network.promote.json
        digest: "d222a1d37977b2f9"
    asserted_at: "2026-08-31"
