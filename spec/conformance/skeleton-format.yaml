# Формат структурного скелета страницы.
#
# Снимки настоящих страниц площадки хранятся не сырой разметкой, а скелетами:
# структура целиком, тексты и значения атрибутов - подписями. Правило проекта
# жёсткое: сырая разметка авторизованных страниц в репозиторий не попадает
# никогда. Страницы сняты под сессией, там имена покупателей, тексты переписки и
# номера заказов, а ручная чистка оставляет вопрос «достаточно ли вычищено»
# открытым навсегда - и git-историю из форков потом не переписать.
#
# Зачем это в спецификации. Скелеты - общая проверочная база: по ним сверяется,
# что объявленный селектор вправду присутствует на наблюдённой странице. Вторая
# реализация обязана уметь построить скелет ТОГО ЖЕ вида, иначе она не сможет ни
# принять чужие снимки, ни отдать свои. До сих пор формат описывался только
# внутри эталонной реализации, а версия его была литералом в коде.

version: "0.1.0"

format: structural-skeleton-v6

accepted_formats:
  - structural-skeleton-v3
  - structural-skeleton-v4
  - structural-skeleton-v5
  - structural-skeleton-v6

# Версии, в которых идентификаторы РАЗЛИЧИМЫ между собой.
#
# Перечень нужен проверкам, а не чтению. Пока идентификаторы схлопывались в одну
# подпись, всякая проверка курсора, гашения и порождения событий проходила
# впустую и выглядела при этом пройденной; на это наступали дважды. Требовать
# различимости от снимка версии v3 нечестно - восстановить её он не может, - а
# от прочих обязательно.
#
# Свойство объявлено перечнем, а не выведено из порядка версий. Вывод по порядку
# сломался бы на первой же версии, поднятой по другой причине: v6 поднята из-за
# маскировки заглавных, к нумерации отношения не имеющей.
numbered_formats:
  - structural-skeleton-v4
  - structural-skeleton-v5
  - structural-skeleton-v6

irreversibility:
  rule: >-
    Хранится подпись, обратного преобразования не существует. Это свойство
    формата, а не предосторожность при захвате.
  verified_by: >-
    Проверка на отсутствие текста в снимке выполняется при каждом запуске, а не
    считается выполненной однажды.

# --- Подпись текстового узла ------------------------------------------------
text_signature:
  shape: "T{длина}:{классы}"
  length: Число знаков исходного текста.
  classes_are_sorted: true
  classes_are_unique: true
  normalization: NFC
  normalization_note: >-
    Текст приводится к NFC перед разбором на классы. Иначе одна и та же буква
    дала бы разный состав классов в зависимости от того, каким стеком пришла
    страница.

  character_classes:
    d: Цифры.
    a: Латиница любого регистра.
    c: Кириллица любого регистра.
    s: Пробельные знаки.
    p: Пунктуация ASCII.
    o: Всё прочее.

  order_note: >-
    Классы выводятся отсортированными и без повторов: иначе один и тот же текст
    давал бы разные подписи в зависимости от порядка знаков, и снимок перестал
    бы быть воспроизводимым.

# --- Атрибуты ---------------------------------------------------------------
attributes:
  masked: true
  preserved_verbatim:
    - class
  preserved_note: >-
    Класс сохраняется дословно: без него не написать ни одного селектора, а
    именно ради селекторов снимки и существуют.

  numbering:
    shape: "T{длина}:{классы}#{номер}"
    scope: document
    why: >-
      Без номеров все пятьдесят диалогов страницы несли одну подпись, и
      проверка, опирающаяся на их различимость, проходила впустую, выглядя
      пройденной.
  signature_kept_note: >-
    Подпись при нумерации остаётся: по ней видны длина и состав, а именно на
    длинах строились выводы о позициях сообщений.

# --- Адреса -----------------------------------------------------------------
links:
  own_host:
    path: >-
      Форма пути сохраняется, идентификатор нумеруется: /orders/12345
      превращается в /orders/{n1}. Видно, что ссылка ведёт на заказ, и видно,
      тот же это заказ или другой, - но не видно какой.
    query: Заменяется номером - /chat/?{q1}.

    what_counts_as_an_identifier: >-
      Сегмент считается идентификатором, если содержит цифру, ЗАГЛАВНУЮ БУКВУ
      либо знак вне латиницы. Прочие сохраняются дословно как слова маршрута.

      Правило про заглавную заведено версией v6 и не косметика. Прежде
      маскировались только сегменты с цифрами, и первый же снимок страницы
      отдельного заказа принёс /orders/SBVZKXAF/ ДОСЛОВНО: идентификаторы
      площадки - восемь заглавных латинских букв без единой цифры.

      Довод, по которому граница проведена именно здесь: слова маршрута пишутся
      строчными по соглашению об адресах, а регистр в сегменте означает, что
      значение пришло не из словаря разработчика. Ошибаться правило будет в
      сторону лишней маскировки, и это верная сторона: лишняя подпись стоит
      одной пересобранной фикстуры, недостающая - идентификатора чужой сделки в
      открытом репозитории.

  foreign_host:
    path: >-
      Маскируется целиком: t.me/ivanpetrov превращается в t.me/{t}. Схема и имя
      хоста остаются - они публичны и говорят, куда ведёт ссылка, не говоря, к
      кому.
    query: Отбрасывается.
    numbering: none
    why_no_numbering: >-
      На чужом хосте совпадение само по себе - сведение о третьем лице.
    history_note: >-
      Прежнее правило маскировало сегмент только при наличии цифр либо
      нелатинских знаков, и имя вроде ivanpetrov прошло бы в снимок дословно.
      Та же ошибка на своём хосте прожила до v6 - см. what_counts_as_an_identifier.

# --- Что формат НЕ обещает --------------------------------------------------
not_comparable_across_documents:
  rule: >-
    Номера не связаны между документами. Один и тот же заказ получает разные
    номера в двух снимках, а разные заказы - одинаковые.
  consequence: >-
    Сравнивать снимки по номерам нельзя. Это ловушка, которую вводит сам формат,
    и записана она здесь затем, чтобы вторая реализация не построила на номерах
    сверку двух снимков.

text_nodes_are_not_numbered:
  rule: Текстовые узлы номеров не получают.
  why: >-
    Граница проведена по различию «разметка против содержимого»: равенство двух
    значений атрибута нужно проверкам, равенство двух сообщений переписки не
    нужно никому.

# --- Где лежат снимки -------------------------------------------------------
fixtures_location:
  repository: Funora-python
  path: tests/fixtures/pages
  note: >-
    Снимки живут в эталонной реализации, а не здесь. Переносить их в этот
    репозиторий имеет смысл, когда появится вторая реализация; до тех пор
    дублировать их незачем, а описание формата нужно уже сейчас - чтобы вторая
    реализация могла построить такой же.
