# Протокол запуска набора соответствия.
#
# Ось версий заведена в spec/version.yaml как runner_protocol и до сих пор
# ничего не описывала: менять было нечего, потому что набора не существовало.
# Теперь набор есть - векторы канонической формы и отпечатка, - и способ его
# прогнать обязан быть общим, иначе каждая реализация проверит себя по-своему и
# все шестеро окажутся согласны сами с собой.
#
# Главное свойство протокола - НЕЛЬЗЯ ПРОМОЛЧАТЬ. Реализация, не умеющая
# случай, обязана сказать об этом словами и назвать запись реестра
# неисполненного. Набор, который можно тихо пропустить, показывает согласие
# там, где его нет, и это хуже отсутствия набора: отсутствие видно, ложное
# согласие нет.

version: "0.1.0"

protocol: 1

# --- Как запускается --------------------------------------------------------
invocation:
  transport: jsonl_stdin_stdout
  rule: >-
    Реализация предоставляет исполняемую команду. Раннер подаёт ей случаи по
    одному в строке в виде JSON и читает ответы так же - по одному в строке.

  encoding: >-
    UTF-8 на обоих потоках, и задать её реализация обязана явно. Кодировка по
    умолчанию берётся у системы: на Windows это оказалась cp1251, и раннер
    получал вопросительные знаки вместо кириллицы - то есть показывал отказ
    там, где реализация права. Проверяются в наборе в том числе неASCII-строки,
    так что молча тут не разойтись только явным объявлением.

  why_not_a_library: >-
    Библиотечный вызов привязал бы раннер к языку реализации, а проверять
    предстоит шесть. Строки на входе и выходе умеет всякий язык, и никакой
    общей сборки для этого не нужно.

  order_is_preserved: >-
    Ответ на случай выдаётся до чтения следующего. Раннер вправе подать все
    случаи разом и читать по мере готовности, но перепутать порядок нельзя:
    сопоставление идёт по полю id, а не по позиции.

  python_command: python -m funora.conformance

# --- Что подаётся -----------------------------------------------------------
case:
  required: [id, suite, kind, vector]
  optional: [expected, same_as, why]

  fields:
    id: Устойчивый идентификатор случая. Не меняется между версиями набора.
    suite: Имя набора, к которому случай принадлежит.
    kind: Что делать со входом. Перечень ниже.
    vector: >-
      Ссылка на вектор в файле набора: раздел, корзина и порядковый номер, -
      например «serialize.accept[7]». Реализация читает файл САМА.
    expected: Ожидаемый ответ, если он выражается значением.
    same_as: >-
      Идентификатор случая, с которым ответ обязан совпасть. Нужен там, где
      важно не само значение, а равенство двух - например, что составная и
      разложенная записи одной строки дают один отпечаток.
    why: Зачем случай существует. Читает человек, разбирающий отказ.

  why_a_reference_and_not_the_value: >-
    Вход передаётся ССЫЛКОЙ, а не значением, и это не удобство, а
    необходимость. Первая редакция протокола передавала значение, и раннер
    портил его по дороге: он написан на JavaScript, а JSON.parse там теряет
    точность за 2^53 и не отличает 1.0 от 1.

    То есть транспорт уничтожал ровно те различия, ради которых векторы и
    существуют - вектор про 9007199254740993 предсказывал эту поломку дословно
    и поймал её у самого раннера на первом же прогоне.

    Транспорт, портящий проверяемое, хуже отсутствия транспорта: он показывает
    отказ там, где реализация права, и однажды покажет согласие там, где она
    не права. Значит вектор обязан доезжать нетронутым, а разобрать его должен
    тот, кто будет с ним работать, - своим разборщиком, а не чужим.

  file_is_found_by: >-
    Реализация ищет файл набора рядом с рабочей копией спецификации. Как именно
    - её дело: переменная окружения, ключ запуска, соседний каталог. Протокол
    требует лишь, чтобы она умела его прочесть.

  kinds:
    serialize: Привести вход к канонической форме и вернуть строку.
    serialize_refuses: >-
      Вход невыразим канонической формой. Ответ обязан быть отказом, и отказ -
      это успех случая.
    fingerprint: Посчитать отпечаток события из четырёх полей.
    fingerprint_refuses: Вход недопустим, отпечаток считать нельзя.
    resume: >-
      Прогнать сценарий гашения повторов и вернуть, что дошло на каждом шаге.
      Отличается от прочих видов тем, что случай не чистая функция от входа:
      он несёт последовательность шагов и перезапуск посередине.

# --- Что отвечается ---------------------------------------------------------
result:
  required: [id, outcome]
  optional: [value, steps, detail, not_implemented]

  outcomes:
    pass: Случай пройден.
    fail: >-
      Ответ разошёлся с ожидаемым. Поле detail обязано назвать, что получилось
      и что ожидалось: отказ без подробностей заставляет разбираться заново.
    skip: >-
      Реализация случая не умеет. Поле not_implemented обязано назвать запись
      spec/conformance/not-implemented.yaml, объясняющую почему.

  skip_rule: >-
    Пропуск без ссылки на реестр считается отказом, а не пропуском. Это и есть
    то, ради чего протокол написан: реализация вправе чего-то не уметь и не
    вправе делать вид, что умеет.

  unknown_kind_rule: >-
    Случай неизвестного вида - тоже отказ, а не пропуск. Неизвестный вид
    означает, что реализация отстала от набора, и молчать об этом нельзя.

# --- Что получается в итоге -------------------------------------------------
report:
  required: [protocol, suites, total, passed, failed, skipped]
  rule: >-
    Итог обязан различать отказ и пропуск числом, а не только словами.
    Реализация, у которой сорок пропусков и ноль отказов, соответствует не
    больше, чем реализация с сорока отказами, - и отчёт не должен позволять
    прочесть первое как успех.

  exit_code:
    zero_when: Отказов нет.
    nonzero_when: Есть хотя бы один отказ. Пропуски на код возврата не влияют.
    why: >-
      Пропуск - объявленное состояние, и ронять сборку из-за него значило бы
      требовать полноты там, где реестр честно говорит о неполноте.

# --- Наборы -----------------------------------------------------------------
suites:
  canonical_form:
    source: spec/conformance/canonical-form.vectors.json
    covers: >-
      Правила канонической сериализации и отпечаток события. Случаи выводятся
      из файла векторов, а не пишутся отдельно: два перечня одного и того же
      разошлись бы молча.

  resume:
    source: spec/conformance/resume.vectors.json
    covers: >-
      Переживает ли гашение повторов перезапуск. Объявлен в
      spec/events/delivery.yaml как conformance_suite: resume.

    the_trap: >-
      Внутренние часы процесса. Гашение хранит метки времени, и реализация,
      сохранившая их показанием СВОЕГО секундомера, после перезапуска прочтёт
      не то, что записала: начало отсчёта у монотонных часов своё в каждом
      запуске.

      Поэтому шаги задают время стенными часами, а перезапуск объявляет аптайм
      нового процесса. Реализация обязана дать один и тот же ответ при любом
      аптайме - если он на что-то влияет, метки хранятся не в том.

    uptime_s: >-
      Аптайм ПЕРВОГО процесса сценария, по умолчанию 604800 - семь суток. Ноль
      сюда ставить нельзя: при нуле показание секундомера совпадает с прошедшим
      по стенным часам, и реализация, перепутавшая одно с другим, случайно даёт
      верный ответ. Проверено мутацией - при нуле сценарий про истечение срока
      проходил и на сломанной реализации.

    steps:
      at_ms: Момент шага по стенным часам, миллисекунды от эпохи.
      key: >-
        Ключ упорядочивания шага, по умолчанию «k». Гашение работает в пределах
        ключа, и сохранённое состояние обязано это разделение пережить.
      offer: Идентификаторы событий, предложенных к доставке на этом шаге.
      commit: >-
        Какие из предложенных приняты обработчиком. Непринятое не фиксируется:
        событие, на котором обработчик упал, обязано прийти снова.
      restart: >-
        Перезапуск процесса. Поле uptime_s объявляет, сколько работает новая
        машина, и реализация обязана начать внутренние часы именно с него.

    expected: >-
      Для каждого шага - что прошло сквозь гашение, в порядке предложения. Шаг
      перезапуска даёт пустой перечень.

  planned:
    - >-
      rate-budget: трасса меток отправки против ожидаемых пауз. Объявлен в
      spec/runtime/budget.yaml.
