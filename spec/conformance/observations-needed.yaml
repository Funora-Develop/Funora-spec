# Наблюдений не хватает - перечень с ценой каждого.
#
# Файл появился после оценки готовности. Она показала главное: реализация растёт
# не кодом, а наблюдением. Снимки страниц - весь фундамент, на котором стоят
# написанные операции, и дописать остальные нельзя, не увидев их страниц.
#
# Числа из этой шапки убраны нарочно. Стояло «пять снимков, три операции из
# двадцати одной»; за неделю стало семь снимков, четыре операции из двадцати
# двух, и все три числа устарели молча - шапку никто не перечитывал. Написанное по догадке о разметке разойдётся с
# площадкой молча, а молчаливое расхождение здесь стоит аккаунта.
#
# ЗАЧЕМ ЭТО В КОНТРАКТЕ, А НЕ В ЗАМЕТКАХ. Каждая строка называет записи реестра
# неисполненного, которые закроются наблюдением. Перечень в заметках разошёлся бы
# с реестром молча; здесь расхождение ловят ворота: указание на несуществующую
# запись - нарушение, как и запись, которую никакое наблюдение не закрывает.
#
# ЧЕГО ЗДЕСЬ НЕТ. Указаний ходить на площадку чаще, чем нужно, и провоцировать
# её. Каждое наблюдение - ОДНА страница, снятая один раз, обычным путём. Сырой
# HTML не сохраняется никогда: инструмент кладёт структурный скелет, где текст
# заменён подписью длины и состава.

how_to_capture: >-
  Ключ кладётся в переменную окружения FUNORA_GOLDEN_KEY - в неё, а не в
  аргументы командной строки: аргументы видны в списке процессов и попадают в
  историю оболочки.

  Затем: funora-observe <путь> [<путь> ...]

  Несколько путей одним запуском снимаются подряд и проходят через общий
  бюджет запросов. Результат ложится в observations/ структурным скелетом и
  файлом происхождения рядом.

how_to_capture_a_request: >-
  Наблюдения двух родов снимаются РАЗНЫМИ инструментами, и перепутать их значит
  получить пустоту.

  Страница - funora-observe. Он ходит за разметкой своим транспортом и кладёт
  структурный скелет.

  Запрос - сборщик в браузере, tools/capture.js. Чужих запросов транспорт не
  видит по устройству: их делает страница, а не мы. Пункт, ждущий файла с именем
  network.*, снимается только так.

why_expect_file: >-
  Каждый пункт называет имя снимка, который он ждёт. Совпадение по ПУТИ для
  этого не годится: пустой список продаж и список с продажами лежат по одному
  адресу, и инструмент, сверяющий пути, объявил бы пустой список уже снятым.
  Первая редакция так и сделала - пометила снятым четыре пункта из восьми,
  включая самый нужный.

what_to_check_before_moving: >-
  Скелет надо ПРОЧЕСТЬ глазами прежде, чем переносить его в tests/fixtures.
  Маскирование проверено, но проверено на пяти страницах, и новая страница
  вправе принести неизвестный вид значения. Смотреть надо на одно: не осталось
  ли в скелете чего-то, что читается как настоящий текст, имя или адрес.

items:

  # Пункт orders_empty снят 24.08.2026: наблюдение сделано, и оно закрыло
  # ровно то, ради чего затевалось. Площадка при пустом списке не рисует таблицу
  # совсем - вместо неё короткое сообщение, а форма фильтра остаётся. Снято
  # контрольной парой в одну минуту, признак сработал ровно в одну сторону.
  #
  # Что это дало: пустое чтение стало полным, курсор заводится на нём, и первая
  # продажа приходит событием. Запись реестра first_sale_from_empty_start снята.
  #
  # Описание признака - spec/extraction/orders.yaml, раздел empty_list.

  # === Открывают самые нужные операции ========================================
  lots_manage:
    expect_file: lots-trade.logged.ru
    path: /lots/{id}/trade
    account_state: >-
      У аккаунта должен быть хотя бы один выставленный лот в этом разделе.

      Адрес требует НОМЕРА РАЗДЕЛА. Взять его неоткуда, кроме собственного
      профиля: там четырнадцать блоков .offer, и у каждого кнопка правки ведёт
      на /lots/{id}/trade нужного раздела. Годится любой из них.
    why: >-
      Пять операций лотов - собственный список, включение, выключение, правка
      цены, поднятие - стоят на этой странице.

      ПУТЬ ИСПРАВЛЕН 24.08.2026 ПО ИЗМЕРЕНИЮ. Прежде здесь стоял /lots/, и это
      была догадка: снятие вернуло 404. Управление лотами живёт по одному адресу
      на раздел, а не по одному на аккаунт.

      ЧТЕНИЕ СОБСТВЕННЫХ ЛОТОВ ПРИ ЭТОМ УЖЕ ВОЗМОЖНО и этой страницы не требует:
      снимок профиля user.logged.ru несёт четырнадцать разделов и сто пятьдесят
      восемь предложений со ссылками. Эта страница нужна ради ОПЕРАЦИЙ ЗАПИСИ -
      ради того, чего на публичной витрине нет: переключателей, поля цены,
      кнопки поднятия.
    unblocks: [lots_service_operations, domain_write_operations, lots_deactivate_guards, lots_update_price_audit]
    priority: 2

  # Пункт account_balance снят 24.08.2026: страница снята, скелет лежит в
  # фикстурах как account-balance.logged.ru. Три узла .balances-value
  # подтвердились разметкой - прежде это стояло только на переписи знаков.
  #
  # Страница принесла и то, чего не ждали: таблицу операций на той же машинерии
  # dyn-table, с data-transaction, состоянием в имени класса строки и суммой,
  # отделённой от знака валюты. Операции для неё в контракте нет вовсе.

  # === Открывают остальное ====================================================
  # Пункт catalog_categories снят 24.08.2026: корень площадки снят, скелет лежит
  # в фикстурах как root.logged.ru - тридцать три тысячи строк.

  market_offers:
    expect_file: market-offers.logged.ru
    path: /lots/
    account_state: >-
      Нужна ЧУЖАЯ витрина - страница предложений по любому разделу, а не
      собственные лоты. Путь тот же по форме, раздел другой.
    why: Перечень предложений и снимок раздела - две операции витрины.
    unblocks: [market_service_operations, market_transport_lane, market_snapshot_completeness]
    priority: 4

  # Пункт reviews снят 24.08.2026, и снят он БЕЗ наблюдения. Требуемое уже
  # лежало на диске: снимок профиля от 23.08.2026, снятый ради идентификатора
  # аккаунта, нёс шесть полных отзывов с адресуемой разметкой - оценку в имени
  # класса, автора, заказ, текст, дату. Служба написана по нему целиком.
  #
  # ПРАВИЛО, КОТОРОЕ ИЗ ЭТОГО СЛЕДУЕТ. Прежде чем вносить пункт в этот перечень,
  # надо перечитать уже снятое. Страница отдаёт всё, что на ней есть, а снимают
  # её ради одного поля - и остальное лежит непрочитанным.

  reviews_many:
    expect_file: user-many-reviews.logged.ru
    path: /users/{id}/
    account_state: >-
      Нужен профиль продавца с БОЛЬШИМ числом отзывов - сотнями, а не десятком.
      Любой крупный продавец подойдёт; страница открыта всем, ничего делать не
      надо.
    why: >-
      Вопрос ровно один: что означает класс hidden у кнопки dyn-table-continue.

      На наблюдённом профиле шесть отзывов, кнопка спрятана, и два объяснения
      дают одну и ту же разметку - «спрятана, потому что всё показано» и
      «спрятана, пока её не покажет сценарий». Профиль с сотнями отзывов
      различит их сразу: кнопка либо показана, либо нет.

      До этого наблюдения чтение отзывов не объявляется полным ни разу, и
      всякий вызывающий обязан признавать неполноту.

      ЧЕГО ЭТОТ ПУНКТ СТОИЛ. Первая его редакция говорила, что управления
      постраничным выводом на странице нет вовсе, и спрашивала совсем о другом.
      Отсутствие было выведено из неудачи поиска по образцу more|pagin|load -
      площадка называет эти узлы иначе.
    unblocks: [reviews_page_totality]
    priority: 4

  reviews_foreign_profile:
    expect_file: user-foreign.logged.ru
    path: /users/{id}/
    account_state: >-
      Нужен ЧУЖОЙ профиль с отзывами - любого продавца. Ничего отправлять и
      покупать не надо, страница открыта всем.
    why: >-
      Разбор отзывов написан по собственному профилю. Разметка отзыва лежит
      внутри таблицы и от владельца зависеть не должна, но «не должна» - это
      рассуждение, а не наблюдение. Возможность reviews.get помечена probe
      именно поэтому.

      Снимок чужого профиля закрывает и вторую половину: разбор идентификатора
      автора из адреса профиля проверен пока только там, где автор - чужой, а
      владелец - свой.
    unblocks: [reviews_foreign_profile_unobserved]
    priority: 5

  # === Ждут случая, а не действия =============================================
  # Пункт runner_fourth_name снят 24.08.2026: имя наблюдено вторым опросом, это
  # c-p-u. Наблюдение не стоило ни действия, ни лишнего запроса - канал
  # опрашивает сам себя, сборщик только смотрел.
  order_other_locale:
    expect_file: order-en.logged.ru
    path: /orders/{id}/
    account_state: >-
      Тот же заказ, что уже снят, но на ДРУГОЙ локали. Площадка отдаёт ссылки
      вида /en/orders/{id}/ - они есть в шапке снятой страницы.

      Ничего менять и отправлять не надо: страница только читается.
    why: >-
      Восемь параметров заказа отдаются без имён: различить их можно было бы
      только по локализованной метке, а метка на другой локали другая.

      Снимок на второй локали не даст имён, но РАЗДЕЛИТ ПОЛЯ НА РАЗРЯДЫ:
      значения, которые не изменятся, - идентификаторы, суммы, адреса;
      изменившиеся - локализованные. Этого хватит, чтобы объявить хотя бы, какие
      из восьми вообще пригодны к машинному чтению.

      И это же наблюдение проверит правило локали с другой стороны: до сих пор
      все снимки сняты на одной.
    unblocks: [order_params_unnamed]
    priority: 3

  order_with_more_messages:
    expect_file: order-long-chat.logged.ru
    path: /orders/{id}/
    account_state: >-
      Нужен заказ с ДЛИННОЙ перепиской - десяток сообщений и больше. Годится
      любой; страница только читается.
    why: >-
      На снятой странице пять сообщений, и признака усечения не нашлось ни
      одного. Из этого не следует, что переписка полна: ровно на такой неудаче
      поиска уже ошиблись с догрузкой отзывов, где узлы назывались
      dyn-table-continue и образец их не поймал.

      Заказ с длинной перепиской различит сразу: либо сообщений на странице
      столько же, сколько в диалоге, либо появится узел догрузки.
    unblocks: [order_chat_truncation]
    priority: 3

  runner_error:
    expect_file: network.runner-error.json
    path: /chat/?node={id}
    account_state: >-
      НЕ ДОБИВАТЬСЯ НАРОЧНО. Отказ канала наблюдается, если площадка отдаст его
      сама - при истёкшей сессии, при отправке в закрытый диалог, при чём угодно
      ещё, случившемся по ходу обычной работы.

      Если такое случилось при включённом сборщике - сохранить запись.
    why: >-
      Реализация отправки обязана отличить успех от отказа. Поле response.error
      наблюдалось только пустым: оба наблюдения 24.08.2026 сняты с успешных
      отправок, и форма отказа неизвестна - строка ли там, объект ли, код ли.

      Не зная её, реализация либо объявит успехом всё, что вернулось с кодом
      200, - и продавец решит, что покупателю ответили, - либо объявит отказом
      всё, чего не узнала, и отправит сообщение второй раз. У отправленного
      сообщения отмены нет.
    unblocks: [runner_error_shape]
    priority: 6
    do_not_provoke: true

  rate_limited:
    expect_file: rate-limited.logged.ru
    path: любой
    account_state: >-
      НЕ ДОБИВАТЬСЯ НАРОЧНО. Ответ 429 наблюдается, если площадка его отдаст
      сама, при обычной работе.
    why: >-
      Весь механизм отступления завязан на этот код, и его никто не видел ни
      разу. Неизвестно даже, шлёт ли площадка Retry-After и в каком виде.

      Числа бюджета помечены provisional именно поэтому: они выбраны
      консервативно, а не измерены.
    unblocks: [budget_exact_trace, budget_account_bucket]
    priority: 9
    do_not_provoke: true
