# Наблюдений не хватает - перечень с ценой каждого.
#
# Файл появился после оценки готовности. Она показала главное: реализация растёт
# не кодом, а наблюдением. Пять снимков страниц - весь фундамент, на котором
# стоят три операции из двадцати одной, и дописать остальные восемнадцать
# нельзя, не увидев их страниц. Написанное по догадке о разметке разойдётся с
# площадкой молча, а молчаливое расхождение здесь стоит аккаунта.
#
# ЗАЧЕМ ЭТО В КОНТРАКТЕ, А НЕ В ЗАМЕТКАХ. Каждая строка называет записи реестра
# неисполненного, которые закроются наблюдением. Перечень в заметках разошёлся бы
# с реестром молча; здесь расхождение ловят ворота: указание на несуществующую
# запись - нарушение, как и запись, которую никакое наблюдение не закрывает.
#
# ЧЕГО ЗДЕСЬ НЕТ. Указаний ходить на площадку чаще, чем нужно, и провоцировать
# её. Каждое наблюдение - ОДНА страница, снятая один раз, обычным путём. Сырой
# HTML не сохраняется никогда: инструмент кладёт структурный скелет, где текст
# заменён подписью длины и состава.

how_to_capture: >-
  Ключ кладётся в переменную окружения FUNORA_GOLDEN_KEY - в неё, а не в
  аргументы командной строки: аргументы видны в списке процессов и попадают в
  историю оболочки.

  Затем: funora-observe <путь> [<путь> ...]

  Несколько путей одним запуском снимаются подряд и проходят через общий
  бюджет запросов. Результат ложится в observations/ структурным скелетом и
  файлом происхождения рядом.

why_expect_file: >-
  Каждый пункт называет имя снимка, который он ждёт. Совпадение по ПУТИ для
  этого не годится: пустой список продаж и список с продажами лежат по одному
  адресу, и инструмент, сверяющий пути, объявил бы пустой список уже снятым.
  Первая редакция так и сделала - пометила снятым четыре пункта из восьми,
  включая самый нужный.

what_to_check_before_moving: >-
  Скелет надо ПРОЧЕСТЬ глазами прежде, чем переносить его в tests/fixtures.
  Маскирование проверено, но проверено на пяти страницах, и новая страница
  вправе принести неизвестный вид значения. Смотреть надо на одно: не осталось
  ли в скелете чего-то, что читается как настоящий текст, имя или адрес.

items:

  # Пункт orders_empty снят 24.08.2026: наблюдение сделано, и оно закрыло
  # ровно то, ради чего затевалось. Площадка при пустом списке не рисует таблицу
  # совсем - вместо неё короткое сообщение, а форма фильтра остаётся. Снято
  # контрольной парой в одну минуту, признак сработал ровно в одну сторону.
  #
  # Что это дало: пустое чтение стало полным, курсор заводится на нём, и первая
  # продажа приходит событием. Запись реестра first_sale_from_empty_start снята.
  #
  # Описание признака - spec/extraction/orders.yaml, раздел empty_list.

  # === Открывают самые нужные операции ========================================
  lots_own:
    expect_file: lots-own.logged.ru
    path: /lots/
    account_state: У аккаунта должен быть хотя бы один выставленный лот.
    why: >-
      Пять операций лотов - собственный список, включение, выключение, правка
      цены, поднятие - стоят на этой странице. Это самый крупный неоткрытый
      кусок: треть всего перечня операций.
    unblocks: [lots_service_operations, domain_write_operations, lots_deactivate_guards, lots_update_price_audit]
    priority: 2

  chats_send_request:
    expect_file: network.send-message-4.json
    path: /chat/?node={id}
    account_state: >-
      Нужен диалог, в который МОЖНО написать, - и написать в него придётся
      вправду: наблюдается не разметка, а запрос. Годится переписка с самим
      собой либо с тем, кто предупреждён.
    why: >-
      Отправка сообщения - то, ради чего берут SDK для площадки. Запрос уже
      наблюдался трижды, и форма его известна целиком: POST /runner/, поля формы
      csrf_token, objects и request, внутри request - JSON вида
      {action, data: {node, last_message, content}}.

      Не хватает ЗНАЧЕНИЙ трёх строк, без которых запрос не собрать: action
      (12 знаков), тип объекта в запросе (15 знаков) и тип объекта в ответе
      (9 знаков). Сборщик замаскировал их подписями, потому что образец
      протокольного знака допускал только строчные буквы и подчёркивание.

      Образец расширен 24.08.2026 - теперь он пропускает точку, дефис и
      заглавные, оставаясь строгим: пробела в нём нет, кириллицы нет, длина
      ограничена. Одного нового наблюдения достаточно, чтобы три значения
      появились дословно.

      ДО 24.08.2026 ЭТОТ ПУНКТ ПРОСИЛ НЕ ТОГО. Он назывался chats_send_form и
      требовал снять разметку формы отправки со страницы /chat/. Формы там нет:
      отправка идёт запросом, а не отправкой формы, и снимок разметки не дал бы
      ничего.
    unblocks: [chats_service_operations, chats_sending_form, chats_send_governor]
    priority: 2

  account_balance:
    expect_file: account-balance.logged.ru
    path: /account/balance
    account_state: Обычное состояние, ничего особенного не требуется.
    why: >-
      Страницу уже видели - 23.08.2026, но видели ПЕРЕПИСЬЮ ЗНАКОВ ВАЛЮТ, а не
      скелетом. Перепись сказала главное и не сказала остального: на странице
      три разные валюты в узлах span.balances-value, и одним скалярным полем
      баланс не описывается. Схема исправлена по этому, поле стало перечнем.

      Чего перепись не дала - разметки. Селекторов у баланса нет, и написать
      чтение не по чему: неизвестно, где лежит код валюты, где сумма, чем
      отличается доступное от замороженного и показывается ли последнее вообще.

      До 24.08.2026 этот пункт назывался account_profile и обещал, что «самой
      страницы никто не видел». Обещание было ложным с 23.08, и держалось оно на
      том, что перепись положили в observations/ и не перечитали.
    unblocks: [account_service_operations]
    priority: 3

  # === Открывают остальное ====================================================
  catalog_categories:
    expect_file: catalog.guest.ru
    path: /
    account_state: Обычное состояние. Разделы каталога видны и гостю.
    why: Дерево разделов и схема полей раздела - две операции каталога.
    unblocks: [catalog_service_operations, catalog_categories_cache]
    priority: 4

  market_offers:
    expect_file: market-offers.logged.ru
    path: /lots/
    account_state: >-
      Нужна ЧУЖАЯ витрина - страница предложений по любому разделу, а не
      собственные лоты. Путь тот же по форме, раздел другой.
    why: Перечень предложений и снимок раздела - две операции витрины.
    unblocks: [market_service_operations, market_transport_lane, market_snapshot_completeness]
    priority: 4

  # Пункт reviews снят 24.08.2026, и снят он БЕЗ наблюдения. Требуемое уже
  # лежало на диске: снимок профиля от 23.08.2026, снятый ради идентификатора
  # аккаунта, нёс шесть полных отзывов с адресуемой разметкой - оценку в имени
  # класса, автора, заказ, текст, дату. Служба написана по нему целиком.
  #
  # ПРАВИЛО, КОТОРОЕ ИЗ ЭТОГО СЛЕДУЕТ. Прежде чем вносить пункт в этот перечень,
  # надо перечитать уже снятое. Страница отдаёт всё, что на ней есть, а снимают
  # её ради одного поля - и остальное лежит непрочитанным.

  reviews_many:
    expect_file: user-many-reviews.logged.ru
    path: /users/{id}/
    account_state: >-
      Нужен профиль продавца с БОЛЬШИМ числом отзывов - сотнями, а не десятком.
      Любой крупный продавец подойдёт; страница открыта всем, ничего делать не
      надо.
    why: >-
      Единственный вопрос: отдаёт ли площадка все отзывы разом или первую
      порцию. На наблюдённом профиле отзывов шесть, и по нему это неразличимо -
      управления постраничным выводом нет ни одного узла, но и надобности в нём
      при шести отзывах нет.

      От ответа зависит смысл слова complete у чтения отзывов. Сейчас оно значит
      «разобраны все строки страницы», и вызывающий вправе прочесть его как «все
      отзывы продавца».
    unblocks: [reviews_page_totality]
    priority: 5

  reviews_foreign_profile:
    expect_file: user-foreign.logged.ru
    path: /users/{id}/
    account_state: >-
      Нужен ЧУЖОЙ профиль с отзывами - любого продавца. Ничего отправлять и
      покупать не надо, страница открыта всем.
    why: >-
      Разбор отзывов написан по собственному профилю. Разметка отзыва лежит
      внутри таблицы и от владельца зависеть не должна, но «не должна» - это
      рассуждение, а не наблюдение. Возможность reviews.get помечена probe
      именно поэтому.

      Снимок чужого профиля закрывает и вторую половину: разбор идентификатора
      автора из адреса профиля проверен пока только там, где автор - чужой, а
      владелец - свой.
    unblocks: [reviews_foreign_profile_unobserved]
    priority: 5

  # === Ждут случая, а не действия =============================================
  rate_limited:
    expect_file: rate-limited.logged.ru
    path: любой
    account_state: >-
      НЕ ДОБИВАТЬСЯ НАРОЧНО. Ответ 429 наблюдается, если площадка его отдаст
      сама, при обычной работе.
    why: >-
      Весь механизм отступления завязан на этот код, и его никто не видел ни
      разу. Неизвестно даже, шлёт ли площадка Retry-After и в каком виде.

      Числа бюджета помечены provisional именно поэтому: они выбраны
      консервативно, а не измерены.
    unblocks: [budget_exact_trace, budget_account_bucket]
    priority: 9
    do_not_provoke: true
