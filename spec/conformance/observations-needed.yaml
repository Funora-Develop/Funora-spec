# ЧТО ИЗ ЭТОГО ПЛАНА УЖЕ СДЕЛАНО, и почему записи сняты.
#
# lot_edit_form и lot_price_save - сняты 30-31.08.2026. Форма правки лота лежит
# в фикстурах, запрос сохранения записан, операция lots.update_price написана.
#
# reviews_foreign_profile - снят 30.08.2026: user-foreign.logged.ru.
#
# Записи держались в плане ПОСЛЕ выполнения, и это не безобидно: план, где
# половина сделана, читается как список дел и заставляет делать заново. Ворота
# на это теперь стоят - см. tests/test_observations_plan.py.

# Наблюдений не хватает - перечень с ценой каждого.
#
# Файл появился после оценки готовности. Она показала главное: реализация растёт
# не кодом, а наблюдением. Снимки страниц - весь фундамент, на котором стоят
# написанные операции, и дописать остальные нельзя, не увидев их страниц.
#
# Числа из этой шапки убраны нарочно. Стояло «пять снимков, три операции из
# двадцати одной»; за неделю стало семь снимков, четыре операции из двадцати
# двух, и все три числа устарели молча - шапку никто не перечитывал. Написанное по догадке о разметке разойдётся с
# площадкой молча, а молчаливое расхождение здесь стоит аккаунта.
#
# ЗАЧЕМ ЭТО В КОНТРАКТЕ, А НЕ В ЗАМЕТКАХ. Каждая строка называет записи реестра
# неисполненного, которые закроются наблюдением. Перечень в заметках разошёлся бы
# с реестром молча; здесь расхождение ловят ворота: указание на несуществующую
# запись - нарушение, как и запись, которую никакое наблюдение не закрывает.
#
# ЧЕГО ЗДЕСЬ НЕТ. Указаний ходить на площадку чаще, чем нужно, и провоцировать
# её. Каждое наблюдение - ОДНА страница, снятая один раз, обычным путём. Сырой
# HTML не сохраняется никогда: инструмент кладёт структурный скелет, где текст
# заменён подписью длины и состава.

how_to_capture: >-
  Ключ кладётся в переменную окружения FUNORA_GOLDEN_KEY - в неё, а не в
  аргументы командной строки: аргументы видны в списке процессов и попадают в
  историю оболочки.

  Затем: funora-observe <путь> [<путь> ...]

  Несколько путей одним запуском снимаются подряд и проходят через общий
  бюджет запросов. Результат ложится в observations/ структурным скелетом и
  файлом происхождения рядом.

how_to_capture_a_request: >-
  Наблюдения двух родов снимаются РАЗНЫМИ инструментами, и перепутать их значит
  получить пустоту.

  Страница - funora-observe. Он ходит за разметкой своим транспортом и кладёт
  структурный скелет.

  Запрос - сборщик в браузере, tools/capture.js. Чужих запросов транспорт не
  видит по устройству: их делает страница, а не мы. Пункт, ждущий файла с именем
  network.*, снимается только так.

why_expect_file: >-
  Каждый пункт называет имя снимка, который он ждёт. Совпадение по ПУТИ для
  этого не годится: пустой список продаж и список с продажами лежат по одному
  адресу, и инструмент, сверяющий пути, объявил бы пустой список уже снятым.
  Первая редакция так и сделала - пометила снятым четыре пункта из восьми,
  включая самый нужный.

what_to_check_before_moving: >-
  Скелет надо ПРОЧЕСТЬ глазами прежде, чем переносить его в tests/fixtures.
  Маскирование проверено, но проверено на пяти страницах, и новая страница
  вправе принести неизвестный вид значения. Смотреть надо на одно: не осталось
  ли в скелете чего-то, что читается как настоящий текст, имя или адрес.

items:

  # Пункт orders_empty снят 24.08.2026: наблюдение сделано, и оно закрыло
  # ровно то, ради чего затевалось. Площадка при пустом списке не рисует таблицу
  # совсем - вместо неё короткое сообщение, а форма фильтра остаётся. Снято
  # контрольной парой в одну минуту, признак сработал ровно в одну сторону.
  #
  # Что это дало: пустое чтение стало полным, курсор заводится на нём, и первая
  # продажа приходит событием. Запись реестра first_sale_from_empty_start снята.
  #
  # Описание признака - spec/extraction/orders.yaml, раздел empty_list.

  # === Открывают самые нужные операции ========================================
  # Пункт lots_manage снят 28.08.2026: страница снята, скелет лежит в фикстурах
  # как lots-trade.logged.ru - девятьсот восемьдесят семь строк.
  #
  # Снимок принёс больше, чем ждали от него. Он сделан форматом v8, первым
  # сохраняющим ключи объекта настроек, и потому на нём впервые проверяется
  # разбор ЗАЩИТНОГО ТОКЕНА - записи csrf_token_unreadable_from_snapshot больше
  # нет в реестре.
  #
  # Он же нашёл дефект классификатора. Сборщик записал странице вердикт
  # challenge: слово captcha стоит в описании лота владельца, торгующего защитой
  # игровых серверов от ботов, а текстовая подпись искала его по всему тексту
  # страницы. Исправлено в 0.16.0 - признаком страницы приложения объявлено меню
  # вошедшего.
  #
  # Пять операций лотов при этом НЕ открылись: страница у нас есть, а записей
  # запросов, которыми делаются переключение, правка цены и поднятие, нет.
  # Заведён отдельный пункт lots_write_requests.

  # Пункты runner_subscription_minimal и runner_empty_subscription сняты
  # 29.08.2026. Оба закрыты ОДНОЙ записью - network.runner-empty, - и это не
  # совпадение: они спрашивали об одном и том же с двух сторон.
  #
  # Что получено.
  #
  # Первое: ПУСТУЮ ПОДПИСКУ ПЛОЩАДКА ПРИНИМАЕТ. Опрос с objects=[] вернул код
  # 200 и ответ обычной формы. Значит собирать подписку, чтобы обратиться к
  # каналу, не обязательно.
  #
  # Второе: МЕТКИ РАЗНЫХ ВИДОВ - РАЗНЫЕ ЗНАЧЕНИЯ. У orders_counters метка равна
  # атрибуту data-orders страницы, у chat_bookmarks - ни одному из трёх
  # наблюдаемых атрибутов. Подписи у обеих одинаковы, и прежним форматом записи
  # различить их было нельзя вовсе.
  #
  # Чего НЕ получено, и это записано в контракте отдельно: наблюдался ОПРОС, а
  # не действие. «Форма запроса принимается» и «действие выполняется при пустой
  # подписке» - разные утверждения, и второе не наблюдалось.
  #
  # Как это стало возможно. Сборщик научен сверять метку с атрибутами страницы
  # в момент запроса и записывать ИМЯ совпавшего атрибута либо false. Сверить
  # два файла - снимок и запись - нельзя было в принципе: маскирование у них
  # независимое.

  # Пункт chat_action_field_origins снят 29.08.2026. Одна обычная отправка с
  # включённым сборщиком ответила на оба вопроса сразу: node берётся из
  # data-name узла виджета, last_message - из data-node-msg АКТИВНОЙ строки
  # списка диалогов.
  #
  # Она же дала больше, чем спрашивалось: происхождение всех четырёх объектов
  # подписки, кроме одной метки. Запрос отправки собирается из наблюдённого
  # целиком - см. spec/extraction/updates.yaml, action.where_every_field_comes_from.
  #
  # Осталась одна метка - у chat_bookmarks. Кандидат назван (data-bookmarks-tag
  # того же узла), в перечень сверки сборщика он теперь входит, и ответит на
  # него любое следующее наблюдение канала.

  # Пункт thread_page_v8 снят 29.08.2026. Страница диалога переснята форматом
  # v8; скелет лежит в фикстурах как chat-thread.v8.logged.ru - РЯДОМ с
  # chat-thread.logged.ru, а не вместо него.
  #
  # Замена не годилась: прежний снимок служит свидетельством числу сообщений -
  # одиннадцать строк, пять ссылок автора, - а новый снят другого диалога.
  # Подмена уронила бы дюжину счётных утверждений контракта, и это был бы не
  # признак поломки, а признак того, что снимки разные.
  #
  # Что она дала: признак пригодности страницы для отправки впервые ИСТИНЕН.
  # Прежде он не бывал истинным ни на одной фикстуре, и проверен был только
  # отрицательный случай - та половина, что не ловит ошибку «не годится
  # никогда».

  # Пункт runner_action_empty снят 30.08.2026. Канал выполняет действие при
  # пустой подписке - наблюдено контрольной парой в одной записи.
  #
  # Он же принёс второе, чего не спрашивали: ответ несёт изменения ТОЛЬКО
  # подписанных объектов. При пустой подписке ответ пуст, и подтверждать
  # отправку нечем. Отсюда пункт ниже.

  # Пункт runner_action_minimal снят 30.08.2026. Подписка из одного узла
  # возвращает подтверждение - наблюдено network.send-minimal.
  #
  # Этим закрыта последняя догадка в отправке сообщения: запрос, подписка, ответ
  # и подтверждение наблюдены целиком.

  showcase_over_twenty:
    expect_file: lots-trade-big.logged.ru
    path: /lots/{id}/trade
    account_state: >-
      Нужен раздел, в котором у продавца БОЛЬШЕ двадцати лотов. Годится любой -
      важно только число.

      Если такого раздела нет ни одного, наблюдение не делается, а пункт
      закрывается этим фактом: аккаунтом без разделов свыше двадцати вопрос не
      решается, и записать это честнее, чем ждать вечно.
    why: >-
      Обрезает ли площадка витрину на двадцатом предложении.

      Первый снимок управления, сделанный 28.08.2026, вопроса не решил: в
      снятом разделе оказалось ровно двадцать строк - то самое спорное число, -
      и средств перелистывания на странице нет ни одного.

      Разделы с четырьмя, тремя и двумя строками при этом показаны полностью.
      Значит порог, если он есть, ровно один, и проверяется он одним снимком
      раздела, где лотов больше.
    unblocks: [showcase_truncation]
    priority: 3

  # Пункт account_balance снят 24.08.2026: страница снята, скелет лежит в
  # фикстурах как account-balance.logged.ru. Три узла .balances-value
  # подтвердились разметкой - прежде это стояло только на переписи знаков.
  #
  # Страница принесла и то, чего не ждали: таблицу операций на той же машинерии
  # dyn-table, с data-transaction, состоянием в имени класса строки и суммой,
  # отделённой от знака валюты. Операции для неё в контракте нет вовсе.

  # === Открывают остальное ====================================================
  # Пункт catalog_categories снят 24.08.2026: корень площадки снят, скелет лежит
  # в фикстурах как root.logged.ru - тридцать три тысячи строк.

  catalog_field_schema_page:
    expect_file: catalog-fields.logged.ru
    path: /lots/{n}/
    account_state: >-
      Открыть раздел и выбрать подкатегорию - ту, где у лотов есть свои поля.
      Снять страницу как есть. Ничего не меняет.
    why: >-
      ПЕРЕИМЕНОВАНО ИЗ market_offers 31.08.2026: сам перечень предложений снят
      дважды и операция market.offers написана. Осталась одна из четырёх вещей,
      ради которых запись заводилась, - схема полей подкатегории.

      Раздел показывает предложения и фильтры, а перечня полей с их типами и
      обязательностью на снимке не видно. Правдоподобно, что он приходит
      отдельным запросом при выборе подкатегории; правдоподобно и то, что его
      нет вовсе, а поля объявляются формой создания лота.

      Оба «правдоподобно» проверяются одним наблюдением.
    unblocks: [catalog_field_schema]
    priority: 4
  # Пункт reviews снят 24.08.2026, и снят он БЕЗ наблюдения. Требуемое уже
  # лежало на диске: снимок профиля от 23.08.2026, снятый ради идентификатора
  # аккаунта, нёс шесть полных отзывов с адресуемой разметкой - оценку в имени
  # класса, автора, заказ, текст, дату. Служба написана по нему целиком.
  #
  # ПРАВИЛО, КОТОРОЕ ИЗ ЭТОГО СЛЕДУЕТ. Прежде чем вносить пункт в этот перечень,
  # надо перечитать уже снятое. Страница отдаёт всё, что на ней есть, а снимают
  # её ради одного поля - и остальное лежит непрочитанным.

  reviews_many:
    expect_file: user-many-reviews.logged.ru
    path: /users/{id}/
    account_state: >-
      Нужен профиль продавца с БОЛЬШИМ числом отзывов - сотнями, а не десятком.
      Любой крупный продавец подойдёт; страница открыта всем, ничего делать не
      надо.
    why: >-
      Смысл класса hidden у кнопки догрузки уже наблюдён - но парой с РАЗНЫХ
      страниц: профиль с шестью отзывами дал спрятанную кнопку, страница
      операций с двадцатью пятью строками и продолжением - показанную.

      Пара на ОДНОЙ странице подтвердила бы вывод прямо. Профиль с сотнями
      отзывов даст показанную кнопку там же, где шесть отзывов дали спрятанную.

      До тех пор полнота чтения отзывов помечена ВЫВЕДЕННОЙ, а не наблюдённой.
    unblocks: [reviews_page_totality]
    priority: 5

  order_other_locale:
    expect_file: order-en.logged.ru
    path: /orders/{id}/
    account_state: >-
      Тот же заказ, что уже снят, но на ДРУГОЙ локали. Площадка отдаёт ссылки
      вида /en/orders/{id}/ - они есть в шапке снятой страницы.

      Ничего менять и отправлять не надо: страница только читается.
    why: >-
      Восемь параметров заказа отдаются без имён: различить их можно было бы
      только по локализованной метке, а метка на другой локали другая.

      Снимок на второй локали не даст имён, но РАЗДЕЛИТ ПОЛЯ НА РАЗРЯДЫ:
      значения, которые не изменятся, - идентификаторы, суммы, адреса;
      изменившиеся - локализованные. Этого хватит, чтобы объявить хотя бы, какие
      из восьми вообще пригодны к машинному чтению.

      И это же наблюдение проверит правило локали с другой стороны: до сих пор
      все снимки сняты на одной.
    unblocks: [order_params_unnamed]
    priority: 3

  order_with_more_messages:
    expect_file: order-long-chat.logged.ru
    path: /orders/{id}/
    account_state: >-
      Нужен заказ с ДЛИННОЙ перепиской - десяток сообщений и больше. Годится
      любой; страница только читается.
    why: >-
      На снятой странице пять сообщений, и признака усечения не нашлось ни
      одного. Из этого не следует, что переписка полна: ровно на такой неудаче
      поиска уже ошиблись с догрузкой отзывов, где узлы назывались
      dyn-table-continue и образец их не поймал.

      Заказ с длинной перепиской различит сразу: либо сообщений на странице
      столько же, сколько в диалоге, либо появится узел догрузки.
    unblocks: [order_chat_truncation]
    priority: 3

  # Пункт dyn_table_form_names снят 24.08.2026: запрос наблюдён, поля названы -
  # user_id, continue, filter. Само наблюдение при этом НЕ СОХРАНЕНО: сборщик
  # разобрал ответ-разметку как форму и записал вместе с ключами настоящие суммы
  # операций. Файл удалён, сборщик починен с обеих сторон, проверки заведены.
  #
  # Что осталось тёмным - смысл значения в поле continue - записано в реестр, а
  # не сюда: закроется оно чтением формы, а не новым походом на площадку.

  lot_visibility_toggle:
    expect_file: network.lot-visibility.json
    path: /lots/{id}/trade
    account_state: >-
      Выбрать самый малозначимый свой лот.

      funora.watch(), выключить лот, funora.stop. Затем снять страницу лотов
      раздела - в ней одна строка скрыта, а прочие нет. Затем funora.watch(),
      включить лот обратно, funora.stop.

      Лот снят с витрины на минуты и возвращён тем же действием.
    why: >-
      Закрывает lots.activate и lots.deactivate - и вместе с ними признак
      показа лота в выдаче, которого на странице сегодня НЕТ НИ ОДНОГО.

      Без признака не собирается модель Lot: она требует is_active
      обязательным. Без него же неисполним объявленный предохранитель
      requires_known_stock у lots.deactivate.

      Снимок нужен именно ПАРНЫЙ - страница, где одна строка скрыта, а прочие
      нет. Страница, где скрыты все либо не скрыт никто, признака не покажет:
      различающего класса на ней не будет по построению.
    unblocks: [lots_service_operations]
    priority: 4

  chat_unread_open:
    expect_file: network.chat-open-unread.json
    path: /chat/
    account_state: >-
      ЖДЁТ СЛУЧАЯ: нужен непрочитанный диалог, добиваться его не надо.

      Сперва снять список диалогов ДО открытия. Затем funora.watch(), открыть
      непрочитанный диалог, funora.stop.
    why: >-
      Закрывает три долга разом.

      Первый: существует ли chats.mark_read отдельным запросом. Вероятный ответ
      «нет, отдельного запроса нет» - полноценный: возможность объявляется
      неподдерживаемой, и запись реестра закрывается отказом.

      Второй: признак непрочитанного сегодня ВЫВЕДЕН из расхождения двух
      позиций, и расхождения при непрочитанном диалоге не наблюдалось ни разу.

      Третий: список диалогов с непрочитанной строкой - единственный способ
      проверить правило на положительном случае.
    unblocks: [chats_service_operations]
    priority: 5
    do_not_provoke: true

# ВОЗВРАТ И ВЫВОД СЮДА НЕ ВНЕСЕНЫ, и это решение, а не забывчивость.
#
# Формы обеих наблюдены 31.08.2026 - адреса, поля, число вариантов у списков.
# Записаны они в spec/extraction: order.yaml#refund и account.yaml#withdraw.
#
# В ПЛАН они не попадают потому, что закрывать им нечего: контракт таких
# операций не объявляет вовсе. Правило этого файла - «наблюдение, которое
# ничего не закрывает, не план, а пожелание», - и правило верное.
#
# Чтобы они стали планом, сперва надо РЕШИТЬ, объявляет ли контракт возврат и
# вывод. Решение это не техническое: обе операции необратимы и обе про деньги,
# вывод вдобавок требует второго множителя. Объявить операцию значит пообещать
# её; пообещать то, что нельзя проверить иначе как настоящим переводом денег
# продавца, - отдельный разговор.

  continue_form_semantics:
    expect_file: network.continue-form.json
    path: /users/{n}/
    account_state: >-
      На чужом профиле с длинным списком отзывов: funora.watch(), нажать
      догрузку, funora.stop. Ничего не меняет.
    why: >-
      ОДНА ФОРМА НА ТРИ МЕСТА, и это выяснилось 31.08.2026. Поля user_id,
      continue и filter несут и догрузка отзывов, и догрузка операций счёта, и
      - тем же именем continue - догрузка таблиц вообще.

      Значит правило одно, а не три, и разгадав его однажды, закрываем
      chats.history_before, постраничность отзывов и dyn_table_continue_request
      разом.

      Что известно: курсор НЕ равен последней показанной строке - это уже
      наблюдалось. Чему он равен, неизвестно.
    unblocks: [dyn_table_continue_request, reviews_page_totality]
    priority: 1

  chat_mark_read_request:
    expect_file: network.chat-mark-read.json
    path: /chat/?node={id}
    account_state: >-
      В диалоге с непрочитанным: funora.watch(), сделать то, чем площадка
      отмечает прочтение - открыть диалог либо нажать пометку, если она есть, -
      funora.stop.

      ЖДЁТ СЛУЧАЯ: непрочитанного добиваться не надо, оно появляется само.
    why: >-
      Операция chats.mark_read объявлена контрактом и не написана: запроса
      никто не наблюдал. Неизвестно даже, отдельный ли это запрос - отметка
      может ставиться самим открытием страницы диалога.

      Это первое, что покажет наблюдение, и оно же решает, бывает ли у операции
      собственный запрос вообще.
    user_impact: >-
      Отметка прочтения меняет состояние У ПОКУПАТЕЛЯ: он видит, что продавец
      прочитал. Ставить её догадкой значит вводить человека в заблуждение о
      чужом внимании.
    unblocks: [chats_service_operations]
    priority: 5

  chat_send_image_request:
    expect_file: network.chat-send-image.json
    path: /chat/?node={id}
    account_state: >-
      В своём диалоге - годится диалог с самим собой, если такой есть, либо
      любой, где лишняя картинка не помешает: funora.watch(), прикрепить
      картинку и ОТПРАВИТЬ, funora.stop.

      ОТПРАВКА НАСТОЯЩАЯ И НЕОБРАТИМАЯ. Картинка уйдёт собеседнику. Решение за
      владельцем аккаунта; выбирать диалог надо так, чтобы лишнее сообщение
      никого не смутило.

      Наблюдение 30.08.2026 показало: прикрепление БЕЗ отправки не грузит
      ничего. Значит загрузка неотделима от отправки, и половинчатого
      наблюдения здесь не бывает.
    why: >-
      Отправка картинки - то же действие chat_message плюс поле image_id, и
      перед ним отдельный запрос загрузки файла на /file/addImage.

      Наблюдён АДРЕС загрузки, но не сам запрос: неизвестно ни имя поля с
      файлом, ни что возвращается взамен. Без этого image_id взять неоткуда, и
      операция не собирается.
    user_impact: >-
      Автовыдача товара картинкой - обычное дело у продавцов ключей и скриншотов.
      Объявленная и ненаписанная, операция выглядит доступной до первого вызова.
    unblocks: [chats_service_operations]
    priority: 6

  lot_promote_request:
    expect_file: network.lot-promote.json
    path: /lots/{id}/trade
    account_state: >-
      На странице своих лотов раздела: funora.watch(), нажать поднятие ОДИН РАЗ,
      funora.stop.

      НЕОБРАТИМО И ТРАТИТ СУТОЧНЫЙ ПРЕДЕЛ. Делать только тогда, когда поднятие
      и так собирались сделать; ради наблюдения - не делать.

      Довод кнопки при этом уже читается со страницы: игра и раздел лежат в
      разметке и разобраны. Вслепую наблюдение делать не придётся.
    why: >-
      lots.promote объявлена unsafe и требует сверки вместо повтора - а сверять
      нечего, пока неизвестно, чем площадка отвечает на поднятие.

      Второе, что покажет наблюдение: как выглядит отказ при неистёкшем
      остывании. Контракт объявляет предусловие cooldown_elapsed, а срок его не
      наблюдался - числа у нас нет, и выдумать его нельзя.
    user_impact: >-
      Повтор поднятия расходует лимит, восстановить который нельзя. Операция без
      наблюдённого ответа не отличит успех от отказа и повторит.
    unblocks: [lots_service_operations]
    priority: 7

  runner_error:
    expect_file: network.runner-error.json
    path: /chat/?node={id}
    account_state: >-
      НЕ ДОБИВАТЬСЯ НАРОЧНО. Отказ канала наблюдается, если площадка отдаст его
      сама - при истёкшей сессии, при отправке в закрытый диалог, при чём угодно
      ещё, случившемся по ходу обычной работы.

      Если такое случилось при включённом сборщике - сохранить запись.
    why: >-
      Реализация отправки обязана отличить успех от отказа. Поле response.error
      наблюдалось только пустым: оба наблюдения 24.08.2026 сняты с успешных
      отправок, и форма отказа неизвестна - строка ли там, объект ли, код ли.

      Не зная её, реализация либо объявит успехом всё, что вернулось с кодом
      200, - и продавец решит, что покупателю ответили, - либо объявит отказом
      всё, чего не узнала, и отправит сообщение второй раз. У отправленного
      сообщения отмены нет.
    unblocks: [runner_error_shape]
    priority: 6
    do_not_provoke: true

  rate_limited:
    expect_file: rate-limited.logged.ru
    path: любой
    account_state: >-
      НЕ ДОБИВАТЬСЯ НАРОЧНО. Ответ 429 наблюдается, если площадка его отдаст
      сама, при обычной работе.
    why: >-
      Весь механизм отступления завязан на этот код, и его никто не видел ни
      разу. Неизвестно даже, шлёт ли площадка Retry-After и в каком виде.

      Числа бюджета помечены provisional именно поэтому: они выбраны
      консервативно, а не измерены.
    unblocks: [budget_exact_trace, budget_account_bucket]
    priority: 9
    do_not_provoke: true
