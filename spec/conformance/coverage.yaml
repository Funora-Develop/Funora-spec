# Чем каждый файл спецификации связан с реализацией.
#
# Файл появился после разбора, который посчитал: генератор читает семь файлов из
# сорока девяти. Проверка свежести покрывает эти семь. Правка любого из
# остальных сорока двух - а равно правка непрочитанного раздела внутри самих
# семи - не даёт ни одного признака ни в одной сборке.
#
# Расхождение при этом обнаруживается не сразу и не здесь: спецификация зелёная,
# сборка зелёная, а второй SDK, написанный по правленому файлу, ведёт себя иначе
# первого. Обнаружит это тот, кто подключит обе реализации.
#
# Механизмов ровно три:
#
#   generated - из файла порождается артефакт. Генератор объявляет свои
#   источники перечнем SOURCES и отказывается читать необъявленное.
#
#   verified - порождать нечего либо незачем, но реализация обязана
#   согласоваться с файлом, и это проверено тестом. Названа проверка.
#
#   prose - обоснование, история решения, объяснение почему. Проверять нечего
#   ПО УСТРОЙСТВУ, а не по трудности: обоснование не имеет машинного отражения.
#
# Файл, не попавший ни в одну корзину, роняет проверку покрытия. Молчащий файл
# спецификации - это обещание, которое никто не держит.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

files:
  spec/capabilities.yaml:
    mechanism: generated
    note: >-
      capabilities.py: перечисление возможностей, начальные состояния, правило
      допустимости вызова. Плюс scripts/validate.js: описательная таблица
      состояний сверяется с нормативными предикатами - признак opt_in_required
      обязан точно совпасть со списком requires_opt_in, is_usable не смеет
      называть неработающее состояние, списки не пересекаются, а состояние вне
      обоих допустимо ровно одно - unsupported.
    not_implemented:
      - orders_events_capability
      - probe_laziness
      - probe_single_flight
      - capability_profile
  spec/canonical-form.yaml:
    mechanism: verified
    note: >-
      tests/test_canonical.py: каждое правило обязано называть, чем оно
      проверяется, и названное обязано существовать. Файл появился потому, что
      правила жили в прозе docs/canonical-json.md - вне реестра, вне валидатора
      и вне классификатора изменений: их можно было переписать на
      противоположные, и обе сборки оставались зелёными.
  spec/compat-rules.yaml:
    mechanism: verified
    note: >-
      scripts/compat.js: классификация изменений спецификации между двумя
      ревизиями. Плюс раздел deprecation: три класса требуют предварительной
      пометки x-funora-deprecated, и классификатор отклоняет удаление
      непомеченного либо помеченного позже, чем требует min_deprecation_minors.
      Форму самой пометки сверяет scripts/validate.js. Плюс раздел conditions:
      три условия правил вычисляются, а не только объявляются -
      enum_has_unknown_fallback, migration_note и провизорность чисел бюджета.
      Условие не выполнено - класс изменения поднимается до major.
  spec/conformance/capabilities.vectors.json:
    mechanism: verified
    note: >-
      scripts/conformance.js: набор capabilities. Решение о допуске вызова -
      полный перебор пяти состояний на два значения включения, плюс те же две
      ветки по КАЖДОЙ возможности, плюс начальное состояние каждой. Файл
      появился потому, что spec/capabilities.yaml требует вектор на обе ветки у
      каждой возможности, а вектора не существовало ни одного: двадцать две
      возможности, ноль векторов. Перебор по каждой возможности не избыточен -
      он ловит реализацию, у которой одна возможность обработана особо, и
      таблицу решений такая проходит целиком.
  spec/conformance/observations-needed.yaml:
    mechanism: verified
    note: >-
      scripts/validate.js: перечень сверяется с реестром неисполненного в обе
      стороны - указание на несуществующую запись отвергается, а запись,
      помеченная ожидающей наблюдения и не названная ни одним пунктом, тоже.

      Плюс tools/observe_plan.py эталонной реализации: читает перечень и печатает
      готовые команды по порядку важности, отмечая уже снятое по имени ожидаемого
      снимка.

      Файл появился после оценки готовности: она показала, что реализация растёт
      наблюдением, а не кодом, и что пять снимков - весь фундамент под тремя
      операциями из двадцати одной.
  spec/conformance/coverage.yaml:
    mechanism: verified
    note: >-
      tests/test_spec_coverage.py: этот файл сверяется с составом спецификации.
  spec/conformance/canonical-form.vectors.json:
    mechanism: verified
    note: >-
      tests/test_canonical.py: векторы канонической формы и отпечатка события
      прогоняются дословно. Файл появился потому, что docs/canonical-json.md
      объявлял обязательные векторы, а не существовало ни одного - правила
      можно было переписать на противоположные, и обе сборки остались бы
      зелёными.
  spec/conformance/rate-budget.vectors.json:
    mechanism: verified
    note: >-
      tests/test_rate_budget_vectors.py: трассы бюджета прогоняются дословно.
      Набор был объявлен в spec/runtime/budget.yaml одним словом: числа вёдер
      сверялись со спецификацией, а поведение, которое из них следует, - залп,
      единица учёта и правило допуска по классу - не проверялось ничем.
  spec/conformance/resume.vectors.json:
    mechanism: verified
    note: >-
      tests/test_resume_vectors.py: сценарии перезапуска прогоняются дословно.
      Свойство было объявлено в spec/events/delivery.yaml как
      conformance_suite: resume и проверить его было нечем - а ловушка там
      настоящая: реализация, сохранившая метки показанием своего секундомера,
      после перезапуска выдаёт товар дважды.
  spec/conformance/runner-protocol.yaml:
    mechanism: verified
    note: >-
      tests/test_conformance.py: реализация отвечает по объявленному протоколу,
      пропуск без ссылки на реестр неисполненного считается отказом. Ось версий
      была заведена в spec/version.yaml заранее и до сих пор ничего не
