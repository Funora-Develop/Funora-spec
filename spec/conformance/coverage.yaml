  spec/protocol/reconciliation.yaml:
    mechanism: generated
    note: >-
      reconciliation.py: три вердикта и расписание чтений. Кодогенератор при этом
      ЗАПРЕЩАЕТ вердикт отрицания - not_delivered, failed, not_sent - и требует,
      чтобы всякий объявленный вердикт был достижим шагом, а число пауз
      совпадало с числом чтений и возрастало.

      Запрет вердикта отрицания стоит в порождении, а не в прозе, потому что
      цена его нарушения - второе сообщение покупателю: отсутствие в истории
      свидетельство отрицательное, и объявлять по нему «не отправлено» нельзя.

  spec/protocol/send-outcome.yaml:
    mechanism: generated
    note: >-
      send_outcome.py: три исхода, закрытый перечень причин и НОРМАТИВНЫЙ порядок
      шагов перечнем. Порядок порождается, а не пересказывается, чтобы проверка
      могла пройти по нему, а не по прозе: у каждого шага обязан быть свой
      случай, и мутация шага обязана его убивать.

      Кодогенератор при этом сверяет причины шагов с перечнем причин в обе
      стороны и требует, чтобы всякий объявленный исход был достижим. Причина
      без шага - обещание исхода, которого не бывает; исход без шага - ветка,
      которую вызывающий напишет зря.

