# Что контракт объявляет, а эталонная реализация не делает.
#
# Файл появился после разбора, который нашёл в контракте несколько механизмов,
# объявленных и не реализованных нигде: классы запросов с долями, реакция на
# ограничение площадки, залповый предел ведра. Ни один из них не был помечен как
# намерение - все выглядели как часть контракта.
#
# Разница решает вот что. Автор второго SDK читает спецификацию и полагает, что
# описанное работает: он не станет писать свою защиту от вытеснения, если
# контракт обещает доли. А доли не работают ни у кого.
#
# Поэтому правило: механизм либо реализован, либо перечислен здесь. Третьего -
# «объявлен и молчит» - не бывает. Проверка в эталонной реализации сверяет этот
# перечень с тем, что в ней вправду читается, в обе стороны: объявленное и
# нечитаемое обязано быть здесь, а реализованное обязано отсюда исчезнуть.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

items:
  budget_request_preemption:
    declared_in: spec/runtime/budget.yaml#classes
    what: >-
      Вытеснение УЖЕ ИДУЩЕГО запроса: признаки preemptible deferrable и
      cancellable применяются на входе, но начатый запрос не отменяется и не
      откладывается.
    why_not: >-
      Для этого нужна общая очередь с приоритетами, а эталонная реализация
      ходит на площадку по одному запросу за раз из одного цикла. Отменять
      нечего: к моменту, когда пришёл бы более важный запрос, менее важный уже
      получил ответ.

      Правило допуска по классу СДЕЛАНО и работает на входе: запрос класса X
      допускается, только если после него в ведре останется доля всех более
      защищённых классов. Собственный мониторинг продавца больше не вытесняет
      ответы покупателям - он уступает первым, как и объявлено.
    user_impact: >-
      Разница видна при одновременных запросах. «Которых у эталонной реализации
      не бывает» здесь стояло и противоречило spec/runtime/budget.yaml#scope:
      клиент без явного runtime присоединяется к общему для процесса, значит
      несколько клиентов в одном процессе ходят через один бюджет и приходят к
      нему одновременно.

      Чего вправду нет - это общей ОЧЕРЕДИ: каждый клиент спрашивает бюджет из
      своего цикла и, получив отказ, ждёт сам. Правило допуска по классу при
      этом работает и держит долю более защищённых. Не работает порядок
      обслуживания: два запроса, пришедшие в одну миллисекунду, обслуживаются в
      порядке поступления, а не по классу.
    symbols: []

  lane_dropping:
    declared_in: spec/events/delivery.yaml#backpressure.lanes
    what: >-
      Признак droppable у полосы очереди доставки и сжатие событий полосы
      monitoring.
    why_not: >-
      Очередь доставки в опрашивающем клиенте не переполняется: события уходят
      обработчикам партией на том же шаге, на котором родились, и копиться им
      негде. Выбрасывать нечего.

      Ограничение у такого клиента ложится на очередь РАБОТЫ - список диалогов,
      которые предстоит дочитать, - и она ограничена и объявляет потерю вслух:
      см. delivery.yaml -> restart.queue_is_bounded. Это другой механизм, и
      путать их не следует.

      Сжатие событий полосы monitoring не сделано по причине более простой, чем
      «нет наблюдения за витриной»: пересечение порождаемых видов с этой полосой
      ПУСТО. В полосе четыре вида - три про предложения витрины и присутствие
      продавца, - и ни один из них не порождается ничем. Сжимать нечего, и код,
      который бы это делал, не исполнился бы ни разу.
    user_impact: >-
      Сегодня нулевое: выбрасывать нечего. Признак понадобится вместе с
      наблюдением за витриной - единственной полосой, которой сжатие и
      выбрасывание разрешены.
    symbols: [LANE_DROPPABLE]

  budget_exact_trace:
    declared_in: spec/runtime/budget.yaml#conformance.determinism
    what: >-
      Сравнение трассы меток отправки до миллисекунды. Спецификация обещает
      сравнимость между языками, набор сверяет границы.
    why_not: >-
      Запас в ведре считается числами с плавающей точкой, и последний бит
      деления даёт то 199, то 200 миллисекунд. Разница безобидна для площадки и
      смертельна для набора: он показал бы отказ там, где реализация права, -
      то есть ровно то, за что уже был переделан транспорт случаев.

      Чтобы сравнивать до миллисекунды, запас и право на залп обязаны считаться
      целыми числами, а не долями секунды. Это переделка ведра, а не набора.
    user_impact: >-
      Набор ловит нарушение правила залпа в обе стороны: ожидаемое задано
      КОРИДОРОМ из not_before и not_after, и реализация, восстанавливающая право
      на залп вдвое медленнее объявленного, коридор пробивает.

      Прежде здесь было написано «не расхождение в единицы миллисекунд», и это
      преуменьшало дыру: границы были только нижние, и замедление вдвое
      проходило набор целиком. Коридор это закрыл.

      Осталось то, что коридором не закрыть: расхождение реализаций в единицы
      миллисекунд. Ширина коридора выбрана под сторожевую миллисекунду и
      последний бит деления, и внутри неё две реализации на разных языках вправе
      разойтись. Для площадки это не значит ничего, для согласия шести
      реализаций - значит.
    symbols: []

  budget_account_bucket:
    declared_in: spec/runtime/budget.yaml#buckets.account
    what: >-
      Отдельное ведро на КАЖДЫЙ аккаунт, вложенное в ведро сетевой идентичности.
    why_not: >-
      Ведро аккаунта заведено одно на идентичность, а не одно на аккаунт: у
      клиента сегодня нет собственного идентификатора аккаунта - все ходят под
      именем «self», и различать их нечем.

      Ошибка при этом в СТРОГУЮ сторону: несколько аккаунтов на одной
      идентичности делят тридцать запросов вместо тридцати на каждого. Обратная
      ошибка - ведро на клиента - дала бы многократную нагрузку с одного адреса,
      и от неё защищает то, что бюджет принадлежит идентичности; это и
      проверяет набор rate-budget.
    user_impact: >-
      Несколько аккаунтов в одном процессе ходят реже, чем спецификация
      разрешает. Ответы покупателям при этом не теряются: правило допуска по
      классу работает поверх и держит долю interactive.
    symbols: []

  handler_timeout_for_plain_calls:
    declared_in: spec/runtime/budget.yaml#limits.handler_timeout_rule
    what: >-
      Предел времени над НЕОТМЕНЯЕМЫМ вызовом обработчика - тем, который вернул
      не ожидаемое, а обычное значение.
    why_not: >-
      Прервать выполняющуюся функцию нечем, кроме отдельного потока на каждый
      вызов, а это меняет модель исполнения: обработчик перестаёт выполняться в
      потоке вызывающего, и вызывающий об этом не просил.

      Признак - вид ВЫЗОВА, а не вид клиента, и прежнее имя записи
      (handler_timeout_for_sync) вводило в заблуждение: асинхронный клиент с
      обычной функцией в обработчиках так же беззащитен, как синхронный.
      Проверяется буквально наличием ожидаемого у возвращённого значения.
    user_impact: >-
      Обработчик обычной функцией, ушедший в вечное ожидание, останавливает цикл
      наблюдения целиком: ни исключения, ни строки в журнале. Обработчик
      сопрограммой отпускается по пределу и получает HandlerTimeoutError.

      Что нужно, чтобы закрыть: решение о том, вправе ли SDK уводить обработчик
      в отдельный поток. Сегодня это решение не принято, и принимать его молча
      нельзя - оно меняет то, в каком потоке исполняется чужой код.
    symbols: []

  orders_events_capability:
    declared_in: spec/capabilities.yaml#capabilities.orders.events
    what: >-
      Возможность orders.events - поток событий по заказам как отдельно
      управляемая функция: включена она или нет, решается её состоянием.
    why_not: >-
      Операции у возможности нет ни одной, и управлять ею вызывающему нечем.
      События по заказам порождает цикл наблюдения, а он про состояние
      возможности не спрашивает: включить или выключить поток через неё
      невозможно.
    user_impact: >-
      Вызывающий, прочитавший реестр возможностей, решит, что поток событий
      можно спросить и настроить. Спросить состояние он сможет - и получит
      ответ, который ни на что не влияет: события придут независимо от него.
    symbols: []

  # Запись reviews_service снята в 0.8.0. Служба написана, и написана она БЕЗ
  # единого нового похода на площадку: снимок профиля лежал в проекте с
  # 23.08.2026, снятый ради идентификатора аккаунта, и всё это время нёс шесть
  # полных отзывов с адресуемой разметкой.
  #
  # Перечень нужных наблюдений при этом требовал снять reviews.logged.ru, потому
  # что «службы отзывов нет вовсе: наблюдение покажет, что там есть». План
  # просил того, что уже было снято.

  # Запись runner_fourth_subscription снята 24.08.2026: имя наблюдено, это
  # c-p-u. Путь до него стоит помнить, потому что он и есть правило.
  #
  # Значение не прошло образец протокольного знака сборщика. Первая попытка
  # расширить образец делалась НАУГАД и пропустила бы токен вида a1b2c3d4 -
  # проверка это поймала. Вместо догадки сборщик научили говорить, ЧЕМ значение
  # не подошло: длина пять, знаки строчные, пунктуация «-», цифр и заглавных
  # нет. По этой мерке добавлен ровно дефис, и следующий же опрос назвал имя.
  dyn_table_continue_request:
    declared_in: spec/extraction/account.yaml#pagination.request
    what: >-
      Догрузка строк у виджета dyn-table не выполняется ни на одной странице.
    why_not: >-
      Запрос НАБЛЮДЁН 24.08.2026, и имена полей известны: user_id, continue,
      filter. Не хватает не знания, а работы: реализации догрузки нет.

      Одно место остаётся тёмным. Что кладут в поле continue - не наблюдено: в
      скрытом поле формы стоит девятизначное значение, совпадающее с
      идентификатором ВТОРОЙ строки таблицы, а не первой и не последней.
      Реализация обязана брать его из формы как есть, а не выводить из строк.

      Ответ на догрузку - разметка, а не JSON. Разбирать её предстоит тем же
      правилом, что и строки первой страницы; проверить это нечем: наблюдение не
      сохранено - сборщик разобрал разметку как форму и утёк суммами операций,
      файл удалён.
    user_impact: >-
      Вызывающий, у которого сотня отзывов либо тысяча операций, получает первую
      страницу и признание неполноты. Дочитать остальное SDK не умеет.
    symbols: []

  showcase_truncation:
    declared_in: spec/extraction/showcase.yaml#totality
    awaits_observation: true
    what: >-
      Показывает ли профиль всю витрину продавца или её начало.
    why_not: >-
      Признака усечения на странице нет ни одного - ни кнопки догрузки, ни
      формы, ни ссылки «показать все», - при том что у таблицы отзывов на той же
      странице кнопка догрузки есть и находится тем же перебором классов.

      Но у семи разделов из тринадцати ровно по двадцать строк. Двадцать круглое
      число, и семь совпадений подряд на случайность не похожи: это
      ПОЛОЖИТЕЛЬНЫЙ довод в пользу обрезания, а не отсутствие довода против.

      Доказательством он не является: предел выведен из одного снимка одного
      продавца.

      СТРАНИЦА УПРАВЛЕНИЯ СНЯТА 28.08.2026 И ВОПРОСА НЕ РЕШИЛА. На ней ровно
      двадцать строк tc-item и ни одного средства перелистывания - ни кнопки, ни
      ссылки, ни формы. То есть двадцать сошлись на обеих страницах, и обе
      возможности остались: у продавца вправду двадцать лотов в этом разделе,
      либо обрезают обе страницы одинаково.

      Снимок закрыл, впрочем, соседний вопрос. Разделы витрины с четырьмя,
      тремя и двумя строками показаны ПОЛНОСТЬЮ - значит профиль не обрезает
      всё подряд до какого-то меньшего числа, и подозрение сузилось до одного
      порога.

      Что решит вопрос: страница управления раздела, в котором лотов БОЛЬШЕ
      двадцати. Если такого раздела у продавца нет, вопрос не решается его
      аккаунтом вовсе - и это тоже ответ, который стоит записать.
    user_impact: >-
      Продавец читает свою витрину, чтобы свериться с ценами. Объяви разбор
      полноту - и он не увидел бы предложений за двадцатым в каждом разделе, а
      узнал бы об этом от покупателя.
    symbols: []

  runner_error_shape:
    declared_in: spec/extraction/updates.yaml#runner.response_shape
    awaits_observation: true
    what: >-
      Что канал /runner/ кладёт в response.error при неудаче.
    why_not: >-
      Поле наблюдалось только пустым - оба наблюдения 24.08.2026 сняты с
      успешных отправок. Форма отказа неизвестна: строка ли там, объект ли,
      код ли.
    what_it_no_longer_blocks: >-
      ДО 29.08.2026 ЭТА ЗАПИСЬ СЧИТАЛАСЬ БЛОКИРУЮЩЕЙ ОТПРАВКУ, и это было
      преувеличением.

      Чтобы отличить отказ от успеха, форма отказа НЕ НУЖНА: довольно предиката
      «поле error не пусто». Успех при этом объявляется своим положительным
      признаком - площадка вернула сообщение в том самом диалоге, - а не
      отсутствием отказа.

      Правило записано в spec/protocol/send-outcome.yaml и проверено на ответах,
      собранных по наблюдённой форме, включая пять разных видов непустого error.

      Чего форма всё-таки стоит: НАЗВАТЬ причину отказа словами. Сегодня всякий
      отказ называется одной причиной channel_reported_error, и вызывающий узнаёт
      «площадка отказала», не узнавая, почему.
    user_impact: >-
      Реализация отправки обязана отличить успех от отказа. Не зная формы
      отказа, она либо объявит успехом всё, что вернулось с кодом 200, - и
      продавец решит, что покупателю ответили, - либо объявит отказом всё, чего
      не узнала, и отправит сообщение второй раз.
    symbols: []

  reviews_foreign_profile_unobserved:
    declared_in: spec/extraction/reviews.yaml#sources.profile
    awaits_observation: true
    what: >-
      Разбор отзывов проверен только на СОБСТВЕННОМ профиле.
    why_not: >-
      Снимок /users/{id}/ сделан со своего профиля: на нём есть редактор
      аватара, которого на чужом не будет. Разметка отзыва лежит внутри таблицы
      и от владельца зависеть не должна - но это рассуждение, а не наблюдение.
    user_impact: >-
      Вызывающий читает отзывы чужого продавца, чтобы решить, стоит ли с ним
      торговать. Отличайся разметка чужого профиля - и он получит либо отказ по
      смене протокола на ровном месте, либо пустой список, объявленный полным.
    symbols: []

  reviews_page_totality:
    declared_in: spec/extraction/reviews.yaml#pagination.what_hidden_means
    awaits_observation: true
    what: >-
      Полнота чтения отзывов выводится по признаку, наблюдённому на РАЗНЫХ
      страницах, а не на одной.
    why_not: >-
      Класс hidden у кнопки догрузки наблюдён в обоих состояниях, но пара снята
      с двух страниц: профиль с шестью отзывами дал спрятанную кнопку, страница
      операций с двадцатью пятью строками и продолжением - показанную.

      Виджет один и тот же, класс один и тот же, и обратное объяснение требует,
      чтобы он означал разное в двух местах. Но строго говоря наблюдено, что на
      одной странице кнопка спрятана, а на другой нет.

      До 24.08.2026 эта запись говорила другое - что управления постраничным
      выводом на странице нет вовсе. Утверждение было ложным и ложным особым
      образом: отсутствие объявлялось ПО НЕУДАЧЕ ПОИСКА по образцу
      more|pagin|load|next|prev, а узлы назывались dyn-table-continue.
    user_impact: >-
      Вызывающий читает полноту и считает по ней среднюю оценку продавца. Окажись
      вывод неверным - он посчитает её по первой странице.

      Цена сейчас меньше, чем была утром: полнота помечена выведенной, и
      вызывающий, которому это важно, различит вывод и наблюдение.
    symbols: []

  # === Объявленные операции без реализации ===================================
  # Девятнадцать операций из двадцати двух объявлены и не реализованы.
  # Реализовано три: список продаж, список диалогов и чтение переписки.
  #
  # Перечень ПОИМЁННЫЙ нарочно. Прежде семь операций записи покрывались одной
  # записью, называвшей одну из них: читатель, искавший chats.mark_read, не
  # находил ничего и заключал, что она есть.
  #
  # Прочие записи реестра говорят об ОТДЕЛЬНЫХ свойствах некоторых из этих
  # операций - об аудите правки цены, о полосе транспорта у витрины, о кэше
  # здоровья сессии. Ни одна не говорила главного, что самой операции нет.

  # Запись account_service_operations снята в 0.14.0: все четыре операции службы
  # написаны - чтение профиля, его обновление, проверка сессии и профиль
  # возможностей.
  #
  # Ни одна из них не потребовала нового наблюдения. Прежнее обоснование записи
  # говорило «наблюдений пока мало, семь снимков»: снимков стало девять, и
  # нужное лежало уже в первых.

  # Запись catalog_service_operations снята в 0.13.0: чтение каталога написано
  # по снимку корня площадки. Осталась одна операция службы - catalog.field_schema,
  # и она объявлена своей записью ниже.

  catalog_field_schema:
    declared_in: spec/services/catalog.yaml#operations.catalog.field_schema
    awaits_observation: true
    what: >-
      Операция catalog.field_schema - чтение схемы полей подкатегории.
    why_not: >-
      Корень площадки даёт разделы, но не их поля. Страницы раздела никто не
      снимал, и что она показывает - неизвестно.
    covers:
      - catalog.field_schema
    user_impact: >-
      Автор второго SDK читает перечень операций как то, что фреймворк умеет, и
      планирует нормализацию полей лота. Обнаружит отсутствие он тогда, когда
      пойдёт звать операцию.
    symbols: []

  chats_service_operations:
    declared_in: spec/services/chats.yaml
    what: >-
      ТРИ операции диалогов: дочитывание переписки назад, отметка прочтения и
      отправка картинки. Список диалогов, чтение переписки и ОТПРАВКА ТЕКСТА
      реализованы и сюда не входят.

      Отправка текста снята 30.08.2026, и это первая операция записи в проекте.
      Отправка картинки осталась: она требует загрузки файла отдельным запросом
      на адрес, который в записи наблюдения замаскирован.

      ПРОЗА ГОВОРИЛА ЭТО ВЕРНО, А ПЕРЕЧЕНЬ - НЕТ. До 29.08.2026 в covers стояла
      chats.history, реализованная с самого начала: перечень утверждал ровно то,
      что соседний абзац отрицал.

      Ворота расхождения не видели, потому что выводили реализованность из имени
      вида «служба.метод», а chats.history выполняется методом thread. Теперь они
      читают рукописную таблицу соответствия - ту же, которой сверяется
      возвращаемый тип.
    why_not: >-
      ПРИЧИНА СМЕНИЛАСЬ В 0.17.0, и прежняя записана здесь же ниже, потому что
      она больше не верна.

      Страница наблюдена 28.08.2026: три тысячи одна строка, правила извлечения
      записаны в spec/extraction/market.yaml, разбор написан и проверен. Мешает
      теперь не незнание разметки, а сама модель.

      market.offers объявлена возвращающей Offer[], а Offer требует обязательными
      id, price и category_id. Ни одного из трёх со страницы не собрать.
      Идентификатор чужого предложения лежит в СТРОКЕ ЗАПРОСА ссылки и атрибутом
      не выносится - в отличие от страницы своих лотов, где он есть. Цена
      наблюдается текстом, а валюта не наблюдается вовсе; Money требует числа и
      кода валюты. Полей stock и auto_delivery на этой странице нет.

      Собрать Offer из того, что есть, значило бы выдумать три обязательных поля
      из пяти.

      Мешает и второе: pagination объявлена курсором, а разметки постраничной
      навигации на снимке нет ни одной. Список при этом отдан целиком - три
      тысячи строк одним ответом, - и курсор здесь, возможно, не нужен вовсе. Но
      «возможно» операцией не объявляют.

      market.snapshot стоит на market.offers и ждёт её.

      ПРЕЖНЯЯ ПРИЧИНА, снятая наблюдением: реализация растёт наблюдением, а
      наблюдений пока мало - семь снимков страниц на 24.08.2026.

      ОТПРАВКА ПРИ ЭТОМ НАБЛЮДЕНА - 24.08.2026, и наблюдена не разметкой, а
      записями запросов: канал /runner/, действие chat_message, поля данных.
      Отправка изображения - то же действие плюс image_id, с отдельной загрузкой
      файла перед ним.

      ЗАТОР С ПОЛЕМ objects СНЯТ 29.08.2026. Прежде здесь стояло, что операцию
      написать нельзя: поле objects несёт подписку канала, во всех записанных
      запросах оно непусто, и годится ли оно пустым - неизвестно.

      Теперь известно. Опрос с objects=[] вернул код 200 и ответ обычной формы:
      наблюдение network.runner-empty, запись 0. Догадки в этом поле больше нет.

      ЧТО ОСТАЛОСЬ, и это уже не наблюдения. Операция объявлена с governor:
      outbound_message, а ограничитель исходящих числится нереализованным
      записью outbound_governor. Она же объявлена requires_reconciliation:
      true - сверка по истории переписки, а не по факту отсутствия ошибки.

      Порядок назван самим реестром, в записи outbound_governor: «сперва
      операции записи, потом сам ограничитель». Порядок этот про зависимость -
      ограничивать нечего, пока нечего ограничивать, - а не про выпуск. Выпустить
      отправку без ограничителя значило бы отдать продавцу цикл в пять строк,
      наказание за который получает он.

      Наблюдения не хватает ровно одного, и оно узкое: что канал выполняет
      ДЕЙСТВИЕ при пустой подписке. Наблюдался опрос, а опрос и действие - разные
      утверждения. Проверяется это одной отправкой, и сделать её можно только
      настоящим сообщением: отменить его нельзя, поэтому решение за владельцем
      аккаунта, а не за реализацией.

      ТРАНСПОРТ ПРИ ЭТОМ ГОТОВ. Отправка формы написана в обоих транспортах
      29.08.2026, вместе с правилом не повторять запись по переходу.
    covers:
      - chats.history_before
      - chats.mark_read
      - chats.send_image
    user_impact: >-
      Вызывающий читает spec/services как перечень того, что можно позвать.
      Позвав, он получает встроенную ошибку языка, а не FunoraError: общий
      перехват её не поймает, и остановится не операция, а весь его цикл.
    symbols: []

  lots_service_operations:
    declared_in: spec/services/lots.yaml
    what: >-
      ЧТЕНИЕ СОБСТВЕННЫХ ЛОТОВ СНЯТО 30.08.2026 - это первое, что удалось
      написать со страницы управления. Осталось четыре операции записи:
      включение, выключение, правка цены, поднятие.

      Каждая из четырёх адресует лот идентификатором, и теперь его есть
      откуда взять: витрина его не давала. Не хватает им уже не
      идентификатора, а НАБЛЮДЕНИЯ САМИХ ЗАПРОСОВ - переключения, правки и
      поднятия никто не записывал.

      У кнопки поднятия при этом оба довода лежат на странице и читаются:
      игра и раздел. Наблюдение поднятия делать больше не вслепую.

      Пять операций лотов: собственный список, включение, выключение, правка
      цены и поднятие в выдаче.
    why_not: >-
      Реализация растёт наблюдением, а наблюдений пока мало - семь снимков страниц на 24.08.2026.
      Операция, чью страницу никто не видел, писалась бы по догадке о разметке -
      и разошлась бы с площадкой молча, что хуже отсутствия.
    covers:
      - lots.activate
      - lots.deactivate
      - lots.promote
      - lots.update_price
    user_impact: >-
      Вызывающий читает spec/services как перечень того, что можно позвать.
      Позвав, он получает встроенную ошибку языка, а не FunoraError: общий
      перехват её не поймает, и остановится не операция, а весь его цикл.
    symbols: []

  market_service_operations:
    declared_in: spec/services/market.yaml
    what: >-
      Две операции витрины: перечень предложений и снимок раздела.
    why_not: >-
      Реализация растёт наблюдением, а наблюдений пока мало - семь снимков страниц на 24.08.2026.
      Операция, чью страницу никто не видел, писалась бы по догадке о разметке -
      и разошлась бы с площадкой молча, что хуже отсутствия.
    covers:
      - market.offers
      - market.snapshot
    user_impact: >-
      Вызывающий читает spec/services как перечень того, что можно позвать.
      Позвав, он получает встроенную ошибку языка, а не FunoraError: общий
      перехват её не поймает, и остановится не операция, а весь его цикл.
    symbols: []

  # Запись orders_get_operation снята в 0.10.0: операция написана по снимку
  # order.logged.ru, который лежал в проекте с 23.08.2026.

  order_params_unnamed:
    declared_in: spec/extraction/order.yaml#params.why_no_names
    awaits_observation: true
    what: >-
      Восемь параметров заказа отдаются перечнем «метка и значение» без имён.
    why_not: >-
      Различить их можно было бы только по тексту метки, а текст локализован:
      правило, читающее «Дата», умрёт на английской локали молча. Различить по
      положению нельзя: порядок площадка не обещала.

      Два параметра из восьми к тому же совпадают ПОБАЙТОВО вместе с обёрткой и
      цепочкой предков - шестьсот двадцать четыре байта против шестисот двадцати
      четырёх. У них одинакова даже длина значения. Разделить их не может ничто,
      кроме порядка.
    user_impact: >-
      Вызывающий, которому нужна дата заказа, получает перечень и ищет её сам -
      либо по месту, либо по метке. И то и другое хрупко, и SDK этого не
      скрывает: выдуманное имя выглядело бы надёжным и не было бы им.
    symbols: []

  order_chat_truncation:
    declared_in: spec/extraction/order.yaml#chat.truncation
    awaits_observation: true
    what: >-
      Полна ли переписка, показанная на странице заказа.
    why_not: >-
      Признака усечения на странице не нашлось ни одного - ни кнопки догрузки,
      ни счётчика. Из этого НЕ следует, что переписка полна: ровно на такой
      неудаче поиска сегодня уже ошиблись с догрузкой отзывов, где узлы
      назывались dyn-table-continue и образец их не поймал.
    user_impact: >-
      Вызывающий читает заказ и видит пять сообщений. Реши он, что это вся
      переписка, - и решение о выдаче товара будет принято по обрезанной
      истории. Поэтому чтение отдаёт идентификатор диалога: переписку следует
      читать целиком отдельной операцией.
    symbols: []

  # === Обещания о поведении пробы и кэша =====================================
  # Раздел вырос из второго сплошного разбора «объявлено и молчит». Общее у всех
  # записей ниже одно: объявление читается как исполненное соглашение проекта, а
  # исполнения нет ни в контракте, ни в реализации, и цена ошибки ложится на
  # аккаунт пользователя.

  dedup_eviction_policy:
    declared_in: spec/events/delivery.yaml#deduplication.eviction
    what: >-
      eviction: lru рядом с min_entries_per_key: 256. Политика вытеснения
      записей кэша гашения при переполнении корзины ключа: выбывает та запись,
      к которой дольше всех не обращались, а обращением считается и само
      гашение повтора.
    why_not: >-
      Кэш гашения в эталонной реализации не вытесняет ничего по возрасту
      обращения: политики нет, есть только предел. Объявление вывернуто
      наизнанку на копии - eviction: newest_first, то есть противоположная
      политика, - и промолчали все проверяющие, включая классификатор
      изменений.
    user_impact: >-
      Расхождение видно ровно там, где кэш и переполняется: в оживлённом
      диалоге. Ключ упорядочивания у диалога один, 256 записей набираются, и при
      неверной политике первым теряет защиту от повтора то событие, которое
      повторяется чаще прочих. Пользователь получает его дважды - и получает
      именно то, ради гашения которого механизм и заведён.
    symbols: []

  probe_laziness:
    declared_in: spec/capabilities.yaml#probe.rules
    what: >-
      Проба выполняется лениво по группе, а не залпом сразу после логина: момент
      сразу после входа - самый подозрительный для площадки, и серия запросов в
      этот момент даёт худший возможный первый след.
    why_not: >-
      Пробы нет вовсе. Состояния возможностей берутся из статической таблицы, и
      правило о моменте пробы исполнять нечему. Объявление вывернуто на копии в
      «залпом сразу после логина» - промолчали все проверяющие.
    user_impact: >-
      Правило защищает аккаунт, а не удобство. Автор второго SDK читает его как
      исполненное соглашение проекта, не пишет собственной защиты и ставит
      перебор возможностей в конструктор клиента. Цена ошибки несимметрична:
      лишняя лень стоит задержки, залп стоит аккаунта.
    symbols: []

  probe_single_flight:
    declared_in: spec/capabilities.yaml#probe.rules
    what: >-
      На capabilities() действует single-flight: параллельные вызовы дожидаются
      одной пробы, а не запускают по своей. То же обещание задвоено в
      spec/services/account.yaml, operations.capabilities.notes.
    why_not: >-
      Метода capabilities() у эталонной реализации нет вовсе, а значит нет и
      того, на что single-flight мог бы действовать. Объявление вывернуто на
      копии в «single-flight НЕ действует» - промолчали все проверяющие.
    user_impact: >-
      Обещание адресовано тому, кто пишет многопоточного бота: десять
      параллельных вызовов дадут одну пробу, а не десять. Автор второго SDK на
      это положится и не поставит своей блокировки. Десять одновременных серий
      проб с одного адреса - ровно то поведение, из-за которого аккаунт и
      блокируют.
    symbols: []

  capability_profile:
    declared_in: spec/capabilities.yaml#probe.rules
    what: >-
      Профиль возможностей возвращается с полями evaluated_at и source и
      инвалидируется при смене сессии и при первом ProtocolChangedError на
      связанной странице.
    why_not: >-
      Профиля нет: ни типа, ни схемы, ни возврата. Объявление вывернуто на копии
      в «без полей и не инвалидируется» - промолчали все проверяющие.

      Отдельно: перечень значений source здесь - static, probe,
      observed_failure, - а у поля source в реестре возможностей - static,
      probe, derived. Одно слово значит в двух местах разное, и пока профиля
      нет, свести их не на чем.
    user_impact: >-
      Обещана инвалидация профиля при смене сессии - защита ровно от того, чем
      открывается шапка файла: одно попадание в 429 навсегда записывает
      возможность в «отсутствует», код уходит в else-ветку и молча делает не то.
      Читающий считает защиту действующей. Вдобавок тип CapabilityProfile
      назван, а схемы его нет: реализовать профиль по контракту нельзя и сверить
      профили двух SDK нечем.
    symbols: []

  # Запись session_health_cache снята в 0.14.0. Механизм написан, и у срока
  # появилось ЧИСЛО, а не только имя: min_health_interval_ms объявлен в
  # spec/runtime/budget.yaml и порождается в реализацию.
  #
  # Число ВЫБРАНО, а не измерено, и это сказано там же: срок дросселя - наша
  # собственная политика, а не свойство площадки.

  money_mapping_for_absent_languages:
    declared_in: spec/types.yaml#types.money.language_mapping
    what: >-
      Отображение доменного типа money в пять языков, реализаций которых не
      существует: typescript - bigint, java - long с BigDecimal в помощнике,
      dotnet - long с decimal в помощнике, cpp и c - int64_t.
    why_not: >-
      Здесь молчание доказывает не дефект проверки, а невозможность проверки:
      сверять не с чем. Реализация одна, питоновская, и её строка проверяема;
      остальные пять - намерение, записанное в том же виде, что и действующая
      часть контракта.
    user_impact: >-
      Строка своего языка читается автором второго SDK как обязательство,
      проверенное хоть кем-то. Отличить намерение от действующего контракта ему
      нечем. Цена ошибки в такой строке - публичный тип денег второго SDK; цена
      молчания - уверенность, что строка чем-то держится.
    symbols: []

  # === Ошибки, объявленные и недостижимые ====================================
  # Раздел вырос из разбора: из 27 листовых классов ошибок девять не
  # встречались в исполняемом коде ни разу. Два случая оказались дырами и
  # починены; остальные - здесь.
  #
  # Правило то же, что и для механизмов. Автор второго SDK читает
  # spec/errors/errors.yaml, видит класс с устойчивым идентификатором и
  # abi_code, и заключает, что условие наблюдаемо. Он выпишет except и будет
  # ждать. Ждать нечего.

  domain_not_found:
    declared_in: spec/services/chats.yaml#chats.history
    what: >-
      EntityNotFoundError при обращении к несуществующей сущности.
    why_not: >-
      Ветки «не найдено» в чтении переписки нет, и завести её пока не из чего:
      признака несуществующего диалога в spec/extraction не наблюдалось ни
      разу. Придумать селектор вместо наблюдения нельзя - он разошёлся бы с
      площадкой молча.
    user_impact: >-
      Запрос несуществующего диалога даёт один из трёх ложных диагнозов, и все
      три говорят «сломался адаптер» там, где верное - «нет такой сущности»:
      unexpected_response на 404, protocol.changed на странице без контейнера,
      IncompleteResultError на пустом контейнере. Разница дорогая: первые два
      читаются как поломка разметки и, по объявленной политике, переводят
      клиента в состояние protocol-changed - то есть останавливают автоматику
      продавца из-за опечатки в идентификаторе.
    symbols: [EntityNotFoundError]

  domain_write_operations:
    declared_in: spec/services/lots.yaml#lots.update_price
    what: >-
      Операции записи и их отказы: ConflictError при столкновении с
      параллельным изменением, PreconditionFailedError при разошедшейся
      expected_revision.
    why_not: >-
      Операций записи в эталонной реализации нет ни одной: она умеет читать
      список продаж, список диалогов и историю диалога, и больше ничего.
      Возбуждать эти ошибки некому и неоткуда.
    user_impact: >-
      Вызывающему сегодня не видно ничего: спровоцировать условие нельзя даже
      нарочно, потому что службы lots в клиенте нет вовсе - обращение к ней
      даёт встроенную ошибку языка, а не FunoraError, и общий перехват её не
      поймает. Вред адресован читателю
      спецификации: он видит у lots.update_price блок preconditions с
      expected_revision и заключает, что защита от перетирания параллельной
      правки существует.
    symbols: [ConflictError, PreconditionFailedError]

  cursor_pagination:
    declared_in: spec/services/chats.yaml#chats.history_before
    what: >-
      Непрозрачный курсор как значение, отдаваемое вызывающему, и догрузка
      более старых сообщений по нему.
    why_not: >-
      Курсора-значения не существует. Спецификация описывает его как base64url
      от канонического JSON с версией формата и семейством адаптера внутри;
      реализация держит позицию вложенным словарём внутри файла состояния,
      наружу его не отдаёт и обратно не принимает. Метода chats.history_before
      нет.

      Несовместимость при этом ловится - по семейству адаптера и канонической
      форме файла состояния, и с недавних пор именно CursorIncompatibleError.
      Не хватает не проверки, а самого курсора как значения.
    user_impact: >-
      Историю глубже одной страницы не прочитать. Обращение к
      client.chats.history_before даёт встроенную ошибку языка, а не отказ по
      контракту,
      поэтому вызывающий, обернувший работу в except FunoraError, узнает о
      нехватке не отказом, а падением.
    symbols: []

  parse_error_class:
    declared_in: spec/errors/errors.yaml#ParseError
    what: >-
      Отказ ParseError при значении, не приводящемся к доменному типу.
    why_not: >-
      Отношение ParseError и повреждения теперь объявлено:
      spec/extraction/rules.yaml -> value_does_not_convert. Значение,
      не приводящееся к типу, даёт повреждение уровня field либо row, а
      ParseError оставлен уровню page - тому значению, без которого страница
      не имеет смысла вовсе.

      В эталонной реализации такого значения нет: она читает строки списков, и
      потеря любого поля оставляет остальные строки годными. Возбуждать
      ParseError не из чего.
    user_impact: >-
      Вызывающий, выписавший except ParseError, не поймает ничего: придёт
      IncompleteResultError, у которого другой родитель. Прежде это было
      расхождением, теперь - объявленным свойством: перечень ошибок операции
      называет то, что вправду бывает, а ParseError среди них нет.
    symbols: [ParseError]
  updates_channel:
    declared_in: spec/extraction/updates.yaml
    what: >-
      Канал обновлений площадки: метки состояния в атрибутах шапки и виджета,
      механизм runner и повтор пропущенного по позиции.
    why_not: >-
      Реализация канал не использует вовсе. Она опрашивает страницы целиком по
      расписанию и сравнивает наблюдённое с сохранённым.

      «Метки не читает ни одной» здесь стояло и было неверно: позиции
      data-node-msg и data-user-msg читаются в _chats.py, и на их сравнении
      стоит порождение chat.unread_changed. Утверждение опасное - автор второго
      SDK прочитал бы его как «позиции можно не делать», а на них держится
      целый вид события. Не сделан именно КАНАЛ: механизм runner и повтор
      пропущенного по позиции.

      Причина не в лени: метка отвечает на вопрос «изменилось ли», а позиция -
      «что именно я пропустил», и второе только предполагается. Строить на
      предположении доставку событий значило бы обещать гарантию, которой нет.
    user_impact: >-
      Опрос идёт чаще, чем нужно, и узнаёт об изменении позже, чем мог бы: между
      двумя чтениями проходит интервал расписания, а метка сменилась бы сразу.
      Для наблюдения за собственными продажами разница невелика, для отслеживания
      чужих цен - заметна.

      Отдельно: реестр покрытия ссылался на эту запись, а записи не было. Ссылка
      на несуществующее хуже отсутствия ссылки - она выглядит выполненным
      обещанием.
    symbols: []

  outbound_governor:
    declared_in: spec/runtime/budget.yaml#outbound_governor
    what: >-
      Ограничитель исходящих сообщений: не больше тридцати в час, не больше
      пятнадцати уникальных адресатов, не чаще одного в тридцать секунд на
      переписку, холодное обращение только с явным признаком и не больше трёх в
      час.
    why_not: >-
      САМ МЕХАНИЗМ НАПИСАН 29.08.2026, и запись остаётся не поэтому.

      Прежде здесь стояло: ни одно из чисел раздела не читает никто - ни
      кодогенератор, ни ворота, ни один тест; проверено мутацией дважды, раздел
      удалялся целиком и числа выворачивались наизнанку, и оба раза проверки
      молчали.

      Теперь числа порождаются, а обе те мутации сборку РОНЯЮТ - вместе с тремя
      новыми: снятым окном холодного обращения, опустошённым перечнем греющих
      событий и любым непрочитанным ключом раздела.

      Журнал исходящих написан и проверен двенадцатью мутациями: четыре предела,
      переживание перезапуска, часы, переведённые в обе стороны, и отказ без
      долговечного реестра.

      ЧЕГО НЕТ: операции, к которой ограничитель привязывается. Ограничивать
      по-прежнему нечего - отправки в эталонной реализации нет, - и потому не
      проверено главное: что операция вправду спрашивает ограничитель прежде
      вёдер и записывает попытку впереди запроса.

      Механизм, написанный и никем не вызываемый, - ровно тот случай, ради
      которого этот реестр и заведён. Снимать запись до появления вызова
      значило бы объявить защиту действующей.
    what_the_contract_itself_does_not_say: >-
      Записано после разбора 29.08.2026. Прежде запись читалась как «числа есть,
      осталось написать код». Чисел есть четыре, а для механизма их мало.

      Не объявлено ОКНО холодного обращения. Определение говорит «не было
      входящего события в окне», а самого окна нет ни здесь, ни где-либо в
      spec/. Подставить окно соседнего механизма нельзя: они про другое.

      Не объявлено, что считать ВХОДЯЩИМ СОБЫТИЕМ. Видов событий шестнадцать, и
      какие из них делают переписку тёплой, не сказано. Хуже того: реализация
      сегодня не отличает своё сообщение от чужого - Origin различает системное,
      человеческое и неизвестное, а сторону не различает вовсе.

      Не объявлена ОБЛАСТЬ ДЕЙСТВИЯ. Тридцать сообщений в час - на аккаунт или
      на сетевую идентичность? Раздел вложенности описывает только вёдра.

      Не объявлено ПОВЕДЕНИЕ ПРИ ОТКАЗЕ. Пределы часового масштаба, а ждать их
      бессмысленно при объявленном пределе ожидания в пять секунд, и нигде это
      не сказано. Класс ошибки тоже не назван.

      Не объявлено, ПЕРЕЖИВАЮТ ЛИ СЧЁТЧИКИ ПЕРЕЗАПУСК. Всё состояние бюджета
      живёт в памяти на монотонных секундах. При счётчиках в памяти тридцать
      сообщений в час обходятся перезапуском процесса - то есть защита, ради
      которой раздел написан, снимается вовсе.

      НАБОРА СООТВЕТСТВИЯ НЕТ. Раздел соответствия называет три вида векторов, и
      ни один не про исходящие. Согласие шести реализаций по этим числам не
      проверяется ничем.
    user_impact: >-
      Вред адресован не вызывающему, а автору второго SDK, и он тяжелее
      обычного. Тот прочитает раздел как действующую защиту от наказания по
      публичным правилам площадки и НЕ станет писать собственную.

      Порядок закрытия назывался так: сперва операции записи, потом сам
      ограничитель. Вышло наоборот, и это оказалось лучше: доопределяя
      ограничитель, пришлось назвать шесть вещей, которых контракт не говорил
      вовсе - окно холодного обращения, определение входящего события, область
      действия, поведение при отказе, переживание перезапуска и порядок проверки
      пределов. Напиши мы отправку раньше, она встала бы на эти шесть пробелов.

      Пока вызова нет, цикл в пять строк поверх Funora ничем не ограничен, а
      наказание получает продавец.
    symbols: []

  admission_control:
    declared_in: spec/runtime/budget.yaml#admission_control
    what: >-
      Допуск наблюдений по прогнозируемой стоимости: регистрация проверяет,
      помещается ли наблюдение в бюджет, и отказывает со списком того, что
      придётся снять. Сюда же относится cost_hint у операций - объявленная
      стоимость, которая была бы входом этого правила.
    why_not: >-
      Наблюдений за рынком нет, регистрировать нечего. Ни enabled, ни rule,
      ни cost_source, ни dry_run, ни cost_hint у операций не читает никто.

      Проверено мутацией: enabled переведён в false, cost_hint удалён у обеих
      объявляющих его операций - все проверки промолчали.
    user_impact: >-
      Автор второго SDK реализует отказ при регистрации и предварительный
      расчёт monitoring.plan, полагая, что контракт уже защищает от
      круглосуточного потока наблюдений. Не защищает ничто.

      cost_hint оставлен в контракте нарочно: он не ошибка, а часть этого же
      механизма, и убирать его отдельно значило бы разобрать механизм на части,
      каждая из которых по отдельности выглядит лишней.
    symbols: []

  write_bucket_unit:
    declared_in: spec/runtime/budget.yaml#buckets.write.unit
    what: >-
      Отдельная единица учёта у ведра write: действия в час, а не запросы.
      Одно действие может стоить нескольких запросов, а ограничивать надо число
      изменений на площадке.
    why_not: >-
      Ведро write не расходуется ничем: операций записи нет. Признак unit
      кодогенератор не читает - порождается только ёмкость, скорость и залп, -
      и расход считался бы запросами наравне с прочими вёдрами.
    user_impact: >-
      Автор второго SDK спишет одно действие один раз независимо от того, во
      сколько запросов оно обошлось, а эталонная реализация, дойди у неё до
      этого дело, списала бы каждый запрос. Расхождение в разы, и молчаливое.
    symbols: []

  retry_conformance_suite:
    declared_in: spec/protocol/retry-policy.yaml#conformance
    what: >-
      Набор соответствия retries: нормализованный журнал решений о повторе -
      попытка, класс, повторено ли, пауза, код причины - и утверждение окна
      допустимых пауз.
    why_not: >-
      Набора нет. Объявлены три: canonical_form, resume и rate-budget; этот
      четвёртый назван в retry-policy.yaml и в runner-protocol.yaml не значится.

      Проверено мутацией: имя набора и формат ожидаемого журнала изменены -
      прогон набора соответствия не заметил ничего.
    user_impact: >-
      Решение о повторе - то, где реализации расходятся тише всего: обе
      «повторяют», а паузы и число попыток разные. Объявленный и несуществующий
      набор выглядит гарантией согласия, которой нет.
    symbols: []

  single_flight_reauth:
    declared_in: spec/protocol/retry-policy.yaml#policies
    what: >-
      Признак requires: single_flight_reauth у политики истёкшей сессии.
      Восстановление сессии однократное: десять параллельных запросов,
      одновременно получивших отказ, обязаны дождаться одного восстановления, а
      не запустить десять.
    why_not: >-
      Признак не читает никто: кодогенератор порождает из политик задержки,
      число попыток и признак account_scoped, а requires опускает молча.
      Восстановления сессии в реализации нет вовсе.
    user_impact: >-
      Десять одновременных восстановлений - это десять входов подряд с
      одного адреса, то есть ровно то поведение, из-за которого аккаунт и
      блокируют. Автор второго SDK прочитает признак как исполненный.
    symbols: []

  event_identity_source:
    declared_in: spec/events/delivery.yaml#identity
    what: >-
      Выбор источника идентичности события: preferred: remote_id,
      fallback: deterministic_fingerprint. Удалённый идентификатор площадки
      предпочитается вычисленному отпечатку.
    why_not: >-
      Реализация всегда считает отпечаток и удалённого идентификатора не
      ищет вовсе. Оба ключа раздела не читает никто.
    user_impact: >-
      Две реализации, одна с удалёнными идентификаторами и одна с
      отпечатками, дадут РАЗНЫЕ идентификаторы одному событию. Гашение повторов
      и ключи идемпотентности у них не совпадут, и обнаружит это тот, кто
      перенесёт состояние с одной на другую.
    symbols: []

  ordering_causality:
    declared_in: spec/events/delivery.yaml#ordering
    what: >-
      Правило причинности: события, причинно связанные с одним заказом,
      получают ключ заказа, даже если наблюдаются в переписке.
    why_not: >-
      Ключ упорядочивания берётся из таблицы по виду события, и вид
      message.created всегда даёт ключ диалога. Связать сообщение об оплате с
      заказом нечем: связи между ними в разметке не наблюдалось.

      Разбор предлагал правило убрать. Оставлено записью: это не ошибка текста,
      а невыполненное намерение, и намерение верное - сообщение об оплате и
      смена статуса заказа, разъехавшись по разным ключам, обрабатываются
      параллельно и в любом порядке.
    user_impact: >-
      Обработчик, полагающийся на порядок между сообщением об оплате и
      сменой статуса заказа, получит их в произвольном порядке. Для выдачи
      товара это значит выдачу до подтверждения оплаты.
    symbols: []

  lots_deactivate_guards:
    declared_in: spec/services/lots.yaml#lots.deactivate
    what: >-
      Три предохранителя автоматической деактивации лота: снимать только при
      достоверно нулевом остатке, не снимать по ненаблюдённому значению,
      объявлять снятие обратимым.
    why_not: >-
      Службы lots в реализации нет вовсе. Предохранители не читает никто, и
      мутация любого из них проходит молча.
    user_impact: >-
      Предохранители придуманы против одной ошибки: снять лот с продажи,
      прочитав «остаток не наблюдался» как «остаток ноль». Автор второго SDK
      прочитает их как исполненные и не станет писать своих - а цена ошибки
      здесь снятый с витрины товар.
    symbols: []

  chats_send_governor:
    declared_in: spec/services/chats.yaml#chats.send_text
    what: >-
      Привязка операций отправки к именованному ограничителю исходящих:
      governor: outbound_message у send_text и send_image.
    why_not: >-
      Операций отправки нет. Ограничитель с 29.08.2026 ЕСТЬ - см. запись
      outbound_governor, - а признак governor: outbound_message у операции
      по-прежнему не читает никто: читать его некому, пока нет самой операции.

      Признак и механизм закроются одним движением: тем, которое напишет
      отправку и заставит её спросить ограничитель.
    user_impact: >-
      Та же сторона того же обещания, что и outbound_governor, но видимая
      автору второго SDK из другого файла: он открывает описание операции
      отправки и видит, что она уже под ограничителем.
    symbols: []

  market_transport_lane:
    declared_in: spec/services/market.yaml#market.offers
    what: >-
      Отдельная транспортная дорожка public_read у операций рынка: свой пул
      соединений, свой бюджет, свой набор cookie. Цель - изоляция отказов
      публичного чтения от работы под сессией.
    why_not: >-
      Дорожка не заведена: транспорт один, и признак transport_lane не
      читает никто. Наблюдения за рынком нет вовсе.
    user_impact: >-
      Изоляция объявлена и отсутствует. Отказ публичного чтения уронит то же
      соединение и тот же бюджет, которыми идёт работа под сессией, - ровно то,
      от чего дорожка и заводилась.
    symbols: []

  lots_update_price_audit:
    declared_in: spec/services/lots.yaml#lots.update_price
    what: >-
      Требование audit: before_state - сохранять состояние лота до изменения
      цены. Единственная операция контракта, которой предписан аудит.
    why_not: >-
      Операции нет, сохранять нечего. Признак не читает никто.
    user_impact: >-
      Аудит цены - единственный способ узнать, что бот поменял её неверно, и
      единственный способ вернуть как было. Объявленный и отсутствующий, он
      выглядит страховкой, которой нет.
    symbols: []

  market_snapshot_completeness:
    declared_in: spec/services/market.yaml#market.snapshot
    what: >-
      Обязательность признака полноты у снимка рынка и три правила рядом с
      ним: перечень значений полноты, запрет молчаливой неполноты и требование
      называть причину.
    why_not: >-
      Снимка рынка нет. Ни completeness_required, ни правила в notes не
      читает никто.
    user_impact: >-
      Молчаливая неполнота снимка рынка означает неверное решение о цене:
      бот увидит половину предложений и посчитает себя дешевле всех.
    symbols: []

  catalog_categories_cache:
    declared_in: spec/services/catalog.yaml#catalog.categories
    what: >-
      Кэширование справочника разделов: срок сутки и три события сброса -
      смена версии адаптера, смена протокола, смена сессии.
    why_not: >-
      Справочника разделов в реализации нет. Ни срок, ни события сброса не
      читает никто.
    user_impact: >-
      Кэш без сброса на смену протокола отдаёт разделы, которых больше нет,
      ровно до истечения суток. Автор второго SDK прочитает правило сброса как
      исполненное.
    symbols: []

  instant_attributes:
    declared_in: spec/types.yaml#types.instant
    what: >-
      Два атрибута момента с закрытыми перечислениями: precision - вправду
      ли метка точна или сведена из «вчера, 14:32», и origin - абсолютной она
      была или вычислена из относительной формулировки.
    why_not: >-
      Реализация отдаёт момент без атрибутов: метки времени возвращаются
      текстом, и разбирать их в момент она не берётся - относительные
      формулировки площадки не наблюдались достаточно, чтобы это делать.
      Перечисления не читает никто.
    user_impact: >-
      Относительная метка, выданная за точную, сдвигает всякий расчёт срока:
      «вчера, 14:32» превращается в момент с точностью до минуты, которого не
      было. Атрибут precision заводился ровно затем, чтобы это было видно.
    symbols: []

  # Запись runner_action_empty_subscription снята 30.08.2026. Канал ВЫПОЛНЯЕТ
  # действие при пустой подписке: отправка с objects=[] прошла, сообщение
  # появилось в переписке.
  #
  # Наблюдение оказалось контрольной парой - две отправки в один диалог, в одну
  # минуту, в одной записи: одна страницей с полной подпиской, другая сборщиком
  # с пустой. Различие ровно одно, и оно объясняет всё.
  #
  # Оно же принесло второе, чего не ждали, и завело запись ниже.

  # Запись runner_action_minimal_subscription снята 30.08.2026. Подписка из
  # одного узла возвращает его изменение: отправка с подпиской ровно на узел
  # диалога вернула ровно один объект - тот самый узел, с непустым messages.
  #
  # Правило «ответ подтверждает только подписанное» подтверждено на ТРЁХ точках:
  # четыре объекта в подписке дали два в ответе, один дал один, ноль дал ноль.
  #
  # ЧТО ЭТО ЗАКРЫВАЕТ: последнюю догадку в отправке сообщения. Запрос, подписка,
  # ответ и подтверждение - всё наблюдено. Полная подписка при этом не нужна, и
  # это кстати: метка закладок так и не найдена.

  chats_send_return_type:
    declared_in: spec/services/chats.yaml#operations.chats.send_text.returns
    what: >-
      Операции отправки объявлены returns: Message, а схема Message помечена
      x-funora-not-implemented и сама говорит, что её не собирает ни одна
      реализация.
    why_not: >-
      Противоречие внутри контракта, а не пробел наблюдения. Два обязательных
      поля Message из ответа канала не заполняются вовсе:

      text - в ответе лежит только готовая разметка сообщения, а её значения не
      наблюдают НАМЕРЕННО: это чужая переписка. Подставить эхо своего ввода не
      то же самое - что площадка сохранила, неизвестно;

      origin - в Message отвечает на «как определено, что сообщение системное»,
      а в реализации на «кто отправил». Схема сама говорит, что значения не
      пересекаются.

      Заполнимы из ответа только id, chat_id и observed_at.
    user_impact: >-
      Автор второго SDK прочитает returns: Message как обещание и станет
      выдумывать поля, которых не наблюдал, - ровно то, ради чего пометка
      x-funora-not-implemented на схеме и стоит.
    symbols: []

  # Запись reconciliation_procedure снята 29.08.2026. Порядок шагов, правило
  # решения и признак опознания объявлены в spec/protocol/reconciliation.yaml -
  # третьем доме нормативного порядка.
  #
  # Главное, что она дала: признак опознания своего сообщения. По ссылке на
  # собственный профиль, а не по идентификатору, - и этим объявленный затор
  # (идентификатор в ответе число, в разметке строка) стал НЕВАЖНЫМ, а не
  # обойдённым догадкой.
  #
  # Опознание по тексту запрещено прямо: текст - чужой ввод, и совпадение
  # подделывает собеседник, прислав в ответ то же самое.
  #
  # Вердикта отрицания в перечне НЕТ, и запрет стоит в порождении, а не в прозе:
  # отсутствие в истории - свидетельство отрицательное, и объявлять по нему «не
  # отправлено» значило бы подтолкнуть вызывающего написать второй раз.

  catalog_search_operation:
    declared_in: spec/extraction/catalog.yaml#search.form
    what: >-
      Поиск по играм: форма на корне площадки наблюдена, операции нет.
    why_not: >-
      Адрес формы снят с разметки. Имя поля ввода в скелете замаскировано, и
      собрать запрос по снимку нельзя - тот же затор, что у догрузки строк.

      Главное же в том, что ОТВЕТА НИКТО НЕ ВИДЕЛ. Объявлять операцию по одной
      форме значило бы обещать разбор того, чего не наблюдали: неизвестно даже,
      возвращает площадка разметку или JSON.
    user_impact: >-
      Вызывающий, которому нужна игра по названию, перебирает восемьсот сорок две
      карточки сам. Это работает и стоит одного чтения каталога - неудобно, но не
      обманчиво.
    symbols: []

  chats_sending_form:
    declared_in: spec/extraction/chats.yaml#sending
    what: >-
      Адрес и метод формы отправки сообщения, наблюдённые в разметке, и
      утверждение об отсутствии скрытых полей.
    why_not: >-
      Отправки в реализации нет, форму никто не читает. Наблюдение при этом
      настоящее: адрес и метод сняты с живой страницы.

      Наблюдение 23.08.2026 показало вдобавок, что отправка идёт не этой формой,
      а каналом обновлений - POST /runner/ с полем request. Объявленный адрес
      формы описывает не тот путь, которым сообщение уходит на деле.
    user_impact: >-
      Автор второго SDK реализует отправку по объявленному адресу формы. Она
      может и сработать, но это не тот путь, которым пользуется сама площадка, и
      согласия между реализациями по нему не будет.
    symbols: []
