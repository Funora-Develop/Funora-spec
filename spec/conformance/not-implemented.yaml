# Что контракт объявляет, а эталонная реализация не делает.
#
# Файл появился после разбора, который нашёл в контракте несколько механизмов,
# объявленных и не реализованных нигде: классы запросов с долями, реакция на
# ограничение площадки, залповый предел ведра. Ни один из них не был помечен как
# намерение - все выглядели как часть контракта.
#
# Разница решает вот что. Автор второго SDK читает спецификацию и полагает, что
# описанное работает: он не станет писать свою защиту от вытеснения, если
# контракт обещает доли. А доли не работают ни у кого.
#
# Поэтому правило: механизм либо реализован, либо перечислен здесь. Третьего -
# «объявлен и молчит» - не бывает. Проверка в эталонной реализации сверяет этот
# перечень с тем, что в ней вправду читается, в обе стороны: объявленное и
# нечитаемое обязано быть здесь, а реализованное обязано отсюда исчезнуть.

version: "0.1.0"

items:
  budget_request_preemption:
    declared_in: spec/runtime/budget.yaml#classes
    what: >-
      Вытеснение УЖЕ ИДУЩЕГО запроса: признаки preemptible deferrable и
      cancellable применяются на входе, но начатый запрос не отменяется и не
      откладывается.
    why_not: >-
      Для этого нужна общая очередь с приоритетами, а эталонная реализация
      ходит на площадку по одному запросу за раз из одного цикла. Отменять
      нечего: к моменту, когда пришёл бы более важный запрос, менее важный уже
      получил ответ.

      Правило допуска по классу СДЕЛАНО и работает на входе: запрос класса X
      допускается, только если после него в ведре останется доля всех более
      защищённых классов. Собственный мониторинг продавца больше не вытесняет
      ответы покупателям - он уступает первым, как и объявлено.
    user_impact: >-
      Разница видна только при одновременных запросах, которых у эталонной
      реализации не бывает. Появятся - появится и нужда в очереди.
    symbols: []

  retry_fail_closed:
    declared_in: spec/protocol/retry-policy.yaml#policies
    what: >-
      Признак fail_closed у политик access_blocked и challenge_required:
      «опрос останавливается полностью, короткий автоматический backoff
      запрещён».
    why_not: >-
      Признак порождается в RetryPolicy и не читается никем. Наблюдаемое
      поведение сегодня совпадает с объявленным по совпадению, а не по правилу:
      обе ошибки неповторяемы, а неповторяемая ошибка чтения выходит из цикла
      наблюдения наружу и останавливает его.

      Совпадение это хрупкое. Появись у любой из двух политик max_attempts
      больше единицы - и клиент начнёт стучаться после отказа в доступе, то есть
      подтверждать подозрение, а признак, который это запрещает, останется
      непрочитанным.
    user_impact: >-
      Сегодня нулевое. Завтра - ровно то, ради чего признак заведён: клиент
      продолжает опрос заблокированного аккаунта.
    symbols: [fail_closed]

  lane_dropping:
    declared_in: spec/events/delivery.yaml#backpressure.lanes
    what: >-
      Признак droppable у полосы очереди: события полосы monitoring разрешено
      выбрасывать при переполнении, события двух других - нет.
    why_not: >-
      Реализация не выбрасывает событий вовсе, поэтому решать нечего. При
      переполнении останавливается производитель: очередь дочитывания переписок
      ограничена, а выбывшие из неё диалоги объявляются событием event.loss.

      Полоса при этом читается - по ней решается, считать ли событие признаком
      активности. Не читается именно признак выбрасываемости.
    user_impact: >-
      Сегодня нулевое: выбрасывать нечего. Признак понадобится тогда, когда
      появится наблюдение за витриной - единственная полоса, которой сжатие и
      выбрасывание разрешены.
    symbols: [LANE_DROPPABLE]

  conformance_runner:
    declared_in: spec/version.yaml#runner_protocol
    what: >-
      Версия протокола запуска набора соответствия: способ прогнать чужую
      реализацию по общим векторам и сравнить журнал решений.
    why_not: >-
      Набора векторов не существует физически. Ось версий заведена заранее,
      чтобы протокол запуска можно было менять отдельно от контракта, но менять
      пока нечего.
    user_impact: >-
      Проверить чужую реализацию на соответствие нечем. Сегодня согласованность
      держится тем, что реализация одна.
    symbols: [RUNNER_PROTOCOL]

  handler_timeout_for_sync:
    declared_in: spec/runtime/budget.yaml#limits.handler_timeout_ms
    what: Предел времени на обработчик.
    why_not: >-
      Применяется к асинхронным обработчикам, где сопрограмму можно отменить. К
      синхронным не применяется: прервать выполняющуюся функцию в Python нечем,
      кроме отдельного потока на каждый вызов, а это меняет модель исполнения
      обработчика - он перестаёт выполняться в потоке вызывающего.
    user_impact: >-
      Синхронный обработчик, ушедший в вечное ожидание, останавливает цикл
      наблюдения. Асинхронный отпускается по пределу.
    symbols: []

  # === Ошибки, объявленные и недостижимые ====================================
  # Раздел вырос из разбора: из 27 листовых классов ошибок девять не
  # встречались в исполняемом коде ни разу. Два случая оказались дырами и
  # починены; остальные - здесь.
  #
  # Правило то же, что и для механизмов. Автор второго SDK читает
  # spec/errors/errors.yaml, видит класс с устойчивым идентификатором и
  # abi_code, и заключает, что условие наблюдаемо. Он выпишет except и будет
  # ждать. Ждать нечего.

  domain_money_type:
    declared_in: spec/types.yaml#money
    what: >-
      Доменный тип money: сумма в минорных единицах и код валюты по ISO 4217,
      с запретом арифметики между разными валютами.
    why_not: >-
      Тип не строится нигде. Пакет отдаёт наблюдённое как есть - amount_text
      («1500 ₽») и currency_symbol_text («₽») по отдельности, оба Observed[str].

      Собрать из этого money значило бы вывести код валюты из символа и
      разрядность из вида числа. И то и другое - домысел, а не наблюдение:
      символ доллара стоит у полудюжины валют, а разрядность по записи не
      видна. Правило проекта запрещает выдавать домысел за наблюдение, и
      молчаливо неверная валюта в денежном поле - худший из возможных способов
      это правило нарушить.
    user_impact: >-
      Вызывающий разбирает цену сам. Он получает строку, а не сумму, и
      складывать цены двух заказов вынужден своим кодом - в котором нет ни
      проверки валют, ни защиты от плавающей точки, ради которых тип и
      объявлен. CurrencyMismatchError не возбуждается никогда, потому что
      арифметики, которая могла бы ошибиться, в пакете не существует.
    symbols: [CurrencyMismatchError]

  domain_not_found:
    declared_in: spec/services/chats.yaml#chats.history
    what: >-
      EntityNotFoundError при обращении к несуществующей сущности.
    why_not: >-
      Ветки «не найдено» в чтении переписки нет, и завести её пока не из чего:
      признака несуществующего диалога в spec/extraction не наблюдалось ни
      разу. Придумать селектор вместо наблюдения нельзя - он разошёлся бы с
      площадкой молча.
    user_impact: >-
      Запрос несуществующего диалога даёт один из трёх ложных диагнозов, и все
      три говорят «сломался адаптер» там, где верное - «нет такой сущности»:
      unexpected_response на 404, protocol.changed на странице без контейнера,
      IncompleteResultError на пустом контейнере. Разница дорогая: первые два
      читаются как поломка разметки и, по объявленной политике, переводят
      клиента в состояние protocol-changed - то есть останавливают автоматику
      продавца из-за опечатки в идентификаторе.
    symbols: [EntityNotFoundError]

  domain_write_operations:
    declared_in: spec/services/lots.yaml#lots.update_price
    what: >-
      Операции записи и их отказы: ConflictError при столкновении с
      параллельным изменением, PreconditionFailedError при разошедшейся
      expected_revision.
    why_not: >-
      Операций записи в эталонной реализации нет ни одной: она умеет читать
      список продаж, список диалогов и историю диалога, и больше ничего.
      Возбуждать эти ошибки некому и неоткуда.
    user_impact: >-
      Вызывающему сегодня не видно ничего: спровоцировать условие нельзя даже
      нарочно, потому что обращение к client.lots даёт AttributeError - не
      FunoraError, и общий except его не поймает. Вред адресован читателю
      спецификации: он видит у lots.update_price блок preconditions с
      expected_revision и заключает, что защита от перетирания параллельной
      правки существует.
    symbols: [ConflictError, PreconditionFailedError]

  cursor_pagination:
    declared_in: spec/services/chats.yaml#chats.history_before
    what: >-
      Непрозрачный курсор как значение, отдаваемое вызывающему, и догрузка
      более старых сообщений по нему.
    why_not: >-
      Курсора-значения не существует. Спецификация описывает его как base64url
      от канонического JSON с версией формата и семейством адаптера внутри;
      реализация держит позицию вложенным словарём внутри файла состояния,
      наружу его не отдаёт и обратно не принимает. Метода chats.history_before
      нет.

      Несовместимость при этом ловится - по семейству адаптера и канонической
      форме файла состояния, и с недавних пор именно CursorIncompatibleError.
      Не хватает не проверки, а самого курсора как значения.
    user_impact: >-
      Историю глубже одной страницы не прочитать. Обращение к
      client.chats.history_before даёт AttributeError, а не отказ по контракту,
      поэтому вызывающий, обернувший работу в except FunoraError, узнает о
      нехватке не отказом, а падением.
    symbols: []

  handler_plugins:
    declared_in: spec/errors/errors.yaml#PluginError
    what: >-
      Архитектура сторонних расширений и отказ внутри расширения.
    why_not: >-
      Подключить расширение некуда: точки расширения в пакете нет вовсе.
      Возбуждать PluginError нечему.
    user_impact: >-
      Вред адресован не вызывающему, а автору второго SDK: он видит класс с
      abi_code 1860 под FunoraError и заключает, что архитектура расширений -
      часть контракта, которую его реализации полагается поддержать.
    symbols: [PluginError]

  locale_observation:
    declared_in: spec/errors/errors.yaml#UnsupportedLocaleError
    what: >-
      Наблюдение локали интерфейса и отказ на локали, для которой у адаптера
      нет текстовых шаблонов.
    why_not: >-
      Локаль ответа не наблюдается вовсе. Клиент просит нужную заголовком
      Accept-Language и принимает то, что пришло, не сверяя.
    user_impact: >-
      Страница на чужой локали разбирается молча и настолько, насколько
      позволяют структурные признаки: то, что опознаётся по классам разметки,
      прочитается верно, то, что по тексту, - не прочитается вовсе и уйдёт в
      неполноту без слова «локаль» в причине. Вызывающий будет искать поломку
      разметки там, где сменился язык интерфейса.
    symbols: [UnsupportedLocaleError]

  parse_error_class:
    declared_in: spec/errors/errors.yaml#ParseError
    what: >-
      Отказ ParseError при значении, не приводящемся к доменному типу.
    why_not: >-
      Отношение ParseError и повреждения теперь объявлено:
      spec/extraction/rules.yaml -> value_does_not_convert. Значение,
      не приводящееся к типу, даёт повреждение уровня field либо row, а
      ParseError оставлен уровню page - тому значению, без которого страница
      не имеет смысла вовсе.

      В эталонной реализации такого значения нет: она читает строки списков, и
      потеря любого поля оставляет остальные строки годными. Возбуждать
      ParseError не из чего.
    user_impact: >-
      Вызывающий, выписавший except ParseError, не поймает ничего: придёт
      IncompleteResultError, у которого другой родитель. Прежде это было
      расхождением, теперь - объявленным свойством: перечень ошибок операции
      называет то, что вправду бывает, а ParseError среди них нет.
    symbols: [ParseError]
  canonical_instant_form:
    declared_in: spec/canonical-form.yaml#rules[13]
    what: >-
      Канонический вид instant: строка RFC 3339 в UTC с суффиксом Z и ровно
      тремя знаками миллисекунд.
    why_not: >-
      Реализация принимает момент снаружи и не переписывает его. Единственный
      instant, который она вправду сериализует, - observed_at, и он уходит в
      том виде, в каком пришёл.
    user_impact: >-
      Две реализации, форматирующие момент по-разному, дадут разные байты там,
      где сравниваются байты. Сегодня это некритично: отпечаток строится из
      четырёх полей, момента среди них нет, и правило forbidden_in_fingerprint
      запрещает его туда класть. Станет критично, когда момент попадёт в вектор
      conformance.
    symbols: []

  canonical_timezone_vector:
    declared_in: spec/canonical-form.yaml#rules[13]
    what: >-
      Вектор conformance, прогоняющий одну фикстуру под TZ=UTC и под другим
      поясом с требованием побайтового совпадения.
    why_not: >-
      Требование осмысленно только там, где реализация сама форматирует момент.
      Пока она его не форматирует, вектор проверял бы, что часовой пояс не
      влияет на то, чего не происходит.

      Прежняя редакция docs/canonical-json.md объявляла этот вектор
      ОБЯЗАТЕЛЬНЫМ и существующим. Его не было.
    user_impact: >-
      Реализация, форматирующая момент по местному поясу, не будет поймана
      ничем.
    symbols: []

  updates_channel:
    declared_in: spec/extraction/updates.yaml
    what: >-
      Канал обновлений площадки: метки состояния в атрибутах шапки и виджета,
      механизм runner и повтор пропущенного по позиции.
    why_not: >-
      Реализация канал не использует вовсе. Она опрашивает страницы целиком по
      расписанию и сравнивает наблюдённое с сохранённым, а метки не читает ни
      одной.

      Причина не в лени: метка отвечает на вопрос «изменилось ли», а позиция -
      «что именно я пропустил», и второе только предполагается. Строить на
      предположении доставку событий значило бы обещать гарантию, которой нет.
    user_impact: >-
      Опрос идёт чаще, чем нужно, и узнаёт об изменении позже, чем мог бы: между
      двумя чтениями проходит интервал расписания, а метка сменилась бы сразу.
      Для наблюдения за собственными продажами разница невелика, для отслеживания
      чужих цен - заметна.

      Отдельно: реестр покрытия ссылался на эту запись, а записи не было. Ссылка
      на несуществующее хуже отсутствия ссылки - она выглядит выполненным
      обещанием.
    symbols: []
