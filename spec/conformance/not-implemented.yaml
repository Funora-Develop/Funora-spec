# Что контракт объявляет, а эталонная реализация не делает.
#
# Файл появился после разбора, который нашёл в контракте несколько механизмов,
# объявленных и не реализованных нигде: классы запросов с долями, реакция на
# ограничение площадки, залповый предел ведра. Ни один из них не был помечен как
# намерение - все выглядели как часть контракта.
#
# Разница решает вот что. Автор второго SDK читает спецификацию и полагает, что
# описанное работает: он не станет писать свою защиту от вытеснения, если
# контракт обещает доли. А доли не работают ни у кого.
#
# Поэтому правило: механизм либо реализован, либо перечислен здесь. Третьего -
# «объявлен и молчит» - не бывает. Проверка в эталонной реализации сверяет этот
# перечень с тем, что в ней вправду читается, в обе стороны: объявленное и
# нечитаемое обязано быть здесь, а реализованное обязано отсюда исчезнуть.

version: "0.1.0"

items:
  budget_request_classes:
    declared_in: spec/runtime/budget.yaml#classes
    what: >-
      Классы запросов interactive, automation, poll, monitoring с долями
      floor_share и правилами вытеснения.
    why_not: >-
      Механизм требует общей очереди запросов с приоритетами, которой в
      эталонной реализации нет: она ходит на площадку по одному запросу за раз
      из одного цикла.
    user_impact: >-
      При насыщении бюджета собственный мониторинг продавца вытесняет ответы
      покупателям на общих основаниях: планировщик наблюдений создаёт больше
      запросов и просто выигрывает очередь. Ровно то, ради чего классы и
      придуманы.
    symbols: []

  budget_rate_limit_response:
    declared_in: spec/runtime/budget.yaml#rate_limit_response
    what: >-
      Реакция на ограничение площадки: уменьшить ёмкость вдвое, выдержать
      паузу, восстанавливать постепенно.
    why_not: >-
      Не реализовано. Ответ 429 переводится в RateLimitedError и уходит в
      политику повторов, но ёмкость ведра при этом не меняется - то есть
      следующий залп будет ровно таким же, каким был до ограничения.
    user_impact: >-
      Площадка, ограничившая аккаунт, получит от клиента прежний темп сразу
      после отступления. Это худший из возможных ответов на ограничение.
    symbols: []

  budget_bucket_burst:
    declared_in: spec/runtime/budget.yaml#buckets
    what: Поле burst у каждого ведра.
    why_not: >-
      Значение объявлено числом, но смысл его нигде не определён, а в модели
      токенного ведра на вопрос «сколько можно подряд» отвечает capacity. Второе
      число без правила применения означало бы, что шесть SDK применят его
      шестью способами.
    user_impact: >-
      Число подряд идущих запросов ограничено ёмкостью ведра, а не burst. Для
      ведра хоста это шестьдесят, а не десять.
    symbols: []

  counting_flags:
    declared_in: spec/runtime/budget.yaml#counting
    what: Признаки counts_retries и counts_redirects.
    why_not: >-
      Поведение соответствует объявленному - повторы и переходы расходуют
      бюджет, - но признаки при этом не читаются: поведение прибито в коде.
      Смена признака на false ничего не изменит.
    user_impact: >-
      Расхождение сегодня нулевое. Оно появится в тот день, когда признак
      поменяют и решат, что этого достаточно.
    symbols: [COUNTS_RETRIES, COUNTS_REDIRECTS]

  handler_timeout_for_sync:
    declared_in: spec/runtime/budget.yaml#limits.handler_timeout_ms
    what: Предел времени на обработчик.
    why_not: >-
      Применяется к асинхронным обработчикам, где сопрограмму можно отменить. К
      синхронным не применяется: прервать выполняющуюся функцию в Python нечем,
      кроме отдельного потока на каждый вызов, а это меняет модель исполнения
      обработчика - он перестаёт выполняться в потоке вызывающего.
    user_impact: >-
      Синхронный обработчик, ушедший в вечное ожидание, останавливает цикл
      наблюдения. Асинхронный отпускается по пределу.
    symbols: []
