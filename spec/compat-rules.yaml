# Правила эволюции спецификации.
#
# Классификация всегда делается СО СТОРОНЫ ПОЛЬЗОВАТЕЛЯ SDK, а не со стороны парсера.
# Это не формальность, а главный источник ошибок в проектах такого рода: Funora
# одновременно потребитель чужого HTML и поставщик моделей пользователю, и одно и то же
# изменение схемы имеет с двух сторон противоположный знак.
#
# Пример. Обнаружили, что `Order.buyer.id` не наблюдается у удалённых аккаунтов, и
# ослабили поле с required до optional. Для парсера это послабление - он больше не обязан
# его находить. Для пользователя SDK это сужение гарантии: было `T`, стало `T?`, и весь
# код, который читал поле напрямую, теперь падает. Такое изменение - MAJOR.
#
# Проверяется скриптом scripts/validate.js в режиме --compat: он диффит spec против
# последнего тега, классифицирует каждое изменение и сверяет с bump в version.yaml.
# Расхождение - падающая проверка, а не тема для обсуждения в ревью.

classification_side: sdk_consumer

changes:
  # --- Поля моделей ---------------------------------------------------------
  add_optional_field:
    bump: minor
    rationale: Существующий код продолжает работать, новое поле он просто не читает.

  add_required_field:
    bump: minor
    rationale: >-
      Для читателя модели это усиление гарантии. Но если пользователь сам конструирует
      объект этого типа (например, в тестах), его код перестанет компилироваться -
      поэтому обязательно упоминание в migration note.
    requires_migration_note: true

  optional_to_required:
    bump: minor
    rationale: Гарантия расширяется, `T?` становится `T`. Читатель не ломается.

  required_to_optional:
    bump: major
    rationale: >-
      Гарантия сужается, `T` становится `T?`. В Python это падение в рантайме, в Java -
      ошибка компиляции, в C - разыменование NULL. Самый недооценённый класс изменений.

  remove_field:
    bump: major
    requires_deprecation: true
    min_deprecation_minors: 1
    rationale: Поле сначала помечается deprecated минимум на один minor, только потом удаляется.

  rename_field:
    bump: forbidden
    rationale: >-
      Переименование запрещено как отдельная операция. Добавьте новое поле, пометьте
      старое deprecated, удалите в следующем major. Иначе одно изменение выглядит
      как удаление плюс добавление и классифицируется неверно.

  # --- Типы -----------------------------------------------------------------
  narrow_type:
    bump: major
    rationale: Значения, которые пользователь мог получать раньше, перестают быть представимыми.

  widen_type:
    bump: major
    rationale: >-
      Расширение тоже ломающее. Исчерпывающая обработка на стороне пользователя
      (match, switch без default) перестаёт быть исчерпывающей.

  change_x_funora_type:
    bump: major
    rationale: >-
      Смена представления `money`, `instant` или `entity_id` меняет двоичное
      представление в canonical JSON, а значит обнуляет сохранённые хэши снимков
      и ключи идемпотентности в базах пользователей.

  # --- Перечисления ---------------------------------------------------------
  add_enum_value:
    bump: minor
    requires: enum_has_unknown_fallback
    rationale: >-
      Допустимо только если у перечисления объявлен forward-совместимый вариант
      Unknown(raw). Без него каждый новый статус на стороне площадки ломает
      пользователей, и это происходит без нашего участия.

  remove_enum_value:
    bump: major
    requires_deprecation: true

  # --- Операции сервисов ----------------------------------------------------
  add_operation:
    bump: minor
  remove_operation:
    bump: major
    requires_deprecation: true
    min_deprecation_minors: 1
  change_operation_safety:
    bump: major
    rationale: >-
      Смена `safety` операции (safe / idempotent / unsafe) меняет решение о повторе
      на стороне транспорта. Операция, которая была idempotent и стала unsafe,
      превращает существующий retry в дублирование действия.

  # --- Ошибки ---------------------------------------------------------------
  # Классы ниже добавлены после того, как классификатор пропустил смену типа
  # возврата операции с Order[] на OrderListEntry[]. Он сравнивал у операции
  # только safety, и всё остальное менялось молча.
  change_operation_returns:
    bump: major
    summary: >-
      Изменился тип результата операции. У потребителя ломается тип, а не
      поведение, то есть ошибка обнаруживается при сборке - но только если он
      пересоберётся.

  change_operation_capability:
    bump: major
    summary: >-
      Операция стала зависеть от другой возможности. Потребитель, договорившийся
      о прежней, получает отказ там, где раньше работал.

  change_operation_pagination:
    bump: major
    summary: >-
      Изменился режим постраничности. Это меняет не форму результата, а ответ на
      вопрос, полон ли он: цикл дочитывания либо перестаёт существовать, либо
      появляется там, где его не писали.

  change_operation_request_class:
    bump: minor
    summary: >-
      Изменился класс запроса. Затрагивает только распределение бюджета и
      очерёдность, поверхности контракта не касается.

  add_operation_error:
    bump: minor
    summary: >-
      У операции объявлен новый вид отказа. Обработчик, ловящий базовый тип, не
      ломается; исчерпывающий разбор по видам - да, но он и так хрупок.

  remove_operation_error:
    bump: minor
    summary: >-
      Вид отказа больше не объявлен у операции. Обработчик становится
      недостижимым кодом, а не сломанным.

  add_error_code:
    bump: minor
    rationale: >-
      Пользователь обязан иметь ветку по умолчанию: таксономия ошибок древовидная,
      незнакомый код ловится по родителю.
  change_error_parent:
    bump: major
    rationale: Меняет то, какой `except`/`catch` перехватит ошибку у пользователя.
  change_error_retryable:
    bump: major
    rationale: Меняет поведение транспорта при повторе, в том числе на операциях с деньгами.
  reuse_abi_code:
    bump: forbidden
    rationale: >-
      Числовой `abi_code` не переиспользуется никогда, даже после удаления ошибки.
      В C-SDK он попадает в бинарный интерфейс, и повторное использование означает,
      что старый и новый код обозначают разные вещи одним числом.

  # --- События --------------------------------------------------------------
  add_event_type:
    bump: minor
  remove_event_type:
    bump: major
  change_ordering_key_derivation:
    bump: major
    rationale: >-
      Порядок обработки событий - часть наблюдаемого поведения. Смена правила вывода
      ordering key меняет то, какие события пользователь получает последовательно,
      а какие параллельно.

# Изменение canonical_form_version всегда major, независимо от того, менялись ли модели:
# оно инвалидирует сохранённые снимки, курсоры и ключи дедупликации у всех пользователей.
canonical_form_change:
  bump: major
