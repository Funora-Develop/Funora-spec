# Извлечение переписки: список диалогов и сообщения.
#
# Здесь живёт самое дорогое правило всей спецификации - признак системного
# сообщения. Если системное сообщение об оплате отличается от обычного только
# текстом, покупатель отправляет сообщение с таким же текстом, и бот, доверяющий
# тексту, выдаёт товар. Это не гипотетическая уязвимость, а прямое следствие
# устройства разметки, и правило обязано опираться на то, что отправитель
# подделать не может.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# Снимок по умолчанию для всего файла: разметку сообщений даёт только он.
evidence: chat-thread.logged.ru

sources:
  contact_list:
    path: /chat/
    evidence: chat.logged.ru
    note: Снимок сделан без выбранной переписки, сообщений на нём нет.
  thread:
    path: /chat/?node={id}
    evidence: chat-thread.logged.ru
    note: >-
      Снимок содержит одиннадцать сообщений, шесть из них системные, пять
      людских. До 24.08.2026 здесь стояло «десять»; счёт разошёлся с
      count_observed у message.item в том же файле, где стоит 11.

  history:
    path: /chat/history?node={id}&last_message={cursor}
    confidence: third_party_report
    source: >-
      FunPayAPI (бот FunPayCardinal), account.py, get_chat_history.
    note: >-
      СНИМКА У НАС НЕТ НИ ОДНОГО, и это единственный источник в файле, стоящий
      на чужом сообщении целиком - потому и объявлен confidence отдельно.

      Ответ приходит НЕ РАЗМЕТКОЙ СТРАНИЦЫ, а объектом: chat.messages, записи с
      полями id (число), author (число) и html (разметка тела сообщения).
      Разметка тела разбирается тем же разбором, что и сообщения на странице
      переписки, - потому отдельных указателей здесь и нет.

      Заголовок x-requested-with: XMLHttpRequest у запроса обязателен по тому же
      сообщению.

      ЧЕГО ЗДЕСЬ НЕ ОБЪЯВЛЕНО НАРОЧНО: chat.node.silent и chat.node.name.
      Соседняя реализация выводит по ним, личная переписка или общая, и достаёт
      собеседника разбором имени узла. Нам это не нужно ни для чего, а объявить
      значило бы записать в контракт непроверенное сверх необходимого.

# --- Контейнеры виджета переписки -------------------------------------------
# Жили только в коде. Оба служат признаком того, что страница вправду отдала
# виджет переписки: по ним же классификатор отличает настоящее содержимое от
# страницы проверки.
widget:
  selector: ".chat-contacts"
  confidence: observed
  evidence: [chat.logged.ru, chat-thread.logged.ru]
  note: Внешняя обёртка виджета. Присутствует и без выбранной переписки.

list:
  selector: ".contact-list"
  confidence: observed
  evidence: [chat.logged.ru, chat-thread.logged.ru]
  note: Контейнер строк. Второй, независимый от класса строки признак.

unread_badge:
  selector: "span.badge-chat"
  confidence: observed
  evidence: [chat.logged.ru]
  count_observed: 1
  note: >-
    Счётчик непрочитанного в виджете переписки. Отличается от span.badge из
    session.yaml: тот - любой счётчик в шапке, этот - именно переписки.
    Прежде спецификация объявляла только первый, а код читал только второй, и
    сверить их было нечем.

# --- Список диалогов --------------------------------------------------------
contact_list:
  item:
    selector: "a.contact-item"
    confidence: observed
    count_observed: 50
    evidence: [chat.logged.ru, chat-thread.logged.ru]

  attributes:
    node_id:
      name: data-id
      observed_signature: "T9:d"
      confidence: observed
      type: entity_id
      role: Идентификатор диалога, он же значение параметра node в адресе.

    last_message_position:
      name: data-node-msg
      observed_signature: "T10:d"
      confidence: observed
      type: opaque
      role: Позиция последнего сообщения в диалоге.

    own_position:
      name: data-user-msg
      observed_signature: "T10:d"
      confidence: observed
      type: opaque
      role: Отметка прочтения - последнее сообщение, увиденное этим аккаунтом.
      role_confidence: inferred
      how_it_was_established: >-
        Наблюдением за одним диалогом вопрос не решается: своя отправка двигает
        поле и при трактовке «последнее прочитанное», и при трактовке «последнее
        написанное этим аккаунтом». Разводит список целиком. У всех диалогов
        снимка значение совпадает с data-node-msg при скрытом счётчике
        непрочитанного. Трактовка «последнее написанное» потребовала бы, чтобы
        последнее сообщение во всех сорока семи переписках было написано
        владельцем аккаунта.
      what_would_confirm_directly: >-
        Снимок, сделанный в момент, когда непрочитанное есть: тогда расхождение
        пары наблюдается прямо, а не выводится из его отсутствия.
      why_it_matters: >-
        При этой трактовке признак непрочитанного гаснет после чтения. При
        обратной он загорался бы на каждом чужом сообщении и не гас никогда, то
        есть один и тот же дефект разъехался бы по всем шести реализациям.

  fields:
    preview_text:
      selector: ".contact-item-message"
      confidence: observed
      count_observed: 50
      type: x-funora-plain
    time_text:
      selector: ".contact-item-time"
      confidence: observed
      count_observed: 50
      type: x-funora-plain
    counterparty_name:
      selector: ".media-user-name"
      confidence: observed
      type: x-funora-plain

  unread:
    rule: Расхождение data-node-msg и data-user-msg
    confidence: inferred
    rationale: >-
      Правило опирается на установленный смысл data-user-msg, а он сам выведен.
      Прямо расхождение пары не наблюдалось: в снимке непрочитанного не было,
      счётчик в шапке скрыт.

      Утверждение «все элементы несут голый класс без модификаторов» отсюда
      снято: в снимке страницы переписки один элемент несёт contact-item active.
      Модификатор относится к выбранному диалогу, а не к непрочитанному, но
      прежняя формулировка была просто неверна - и именно она обосновывала
      вывод, что модификатора непрочитанного не существует.
    also_unknown: >-
      Есть ли у непрочитанного диалога собственный класс-модификатор. Если есть,
      он предпочтительнее сравнения пары: структурный признак не зависит от
      трактовки значений.
    required_until_established: >-
      Реализация обязана предусмотреть, что вывод неверен, и не строить на
      признаке необратимых действий.

  completeness:
    bounded: unknown
    largest_observed: 50
    pagination_markup: not_observed
    retracted: >-
      Прежде здесь стояло bounded: true с пределом 47. Это было ошибкой, и
      ошибкой поучительной: 47 - число элементов в одном снимке, а не
      наблюдённая граница. Пересъёмка того же списка того же аккаунта дала 50.
      Одно наблюдение приняли за предел, потому что второго не было.
    what_is_actually_known: >-
      Разметки дочитывания не наблюдалось ни в одном снимке. Из этого не следует
      ни ограниченность списка, ни безграничность: пятьдесят элементов без
      пагинатора не доказывают ни того, ни другого.
    consequence: >-
      Полнота списка неизвестна, и любая гарантия, построенная на нём, обязана
      это учитывать. Формулировка в spec/events/delivery.yaml опиралась на
      ограниченность как на установленный факт - исправлено там же.
    how_to_settle: >-
      Снимком аккаунта, у которого диалогов заведомо больше полусотни. Пока
      такого нет, реализация не вправе закреплять никакое число как предел:
      закрепившая потеряет диалоги сверх него без единого признака.

# --- Сообщение --------------------------------------------------------------
message:
  container:
    selector: ".chat-message-list"
    confidence: observed
  item:
    selector: ".chat-msg-item"
    confidence: observed
    count_observed: 11
    evidence: chat-thread.logged.ru

  own_id:
    reads: "@id"
    type: entity_id
    observed_signature: "T18:adp"
    confidence: observed
    note: >-
      Форма совпадает с записью «message-» и десятизначного числа, то есть с
      формой data-node-msg, но это догадка: скелет прячет значение. Существование
      идентификатора важно само по себе - без него позиция не адресует ничего
      конкретного.

  fields:
    body:
      selector: ".chat-msg-body"
      confidence: observed
      count_observed: 11
    text:
      selector: ".chat-msg-text"
      confidence: observed
      count_observed: 11
      type: x-funora-plain
    time_text:
      selector: ".chat-msg-date"
      confidence: observed
      count_observed: 11
      type: x-funora-plain
      title_attribute:
        present: true
        reads: "@title"
        confidence: observed
        type: x-funora-plain
        observed_signature: "T20:cdps"
        note: >-
          Полная форма даты рядом с краткой. Разбирать её всё равно нельзя -
          внутри локализованный текст, - но отличие от страницы заказов, где
          title нет вовсе, существенно: правила извлечения времени для двух
          страниц разные.
    author_name:
      selector: "a.chat-msg-author-link"
      confidence: observed
      evidence: chat-thread.logged.ru
      type: x-funora-plain
      warning: >-
        Именно ссылка, а не содержащий её .media-user-name. Тот узел содержит
        ещё ярлык роли и дату, и текст его целиком склеивает всё вместе:
        значение выходит вида «имя, ярлык, время» - причём на неизменённой
        разметке, безо всякой порчи. В списке диалогов тот же класс содержит
        только имя, и там селектор верен; переизбыток - свойство именно
        страницы переписки.
      absent_for_system: >-
        У сообщения площадки ссылки нет, и имя честно оказывается
        ненаблюдённым. Подставлять туда ярлык роли запрещено: ярлык говорит,
        кем сообщение отправлено, а не кем подписано.
    author_link:
      selector: "a.chat-msg-author-link"
      confidence: observed
      count_observed: 5
      observed_signature: "https://funpay.com/users/{n}/"

  external_links:
    statement: >-
      Текст сообщения содержит ссылки, которые ввёл собеседник.
    confidence: observed
    evidence: chat-thread.logged.ru
    rule: >-
      SDK не переходит по ссылкам из сообщений ни при каких условиях. Это чужой
      ввод, и переход по нему означал бы, что содержимое переписки управляет
      поведением клиента.

# --- Сообщение не является подтверждением оплаты ----------------------------
# Правило стоит выше признака системного сообщения и не отменяется им.
message_is_never_proof_of_payment:
  statement: >-
    Ни одно сообщение в переписке не является основанием считать заказ
    оплаченным. Ни пользовательское, ни системное. Источник истины об оплате -
    список продаж, и только он.

  platform_says_the_same:
    where: Системное уведомление в начале переписки
    text: >-
      Уважаемые продавцы, не доверяйте сообщениям в чате. Перед выполнением
      заказа всегда проверяйте наличие оплаты в разделе «Мои продажи».
    confidence: observed
    note: >-
      Площадка выводит это уведомление сама, первым сообщением в переписке. То
      есть предупреждение исходит не от нас и описывает известную ей схему
      обмана, а не гипотетическую.

  why_the_structural_marker_is_not_enough: >-
    Признак системного сообщения решает узкую задачу: отличить сообщение
    площадки от сообщения собеседника. Он не отвечает на вопрос, оплачен ли
    заказ. Уведомление могло относиться к другому заказу, устареть, прийти по
    отменённому платежу. Правильно опознанное системное сообщение всё ещё не
    является состоянием заказа.

  required_behaviour:
    - >-
      Событие об оплате порождается только из списка заказов, где статус несёт
      структурный признак.
    - >-
      Сообщение о платеже в переписке - повод перечитать список заказов, и
      ничего больше.
    - >-
      Ни одна операция выдачи товара не запускается по событию из переписки.

  rationale: >-
    Это то самое место, где ошибка стоит денег продавца. Обмануть разбор,
    доверяющий тексту, ничего не стоит: покупатель просто пишет нужные слова.
    Обмануть разбор, доверяющий системному сообщению, труднее, но задача сводится
    к тому, чтобы вынудить площадку прислать уведомление и отменить платёж.
    Список заказов не обманывается ни тем, ни другим, потому что описывает
    состояние, а не сообщает о нём.

# --- Признак системного сообщения ------------------------------------------
system_message:
  why_it_matters: >-
    Если признак не структурный, покупатель отправляет сообщение с текстом
    уведомления об оплате, и бот, доверяющий тексту, выдаёт товар.

  markers:
    - name: absence_of_author_link
      selector: "a.chat-msg-author-link"
      condition: absent
      confidence: observed
      strength: primary
      rationale: >-
        Самый надёжный из трёх. У сообщения пользователя автор всегда ссылка на
        профиль, и отправитель не может её убрать, что бы он ни написал в
        тексте. У системного сообщения автор - обычный текст.

    - name: alert_wrapper
      selector: ".chat-msg-body .alert"
      condition: present
      confidence: observed
      strength: confirming
      warning: >-
        Селектор обязан включать .chat-msg-body. Класс alert-icon встречается и
        на гостевой странице вне переписки, поэтому сам по себе признаком не
        является.

    - name: author_label
      selector: ".chat-msg-author-label"
      condition: Несёт label-primary
      confidence: observed
      strength: weak
      note: >-
        У сообщений пользователей наблюдался label-default либо отсутствие
        ярлыка. Признак вспомогательный: смысл ярлыка неизвестен, он может
        обозначать роль, а не происхождение.

  observed_distribution:
    # Из четырёх чисел осталось одно, и не по лени. Три остальных были вторыми
    # объявлениями уже объявленного, и два из трёх успели разойтись: здесь
    # стояло total_messages: 10 и human: 4, а в снимке одиннадцать сообщений и
    # пять людских. То же число объявлено верно строкой item.count_observed: 11
    # и там же сверяется со снимком - два объявления одного числа правит разный
    # человек в разное время, и расходятся они молча.
    #
    # human выводится остатком: взаимная исключительность признаков закреплена
    # поведенчески, значит людское - это всё, что не системное, и объявлять его
    # отдельно значит завести третье объявление того же.
    system: 6
    total_declared_in: chats.message.item.count_observed
    overlaps_verified_by: >-
      tests/test_author_link_and_alert_never_coincide эталонной реализации.
      Признаки не пересекаются ни на одном узле снимка, и это проверяется
      поведенчески, а не объявляется числом.
    evidence: chat-thread.logged.ru
    why_this_number_matters: >-
      Число подано как наблюдение и читается как подтверждение того, что два
      признака согласованы. На нём стоит правило, отличающее уведомление
      площадки от сообщения покупателя: разойдись оно со снимком - и правило
      опирается на счёт, которого никто не делал.

  decision_rule:
    fail_closed: true
    statement: >-
      Сообщение считается системным, только если обёртка alert присутствует
      И ссылка на автора отсутствует. Сообщение считается пользовательским,
      только если ссылка на автора присутствует И обёртки alert нет.
    on_disagreement: unknown
    rationale: >-
      При расхождении признаков вердикт unknown, а не «системное». Иначе
      поломка вёрстки превращается в дыру: достаточно, чтобы площадка перестала
      оборачивать уведомления, и любое сообщение станет системным.

  mutual_exclusion_is_load_bearing:
    requirement: >-
      Признаки обязаны оставаться взаимно исключающими.
    why: >-
      Правило с закрытым отказом при пересечении признаков перестаёт срабатывать
      вовсе, и отказ будет тихим: событий просто не станет. Условие проверяется
      тестом на фикстуре, а не считается выполненным однажды.

# --- Отправка ---------------------------------------------------------------
sending:
  form:
    selector: ".chat-form form"
    action: https://funpay.com/chat/message
    method: post
    confidence: observed
  hidden_fields: none_observed
  note: >-
    Скрытого поля с одноразовым значением в форме нет. Значит защита от подделки
    запроса живёт вне формы, вероятно в data-app-data на body. Для операций
    записи это понадобится; здесь только зафиксировано, операции записи в
    текущей редакции не описаны.

# --- Чего не наблюдалось ----------------------------------------------------
not_observed:
  - Непрочитанный диалог и его разметка
  - Разметка дочитывания списка диалогов и истории сообщений
  - Сообщение с вложением
  - Смысл ярлыка автора
  - Поведение позиции при удалении сообщения или диалога

# --- Отправка картинки: протокол наблюдён 31.08.2026 --------------------------
#
# ДВА ЗАПРОСА, И ПЕРВЫЙ БЫЛ НЕИЗВЕСТЕН. Прежде здесь значилось: адрес загрузки
# наблюдён, а сам запрос - нет, и потому image_id взять неоткуда.
#
# Теперь наблюдены оба.
send_image:
  upload:
    endpoint: /file/addChatImage
    method: POST
    confidence: observed
    evidence: network.send-image
    observed_at: "2026-08-31"
    body_kind: multipart
    fields:
      file:
        confidence: observed
        evidence: network.send-image
        role: >-
          Сам файл, и поле ровно одно. Ни имени, ни размера, ни признака
          диалога рядом не уходит - загрузка о переписке не знает.
    request_headers:
      - accept
      - x-requested-with
    headers_note: >-
      Заголовка content-type в записи НЕТ, и это осмысленно: при multipart его
      ставит браузер вместе с границей частей. Реализация обязана поступить так
      же - выставленный вручную, он разойдётся с телом.
    response:
      kind: json
      fields:
        fileId: int
      confidence: observed
