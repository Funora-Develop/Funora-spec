# Распознавание состояния сессии по разметке.
#
# Это первый шаг конвейера после транспорта, и порядок здесь важнее содержания.
# Истёкшая сессия отдаёт код 200 после одного перехода - ни 401, ни 403. Если
# проверять только код ответа, страница входа дойдёт до разбора и вернёт пустой
# список заказов, неотличимый от «заказов нет».
#
# Второе требование не менее важное: правило обязано различать «мы не вошли» и
# «разметка изменилась». Это разные диагнозы с разным лечением. В первом случае
# помогает повторный вход, во втором он бесполезен, и повторные попытки только
# подтверждают подозрение площадки.

version: "0.1.0"

# --- Состояния --------------------------------------------------------------
states:
  logged_in:
    meaning: Страница отдана вошедшему пользователю, разбор допустим.
  guest:
    meaning: Сессия недействительна, нужен повторный вход.
  unknown:
    meaning: >-
      Ни один набор признаков не сложился. Разбор не выполняется, вход не
      повторяется, наверх поднимается сообщение о повреждении разметки.

# --- Признаки ---------------------------------------------------------------
# Признаки структурные и не содержат текста. Это принципиально: локаль привязана
# к аккаунту, через адрес не переключается, и текстовый признак сломался бы при
# смене языка молча.
markers:
  logged_in:
    - selector: ".navbar-toggle-logged"
      confidence: observed
      evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
      count_observed: 1
      absent_in: [orders-trade.guest.ru]

    - selector: "div.hidden[data-orders]"
      confidence: observed
      evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
      count_observed: 1
      absent_in: [orders-trade.guest.ru]
      note: >-
        Адресуется по атрибуту, а не по классу: класс hidden в разметке не
        уникален, его несут и счётчики в шапке, и пустой список сообщений.

    - selector: "span.badge"
      confidence: observed
      evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
      count_observed: 4
      absent_in: [orders-trade.guest.ru]
      note: >-
        Счётчики в шапке. Признак вспомогательный: наличие подтверждает сессию,
        отсутствие само по себе ничего не значит.

  guest:
    - selector: ".navbar-toggle-guest"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
    - selector: ".menu-item-login"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
    - selector: ".menu-item-register"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
    - selector: ".content-account-login"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
    - selector: ".modal-auth"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1

  # Признаки страницы проверки. Жили только в коде классификатора, а решают
  # они, отличит ли реализация «площадка требует проверку» от «разметка
  # сменилась». Две реализации с разными перечнями ответят по-разному на одну
  # страницу, и одна из них станет чинить разбор там, где надо ждать.
  challenge:
    - selector: "#challenge-form"
      confidence: inferred
      note: Наблюдений нет. Признак выведен по устройству типовых проверок.
    - selector: ".g-recaptcha"
      confidence: inferred
    - selector: ".h-captcha"
      confidence: inferred
    - selector: 'script[src*="captcha"]'
      confidence: inferred
      note: >-
        Загрузка скрипта проверки. Признак остаётся, даже если виджет ещё не
        отрисован.

  # Виджеты проверки, наблюдённые на ОБЫЧНОЙ странице входа.
  #
  # Признак сам по себе вердикта не даёт, и это не осторожность, а наблюдение:
  # в снимке orders-trade.guest.ru стоит <div class="cf-turnstile"
  # data-sitekey="..."> - то есть площадка держит Turnstile прямо в форме
  # входа. Страница при этом обычная: истёкшая сессия, а не стена проверки.
  #
  # Считать такой признак подписью проверки значило бы отвечать «площадка
  # требует проверку» там, где верно «сессия истекла». Разница в действии:
  # первое останавливает автоматику, второе говорит человеку обновить ключ.
  #
  # Сегодня от ошибки спасает только порядок подписей - шапка гостя
  # проверяется раньше. Опираться на порядок там, где можно опереться на
  # наблюдение, не следует.
  challenge_widget_on_login:
    - selector: ".cf-turnstile"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
    - selector: "[data-sitekey]"
      confidence: observed
      evidence: [orders-trade.guest.ru]
      count_observed: 1
      note: >-
        Атрибут, а не класс: виджеты проверки различаются классами, а ключ
        площадки лежит в атрибуте у всех. Ровно поэтому он и не годится в
        подписи проверки - его несёт и обычная форма входа.

  # Признаки формы входа. Отличаются от markers.guest тем, что говорят не «мы
  # не вошли», а «нам показали страницу входа вместо запрошенной».
  login_form:
    - selector: 'input[type="password"]'
      confidence: inferred
    - selector: 'form[action*="login"]'
      confidence: inferred
    - selector: 'form[action*="auth"]'
      confidence: inferred

# --- Локаль интерфейса ------------------------------------------------------
# Локаль привязана к аккаунту, а не к адресу: запрос с префиксом /en/ отдаёт ту
# же страницу на том же языке. Значит переключить её запросом нельзя, и
# единственное, что остаётся, - узнать, какая она.
#
# Прежде не узнавали вовсе. Страница на чужой локали разбиралась молча, и
# вызывающий получал английские тексты, полагая их русскими.
locale:
  selector: "html[lang]"
  attribute: lang
  confidence: observed
  evidence:
    - orders-trade.logged.ru
    - orders-trade.guest.ru
    - chat.logged.ru
    - chat-thread.logged.ru
  count_observed: 1
  note: >-
    Снимки версий до v6 несут в атрибуте подпись вместо метки: скелет маскировал
    и её. Довольно этого НЕ было - разбор читал подпись как локаль, не находил
    её среди объявленных и объявлял возможность protocol.locale неподдержанной,
    сообщая в журнал об интерфейсе на локали «T2:a#1». Собственные снимки
    заставляли реализацию говорить неправду.

    Закрыто с двух сторон: формат v7 сохраняет lang дословно, если значение
    похоже на метку языка, а чтение проверяет форму и отвергает всё прочее.

unsupported_locale_rule: >-
  Локаль вне объявленного перечня НЕ отменяет чтение. Разбор в этом проекте
  структурный: он опирается на классы разметки, а не на текст, и от смены языка
  не ломается. Отказать из-за локали значило бы отвергнуть страницу, которую
  реализация читает целиком и верно.

  Отсюда правило: локаль наблюдается, сообщается вызывающему и опускает
  возможность protocol.locale до unsupported. Отказа НЕТ ни в каком виде.

  Прежде правило говорило иначе - «ошибка остаётся за операциями, которым нужны
  текстовые шаблоны, - таких сегодня нет», - и контракт при этом сам себе
  противоречил: описание поля locale в account.schema.json обещало
  UnsupportedLocaleError при локали вне набора и закрывало перечисление двумя
  значениями. Одно из двух утверждений обязано было быть ложным, и ложным было
  то, которое ничем не исполнялось.

  Класс ошибки убран. Общий UnsupportedCapabilityError остаётся и покрывает
  случай, ради которого специализация заводилась: возможность, объявленная
  неподдержанной, а вызванная всё равно. Специализация под одну возможность,
  не требуемую ни одной операцией, была объявлением ради возможного будущего -
  таких в контракте больше нет.

why_it_matters_anyway: >-
  Поля, которые приходят текстом - описание заказа, подпись времени, имя
  собеседника, - возвращаются на том языке, на котором их отдала площадка.
  Вызывающий, ожидающий русского, получит английское и не узнает об этом
  ниоткуда, если локаль не сообщать.

  Это то же различие, что и между «не наблюдали» и «здесь этого не бывает»:
  молчание неотличимо от отсутствия проблемы.

# --- Признаки настоящего содержимого ----------------------------------------
# Перечень закрыт по построению: настоящая страница проверки или блокировки
# заменяет содержимое целиком, и ни таблицы заказов, ни виджета переписки на
# ней нет. Отсюда правило - текстовая подпись, найденная на странице, где есть
# хоть один из этих признаков, вердикта не даёт.
#
# Без этого правила сообщение собеседника со словами «ваш аккаунт заблокирован»
# останавливало бы клиента: текст пришёл бы из чужой переписки, а выглядел бы
# как ответ площадки.
content_markers:
  - selector: ".orders-table"
    confidence: observed
    evidence: [orders-trade.logged.ru]
  - selector: ".chat-contacts"
    confidence: observed
    evidence: [chat.logged.ru, chat-thread.logged.ru]
  - selector: ".chat-message-list"
    confidence: observed
    evidence: [chat-thread.logged.ru]
  - selector: ".contact-list"
    confidence: observed
    evidence: [chat.logged.ru, chat-thread.logged.ru]
  - selector: ".content-account"
    confidence: observed
    evidence: [orders-trade.guest.ru]
    note: >-
      Наблюдался только на гостевой странице, вместе с content-account-login.
      И это не ошибка перечня: страница входа - собственная страница площадки,
      а не стена проверки. Текстовая подпись, найденная на ней, вердикта давать
      не должна ровно так же, как на странице заказов.

      Первая редакция объявляла свидетельством страницу вошедшего. Поймала это
      сверка перечня со снимками - утверждение о наблюдении оказалось
      непроверенным.

# --- Правило решения --------------------------------------------------------
decision:
  order_is_normative: true
  rationale: >-
    Порядок шагов нормативен. Если две реализации проверят признаки в разном
    порядке, они по-разному ответят на страницу, где признаки противоречат друг
    другу, и разойдутся именно в том случае, ради которого правило написано.

  steps:
    - step: 1
      check: Тело ответа непустое
      on_fail: unknown
      reason: empty_body
      note: >-
        Пустое тело не является успешным ответом. Проверка идёт первой, потому
        что на пустом теле любой селектор не найдёт ничего, и без этого шага
        вердиктом стало бы «признаки вошедшего отсутствуют».

    - step: 2
      check: Конечный URL после переходов принадлежит ожидаемому хосту
      on_fail: wrong_identity
      note: >-
        Проверяется именно конечный URL. Переход на страницу входа - самый частый
        способ получить код 200 с чужим содержимым. Тот же шаг ловит перепутанные
        cookie при работе с несколькими аккаунтами.

    - step: 3
      check: Присутствует хотя бы один признак guest
      on_true: guest
      note: >-
        Признаки гостя проверяются раньше признаков вошедшего. На странице входа
        признака вошедшего нет по определению, и при обратном порядке вердиктом
        стало бы unknown вместо guest - то есть пользователь не узнал бы, что
        надо просто войти заново.

    - step: 4
      check: Присутствует ".navbar-toggle-logged"
      on_true: logged_in
      on_false: unknown
      reason_on_false: identity_marker_absent

# --- Взаимная исключительность ---------------------------------------------
mutual_exclusion:
  requirement: >-
    Ни один признак вошедшего не встречается на гостевой странице, и наоборот.
  status: observed
  evidence: >-
    Проверено на снимках orders-trade.logged.ru и orders-trade.guest.ru. Все
    пять гостевых признаков присутствуют в первом и отсутствуют во втором;
    признак вошедшего наоборот.
  why_it_matters: >-
    При пересечении признаков правило перестаёт различать состояния, и построен
    он оказывается на песке. Условие проверяется тестом, а не считается
    выполненным однажды.

# --- Коды ответа ------------------------------------------------------------
# Ключи в кавычках намеренно: без них YAML разбирает их как целые числа, и тип
# ключа расходится между реализациями.
status_codes:
  # Значения - имена классов ответа из spec/protocol/response-classes.yaml, а не
  # свой словарь. Прежде здесь стояло guest, которого среди классов нет вовсе:
  # реализации приходилось переводить одно имя в другое, и перевод этот нигде не
  # был записан - третья рукописная связь поверх двух объявленных.
  "401": login_required
  "403": blocked
  "429": rate_limited
  "503": maintenance
  note: >-
    Перечисленные коды от площадки при истёкшей сессии не наблюдались - она
    отдаёт 200. Таблица нужна для полноты: если код всё же придёт, разбирать
    тело бессмысленно.

  rate_limited_is_not_blocked: >-
    Код 429 раньше отображался в blocked, и это было ошибкой с дорогими
    последствиями. В spec/errors/errors.yaml для него есть отдельный
    RateLimitedError с retryable=true, а в retry-policy.yaml ему посвящена
    отдельная политика. При отображении в blocked, который трактуется как отказ
    с закрытым замком, первое же попадание в ограничение частоты навсегда
    останавливало бы опрос, а вся политика повторов оставалась бы недостижимым
    кодом. Превышение частоты - это «слишком быстро», а не «вам сюда нельзя».

# --- Чего не наблюдалось ----------------------------------------------------
not_observed:
  - Страница проверки. Структурные признаки неизвестны, текстовые сигнатуры в
    реализации помечены непроверенными.
  - Страница блокировки. То же.
  - Страница технических работ. То же.
  - Поведение при одновременном присутствии признаков обоих состояний.
