# Извлечение каталога с корня площадки.
#
# Страница крупная - тридцать три тысячи строк, восемьсот сорок две игры, четыре
# с лишним тысячи ссылок на разделы, - и ловушек в ней больше, чем на любой
# другой из наблюдённых. Разобрана пятьюдесятью одним независимым чтением; из
# сорока семи утверждений об адресуемости устояло тринадцать.
#
# СЕМЬ ЛОВУШЕК, каждая из которых даёт молчаливо неверный ответ.
#
#   1. Списков ДВА. .promo-games-fav это избранное, и все восемь его карточек
#      повторяют карточки основного списка - пересечение восемь из восьми.
#      Обход по документу удвоил бы восемь игр.
#
#   2. Заголовков 872 при 850 карточках. Четырнадцать карточек несут по
#      нескольку заголовков - это ВАРИАНТЫ игры, и лишние помечены классом
#      hidden. Отбросить их фильтром :not(.hidden) значило бы потерять двадцать
#      два настоящих варианта с собственными идентификаторами.
#
#   3. Порядок детей карточки: СНАЧАЛА все заголовки, потом переключатель, потом
#      все списки. Соседство заголовка со списком держится лишь в 836 случаях из
#      872; сопоставлять их надо по data-id.
#
#   4. Ссылка на игру - это ОДНОВРЕМЕННО первая ссылка её списка разделов.
#      Совпадение наблюдено 864 раза из 864. Наивный сбор «заголовок плюс все
#      разделы» удвоил бы главный раздел каждой игры.
#
#   5. Голый [data-id] по документу даёт 1781 узел: 1780 каталожных и один
#      посторонний - виджет переписки, который на этой странице тоже есть.
#
#   6. .promo-games, .promo-game-list и .content-with-cd дают по два совпадения.
#      Без уточнения -all либо -fav селектор молча захватит оба списка.
#
#   7. Промежуточные узлы .row.row-10.flex, .col-md-3, .col-xs-6 - раскладка, а
#      не строение. Опираться на них нельзя.

evidence: root.logged.ru

sources:
  root:
    path: /
    evidence: root.logged.ru
    note: >-
      Снимок сделан ВОШЕДШИМ пользователем. Для каталога это, похоже, безразлично
      - но блок избранного зависит от сессии, и гостю его быть не должно.
      «Похоже» и «не должно» здесь рассуждение: гостевого корня никто не снимал.

# --- Два списка ---------------------------------------------------------------
lists:
  catalog:
    selector: "div.promo-games.promo-games-all"
    confidence: observed
    count_observed: 1
    scope: document
    role: >-
      Полный алфавитный каталог. Восемьсот сорок две карточки, восемьсот
      шестьдесят четыре заголовка, тридцать восемь буквенных групп.

  favourites:
    selector: "div.promo-games.promo-games-fav"
    confidence: observed
    count_observed: 1
    scope: document
    role: >-
      Избранное пользователя. Восемь карточек.

    adds_nothing:
      observed: true
      how: >-
        Все восемь идентификаторов игр встречаются и в основном каталоге -
        пересечение восемь из восьми. Шестьдесят три различных адреса разделов
        блока тоже все есть в каталоге.
      consequence: >-
        Читается ТОЛЬКО основной каталог. Избранное не пропускается по
        небрежности: оно наблюдено и признано не дающим новых сведений.

        Обход по документу вместо обхода внутри каталога удвоил бы восемь игр -
        и удвоил бы молча, при полноте и нуле повреждений.

  letter_groups:
    selector: ".promo-games-all .promo-game-list > .promo-game-list-title"
    confidence: observed
    count_observed: 38
    scope: document
    role: >-
      Разделители алфавитных групп, а не игры. Текст каждого - один знак;
      двадцать пять латинских, двенадцать кириллических, одна цифра.

      Объявлены затем, чтобы их не приняли за карточки: они лежат в том же
      контейнере и прямыми детьми того же узла.

# --- Игра -----------------------------------------------------------------------
game:
  card:
    selector: ".promo-games-all .promo-game-item"
    confidence: observed
    count_observed: 842
    scope: document
    role: >-
      Карточка игры. Область ограничена каталогом нарочно - по документу их
      восемьсот пятьдесят, и восемь лишних приходят из избранного.

    within_list:
      selector: ".promo-game-item"
      confidence: observed
      count_observed: 850
      scope: document
      note: >-
        Тот же узел, но без ограничения областью - для поиска ВНУТРИ уже
        найденного контейнера каталога. Объявлен отдельно потому, что разбор
        обязан брать селектор из порождённой таблицы, а не резать строку другого
        селектора: резка строки разошлась бы со спекой молча.

  title:
    selector: ".promo-game-item > .game-title"
    confidence: observed
    count_observed: 872
    scope: document
    reads: attribute
    attributes:
      game_id:
        name: data-id
        type: entity_id
        confidence: observed
        evidence: root.logged.ru
        varies_across_rows: >-
          Подписи нет: у восьмисот семидесяти двух узлов восемьсот шестьдесят
          четыре различных значения. Наблюдено, что значения только цифровые -
          от одного до трёх знаков.
    role: >-
      Заголовок игры. Собственный идентификатор лежит В АТРИБУТЕ, а не только в
      адресе - и это редкость среди наблюдённых страниц.

    within_card:
      selector: ".game-title"
      confidence: observed
      count_observed: 872
      scope: document
      note: Тот же узел для поиска внутри уже найденной карточки.

  variants:
    observed: true
    what: >-
      Четырнадцать карточек несут по нескольку заголовков: семь по два, шесть по
      три, одна по четыре. Лишние двадцать два помечены классом hidden.
    what_they_are: >-
      Это ВАРИАНТЫ одной игры - у каждого свой идентификатор, свой список
      разделов и своя кнопка переключателя. Все тридцать шесть заголовков внутри
      многовариантных карточек ведут на /chips/.
    do_not_filter_them_out: >-
      Фильтр :not(.hidden) даёт по одному заголовку на карточку и теряет двадцать
      два настоящих варианта. Класс hidden здесь говорит о том, какой вариант
      показан переключателем СЕЙЧАС, а не о том, что узел служебный.

  switcher:
    selector: ".promo-game-item > .btn-group > button"
    confidence: observed
    count_observed: 36
    scope: document
    reads: attribute
    attributes:
      variant_id:
        name: data-id
        type: entity_id
        confidence: observed
        evidence: root.logged.ru
        varies_across_rows: >-
          Значения те же, что у заголовков карточки, и в том же порядке -
          проверено во всех четырнадцати случаях, расхождений ноль.
    role: >-
      Кнопки выбора варианта. Есть только у многовариантных карточек.

# --- Разделы --------------------------------------------------------------------
sections:
  list:
    selector: ".promo-game-item > ul.list-inline"
    confidence: observed
    count_observed: 872
    scope: document
    reads: attribute
    attributes:
      belongs_to:
        name: data-id
        type: entity_id
        confidence: observed
        evidence: root.logged.ru
        varies_across_rows: >-
          Значения те же, что у заголовков, и сопоставляются по ним.
    role: >-
      Список разделов одного варианта игры.

    within_card:
      selector: "ul.list-inline"
      confidence: observed
      count_observed: 872
      scope: document
      note: >-
        Тот же узел для поиска внутри уже найденной карточки. Класс
        list-inline - бутстраповское оформление, и держится он здесь только
        потому, что все восемьсот семьдесят два лежат внутри карточек игр.
        Опираться на него можно лишь с якорем карточки слева.

  pair_by_id_not_by_adjacency:
    observed: true
    counts: "соседство .game-title + ul.list-inline держится 836 раз из 872"
    why: >-
      Порядок детей карточки - СНАЧАЛА все заголовки, потом переключатель, потом
      все списки. У одновариантных карточек заголовок и список стоят рядом, у
      многовариантных - нет.
    consequence: >-
      Список сопоставляется с заголовком ПО data-id. Разбор, взявший соседа,
      приписал бы четырнадцати играм чужие разделы - и приписал бы молча.

  link:
    selector: ".promo-game-item > ul.list-inline > li > a"
    confidence: observed
    count_observed: 4315
    scope: document
    reads: attribute
    attributes:
      section_href:
        name: href
        confidence: observed
        evidence: root.logged.ru
        varies_across_rows: Адресов различных 4252 при 4315 узлах.
    role: >-
      Ссылка на раздел. Иных атрибутов у неё нет вовсе - ни класса, ни data-:
      идентификатор раздела живёт только в адресе.

  the_game_link_is_the_first_section:
    observed: true
    counts: "864 совпадения из 864"
    what: >-
      Адрес заголовка игры совпадает с адресом ПЕРВОЙ ссылки её списка разделов.
    consequence: >-
      Сбор «ссылка игры плюс все ссылки списка» удвоил бы главный раздел каждой
      игры. Разбор обязан либо не добавлять ссылку заголовка отдельно, либо
      признать совпадение явно.

      Здесь оно признаётся явно: главный раздел помечается признаком, а не
      выбрасывается. Выброшенный, он унёс бы с собой сведение о том, какой из
      разделов у игры главный.

# --- Два вида разделов -----------------------------------------------------------
section_kinds:
  observed: ["/lots/{id}/", "/chips/{id}/"]
  counts: "по документу 4827 первого вида и 360 второго"
  not_distinguishable_structurally:
    observed: true
    how_checked: >-
      Все пять тысяч сто восемьдесят семь ссылок укладываются в четыре
      структурных отпечатка внутри карточки, и три из четырёх несут оба вида
      вперемешку. У самого узла ссылки нет ни класса, ни data-атрибута - только
      href.
    consequence: >-
      Различить вид можно ТОЛЬКО по сегменту пути. Это наблюдение, а не удобство:
      разбор, ищущий структурный признак вида, не найдёт его и объявит вид
      ненаблюдённым там, где он виден в адресе.

  both_kinds_at_one_game:
    observed: true
    counts: >-
      Сто пятьдесят одна карточка несёт хоть одну ссылку второго вида, и сто
      сорок девять из них несут ссылки обоих видов.

  what_chips_are:
    observed: false
    note: >-
      Что означает второй вид - неизвестно. Страница этого не говорит, и
      догадываться незачем: разбор различает виды по адресу и не приписывает им
      смысла.

# --- Поиск -------------------------------------------------------------------------
search:
  form:
    selector: "form.promo-games-filter"
    confidence: observed
    count_observed: 1
    scope: document
    role: >-
      Поиск по играм. Адрес наблюдён; имя поля в скелете замаскировано, и
      собрать запрос по снимку нельзя - тот же затор, что у догрузки строк.

      Операции поиска в контракте нет, и объявлять её по одной форме нельзя:
      ответа никто не видел.

# --- Полнота -------------------------------------------------------------------------
totality:
  alphabet_index:
    selector: "nav.nav-abc"
    confidence: observed
    count_observed: 1
    scope: document
    role: >-
      Указатель по буквам. Тридцать восемь ссылок, и подписи их текста по порядку
      в точности совпадают с подписями тридцати восьми заголовков групп.

    is_not_pagination: >-
      Адреса у этих ссылок ОДНОСЕГМЕНТНЫЕ - не абсолютные адреса площадки, в
      отличие от всех прочих ссылок каталога. Похоже на якоря внутри страницы, а
      не на переходы.

      Отсюда довод в пользу полноты: все тридцать восемь групп уже на странице, и
      указатель по ним прокручивает, а не догружает.

  decision: >-
    Чтение каталога объявляется ПОЛНЫМ.

    Довод положительный и двойной: число групп в указателе равно числу групп на
    странице, и подписи их текста совпадают по порядку - то есть указатель не
    обещает ни одной группы, которой на странице нет.

    Кнопки догрузки на странице нет; сама по себе её ненаходка доводом не
    является - это правило проекта, - но здесь она и не нужна.

# --- Схема полей раздела: наблюдена 31.08.2026 --------------------------------
#
# ГДЕ ОНА ЛЕЖИТ - в форме фильтра на странице раздела, а не отдельным запросом.
# Прежде здесь значилось «страницы раздела никто не снимал»; страницу сняли, и
# схема нашлась в ней.
field_schema:
  container:
    selector: ".lot-fields"
    scope: document
    confidence: observed
    count_observed: 1
    evidence: catalog-fields.logged.ru
    observed_at: "2026-08-31"
  fields:
    selector: ".lot-field"
    scope: document
    confidence: observed
    count_observed: 2
    evidence: catalog-fields.logged.ru
    attributes:
      field_id:
        name: data-id
        type: entity_id
        confidence: observed
        evidence: catalog-fields.logged.ru
        role: >-
          Идентификатор поля. Имя поля в запросе складывается из него: f-{id}.
          Наблюдено на двух полях раздела 922 - выбор и диапазон.
  label:
    selector: ".control-label"
    reads: text
    scope: row
    confidence: observed
    evidence: catalog-fields.logged.ru
    role: >-
      Подпись поля, как её видит человек. Есть НЕ У ВСЕХ: у поля-выбора её на
      снимке нет - подписью служат сами кнопки вариантов.
  input:
    selector: ".lot-field-input"
    scope: row
    confidence: observed
    evidence: catalog-fields.logged.ru
    attributes:
      input_name:
        name: name
        confidence: observed
        evidence: catalog-fields.logged.ru
        role: Имя поля в запросе - f-{id}.
  kinds:
    choice:
      selector: ".lot-field-radio-box"
      confidence: observed
      evidence: catalog-fields.logged.ru
      what: >-
        Поле-выбор. Варианты лежат кнопками; значение каждой - в атрибуте value,
        и пустое значение у первой означает «любой».
      options_selector: "button[value]"
      options_count_observed: 3
      options_note: >-
        Трёх кнопок на одном поле: «любой» с пустым значением и два варианта.
        Число относится к КНОПКАМ, а не к самому полю-выбору - его на снимке
        одно.
    range:
      selector: ".lot-field-range-box"
      confidence: observed
      evidence: catalog-fields.logged.ru
      what: >-
        Поле-диапазон. Два видимых поля - от и до, - и одно скрытое, в котором
        собирается итоговое значение.
  values_on_rows:
    what: >-
      Значения полей лежат и НА СТРОКАХ предложений - атрибутами того же имени с
      приставкой data-: data-f-type, data-f-members.

      Значит фильтровать выдачу можно, не спрашивая площадку заново.
    confidence: observed
    evidence: catalog-fields.logged.ru
  what_is_still_missing: >-
    Наблюдён ОДИН раздел с ДВУМЯ полями. Бывают ли поля других видов - список,
    дата, свободный текст - неизвестно, и объявлять перечень видов закрытым
    нельзя.
