# Общие правила извлечения данных из разметки.
#
# Зачем отдельный раздел спецификации. Контракт Funora стабилен, а разметка
# площадки нет. Если правила извлечения размазать по шести реализациям, они
# разъедутся: одна найдёт покупателя, другая нет, и обе будут считать себя
# правой. Здесь они собраны один раз и снабжены указанием, откуда взяты.
#
# Главное правило этого раздела - про уверенность. Придуманный селектор хуже
# отсутствующего: отсутствующий виден сразу, придуманный тихо ломает разбор у
# всех шести SDK. Поэтому каждое правило несёт пометку confidence, и метка
# observed допустима только со ссылкой на снимок, в котором селектор буквально
# присутствует.
#
# Снимки лежат в репозитории Funora-python, в tests/fixtures/pages. Это
# структурные скелеты настоящих страниц: разметка сохранена целиком, текст и
# значения атрибутов заменены подписями. Проверка «селектор действительно есть в
# снимке» выполняется там же, тестами над фикстурами. Перенести снимки в этот
# репозиторий имеет смысл, когда появится вторая реализация; до тех пор
# дублировать их незачем.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# --- Словарь уверенности ----------------------------------------------------
confidence_levels:
  observed:
    meaning: >-
      Селектор буквально присутствует в снимке, указанном в поле evidence.
      Проверяется автоматически.
    allowed_in_contract: true

  inferred:
    meaning: >-
      Селектор присутствует, но приписанный ему смысл выведен рассуждением, а не
      наблюдался. Пример: равенство двух числовых атрибутов трактуется как
      «прочитано», хотя непрочитанного диалога в снимке не было.
    allowed_in_contract: true
    requires: >-
      Реализация обязана предусмотреть, что вывод неверен: поле помечается как
      приблизительное либо сопровождается запасным путём.

  assumed:
    meaning: >-
      Взято из общих соображений о вёрстке. В снимках не наблюдалось ни
      селектора, ни смысла.
    allowed_in_contract: false
    rationale: >-
      Предположение в правиле извлечения даёт молчаливый отказ: селектор не
      находит ничего, разбор возвращает пустой результат, и пустой результат
      неотличим от «данных нет». Такие правила остаются в документе наблюдений
      до подтверждения.

  # ЧЕТВЁРТЫЙ УРОВЕНЬ ЗАВЕДЁН 31.08.2026, и вот из-за чего.
  #
  # У площадки есть вторая независимая реализация - библиотека FunPayAPI из бота
  # FunPayCardinal. Она работает с тем же протоколом и знает точки запроса,
  # которых мы не снимали: возврат по заказу, вывод средств, отзывы,
  # калькулятор, кошельки, курс.
  #
  # ЗАПИСАТЬ ЕЁ СЛОВА КАК НАШЕ НАБЛЮДЕНИЕ БЫЛО БЫ ЛОЖЬЮ, и ложью того самого
  # рода, из-за которого три недели жила выдуманная запись «признака показа лота
  # на странице нет». Наблюдение - это то, что мы видели своими глазами в
  # снимке. Слова другой реализации - не наблюдение.
  #
  # ВЫБРОСИТЬ ИХ ТОЖЕ НЕЛЬЗЯ. Это независимое свидетельство о ЧУЖОМ протоколе,
  # проверяемое: путь, имена полей и ключей ответа либо совпадут с живым
  # ответом, либо нет. Молчать о нём значило бы делать вид, будто мы не знаем
  # того, что знаем.
  #
  # Отсюда отдельный уровень с обязательным источником - и с двумя запретами,
  # которые и делают его безопасным.
  third_party_report:
    meaning: >-
      Форма известна от НЕЗАВИСИМОЙ РЕАЛИЗАЦИИ того же протокола, а не из нашего
      снимка. Мы знаем, что она отправляет и какие ключи читает в ответе; самого
      ответа площадки мы не видели.
    allowed_in_contract: true
    requires_field: source
    source_names: >-
      Реализацию, файл и метод. «Известно от третьих лиц» без имени - то же
      самое, что выдумка: проверить нечего и спросить некого.

    # ПЕРВЫЙ ЗАПРЕТ. Отсутствие объявляется ТОЛЬКО по положительному признаку, и
    # чужая реализация положительным признаком быть не может: она молчит о поле
    # не потому, что поля нет, а потому, что оно ей не понадобилось.
    #
    # Это прямое следствие правила, которое проект уже нарушал однажды - и
    # получил три недели неправды в модели, проверке и документации хором.
    cannot_declare_absence: >-
      Пометка third_party_report не имеет права стоять при absent_in и при любом
      утверждении «поля нет», «признака нет», «состояние не наблюдается».
      Молчание чужой реализации о поле не есть свидетельство его отсутствия.

    # ВТОРОЙ ЗАПРЕТ, и он про необратимое. Операция чтения на вторичном
    # источнике ошибётся - вернёт неверные данные, и это видно. Операция ЗАПИСИ
    # ошибётся деньгами, лимитом или чужим лотом, и обратно не отыграется.
    #
    # Молчаливого согласия здесь не бывает. Механизм согласия у нас уже есть -
    # тот же, которым включаются небезопасные возможности.
    write_requires_opt_in: >-
      Операция ЗАПИСИ, у которой форма запроса стоит на third_party_report, не
      отправляет ничего без явного согласия вызывающего. Отказ при отсутствии
      согласия обязателен и происходит ДО обращения к сети.

    # ТРЕТЬЕ - не запрет, а обязанность. Вторичный источник существует ровно до
    # первого живого ответа: как только наблюдение снято, пометка обязана стать
    # observed, а расхождение - быть названным вслух.
    upgrade_on_first_observation: >-
      Первый же живой ответ переводит правило в observed со ссылкой на снимок.
      Разошедшееся с сообщением стороннего источника записывается отдельно: это
      знание о том, где чужая реализация неверна.

# --- Запрет на разбор текста -----------------------------------------------
text_is_not_a_signal:
  statement: >-
    Ни одно правило извлечения не имеет права опираться на текст интерфейса для
    определения состояния, типа или роли. Текст извлекается только как значение
    поля, которое пользователь и так увидит.

  rationale: >-
    Локаль привязана к аккаунту, а не к адресу. Запрос /en/orders/trade вернул
    страницу, побайтово совпадающую с /orders/trade. Значит SDK не может
    привести страницу к одному языку и не может рассчитывать на конкретные
    формулировки. Смена языка сломала бы распознавание, не сломав отпечаток
    страницы, то есть отказ был бы тихим.

  # ЖИВОЙ ПРИМЕР ЦЕНЫ ЭТОГО ПРАВИЛА, и он из чужой реализации того же протокола.
  #
  # FunPayAPI определяет срок до следующего поднятия так: собирает из ответа все
  # цифры в одну строку и смотрит, встречается ли в тексте «секунд», «минут» или
  # «час» - на трёх языках сразу. Не встретилось ничего - возвращает десять.
  # Разбор не удался - подставляет две тысячи двести. Ошибку «слишком часто»
  # ловит сравнением с шестью строками на трёх языках.
  #
  # Первое: смена локали аккаунта ломает это молча. Второе: подставленное число
  # неотличимо от прочитанного, и вызывающий не узнает, что ждёт по выдумке.
  #
  # У нас на том же месте стоит Observed с причиной «не наблюдалось». Ждать
  # придётся вслепую - зато вызывающий об этом ЗНАЕТ.
  observed_counterexample: >-
    Сторонняя реализация того же протокола (FunPayAPI, common/utils.py,
    parse_wait_time) выводит срок ожидания из текста ответа на локали интерфейса
    и подставляет придуманное число, когда вывод не удался. Перенимать нельзя ни
    разбор, ни подстановку: первое отказывает молча при смене языка, второе
    выдаёт выдумку за наблюдение.

  applies_to:
    - Состояние сессии - только структурные признаки
    - Статус заказа - только классы-модификаторы
    - Онлайн-статус - только класс-модификатор
    - Признак системного сообщения - только разметка

  exception:
    where: Классификатор ответа
    what: >-
      Текстовые детекторы страницы проверки, блокировки и технических работ.
    why: >-
      Таких страниц мы не видели, структурных признаков не знаем, а не заметить
      их опаснее, чем сработать по тексту. Все такие сигнатуры помечены
      непроверенными и требуют ручного подтверждения вердикта.

    scope_is_normative: true
    scope: >-
      Текстовые сигнатуры ищутся только вне контейнеров, содержимое которых
      пишут люди. Перечень таких контейнеров объявляет адаптер страницы: именно
      он знает, где на ней чужой ввод. Для наблюдённых страниц это переписка,
      предпросмотр сообщений, имена пользователей, таблица заказов и описания
      в ней.
    scope_rationale: >-
      Без этого ограничения собеседник останавливает чужого клиента одним словом
      в переписке. Проверено на шести обычных сообщениях вида «мой аккаунт
      заблокирован» и «там captcha вылезла»: шесть из шести давали вердикт
      блокировки или проверки, а он трактуется как отказ с закрытым замком.
      Доступа к чужому аккаунту для этого не нужно вовсе. Ограничение сужает
      область поиска, но не отменяет его: тот же текст вне этих контейнеров
      по-прежнему распознаётся, иначе вместе с уязвимостью пропало бы и
      распознавание настоящей страницы блокировки.

# --- Время ------------------------------------------------------------------
time_handling:
  statement: >-
    Машиночитаемого времени в наблюдённой разметке нет. Ни одного атрибута
    datetime, data-time или подобного на странице заказов; в переписке у
    .chat-msg-date есть title, но внутри тоже локализованный текст.

  consequence: >-
    Поле точного времени не может быть заполнено из списка. Разбор человеческой
    формулировки вида «2 дня назад» зависит от языка аккаунта, часового пояса и
    текущего момента, то есть даёт значение, которое нельзя ни повторить, ни
    сверить.

  rule:
    exact_time: >-
      Не заполняется из списка. Наблюдаемость поля объявляется как not_observed,
      а не как пустое значение: пустое значение означало бы «времени нет», и это
      неправда.
    display_text: >-
      Сохраняется как есть, отдельным полем с пометкой x-funora-plain. Текст для
      показа человеку, не для разбора и не для сравнения.
    observed_at: >-
      Момент чтения страницы записывается адаптером. Это единственное время в
      модели, которое действительно известно точно.

  forbidden:
    - Выдавать разобранное из текста время за точное
    - Сравнивать два таких значения между собой
    - Использовать такое значение как ключ упорядочивания

# --- Числовые идентификаторы -----------------------------------------------
numeric_identifiers:
  statement: >-
    Наблюдённые идентификаторы состоят из цифр и достигают десяти знаков.

  type_requirement:
    use: 64-битное целое либо строка
    never: 32-битное целое
    rationale: >-
      Десять цифр это до 9 999 999 999, а signed int32 кончается на
      2 147 483 647. C, C# и Java переполнятся на значениях выше двух
      миллиардов, Python и TypeScript нет. Расхождение вылезло бы не на тестах,
      а в работе, и только у части SDK.

  width_is_not_a_rule: >-
    Наблюдённая ширина в правилах проверки не закрепляется. Десять знаков - факт
    о сегодняшнем дне; переход площадки на одиннадцать сломал бы разбор
    одновременно у всех реализаций.

  leading_zeros: >-
    Сохраняются. Значение непрозрачно, и нормализация его меняет.

# --- Что делать при расхождении --------------------------------------------
# --- Атрибут: нет, пуст, есть -----------------------------------------------
attribute_states:
  rule: >-
    Чтение атрибута различает три исхода: селектор не нашёл узла, узел есть -
    атрибута нет, атрибут есть и пуст.

  why: >-
    Первые два - про наше незнание, третий - факт о странице. Сведи их вместе, и
    вызывающий теряет единственный способ отличить «площадка не дала адрес» от
    «площадка дала пустой». Для адреса разница видна глазом: `<a href="">`
    перезагружает текущую страницу, а `<a>` без адреса ссылкой не является
    вовсе.

  implementation_note: >-
    Проверяется наличие ключа среди атрибутов, а не значение по нему. Разборщики
    отдают отсутствующее значение и для `data-chat`, и для `data-chat=""`, так
    что чтение «взять значение, сравнить с отсутствующим» сводит «атрибута нет»
    с «атрибут пуст» - ровно то различие, ради которого правило написано.

    Атрибут без значения и атрибут с пустым значением между собой не
    различаются: оба означают «атрибут есть, значения нет».

  one_place: >-
    Правило одно на реализацию. В эталонной оно нашлось написанным трижды: две
    копии дословно одинаковые и обе неверные в части «атрибута нет», третья
    верная и разошедшаяся с ними в первый же час.

# --- Значение, не приводящееся к типу ----------------------------------------
# Спецификация объявляла два механизма и молчала об отношении между ними.
# ParseError жил в spec/errors/errors.yaml, повреждение с уровнями page, row и
# field - в spec/models/defect.schema.json, и ни один файл не упоминал другого.
#
# Значит на одну и ту же испорченную ячейку две реализации отвечали бы
# по-разному: одна отвергала бы страницу целиком, другая выдавала бы её без
# одного поля. Расхождение видно не сразу: обе выглядят работающими, пока
# площадка не поменяет разметку.
#
# Решение принято в пользу того, что делает эталонная реализация, и вот почему.
# Потерять восемь прочитанных строк из-за девятой - хуже, чем сообщить о
# девятой. Страница списка продаж существует ради строк, и отказ от всех восьми
# из-за одной непрочитанной цены оставляет продавца вовсе без сведений там, где
# он мог бы получить почти все.
value_does_not_convert:
  rule: >-
    Значение, найденное на месте и не приводящееся к своему доменному типу,
    даёт повреждение, а не отказ. Уровень повреждения - field, если поле
    необязательно для смысла строки, и row, если без него строка бессмысленна.
    Страница при этом остаётся читаемой.

  completeness: >-
    Полнота снимка опускается до partial. Число принятых и отвергнутых строк
    выдаётся вызывающему вместе с перечнем повреждений.

  reading_an_incomplete_result: >-
    Чтение неполного результата без явного согласия даёт IncompleteResultError.
    Согласие выражается признаком accept_incomplete у метода чтения: вызывающий
    берёт на себя, что работает с неполными данными, и это его решение, а не
    решение реализации за него.

  when_parse_error_instead: >-
    ParseError возбуждается там, где не приводится к типу значение, без
    которого страница не имеет смысла вовсе, - то есть при повреждении уровня
    page. Разница не в тяжести ошибки, а в том, останется ли после неё хоть
    что-то полезное.

    В эталонной реализации такого значения сегодня нет: всё, что она читает, -
    это строки списков, и потеря любого поля оставляет остальные строки
    годными. Поэтому ParseError не возбуждается ни разу и записан в
    spec/conformance/not-implemented.yaml. Условие при этом названо точно, а не
    приблизительно: появится страница, у которой есть значение уровня page, -
    появится и путь к ParseError.

  why_not_the_other_way: >-
    Обратное решение - отвергать страницу при первом непреобразуемом значении -
    выглядит строже и на деле мягче к ошибке разметки: оно превращает частную
    поломку в полное молчание. Вызывающий видит отказ и не может отличить
    «площадка сменила одну ячейку» от «площадка сменила всё».

# --- Одинаковые идентификаторы ----------------------------------------------
duplicate_identifiers:
  rule: >-
    Два элемента списка с одним идентификатором - повреждение уровня страницы.

  why: >-
    Курсор наблюдения хранит записи по идентификатору, и одинаковые схлопываются
    в одну. Число записей молча расходится с числом строк, а событие о второй не
    порождается никогда: она неотличима от первой.

    Молчаливость здесь полная. Полнота объявляется complete, повреждений нет,
    список выглядит короче ровно на число дублей - и ни одного признака, по
    которому вызывающий отличил бы это от «столько и было».

  observability_note: >-
    Проверка стала возможной только после того, как формат снимков научился
    различать идентификаторы. До этого маска схлопывала их сама, и всякая такая
    проверка срабатывала бы на каждом снимке - то есть была бы выключена первой.

on_mismatch:
  statement: >-
    Если селектор не нашёл ничего там, где по правилу обязан был найти, это
    поломка разметки, а не отсутствие данных.

  rationale: >-
    Разница видна только изнутри: снаружи пустой список заказов и сломанный
    селектор выглядят одинаково. Именно так теряются оплаченные заказы.

  required_behaviour:
    - Поле помечается как ненаблюдённое, а не как пустое
    - Событие о повреждении разметки поднимается наверх
    - Обязательные поля модели без значения делают запись непригодной целиком
    - Частичная запись не выдаётся за полную
