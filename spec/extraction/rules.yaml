# Общие правила извлечения данных из разметки.
#
# Зачем отдельный раздел спецификации. Контракт Funora стабилен, а разметка
# площадки нет. Если правила извлечения размазать по шести реализациям, они
# разъедутся: одна найдёт покупателя, другая нет, и обе будут считать себя
# правой. Здесь они собраны один раз и снабжены указанием, откуда взяты.
#
# Главное правило этого раздела - про уверенность. Придуманный селектор хуже
# отсутствующего: отсутствующий виден сразу, придуманный тихо ломает разбор у
# всех шести SDK. Поэтому каждое правило несёт пометку confidence, и метка
# observed допустима только со ссылкой на снимок, в котором селектор буквально
# присутствует.
#
# Снимки лежат в репозитории Funora-python, в tests/fixtures/pages. Это
# структурные скелеты настоящих страниц: разметка сохранена целиком, текст и
# значения атрибутов заменены подписями. Проверка «селектор действительно есть в
# снимке» выполняется там же, тестами над фикстурами. Перенести снимки в этот
# репозиторий имеет смысл, когда появится вторая реализация; до тех пор
# дублировать их незачем.

version: "0.1.0"

# --- Словарь уверенности ----------------------------------------------------
confidence_levels:
  observed:
    meaning: >-
      Селектор буквально присутствует в снимке, указанном в поле evidence.
      Проверяется автоматически.
    allowed_in_contract: true

  inferred:
    meaning: >-
      Селектор присутствует, но приписанный ему смысл выведен рассуждением, а не
      наблюдался. Пример: равенство двух числовых атрибутов трактуется как
      «прочитано», хотя непрочитанного диалога в снимке не было.
    allowed_in_contract: true
    requires: >-
      Реализация обязана предусмотреть, что вывод неверен: поле помечается как
      приблизительное либо сопровождается запасным путём.

  assumed:
    meaning: >-
      Взято из общих соображений о вёрстке. В снимках не наблюдалось ни
      селектора, ни смысла.
    allowed_in_contract: false
    rationale: >-
      Предположение в правиле извлечения даёт молчаливый отказ: селектор не
      находит ничего, разбор возвращает пустой результат, и пустой результат
      неотличим от «данных нет». Такие правила остаются в документе наблюдений
      до подтверждения.

# --- Запрет на разбор текста -----------------------------------------------
text_is_not_a_signal:
  statement: >-
    Ни одно правило извлечения не имеет права опираться на текст интерфейса для
    определения состояния, типа или роли. Текст извлекается только как значение
    поля, которое пользователь и так увидит.

  rationale: >-
    Локаль привязана к аккаунту, а не к адресу. Запрос /en/orders/trade вернул
    страницу, побайтово совпадающую с /orders/trade. Значит SDK не может
    привести страницу к одному языку и не может рассчитывать на конкретные
    формулировки. Смена языка сломала бы распознавание, не сломав отпечаток
    страницы, то есть отказ был бы тихим.

  applies_to:
    - Состояние сессии - только структурные признаки
    - Статус заказа - только классы-модификаторы
    - Онлайн-статус - только класс-модификатор
    - Признак системного сообщения - только разметка

  exception:
    where: Классификатор ответа
    what: >-
      Текстовые детекторы страницы проверки, блокировки и технических работ.
    why: >-
      Таких страниц мы не видели, структурных признаков не знаем, а не заметить
      их опаснее, чем сработать по тексту. Все такие сигнатуры помечены
      непроверенными и требуют ручного подтверждения вердикта.

    scope_is_normative: true
    scope: >-
      Текстовые сигнатуры ищутся только вне контейнеров, содержимое которых
      пишут люди. Перечень таких контейнеров объявляет адаптер страницы: именно
      он знает, где на ней чужой ввод. Для наблюдённых страниц это переписка,
      предпросмотр сообщений, имена пользователей, таблица заказов и описания
      в ней.
    scope_rationale: >-
      Без этого ограничения собеседник останавливает чужого клиента одним словом
      в переписке. Проверено на шести обычных сообщениях вида «мой аккаунт
      заблокирован» и «там captcha вылезла»: шесть из шести давали вердикт
      блокировки или проверки, а он трактуется как отказ с закрытым замком.
      Доступа к чужому аккаунту для этого не нужно вовсе. Ограничение сужает
      область поиска, но не отменяет его: тот же текст вне этих контейнеров
      по-прежнему распознаётся, иначе вместе с уязвимостью пропало бы и
      распознавание настоящей страницы блокировки.

# --- Время ------------------------------------------------------------------
time_handling:
  statement: >-
    Машиночитаемого времени в наблюдённой разметке нет. Ни одного атрибута
    datetime, data-time или подобного на странице заказов; в переписке у
    .chat-msg-date есть title, но внутри тоже локализованный текст.

  consequence: >-
    Поле точного времени не может быть заполнено из списка. Разбор человеческой
    формулировки вида «2 дня назад» зависит от языка аккаунта, часового пояса и
    текущего момента, то есть даёт значение, которое нельзя ни повторить, ни
    сверить.

  rule:
    exact_time: >-
      Не заполняется из списка. Наблюдаемость поля объявляется как not_observed,
      а не как пустое значение: пустое значение означало бы «времени нет», и это
      неправда.
    display_text: >-
      Сохраняется как есть, отдельным полем с пометкой x-funora-plain. Текст для
      показа человеку, не для разбора и не для сравнения.
    observed_at: >-
      Момент чтения страницы записывается адаптером. Это единственное время в
      модели, которое действительно известно точно.

  forbidden:
    - Выдавать разобранное из текста время за точное
    - Сравнивать два таких значения между собой
    - Использовать такое значение как ключ упорядочивания

# --- Числовые идентификаторы -----------------------------------------------
numeric_identifiers:
  statement: >-
    Наблюдённые идентификаторы состоят из цифр и достигают десяти знаков.

  type_requirement:
    use: 64-битное целое либо строка
    never: 32-битное целое
    rationale: >-
      Десять цифр это до 9 999 999 999, а signed int32 кончается на
      2 147 483 647. C, C# и Java переполнятся на значениях выше двух
      миллиардов, Python и TypeScript нет. Расхождение вылезло бы не на тестах,
      а в работе, и только у части SDK.

  width_is_not_a_rule: >-
    Наблюдённая ширина в правилах проверки не закрепляется. Десять знаков - факт
    о сегодняшнем дне; переход площадки на одиннадцать сломал бы разбор
    одновременно у всех реализаций.

  leading_zeros: >-
    Сохраняются. Значение непрозрачно, и нормализация его меняет.

# --- Что делать при расхождении --------------------------------------------
on_mismatch:
  statement: >-
    Если селектор не нашёл ничего там, где по правилу обязан был найти, это
    поломка разметки, а не отсутствие данных.

  rationale: >-
    Разница видна только изнутри: снаружи пустой список заказов и сломанный
    селектор выглядят одинаково. Именно так теряются оплаченные заказы.

  required_behaviour:
    - Поле помечается как ненаблюдённое, а не как пустое
    - Событие о повреждении разметки поднимается наверх
    - Обязательные поля модели без значения делают запись непригодной целиком
    - Частичная запись не выдаётся за полную
