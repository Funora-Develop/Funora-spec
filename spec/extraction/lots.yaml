# Страница собственных лотов продавца: /lots/{id}/trade.
#
# ЗАЧЕМ ОНА, КОГДА ЕСТЬ ВИТРИНА. Витрина на профиле показывает те же
# предложения и даже больше полей - количество и признак автовыдачи, - но не даёт
# ГЛАВНОГО: идентификатора предложения. На витрине он лежит в строке запроса
# ссылки, а строку запроса скелет заменяет одной подписью; наблюдать его там
# нельзя по устройству формата.
#
# Здесь он лежит атрибутом. Наблюдено: двадцать строк, двадцать РАЗЛИЧНЫХ
# значений data-offer; на витрине - сто пятьдесят восемь строк и ни одного
# такого атрибута.
#
# Идентификатор нужен всем четырём операциям записи над лотами: включение,
# выключение, правка цены, поднятие. Каждая адресует лот по нему.

rows:
  selector: "a.tc-item"
  confidence: observed
  count_observed: 20
  scope: document
  evidence: lots-trade.logged.ru
  attributes:
    offer_id:
      name: data-offer
      type: entity_id
      confidence: observed
      evidence: lots-trade.logged.ru
      observed_signature: "T8:d"
      role: >-
        ИДЕНТИФИКАТОР ПРЕДЛОЖЕНИЯ, ради которого страница и читается. Восемь
        цифр, различны у всех двадцати строк.
    offer_href:
      name: href
      confidence: observed
      evidence: lots-trade.logged.ru
      observed_shape: "https://funpay.com/lots/{n}?{query}"

  why_scoped_to_the_row: >-
    Ячейки таблицы адресуются ВНУТРИ строки, а не по документу. Классы
    .tc-server, .tc-desc и .tc-price встречаются на странице по двадцать одному
    разу: двадцать строк плюс ШАПКА таблицы, у которой те же классы.

    Счёт по ячейке разошёлся бы с числом лотов на единицу, и разошёлся бы молча -
    та же беда, что уже случалась с ценой на странице баланса.

fields:
  server_text:
    selector: ".tc-server"
    reads: text
    scope: row
    confidence: observed
    evidence: lots-trade.logged.ru
    why_no_signature: >-
      Подпись здесь НЕ ОБЪЯВЛЯЕТСЯ, и это не пробел. Селектор по документу
      находит двадцать один узел: двадцать строк плюс ШАПКУ таблицы с тем же
      классом, и значения у них разные - у строк название сервера, у шапки
      название колонки.

      Подпись, объявленная одна, была бы утверждением сразу о двух разных
      вещах. Селектор при этом остаётся прежним: разбор читает его ВНУТРИ
      строки, и шапка туда не попадает по построению.
  description_text:
    selector: ".tc-desc-text"
    reads: text
    scope: row
    confidence: observed
    evidence: lots-trade.logged.ru
    why_not_the_outer_cell: >-
      ЧИТАЕТСЯ ВЛОЖЕННЫЙ УЗЕЛ, А НЕ ЯЧЕЙКА. Полный текст ячейки .tc-desc равен
      «имя сервера, приклеенное спереди к описанию»: внутри неё лежит и обёртка
      .tc-visible-inside с дублем колонки сервера.

      Наблюдено на всех двадцати строках: текст ячейки - «T14:aps T95:acops»,
      текст вложенного узла - «T95:acops».

      Решение читать ячейку выглядит очевидным по имени класса и ошибается на
      двадцати строках из двадцати. Ошибка при этом ПРАВДОПОДОБНА: описание
      вправду там, просто с лишним словом впереди.
  price_cell:
    selector: ".tc-price"
    scope: row
    confidence: observed
    evidence: lots-trade.logged.ru
    attributes:
      sort_value:
        name: data-s
        type: opaque
        confidence: observed
        evidence: lots-trade.logged.ru
        observed_signature: "T7:dp"
        role: >-
          Значение сортировки. ОДНО И ТО ЖЕ во всех двадцати строках, и это
          доказано номером: у всех двадцати стоит T7:dp#1, а одинаковый номер
          при одном имени атрибута в пределах документа означает одно значение.

          ПОЧЕМУ оно одно - НЕ УСТАНОВЛЕНО. Прежняя редакция этого места
          объявляла причиной равные цены у всех лотов раздела, и это была
          догадка под видом наблюдения: она же противоречила соседней строке,
          где сказано, что содержимое атрибута не проверялось.

          Соперничающее объяснение проверено и отвергнуто: таблица сортируема
          так же, как таблицы витрины - одна ячейка шапки с классом sort здесь и
          по одной в каждом из тринадцати разделов витрины. Сортируемостью
          постоянство не объясняется.

          Числом атрибут не объявляется: наблюдалась подпись, а не значение.
  price_text:
    selector: ".tc-price > div"
    reads: text
    scope: row
    confidence: observed
    evidence: lots-trade.logged.ru
  currency_symbol_text:
    selector: ".tc-price .unit"
    reads: text
    scope: row
    type: x-funora-plain
    confidence: observed
    evidence: lots-trade.logged.ru
    observed_signature: "T1:o"

# --- Чего на странице НЕТ ----------------------------------------------------
# Раздел важнее прочих: он держит реализацию от того, чтобы выдумать поле,
# которого не наблюдали.
absent:
  is_active:
    what: >-
      Признака «лот показывается в выдаче» на странице НЕТ НИ ОДНОГО.
    how_it_was_checked: >-
      Все двадцать строк структурно одинаковы: каждый класс внутри строки
      встречается ровно двадцать раз. Ни различающего класса, ни атрибута
      состояния, ни переключателя у строки.

      Формы на странице одна - фильтр игр в шапке; полей ввода три, и все они
      вне таблицы.
    the_trap: >-
      УЗЕЛ .tc-visible-inside ЭТИМ ПРИЗНАКОМ НЕ ЯВЛЯЕТСЯ, и по имени похоже, что
      является. Опровергается счётом, а не рассуждением.

      Тот же класс есть на ПУБЛИЧНОЙ витрине профиля - в сорока строках из ста
      пятидесяти восьми. Витрина публична, скрытых лотов покупателю не
      показывают, и признаку включённости там взяться неоткуда.

      СОВПАДЕНИЕ ТОЧНОЕ И В ОБЕ СТОРОНЫ. Узел есть ровно в тех сорока строках,
      где есть колонка сервера, и ни в одной из ста восемнадцати без неё: 40 из
      40 и 118 из 118. На странице своих лотов - 20 из 20.

      Значит наличие узла определяется НАБОРОМ КОЛОНОК таблицы, а не состоянием
      лота. Состояние лота не может зависеть от того, есть ли в таблице колонка
      сервера.

      Родитель узла при этом - .tc-desc, то есть он рисуется ВНУТРИ соседней
      ячейки, а не сам является ячейкой. Наблюдено в 60 случаях из 60 по двум
      страницам.
    what_is_not_proven: >-
      Что узел - «дубль для узких экранов», СНИМОК НЕ ДОКАЗЫВАЕТ: правил стилей
      в скелете нет вовсе, а имена классов доказательством не служат - на том и
      строилась исходная ловушка.

      Доказана привязка к набору колонок, и её довольно: ловушка закрыта
      независимо от того, зачем площадка этот узел рисует.
    consequence: >-
      Модель Lot требует is_active обязательным полем, и потому со страницы она
      НЕ СОБИРАЕТСЯ. Операция чтения собственных лотов возвращает своё - то, что
      вправду читается.

      Что покажет площадка у скрытого лота - неизвестно: у продавца на снимке
      все двадцать показаны. Наблюдение нужно со скрытым лотом, и до него
      объявлять признак нельзя.
  amount:
    what: Количества на странице нет, хотя на витрине оно есть (.tc-amount).
    note: >-
      Различие наблюдено, объяснения ему нет. Витрина показывает покупателю
      остаток, страница управления - не показывает.
  auto_delivery:
    what: Признака автовыдачи нет, хотя на витрине он есть (.auto-dlv-icon).

# --- Управление лотами -------------------------------------------------------
controls:
  raise_button:
    selector: "button.js-lot-raise"
    confidence: observed
    count_observed: 1
    scope: document
    evidence: lots-trade.logged.ru
    attributes:
      game_id:
        name: data-game
        type: entity_id
        confidence: observed
        evidence: lots-trade.logged.ru
        observed_signature: "T2:d"
      node_id:
        name: data-node
        type: entity_id
        confidence: observed
        evidence: lots-trade.logged.ru
        observed_signature: "T3:d"
    role: >-
      Кнопка поднятия лотов раздела. Несёт ОБА довода, которых потребует запрос
      поднятия: игру и раздел.

      Самого запроса никто не наблюдал, и операции поднятия нет - см. запись
      lots_service_operations. Но довод, лежащий на странице, объявить стоит:
      без него наблюдение поднятия пришлось бы делать вслепую.
