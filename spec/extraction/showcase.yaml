# Извлечение витрины продавца с его профиля.
#
# Витрина - ПУБЛИЧНЫЙ вид предложений: то, что видит покупатель. Она не то же,
# что страница управления лотами: ни признака включённости, ни правки цены, ни
# кнопки поднятия на ней нет.
#
# ЛОВУШКА, КОТОРУЮ ЗДЕСЬ ЛЕГКО НЕ ЗАМЕТИТЬ. Класс offer на профиле носят
# ЧЕТЫРНАДЦАТЬ узлов, а разделов витрины тринадцать: четырнадцатый - блок
# отзывов, переиспользующий тот же класс. Разбор, взявший .offer за раздел
# витрины, нашёл бы раздел без единого предложения и без заголовка.
#
# Настоящий контейнер - .offer-tc-container, и их ровно тринадцать.

evidence: user.logged.ru

sources:
  profile:
    path: /users/{id}/
    evidence: user.logged.ru
    note: >-
      Снимок сделан с СОБСТВЕННОГО профиля. Витрина при этом публичная, и на
      чужом профиле она должна выглядеть так же - но «должна» это рассуждение,
      а не наблюдение.

# --- Разделы ------------------------------------------------------------------
sections:
  container:
    selector: ".offer-tc-container"
    confidence: observed
    count_observed: 13
    scope: document
    role: >-
      Раздел витрины. НЕ .offer: тот класс носят четырнадцать узлов, и
      четырнадцатый - блок отзывов.

  title:
    selector: ".offer-list-title h3 a"
    confidence: observed
    count_observed: 13
    scope: document
    reads: attribute
    attributes:
      category_href:
        name: href
        type: entity_id
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/lots/{id}/"
    role: >-
      Название раздела и ссылка на него. Лежит НЕ внутри контейнера строк, а
      рядом с ним - в общей обёртке .offer.

  manage_link:
    selector: ".offer-list-title-button a"
    confidence: observed
    count_observed: 13
    scope: document
    reads: attribute
    attributes:
      manage_href:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/lots/{id}/trade"
    role: >-
      Ссылка на страницу управления лотами этого раздела. Видна только своему
      профилю; на чужом её быть не должно, но это не наблюдено.

      Отсюда же берётся номер раздела для пункта наблюдений lots_manage: другого
      места, где он лежит, на профиле нет.

# --- Предложения ---------------------------------------------------------------
offers:
  row:
    selector: "a.tc-item"
    confidence: observed
    count_observed: 158
    scope: document
    reads: attribute
    attributes:
      offer_href:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/lots/offer?{query}"
    role: >-
      Одно предложение. Строка ЦЕЛИКОМ является ссылкой - тег a, а не div с
      вложенной ссылкой.

  id_is_in_the_query:
    observed: true
    consequence: >-
      Идентификатор предложения лежит в СТРОКЕ ЗАПРОСА, а не в пути. Формат
      скелета заменяет строку запроса одной подписью целиком, и разобрать из
      неё параметр по снимку нельзя - ни проверить такой разбор.

      Поэтому адрес отдаётся ЦЕЛИКОМ, непрозрачной строкой. Разбирать его на
      части значило бы завести правило, которое ни одна проверка не покрывает, -
      ровно та ошибка, что уже случилась с разбором суммы на странице заказа.

  fields:
    description_text:
      selector: ".tc-desc-text"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: Описание предложения. Свободный текст.

    price_cell:
      selector: ".tc-price"
      confidence: observed
      count_observed: 1
      scope: row
      reads: attribute
      attributes:
        sort_value:
          name: data-s
          type: opaque
          confidence: observed
          evidence: user.logged.ru
          varies_across_rows: >-
            Подписи здесь нет НАРОЧНО: у ста пятидесяти восьми строк значений
            двадцать три различных. Подпись означала бы «во всех наблюдённых
            узлах значение выглядело так», а это неверно.
      role: >-
        Ячейка цены. Несёт атрибут сортировки - цифры с пунктуацией, похоже на
        цену числом.

        «Похоже» здесь не вежливость: значение замаскировано, и утверждать, что
        это именно цена, по снимку нельзя. Наблюдено, что атрибут есть, что он
        числоподобен и что таблица объявлена сортируемой.

    price_text:
      selector: ".tc-price > div"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: >-
        Цена, как показана. Знак валюты лежит отдельным узлом внутри, и
        собственный текст даёт цену без знака.

    currency_symbol_text:
      selector: ".tc-price .unit"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: Знак валюты. Кода валюты витрина не даёт.

  optional_columns:
    what: >-
      Состав колонок РАЗНЫЙ у разных разделов, и это наблюдено, а не
      предположено.
    amount:
      selector: ".tc-amount"
      confidence: observed
      role: >-
        Остаток. Есть не во всех разделах: наблюдён у части строк, у прочих узла
        нет вовсе.
    server:
      selector: ".tc-server"
      confidence: observed
      role: Сервер. Тоже есть не во всех разделах.
    auto_delivery:
      selector: ".auto-dlv-icon"
      confidence: observed
      reads: presence
      role: >-
        Признак автоматической выдачи. Читается наличием узла - значка у
        предложения.

  price_cell_is_not_unique_by_document:
    observed: true
    counts: "по документу 171, внутри строк 158"
    consequence: >-
      Заголовок каждой таблицы несёт ячейку цены с тем же классом, что и строки.
      Поля обязаны искаться ВНУТРИ строки: поиск по документу сдвинулся бы и
      приписал предложениям чужие цены.

# --- Полнота ------------------------------------------------------------------
totality:
  no_marker_found:
    what: Признака усечения витрины на странице нет ни одного.
    how_checked: >-
      Перебор всех классов внутри контейнеров строк. Ни кнопки догрузки, ни
      формы, ни ссылки «показать все» - при том что на той же странице у таблицы
      отзывов кнопка догрузки есть и находится тем же перебором.
    consequence: >-
      Отсюда НЕ следует, что витрина показана целиком. Отсутствие признака
      говорит о том, кто искал, а не о том, что искали, - правило проекта.

  a_positive_hint_of_truncation:
    what: >-
      У семи разделов из тринадцати ровно по двадцать строк.
    why_it_matters: >-
      Двадцать - круглое число, и семь совпадений подряд на одну случайность не
      похожи. Это ПОЛОЖИТЕЛЬНЫЙ довод в пользу того, что витрина обрезана, а не
      просто отсутствие довода против.
    what_it_is_not: >-
      Доводом ДОКАЗАТЕЛЬНЫМ он не является. Предел в двадцать выведен из одного
      снимка одного продавца; у другого он может оказаться иным, а совпадение
      объясниться тем, что у этого продавца в семи разделах ровно по двадцать
      предложений.

  decision: >-
    Чтение витрины объявляется НЕПОЛНЫМ всегда, с причиной, называющей
    наблюдение: разделов с ровно двадцатью строками семь.

    Закроет вопрос страница управления лотами - там число предложений раздела
    видно продавцу прямо. Пункт наблюдений - lots_manage.
