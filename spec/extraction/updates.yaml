# Как страница сообщает, что что-то изменилось.
#
# Раздел отвечает на вопрос, от которого зависит формулировка гарантии доставки
# в spec/events/delivery.yaml. Отвечает не полностью, и это записано здесь
# прямо: недосказанность в таком месте дороже признания, что ответа нет.
#
# Различать надо две вещи, которые легко спутать, потому что обе выглядят как
# непонятная строка в атрибуте. Метка отвечает на вопрос «изменилось ли».
# Позиция отвечает на вопрос «что именно я пропустил». Первая наблюдалась,
# вторая только предполагается.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# --- Метки состояния --------------------------------------------------------
tags:
  type: opaque
  observed_shapes: ["8 знаков: латиница вперемешку с цифрами"]
  shapes_source: >-
    Со слов наблюдателя, а не из снимка. Метка лежит внутри значения
    data-app-data, а скелет маскирует его целиком одной подписью на все сто
    пятьдесят знаков: проверить по снимку длину и состав самой метки нельзя.

    Пометка стоит затем, чтобы никто не искал этих восьми знаков в файле и не
    счёл их проверяемыми по нему.
  confidence: observed
  evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]

  locations:
    - selector: "div.hidden[data-orders]"
      attributes: [data-orders, data-chat]
      evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
      confidence: observed
      note: >-
        Скрытый блок в шапке. Адресуется по атрибуту, а не по классу: класс
        hidden в разметке не уникален. На гостевой странице блока нет вовсе, что
        делает его дополнительным признаком сессии.

    - selector: ".chat.chat-float"
      attributes: [data-bookmarks-tag, data-tag]
      evidence: [chat.logged.ru, chat-thread.logged.ru]
      confidence: observed

    - selector: ".param-item.chat-panel"
      attributes: [data-tag, data-id, data-type]
      evidence: chat-thread.logged.ru
      confidence: observed
      note: >-
        Появляется только при открытой переписке. Здесь тройка видна целиком:
        тип канала, идентификатор объекта, текущая метка.

  empty_value_is_possible:
    observed: true
    where: data-chat на странице /chat/
    consequence: >-
      Пустое значение и отсутствие атрибута означают unknown, а не unchanged.
      Отчёт о сравнении, в котором пустая метка числится неизменившейся,
      бессодержателен для этой метки.

  reading_rules:
    allowed:
      - Сравнение на точное равенство с ранее сохранённым значением того же объекта
    forbidden:
      - Сравнение на больше или меньше
      - Вычитание и любая арифметика
      - Вывод о количестве или направлении изменений
      - Сравнение меток разных объектов между собой
    rationale: >-
      Значение непрозрачно и меняется без направления. Равенство при этом не
      доказывает отсутствия изменений: длина значения допускает повторы.

  status:
    changed_after_event: >-
      Наблюдалось один раз и только у data-bookmarks-tag после отправки
      сообщения. У data-chat и data-orders изменение не наблюдалось ни разу.
    contract_wording: >-
      Метка описывается как подсказка «имеет смысл перечитать раздел», а не как
      достоверный признак изменения. Ни одна реализация не строит на ней
      дедупликацию и не пропускает чтение по её равенству.

# --- Позиции ----------------------------------------------------------------
positions:
  # Блок атрибутов отображением, а не перечнем имён. Перечень проходил мимо
  # сборщика имён атрибутов: тот знает форму «имя -> запись с полем name», и два
  # имени, объявленные списком, не попадали ни в порождённый словарь, ни под
  # сверку со снимками. Молча.
  attributes:
    last_message:
      name: data-node-msg
      type: opaque
      observed_signature: "T10:d"
      role: Позиция последнего сообщения диалога.
    own:
      name: data-user-msg
      type: opaque
      observed_signature: "T10:d"
      role: Позиция последнего сообщения, увиденного этим аккаунтом.
  # Ключ selector, а не location. Сборщик перечня наблюдённых знает одно имя, и
  # синоним молча выводил правило из-под сверки со снимками: пометка observed
  # стояла, а проверить её было нечем.
  selector: "a.contact-item"

  confidence: observed
  evidence: [chat.logged.ru, chat-thread.logged.ru]

  type_requirement:
    use: 64-битное целое либо строка
    never: 32-битное целое
    rationale: >-
      Десять цифр это до 9 999 999 999, signed int32 кончается на 2 147 483 647.
      C, C# и Java переполнятся, Python и TypeScript нет. Расхождение проявилось
      бы не на тестах, а в работе, и только у части реализаций.

  what_is_established:
    - Значение числовое и после события выросло
    - >-
      data-user-msg сдвинулся на ту же большую величину, что и data-node-msg, а
      не на единицу. Значит оба поля живут в одном пространстве значений и
      обновляются из одного источника; отдельным счётчиком своих сообщений
      data-user-msg не является.
    - >-
      Два чтения подряд без действий между ними не меняют ни одного из 154
      отслеживаемых значений. Одноразовых значений среди наблюдаемых атрибутов
      нет.

  nature:
    conclusion: Счётчик, общий для площадки
    confidence: inferred
    established: 2026-08-19

    how_it_was_established: >-
      Двумя прогонами сравнения с отправкой одного сообщения в один и тот же
      диалог и с разной длительностью паузы. При паузе 66 секунд дельта
      составила 1 273 043, при паузе 1180 секунд - 3421. Дельта упала, когда
      пауза выросла, то есть от времени она не зависит.

    why_seconds_are_excluded: >-
      Основанием второго прогона было сообщение, отправленное в первом, то есть
      не раньше чем за паузу до него. Прошло не более примерно 1270 секунд, а
      дельта составила 3421. Отметка времени не может превысить реально
      прошедшее время, тем более в два с половиной раза.

    why_per_dialog_is_excluded: >-
      У счётчика внутри диалога дельта была бы единицей при каждой отправке.
      Наблюдались 1 273 043 и 3421.

    observed_rate: >-
      Около трёх идентификаторов в секунду в тихий час. Величина приблизительная
      и приведена как порядок, а не как норма: суточный размах у неё
      значительный, и в правилах она не закрепляется.

    what_this_does_not_give: >-
      Общий счётчик упорядочивает сообщения между собой, но не даёт способа
      получить пропущенное. Ограничение описано ниже в разделе replay и от
      природы значения не зависит.

    still_forbidden: >-
      Арифметика над значением остаётся запрещённой. Счётчик общий, поэтому
      разность между двумя значениями одного диалога измеряет сообщения всей
      площадки, а не пропущенные в этом диалоге. Число, полученное вычитанием,
      выглядит осмысленным и означает не то, что кажется, - это хуже, чем явная
      ошибка.

  what_is_not_established:

    monotonicity:
      statement: >-
        Выведена из одного увеличения одного значения. Это не монотонность, а
        одно наблюдение, совместимое и с монотонной схемой, и с немонотонной.
      counterexample: >-
        Удаление последнего сообщения сдвигает указатель на предыдущее, то есть
        значение уменьшается, при полностью монотонном пространстве
        идентификаторов. Правило «новое больше сохранённого, значит было
        изменение» такое изменение молча пропустит.

  reading_rules:
    allowed:
      - Сравнение на точное равенство с сохранённым значением того же диалога
    forbidden:
      - Сравнение на больше или меньше
      - Подсчёт пропущенного по разности
      - Запрос диапазона значений
      - Сортировка диалогов по значению
      - Предположение об уникальности значения
      - Предположение, что значение не может уменьшиться
    on_decrease: >-
      Уменьшение значения, отсутствие атрибута или незнакомая позиция
      трактуются как рассинхронизация: полное перечитывание, а не ошибка.

# --- Чего нет ---------------------------------------------------------------
# Раздел существует потому, что отсутствие ответа легко принять за
# отрицательный ответ, а здесь разница определяет формулировку гарантии.
# --- Собственный канал обновлений площадки -----------------------------------
# Наблюдался 19.08.2026 просмотром сетевых запросов живой страницы. Через
# скелет вопрос не закрывался в принципе: адрес живёт внутри кода страницы, а
# содержимое скриптов формат выбрасывает.
runner:
  observed: true
  observed_at: "2026-08-19"
  method: POST
  url: "https://funpay.com/runner/"
  encoding: application/x-www-form-urlencoded
  confidence: observed
  evidence: network-capture-2026-08-19
  evidence_kind: network
  evidence_note: >-
    Наблюдение сетевое, а не снимок, и проверить его по репозиторию нельзя.
    Скелет содержимое скриптов выбрасывает, поэтому адрес канала через снимок
    не наблюдаем в принципе - это не пробел в захвате, а свойство формата.

    Записано со слов наблюдателя, смотревшего консоль браузера на живой
    странице: перехват печатал имена полей, типы и длины, значения не
    печатались. Пометка стоит здесь затем, чтобы никто не искал подтверждения в
    tests/fixtures и не счёл его пропавшим.

  request_fields: [objects, request, csrf_token]

  response_shape:
    objects: "массив; пуст, когда ничего не изменилось"
    response: boolean

  changed_object_shape:
    type: "строка, 14 знаков; имя раздела"
    id: number
    tag: "строка, 8 знаков; та же метка, что в data-* скрытых узлов страницы"
    data:
      counter: number
      message: number
      order: "массив; наблюдалась длина 50 при 50 диалогах в списке"
      html: "строка, 696 знаков; готовая разметка раздела"

  observed_trigger: >-
    Непустой ответ наблюдался при ВХОДЯЩЕМ СООБЩЕНИИ - площадка доставила его
    аккаунту наблюдений во время перехвата. Это существеннее, чем кажется:
    канал сигналит ровно о том событии, ради которого пишут ботов, и делает это
    за пять секунд.

  what_the_answer_carries: >-
    Ответ при изменении несёт не признак «что-то поменялось», а сами данные:
    счётчики числом, порядок списка и готовую разметку раздела. Это существенно
    больше, чем даёт опрос страницы, и меняет цену вопроса: счётчик
    непрочитанного здесь число, а не вывод из расхождения двух позиций.

    Порядок списка при этом объясняется тем же событием: диалог с новым
    сообщением поднимается наверх, и массив order отражает новый порядок
    целиком.

  interval_s: 5
  interval_note: >-
    Наблюдался промежуток 5 секунд, устойчиво, на нескольких десятках запросов
    подряд. Прежняя запись говорила 30 секунд - она сделана по двум замерам и
    была неверна.
  interval_hypothesis: >-
    Расхождение 5 и 30 объясняется, вероятно, торможением таймеров в неактивной
    вкладке: браузеры замедляют их, когда вкладка в фоне. Это предположение, а
    не наблюдение: измерений в двух состояниях вкладки подряд не делалось.

  observed_sequence: >-
    Пять одинаковых непустых ответов подряд, затем только пустые. Похоже, что
    ответ повторяется, пока клиент не подтвердит новую метку, - но подтверждения
    этому нет: содержимое поля objects в запросе не наблюдалось.

    Из этого следует практическое требование к любому будущему потребителю:
    один и тот же ответ приходит несколько раз, и обработчик обязан быть
    идемпотентным. То же требование уже записано для событий SDK, и канал его не
    отменяет, а подтверждает.

  where_the_token_lives: >-
    Поле csrf-token в JSON атрибута data-app-data элемента body. Там же
    runnerCoordId, userId и locale. Значения не записывались: наблюдались имена
    полей, типы и длины.

  what_is_not_observed:
    - >-
      Содержимое поля objects в запросе. По разметке страницы предполагается,
      что это метки разделов из скрытых узлов с data-orders, data-chat и
      data-message, но соответствие не проверялось
    - Назначение поля request
    - Значение поля type. Наблюдалась только длина - 14 знаков
    - >-
      Что лежит внутри data.order. Наблюдалась только длина массива, совпавшая
      с числом диалогов
    - >-
      Что лежит внутри data.html. Умышленно: это разметка раздела переписки, то
      есть чужие сообщения. Наблюдать её значениями нельзя
    - Поведение при истёкшей сессии и при исчерпании лимита
    - Отвечает ли канал на разделы, которых клиент не запрашивал

  not_used_yet: >-
    Funora к каналу не обращается. Наблюдений за его поведением пока меньше, чем
    нужно для контракта: неизвестно, что он делает при истёкшей сессии и при
    исчерпании лимита, а это ровно те два случая, ради которых в SDK написаны
    политика повторов и распознавание состояния сессии.

    Использование станет расширением, а не исправлением: консервативная
    формулировка про гарантию доставки верна и с каналом, и без него.

  why_it_matters: >-
    Разница не в скорости, а в том, что канал отдаёт. Опрос страницы даёт
    разметку, из которой счётчик непрочитанного приходится выводить расхождением
    двух позиций - вывод, помеченный в chats.yaml как inferred. Канал отдаёт
    счётчик числом. Это тот случай, когда переход на другой источник закрывает
    не производительность, а достоверность.

    Второе: канал наблюдался срабатывающим на входящее сообщение. Событие
    message.created сегодня не порождается вовсе, потому что цикл наблюдения
    переписки не читает, а читать все пятьдесят на каждом шаге нельзя. Канал
    указывает, КАКОЙ диалог изменился, - и вопрос «что читать» этим снимается.

replay:
  endpoint_observed: false
  statement: >-
    Способа получить пропущенное не наблюдалось. Список диалогов хранит по
    одному значению на диалог - последнее. Если за время простоя пришло пять
    сообщений, видно одно.

  compounding_limit: >-
    Разметки дочитывания у списка нет, а полнота его неизвестна: два захвата
    одного списка дали 47 и 50 элементов. Диалог, оказавшийся за пределом
    списка, исчезнет из наблюдения целиком - но существует ли предел, никто не
    видел.

  consequence_for_guarantee: >-
    Гарантия формулируется как обнаружение изменения диалога с последующим
    перечитыванием, а не как переигрывание с произвольной позиции. Повторная
    выдача одного и того же изменения возможна, дедупликация остаётся
    обязанностью SDK.

  why_not_observable_from_page: >-
    Адрес такого запроса живёт внутри кода страницы, а скелет выбрасывает
    содержимое скриптов. Через наблюдение страницы вопрос не закрывается в
    принципе; нужен просмотр сетевых запросов.

  if_found_later: >-
    Появление такой ручки будет расширением контракта, а не исправлением:
    консервативная формулировка остаётся верной и после того, как найдётся
    способ сделать больше.
