# Как страница сообщает, что что-то изменилось.
#
# Раздел отвечает на вопрос, от которого зависит формулировка гарантии доставки
# в spec/events/delivery.yaml. Отвечает не полностью, и это записано здесь
# прямо: недосказанность в таком месте дороже признания, что ответа нет.
#
# Различать надо две вещи, которые легко спутать, потому что обе выглядят как
# непонятная строка в атрибуте. Метка отвечает на вопрос «изменилось ли».
# Позиция отвечает на вопрос «что именно я пропустил». Первая наблюдалась,
# вторая только предполагается.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# --- Метки состояния --------------------------------------------------------
tags:
  type: opaque
  observed_shapes: ["8 знаков: латиница вперемешку с цифрами"]
  shapes_source: >-
    Из снимков, а не со слов. Метка лежит в них открыто и отдельным атрибутом:
    data-orders и data-chat на div.hidden в orders-trade.logged.ru, data-tag и
    data-bookmarks-tag на .chat.chat-float, data-tag на .param-item.chat-panel -
    и все дают подпись T8:ad, восемь знаков латиницы с цифрами.

    До 24.08.2026 здесь стояло, что проверить длину и состав метки по снимку
    нельзя: она-де лежит внутри data-app-data, замаскированного целиком. Внутри
    data-app-data метка, вероятно, тоже есть - но перечень locations ниже уже
    называл три места, где она лежит сама по себе, и утверждение противоречило
    соседнему разделу того же файла.
  confidence: observed
  evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]

  carrier:
    selector: "div.hidden[data-orders]"
    confidence: observed
    count_observed: 1
    scope: document
    reads: attribute
    evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
    attributes:
      orders_tag:
        name: data-orders
        type: opaque
        confidence: observed
        evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
        observed_signature: "T8:ad"
    role: >-
      Метка подписки на счётчики продаж, лежащая на странице сама по себе.

      Объявлена ИМЕНОВАННЫМ селектором, а не только строкой в перечне мест ниже,
      потому что её читает разбор. Перечень мест - опись наблюдения; читаемое же
      обязано браться из порождённой таблицы, иначе спецификация и код
      разойдутся молча.

  locations:
    - selector: "div.hidden[data-orders]"
      attributes: [data-orders, data-chat]
      evidence: [orders-trade.logged.ru, chat.logged.ru, chat-thread.logged.ru]
      confidence: observed
      note: >-
        Скрытый блок в шапке. Адресуется по атрибуту, а не по классу: класс
        hidden в разметке не уникален. На гостевой странице блока нет вовсе, что
        делает его дополнительным признаком сессии.

    - selector: ".chat.chat-float"
      attributes: [data-bookmarks-tag, data-tag]
      evidence: [chat.logged.ru, chat-thread.logged.ru]
      confidence: observed

    - selector: ".param-item.chat-panel"
      attributes: [data-tag, data-id, data-type]
      evidence: chat-thread.logged.ru
      confidence: observed
      note: >-
        Появляется только при открытой переписке. Здесь тройка видна целиком:
        тип канала, идентификатор объекта, текущая метка.

  empty_value_is_possible:
    observed: true
    where: data-chat на странице /chat/
    consequence: >-
      Пустое значение и отсутствие атрибута означают unknown, а не unchanged.
      Отчёт о сравнении, в котором пустая метка числится неизменившейся,
      бессодержателен для этой метки.

  reading_rules:
    allowed:
      - Сравнение на точное равенство с ранее сохранённым значением того же объекта
    forbidden:
      - Сравнение на больше или меньше
      - Вычитание и любая арифметика
      - Вывод о количестве или направлении изменений
      - Сравнение меток разных объектов между собой
    rationale: >-
      Значение непрозрачно и меняется без направления. Равенство при этом не
      доказывает отсутствия изменений: длина значения допускает повторы.

  status:
    changed_after_event: >-
      Наблюдалось один раз и только у data-bookmarks-tag после отправки
      сообщения. У data-chat и data-orders изменение не наблюдалось ни разу.
    contract_wording: >-
      Метка описывается как подсказка «имеет смысл перечитать раздел», а не как
      достоверный признак изменения. Ни одна реализация не строит на ней
      дедупликацию и не пропускает чтение по её равенству.

# --- Позиции ----------------------------------------------------------------
positions:
  # Блок атрибутов отображением, а не перечнем имён. Перечень проходил мимо
  # сборщика имён атрибутов: тот знает форму «имя -> запись с полем name», и два
  # имени, объявленные списком, не попадали ни в порождённый словарь, ни под
  # сверку со снимками. Молча.
  attributes:
    last_message:
      name: data-node-msg
      type: opaque
      observed_signature: "T10:d"
      role: Позиция последнего сообщения диалога.
    own:
      name: data-user-msg
      type: opaque
      observed_signature: "T10:d"
      role: Позиция последнего сообщения, увиденного этим аккаунтом.
  # Ключ selector, а не location. Сборщик перечня наблюдённых знает одно имя, и
  # синоним молча выводил правило из-под сверки со снимками: пометка observed
  # стояла, а проверить её было нечем.
  selector: "a.contact-item"

  confidence: observed
  evidence: [chat.logged.ru, chat-thread.logged.ru]

  type_requirement:
    use: 64-битное целое либо строка
    never: 32-битное целое
    rationale: >-
      Десять цифр это до 9 999 999 999, signed int32 кончается на 2 147 483 647.
      C, C# и Java переполнятся, Python и TypeScript нет. Расхождение проявилось
      бы не на тестах, а в работе, и только у части реализаций.

  what_is_established:
    - Значение числовое и после события выросло
    - >-
      data-user-msg сдвинулся на ту же большую величину, что и data-node-msg, а
      не на единицу. Значит оба поля живут в одном пространстве значений и
      обновляются из одного источника; отдельным счётчиком своих сообщений
      data-user-msg не является.
    - >-
      Два чтения подряд без действий между ними не меняют ни одного из 154
      отслеживаемых значений. Одноразовых значений среди наблюдаемых атрибутов
      нет.

  nature:
    conclusion: Счётчик, общий для площадки
    confidence: inferred
    established: 2026-08-19

    how_it_was_established: >-
      Двумя прогонами сравнения с отправкой одного сообщения в один и тот же
      диалог и с разной длительностью паузы. При паузе 66 секунд дельта
      составила 1 273 043, при паузе 1180 секунд - 3421. Дельта упала, когда
      пауза выросла, то есть от времени она не зависит.

    why_seconds_are_excluded: >-
      Основанием второго прогона было сообщение, отправленное в первом, то есть
      не раньше чем за паузу до него. Прошло не более примерно 1270 секунд, а
      дельта составила 3421. Отметка времени не может превысить реально
      прошедшее время, тем более в два с половиной раза.

    why_per_dialog_is_excluded: >-
      У счётчика внутри диалога дельта была бы единицей при каждой отправке.
      Наблюдались 1 273 043 и 3421.

    observed_rate: >-
      Около трёх идентификаторов в секунду в тихий час. Величина приблизительная
      и приведена как порядок, а не как норма: суточный размах у неё
      значительный, и в правилах она не закрепляется.

    what_this_does_not_give: >-
      Общий счётчик упорядочивает сообщения между собой, но не даёт способа
      получить пропущенное. Ограничение описано ниже в разделе replay и от
      природы значения не зависит.

    still_forbidden: >-
      Арифметика над значением остаётся запрещённой. Счётчик общий, поэтому
      разность между двумя значениями одного диалога измеряет сообщения всей
      площадки, а не пропущенные в этом диалоге. Число, полученное вычитанием,
      выглядит осмысленным и означает не то, что кажется, - это хуже, чем явная
      ошибка.

  what_is_not_established:

    monotonicity:
      statement: >-
        Выведена из одного увеличения одного значения. Это не монотонность, а
        одно наблюдение, совместимое и с монотонной схемой, и с немонотонной.
      counterexample: >-
        Удаление последнего сообщения сдвигает указатель на предыдущее, то есть
        значение уменьшается, при полностью монотонном пространстве
        идентификаторов. Правило «новое больше сохранённого, значит было
        изменение» такое изменение молча пропустит.

  reading_rules:
    allowed:
      - Сравнение на точное равенство с сохранённым значением того же диалога
    forbidden:
      - Сравнение на больше или меньше
      - Подсчёт пропущенного по разности
      - Запрос диапазона значений
      - Сортировка диалогов по значению
      - Предположение об уникальности значения
      - Предположение, что значение не может уменьшиться
    on_decrease: >-
      Уменьшение значения, отсутствие атрибута или незнакомая позиция
      трактуются как рассинхронизация: полное перечитывание, а не ошибка.

# --- Чего нет ---------------------------------------------------------------
# Раздел существует потому, что отсутствие ответа легко принять за
# отрицательный ответ, а здесь разница определяет формулировку гарантии.
# --- Собственный канал обновлений площадки -----------------------------------
# Наблюдался 19.08.2026 просмотром сетевых запросов живой страницы. Через
# скелет вопрос не закрывался в принципе: адрес живёт внутри кода страницы, а
# содержимое скриптов формат выбрасывает.
runner:
  observed: true
  observed_at: "2026-08-19"
  method: POST
  url: "https://funpay.com/runner/"
  encoding: application/x-www-form-urlencoded
  confidence: observed
  evidence: [network.send-message-4, network.send-photo]
  evidence_kind: network
  evidence_note: >-
    Наблюдение сетевое, а не снимок, и в tests/fixtures его нет: скелет
    содержимое скриптов выбрасывает, поэтому адрес канала через снимок не
    наблюдаем в принципе - это свойство формата, а не пробел в захвате.

    С 24.08.2026 наблюдение всё же ПРОВЕРЯЕМО, хотя и не по репозиторию: оно
    лежит машиночитаемыми записями в observations/, снятыми сборщиком. Прежде
    раздел стоял на пересказе - «записано со слов наблюдателя, смотревшего
    консоль браузера», - и проверить его было нечем вовсе.

    Прежний пересказ оказался верным в главном и неточным в частностях. Что
    именно он назвал неверно, перечислено ниже в разделе corrected_by_capture:
    ошибки названы поимённо нарочно, иначе следующий читатель не поймёт, чему
    из старого текста верить.

  request_fields: [objects, request, csrf_token]

  request_fields_note: >-
    ПУСТОЕ ПОЛЕ objects ПЛОЩАДКА ПРИНИМАЕТ. Наблюдено 29.08.2026: один опрос с
    objects=[] и request=false вернул код 200 и ответ обычной формы
    {objects: [], response: булево}. Свидетельство - network.runner-empty,
    запись 0.

    Прежде здесь стояло, что это неизвестно, и что реализация, поставившая туда
    пустой массив, действовала бы догадкой. Догадки больше нет - есть
    наблюдение.

    ДЕЙСТВИЕ ПРИ ПУСТОЙ ПОДПИСКЕ ТОЖЕ ВЫПОЛНЯЕТСЯ. Наблюдено 30.08.2026,
    network.send-empty: отправка с objects=[] и действием chat_message прошла,
    сообщение появилось в переписке.

    Прежде здесь стояло, что это разные утверждения и второе не наблюдалось.
    Теперь наблюдены оба.

  subscription_composition_varies:
    observed: true
    observed_at: "2026-08-29"
    evidence: [network.runner-empty, network.runner-minimal, network.runner-opros]
    what: >-
      Состав подписки зависит от состояния страницы, а не постоянен.

      Наблюдено ДВА объекта - orders_counters и chat_bookmarks - на странице
      переписки без открытого диалога, и ЧЕТЫРЕ (плюс chat_node и c-p-u) на ней
      же с открытым.

      Прежде число четыре сопровождалось оговоркой «наблюдено, а не объявлено
      площадкой; на другой странице состав вправе быть иным». Оговорка была
      верной, и теперь это не оговорка, а наблюдение.
    why_it_matters: >-
      Реализация, переписавшая подписку из записи дословно, объявила бы диалог
      открытым там, где он не открыт.

  answer_confirms_only_what_was_subscribed:
    observed: true
    observed_at: "2026-08-30"
    evidence: [network.send-empty]
    what: >-
      Ответ канала несёт изменения ТОЛЬКО тех объектов, на которые клиент
      подписан. При пустой подписке поле objects ответа пусто, даже когда
      действие выполнено.
    how_it_was_observed: >-
      КОНТРОЛЬНОЙ ПАРОЙ, и это лучшее свидетельство, какое здесь возможно: две
      отправки в один диалог, в одну минуту, в одной записи.

      Первая сделана самой страницей - подписка полная, четыре объекта. Ответ:
      objects с узлом диалога и его сообщениями плюс закладки, response.error
      пуст.

      Вторая сделана сборщиком - подписка ПУСТА. Ответ: objects пуст,
      response.error пуст. Сообщение при этом пришло, и это видно в переписке
      глазами.

      Различие ровно одно - подписка. Значит объясняет его она.
    consequence_for_the_operation: >-
      ПУСТАЯ ПОДПИСКА ГОДИТСЯ ДЛЯ ОТПРАВКИ И НЕ ГОДИТСЯ ДЛЯ ПОДТВЕРЖДЕНИЯ.
      Отправка с ней проходит, а исход всякий раз выходит неподтверждённым:
      подтверждать нечем.

      Для операции это означает, что подписка нужна не ради самой отправки, а
      ради ответа. Объект chat_node собирается со страницы целиком -
      идентификатор из data-name, метка из data-tag, данные те же, что у
      действия, - и потому подписка из одного этого объекта достижима без
      единой догадки.

      ПОДПИСКА ИЗ ОДНОГО ОБЪЕКТА ВОЗВРАЩАЕТ ЕГО ИЗМЕНЕНИЕ. Наблюдено 30.08.2026,
      network.send-minimal: отправка с подпиской ровно на узел этого диалога
      вернула ровно один объект - тот самый узел, с непустым messages.

      Правило подтверждено теперь на ТРЁХ точках, и все три в двух записях
      одного дня:

        подписка на 4 объекта -> в ответе 2;
        подписка на 1 объект  -> в ответе 1;
        подписка пуста        -> в ответе 0.

      Отсюда следует практическое: отправке довольно подписки из одного узла, а
      она собирается со страницы целиком. Полная подписка недостижима - метка
      закладок так и не найдена, - и не нужна.

  where_the_tags_come_from:
    observed: true
    observed_at: "2026-08-29"
    evidence: [network.runner-empty]
    how_it_was_checked: >-
      СРАВНЕНИЕМ В ЖИВОЙ ВКЛАДКЕ, и иначе было нельзя. Скелет страницы нумерует
      значение атрибута в разряде каждого ИМЕНИ отдельно, а сетевая запись
      номеров не выставляет вовсе: две подписи «восемь знаков латиницы с
      цифрами» совпадают у любых двух таких строк. Сверить два файла было
      нечем.

      Сборщик сверяет метку с атрибутами страницы в момент запроса и записывает
      ИМЯ совпавшего атрибута либо false. Значения не уходит ни одного.

      Атрибуты читаются ДО ухода запроса: приложение обновляет метки по ответу,
      и сверка с обновлёнными дала бы «не совпало» там, где совпадало.
    result:
      orders_counters: >-
        tag РАВЕН значению атрибута data-orders скрытого узла страницы.
      chat_bookmarks: >-
        tag НЕ РАВЕН ни одному из трёх наблюдаемых атрибутов - ни data-orders,
        ни data-chat, ни data-message.
    what_this_settles: >-
      Метки разных видов - РАЗНЫЕ значения, а не одно. Подписи у них одинаковы,
      и прежним форматом записи различить их было невозможно.

      Отсюда следствие для сборки подписки: переписать одну метку во все четыре
      объекта нельзя. Годится либо пустая подписка, либо объект, метку которого
      вправду видно на странице.

  transport_ready_since: >-
    Отправка формы написана в обоих транспортах эталонной реализации
    29.08.2026. Правило при ней одно и названо прямо: ПЕРЕХОД В ОТВЕТ НА ЗАПИСЬ
    НЕ ПОВТОРЯЕТСЯ. Чтение по переходу повторить безвредно, запись - нет, и
    переход выглядит как обычное приглашение повторить запрос по другому адресу.

  response_shape:
    objects: "массив; пуст, когда ничего не изменилось"
    response: >-
      НЕ булево, вопреки прежней записи. Наблюдены два разных вида: при опросе
      без действия приходит булево, а при опросе С ДЕЙСТВИЕМ - объект с полем
      error. Реализация, разбирающая поле как булево, споткнётся ровно на
      успешной отправке.
    response_observed_values:
      - "булево - при запросе без действия (network.send-message-4, network.runner-opros)"
      - "{error: null} - при запросе с действием (network.send-message-4, запись 2)"

    what_response_answers: >-
      Поле отвечает на поле request, а НЕ сообщает об изменениях. Наблюдено
      прямо: в network.runner-opros есть запрос без действия, у которого objects
      непусты - пришёл счётчик непрочитанного, - и response при этом остался
      булевым.

      Различие существенно для реализации: узнавать об изменениях надо по
      непустоте objects, а не по виду response.
    error_never_seen_non_null: >-
      Поле error наблюдалось только пустым. Что площадка кладёт туда при
      неудаче - неизвестно, и объявлять форму отказа нельзя: она не наблюдалась.
      Записано в реестр как runner_error_shape.

  changed_object_shape:
    common:
      type: "строка; ИМЯ ВИДА объекта, а не длина. Наблюдены значения ниже"
      id: "число либо строка - зависит от вида"
      tag: "строка, 8 знаков; та же метка, что в data-* скрытых узлов страницы"
      data: >-
        ФОРМА ЗАВИСИТ ОТ ВИДА. Прежняя запись объявляла одну форму на все
        объекты - {counter, message, order, html}, - и это было верно для того
        вида, который наблюдался 19.08, и неверно как общее правило.

    shapes_source: >-
      Записи сборщика в observations/, а не пересказ. Проверить их по
      репозиторию нельзя - сетевого наблюдения там нет по устройству, - но это
      машинная запись, а не память наблюдателя: имена полей, типы и длины сняты
      перехватом и сложены в файл.

      Имя ключа observed_shapes выбрано воротами: они требуют, чтобы наблюдение
      и требование к форме различались именем. Ключ shape читался бы как
      ограничение, и SDK, принявший его за таковое, отбросил бы значение,
      которое эталон принимает.

    subscription_is_complete: >-
      Все четыре вида объектов подписки наблюдены поимённо - двумя опросами
      24.08.2026, без единого действия: канал опрашивает сам себя каждые пять
      секунд, и подписка едет в каждом запросе.

      Число четыре при этом наблюдено, а не объявлено площадкой. Подписка
      собиралась СТРАНИЦЕЙ ПЕРЕПИСКИ; на другой странице состав вправе быть
      иным, и утверждать «их всегда четыре» нельзя.

    observed_types:
      orders_counters:
        where: и в подписке запроса, и в ответе
        evidence: [network.send-message-4, network.send-photo, network.runner-opros]
        shapes_source: >-
          Машинная запись сборщика в observations/, не пересказ. По репозиторию
          не проверяется: сетевого наблюдения там нет по устройству формата.
        observed_shapes:
          - "в подписке: {data: булево, id: строка 8 цифр, tag: строка 8 знаков}"
          - "в ответе: {data: {buyer: число, seller: число}, id: число, tag: строка 8 знаков}"
        note: >-
          Единственный вид, наблюдённый и в подписке, и в ответе. В ответе несёт
          СЧЁТЧИКИ НЕПРОЧИТАННОГО ЧИСЛОМ, отдельно для покупок и для продаж, - то
          есть по нему счётчик получается прямо, а не выводится из расхождения
          двух позиций, как при чтении страниц.

          Идентификатор в подписке - строка из восьми цифр, в ответе - число. Оба
          наблюдены; приводить одно к другому нельзя, пока не наблюдено, что это
          одно и то же значение.

      chat_node:
        where: и в подписке запроса, и в ответе
        evidence: [network.send-message-4, network.send-photo, network.runner-opros]
        shapes_source: >-
          Машинная запись сборщика в observations/, не пересказ.
        observed_shapes:
          - >-
            в подписке при ОПРОСЕ: {data: {node: строка 23 знака, last_message:
            число, content: ПУСТАЯ СТРОКА}, id: строка 23 знака, tag: строка 8
            знаков}
          - >-
            в подписке при ОТПРАВКЕ: то же, но content НЕПУСТ - подпись его
            совпала с подписью content самого действия в том же запросе
          - >-
            в ответе: {id: строка 23 знака, tag: строка 8 знаков, data: {node:
            {id: число, name: строка 23 знака, silent: булево}, messages: [{id:
            число, author: число, html: строка}], hasHistory: булево}}
        note: >-
          В ПОДПИСКЕ несёт ту же форму данных, что и действие отправки:
          {node, last_message, content}. Похоже, что подписка на диалог и есть
          заявление «я смотрю сюда, последнее известное мне сообщение такое», а
          отправка отличается от неё только непустым content и полем action
          снаружи. Похоже - не наблюдено: сравнивались две записи, а не
          поведение площадки при подмене одного поля.

          ПРЕЖДЕ ЗДЕСЬ ОБЪЯВЛЯЛОСЬ «content: пустая строка» БЕЗ ОГОВОРОК, и это
          неверно. В записи отправки от 29.08.2026 content подписки непуст: там
          стоит подпись шести знаков кириллицы - та же, что у content действия.

          Равенством значений это не является и являться не может: сетевые
          записи номеров не выставляют, и две одинаковые подписи говорят лишь
          «столько же знаков того же состава». Наблюдено ровно то, что content
          подписки при отправке НЕ ПУСТ.

          В ОТВЕТЕ внутри messages лежит ГОТОВАЯ РАЗМЕТКА сообщения - поле html,
          шестьсот с лишним знаков. Наблюдать её значениями нельзя: это чужая
          переписка. Сборщик кладёт подпись, и так и должно остаться.

      chat_bookmarks:
        where: и в подписке запроса, и в ответе
        evidence: [network.runner-opros, network.runner-minimal]
        shapes_source: >-
          Машинная запись сборщика в observations/, не пересказ.
        observed_shapes:
          - "в подписке: {data: [[число, число] ... 50 штук], id: строка 8 цифр, tag: строка 8 знаков}"
          - >-
            в ответе: {data: {counter: число, message: число, order: [число ...
            50 штук], html: строка}, id: ЧИСЛО, tag: строка 8 знаков}
        note: >-
          Пятьдесят пар чисел при пятидесяти диалогах в списке. Что означает
          пара - неизвестно: по длине это похоже на «диалог и его позиция», но
          соответствие не проверялось, и утверждать его нельзя.

          В ОТВЕТЕ вид наблюдён впервые 29.08.2026, и форма там ДРУГАЯ: не
          массив пар, а объект с counter, message, order и html, и id числом, а
          не строкой. Прежде второй объект ответа сборщик сворачивал в «...of
          2», не называя вида, - потому он и не был опознан.

          Отсюда же становится ясно, чему принадлежала форма {counter, message,
          order, html} из пересказа 19.08.2026: она объявлялась общей формой
          поля data, а на деле это форма ОДНОГО вида в ОДНОМ направлении.

      c-p-u:
        where: в подписке запроса
        evidence: [network.runner-opros, network.runner-opros-2, network.runner-minimal]
        shapes_source: >-
          Машинная запись сборщика в observations/, не пересказ.
        observed_shapes:
          - "{data: булево, id: строка 8 цифр, tag: строка 8 знаков}"
        note: >-
          Имя записано ДОСЛОВНО и странно выглядит. Что оно означает - неизвестно,
          и догадываться незачем: подписка собирается по имени, а не по смыслу.

          Как имя добралось до записи, стоит помнить. Прежний образец
          протокольного знака его не пропускал, сборщик записал вместо имени
          мерку - длина пять, знаки строчные, пунктуация «-», цифр и заглавных
          нет, - и образец был расширен дефисом ПО ЭТОЙ МЕРКЕ. Первая попытка
          расширить его наугад пропустила бы и токен вида a1b2c3d4.

        tag_was_thought_to_differ: >-
          ЗДЕСЬ СТОЯЛО УТВЕРЖДЕНИЕ, И ОНО ОПРОВЕРГНУТО. Говорилось: метка этого
          вида - восемь знаков латиницы БЕЗ ЦИФР, в отличие от прочих трёх, и
          наблюдено это дважды, «то есть не случайность записи».

          Третье наблюдение, network.runner-minimal от 29.08.2026, показало у
          c-p-u метку T8:ad - латиницу С ЦИФРАМИ, ту же, что у остальных.
          Значит различия нет, а два прежних совпадения были именно тем, что
          сама же запись и допускала: восемь знаков латиницы без цифр выпадают
          у восьмизначного значения и случайно.

          Стоит запомнить не вывод, а его цену. Утверждение было построено на
          двух наблюдениях ОДНОГО РОДА - оба опроса, сделанные подряд одной
          сессией, - и слово «дважды» читалось как независимое подтверждение.
          Два наблюдения одной сессии подтверждают свойство сессии, а не
          свойство вида.


    type_length_was_wrong: >-
      Прежняя запись называла длину имени вида - «строка, 14 знаков». Объявлять
      длину как признак нельзя вовсе: у имени вида длина не свойство, а
      совпадение.

      ДОВОД, КОТОРЫМ ЭТО ЗДЕСЬ ДОКАЗЫВАЛОСЬ, БЫЛ ЛОЖЕН. Говорилось: «наблюдены
      имена длиной 15 и 9, четырнадцати знаков среди них нет». Наблюдены четыре
      имени, и длины у них 15, 14, 9 и 5: chat_bookmarks - ровно четырнадцать.
      То есть прежняя запись угадала длину одного из видов, а довод против неё
      строился на том, что такого вида нет.

      Вывод от этого не меняется - четыре разные длины и есть доказательство,
      что длина не признак, - но довод заменён на верный. Ложный довод, ведущий
      к верному выводу, опаснее прямой ошибки: его не проверяют, потому что
      вывод сходится.

  observed_trigger: >-
    Непустой ответ наблюдался при ВХОДЯЩЕМ СООБЩЕНИИ - площадка доставила его
    аккаунту наблюдений во время перехвата. Это существеннее, чем кажется:
    канал сигналит ровно о том событии, ради которого пишут ботов, и делает это
    за пять секунд.

  what_the_answer_carries: >-
    Ответ при изменении несёт не признак «что-то поменялось», а сами данные:
    счётчики числом, порядок списка и готовую разметку раздела. Это существенно
    больше, чем даёт опрос страницы, и меняет цену вопроса: счётчик
    непрочитанного здесь число, а не вывод из расхождения двух позиций.

    Порядок списка при этом объясняется тем же событием: диалог с новым
    сообщением поднимается наверх, и массив order отражает новый порядок
    целиком.

  # --- Канал служит и действием, а не только опросом --------------------------
  # Наблюдено 24.08.2026 дважды: при отправке текста и при отправке изображения.
  # Это меняет понимание канала целиком. Прежний раздел описывал его как способ
  # УЗНАТЬ об изменении; на деле тем же запросом делается и само изменение.
  action:
    observed: true
    observed_at: "2026-08-24"
    evidence: [network.send-message-4, network.send-photo]

    how_it_differs_from_a_poll: >-
      Главное различие - в поле request. При опросе оно не несёт действия; при
      действии в нём лежит JSON с полем action и данными. Адрес, состав полей
      формы и заголовки при этом совпадают.

      А ВОТ «ПОДПИСКА СОВПАДАЕТ» - НЕВЕРНО, и стояло это здесь до 29.08.2026.
      В записи отправки объект подписки chat_node несёт НЕПУСТОЙ content, тогда
      как при опросе он пуст. Проверить это стало возможно только тогда:
      прежние записи действий сворачивали подписку до одного объекта («...of
      4»), и увидеть в ней chat_node было нельзя.

      Различие существенно для того, кто будет собирать запрос: подписка при
      отправке - не та же самая, что при опросе, и переписать её из записи
      опроса дословно нельзя.

    send_message:
      action_value: chat_message
      data_fields: [node, last_message, content]
      observed_shapes:
        - "{node: строка 23 знака, last_message: число, content: текст}"
      shapes_source: >-
        Машинная запись сборщика в observations/, не пересказ.
      note: >-
        Имя действия записано ДОСЛОВНО: сборщик хранит значения полей action и
        type без маскирования, потому что это протокольные знаки, а не то, что
        написал человек. Список полей-исключений короткий и закрытый, и сверх
        него стоит условие на форму значения.

    send_image:
      action_value: chat_message
      data_fields: [node, last_message, content, image_id]
      note: >-
        ТО ЖЕ ДЕЙСТВИЕ, что и у текста. Отдельного действия для изображения нет:
        content приходит пустой строкой, а к данным добавляется image_id.

        Это стоит сказать прямо, потому что противоположное предположение
        естественно и обошлось бы дорого: реализация, искавшая бы отдельное имя
        действия, не нашла бы его и объявила бы отправку изображений
        неподдержанной.

      upload_first:
        method: POST
        path_masked: "/file/{n}"
        path_note: >-
          Имя метода в записи замаскировано: правило маскирования принимало
          сегмент с заглавной буквой за идентификатор, а имя писано горбатым
          письмом. Правило исправлено 24.08.2026, имя ждёт наблюдения.
        request: "форма с единственным полем file"
        request_headers: [accept, x-requested-with]
        response: "{fileId: число}"
        note: >-
          Загрузка идёт НА САМУ ПЛОЩАДКУ, а не во внешний файлообменник. Это
          снимает опасение, записанное у операции chats.send_image в
          spec/services/chats.yaml: столкновения с пунктом 1.12 публичных правил
          площадки здесь нет.

          Заголовка content-type в запросе нет, и это признак: тело
          многочастное, границу проставляет сам отправитель.

    where_every_field_comes_from:
      observed: true
      observed_at: "2026-08-29"
      evidence: [network.send-origins]
      how_it_was_checked: >-
        Сверкой в живой вкладке. Сборщик сравнивает значение поля запроса со
        значениями атрибутов страницы В МОМЕНТ ЗАПРОСА и записывает ИМЯ
        совпавшего атрибута либо false. Ни одного значения наружу не уходит.

        Иначе было нельзя: скелет страницы и сетевая запись маскируют значения
        независимо, и подписи «двадцать три знака латиницы с цифрами и
        пунктуацией» совпадают у любых двух таких строк.

        Атрибуты читаются ДО ухода запроса: приложение обновляет метки по
        ответу.

      action_data:
        node: >-
          Атрибут data-name узла .chat.chat-float. НЕ data-id: тот несёт девять
          цифр, а node - двадцать три знака с пунктуацией. Формы разные, и
          подставить одно вместо другого нельзя.
        last_message: >-
          Атрибут data-node-msg АКТИВНОЙ строки списка диалогов - a.contact-item
          с классом active. Не data-user-msg: два эти атрибута несут разное, и
          какое из двух кладётся в запрос, прежде было неизвестно.
        content: Даётся вызывающим. Это текст сообщения, и сверке он не подлежит.

      subscription:
        orders_counters: "id из data-user, tag из data-orders"
        chat_node: "id из data-name, tag из data-tag"
        c-p-u: "id из data-id, tag из data-tag"
        chat_bookmarks: >-
          id из data-user, tag НЕ НАЙДЕН среди сверявшихся атрибутов. Кандидат -
          data-bookmarks-tag того же узла .chat.chat-float: он объявлен носителем
          метки подписки в этом же файле, но в перечень сверки не входил.
          Проверяется следующим наблюдением.

      response:
        chat_node.id: "совпал с data-name"
        chat_node.data.node.id: "совпал с data-id - то есть числовой вид того же диалога"
        messages[].id: >-
          НЕ СОВПАЛ ни с одним атрибутом страницы, и это ожидаемо: сообщение
          новое, на странице его ещё нет. Для сверки по истории это и есть
          затор - опознавать своё сообщение придётся ПОСЛЕ перечитывания.

      what_this_makes_possible: >-
        Запрос отправки собирается из наблюдённого ЦЕЛИКОМ, кроме одной метки.
        Прежде здесь стояло, что поле node брать неоткуда.

        Страница нужна СТРАНИЦА ОТКРЫТОГО ДИАЛОГА: на списке без открытого
        диалога у виджета нет ни data-name, ни data-tag - там он несёт класс
        chat-not-selected. Это не подробность: отправить, прочитав только
        список, нельзя.

    request_headers: [accept, content-type, x-requested-with]
    request_headers_note: >-
      Заголовок x-requested-with наблюдён на КАЖДОМ запросе канала. Пропустить
      его нельзя, пока не наблюдено обратное: площадка вправе отвечать на
      запросы без него иначе.

  interval_s: 5
  interval_note: >-
    Наблюдался промежуток 5 секунд, устойчиво, на нескольких десятках запросов
    подряд. Прежняя запись говорила 30 секунд - она сделана по двум замерам и
    была неверна.
  interval_hypothesis: >-
    Расхождение 5 и 30 объясняется, вероятно, торможением таймеров в неактивной
    вкладке: браузеры замедляют их, когда вкладка в фоне. Это предположение, а
    не наблюдение: измерений в двух состояниях вкладки подряд не делалось.

  observed_sequence: >-
    Пять одинаковых непустых ответов подряд, затем только пустые. Похоже, что
    ответ повторяется, пока клиент не подтвердит новую метку, - но подтверждения
    этому нет: содержимое поля objects в запросе не наблюдалось.

    Из этого следует практическое требование к любому будущему потребителю:
    один и тот же ответ приходит несколько раз, и обработчик обязан быть
    идемпотентным. То же требование уже записано для событий SDK, и канал его не
    отменяет, а подтверждает.

  where_the_token_lives: >-
    Поле csrf-token в JSON атрибута data-app-data элемента body. Там же
    runnerCoordId, userId и locale. Значения не записывались: наблюдались имена
    полей, типы и длины.

  what_is_not_observed:
    - >-
      Откуда берётся метка chat_bookmarks. Проверено 29.08.2026 и НЕ совпало ни
      с data-orders, ни с data-chat, ни с data-message. Значит она либо лежит в
      четвёртом месте страницы, либо не лежит на странице вовсе
    - >-
      Что означает пара чисел внутри chat_bookmarks. Пятьдесят пар при
      пятидесяти диалогах - похоже на «диалог и позиция», но не проверено
    - >-
      Значение поля request при опросе БЕЗ действия. В записи стоит подпись пяти
      знаков латиницы; пять знаков латиницы - это false, но пока это догадка
    - Что площадка кладёт в response.error при неудаче: оно наблюдалось только пустым
    - >-
      Адрес загрузки файла. В записи стоит /file/{n}: правило маскирования
      принимало имя метода за идентификатор. Исправлено 24.08.2026
    - >-
      Что лежит внутри data.order. Наблюдалась только длина массива, совпавшая
      с числом диалогов
    - >-
      Что лежит внутри data.html. Умышленно: это разметка раздела переписки, то
      есть чужие сообщения. Наблюдать её значениями нельзя
    - Поведение при истёкшей сессии и при исчерпании лимита
    - Отвечает ли канал на разделы, которых клиент не запрашивал

  not_used_yet: >-
    Funora к каналу не обращается. Наблюдений за его поведением пока меньше, чем
    нужно для контракта: неизвестно, что он делает при истёкшей сессии и при
    исчерпании лимита, а это ровно те два случая, ради которых в SDK написаны
    политика повторов и распознавание состояния сессии.

    Использование станет расширением, а не исправлением: консервативная
    формулировка про гарантию доставки верна и с каналом, и без него.

  why_it_matters: >-
    Разница не в скорости, а в том, что канал отдаёт. Опрос страницы даёт
    разметку, из которой счётчик непрочитанного приходится выводить расхождением
    двух позиций - вывод, помеченный в chats.yaml как inferred. Канал отдаёт
    счётчик числом. Это тот случай, когда переход на другой источник закрывает
    не производительность, а достоверность.

    Второе: канал наблюдался срабатывающим на входящее сообщение. Событие
    message.created сегодня не порождается вовсе, потому что цикл наблюдения
    переписки не читает, а читать все пятьдесят на каждом шаге нельзя. Канал
    указывает, КАКОЙ диалог изменился, - и вопрос «что читать» этим снимается.

replay:
  endpoint_observed: false
  statement: >-
    Способа получить пропущенное не наблюдалось. Список диалогов хранит по
    одному значению на диалог - последнее. Если за время простоя пришло пять
    сообщений, видно одно.

  compounding_limit: >-
    Разметки дочитывания у списка нет, а полнота его неизвестна: два захвата
    одного списка дали 47 и 50 элементов. Диалог, оказавшийся за пределом
    списка, исчезнет из наблюдения целиком - но существует ли предел, никто не
    видел.

  consequence_for_guarantee: >-
    Гарантия формулируется как обнаружение изменения диалога с последующим
    перечитыванием, а не как переигрывание с произвольной позиции. Повторная
    выдача одного и того же изменения возможна, дедупликация остаётся
    обязанностью SDK.

  why_not_observable_from_page: >-
    Адрес такого запроса живёт внутри кода страницы, а скелет выбрасывает
    содержимое скриптов. Через наблюдение страницы вопрос не закрывается в
    принципе; нужен просмотр сетевых запросов.

  if_found_later: >-
    Появление такой ручки будет расширением контракта, а не исправлением:
    консервативная формулировка остаётся верной и после того, как найдётся
    способ сделать больше.
