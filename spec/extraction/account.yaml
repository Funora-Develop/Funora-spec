# Извлечение страницы баланса аккаунта.
#
# Страница снята 24.08.2026 и принесла две вещи, а не одну. Балансы - за ними и
# шли: схема с 0.8.0 объявляла перечень balances по переписи знаков валют, и
# разметка это подтвердила - три узла значения, ровно три.
#
# Второе не искали вовсе: ТАБЛИЦА ОПЕРАЦИЙ. Двадцать пять строк на той же
# машинерии dyn-table, что список продаж и отзывы, с идентификатором в атрибуте,
# состоянием в имени класса строки и суммой, отделённой от знака валюты. Операции
# для неё в контракте не было объявлено вовсе - ни реализации, ни записи в
# реестре неисполненного.
#
# И эта же страница ответила на вопрос, который полдня стоял открытым у отзывов:
# что означает класс hidden у кнопки догрузки. Здесь кнопка НЕ спрятана при
# двадцати пяти строках и продолжении - вторая сторона пары.

evidence: account-balance.logged.ru

sources:
  balance:
    path: /account/balance
    evidence: account-balance.logged.ru
    note: >-
      Страница доступна только своему аккаунту. Чужого баланса не бывает, и
      второй стороны у этого наблюдения не будет никогда.

# --- Балансы ------------------------------------------------------------------
balances:
  list:
    selector: "span.balances-list"
    confidence: observed
    count_observed: 1
    scope: document
    note: >-
      Перечень балансов в заголовке страницы. Лежит внутри h1, а не отдельным
      разделом.

  value:
    selector: "span.balances-value"
    confidence: observed
    count_observed: 3
    scope: document
    reads: text
    type: x-funora-plain
    role: >-
      Один баланс. Их три - ровно столько, сколько валют нашла перепись знаков
      23.08.2026, и это второе, независимое подтверждение того, что скалярным
      полем баланс не описывается.

  delimiter:
    selector: "span.balances-delimiter"
    confidence: observed
    count_observed: 3
    scope: document
    reads: text
    type: x-funora-plain
    role: >-
      Узел перед каждым значением. Подпись - один знак вне ASCII.

  delimiter_is_not_a_separator: >-
    Разделителей ТРИ при трёх значениях, и первый стоит ПЕРЕД первым значением.
    Разделяющий знак дал бы два на три значения; значит это не разделитель, а
    часть своего значения - вероятнее всего знак валюты.

    «Вероятнее всего» здесь не оговорка вежливости: сам знак замаскирован
    подписью, и утверждать, что это именно валюта, по снимку нельзя. Наблюдено
    строение - чередование, начинающееся с разделителя, - и оно исключает
    прочтение «разделитель между значениями».

  currency_code_not_readable: >-
    УТОЧНЕНО 31.08.2026 ДВУМЯ НАБЛЮДЕНИЯМИ, и уточнение вышло невесёлым.

    Код валюты со страницы ЧИТАЕТСЯ - но не тот, который нужен.

    В шапке всякой страницы стоит переключатель валюты. Пункты его несут код
    ISO 4217 в атрибуте data-cy, и перечисляет он ПРОЧИЕ валюты, не текущую:
    наблюдено дважды - {USD, EUR} при рублёвой настройке и {RUB, EUR} после
    переключения. Текущая, стало быть, вычисляется дополнением до объявленного
    набора.

    ЭТО НАСТРОЙКА ПОКАЗА, А НЕ ВАЛЮТА СУММЫ, и разница здесь решающая. После
    переключения на доллары список продаж остался с рублёвым знаком у тридцати
    четырёх сумм из тридцати четырёх. То есть сумма заказа показана в валюте
    ЗАКАЗА, а не в валюте настройки.

    Приписать сумме заказа код из шапки значило бы приписать чужую валюту
    чужому заказу - ровно то, от чего это правило и заведено.

    ЧЕГО НЕ ХВАТАЛО - НАБЛЮДЕНИЯ СТРАНИЦЫ, ГДЕ СУММЫ ЗА НАСТРОЙКОЙ СЛЕДУЮТ.
    Закрыто 31.08.2026, и закрыто трижды: витрина продавца снята в КАЖДОМ из
    трёх положений переключателя, и все цены следуют - 165 рублёвых, 164
    долларовых, 164 евровых, по одному знаку на сбор без единой примеси.

    Итог получается такой. Страницы делятся на два рода, и путать их нельзя:

      где суммы следуют за настройкой (витрина, публичный список) - код берётся
      дополнением переключателя до набора;

      где не следуют (список продаж) - код берётся ИЗ ЗНАКА рядом с самой
      суммой, потому что сумма показана в валюте своего заказа.
  # --- Набор валют замкнут, и это ключ ко всему выше ------------------------
  #
  # Без замкнутости таблица знаков была бы гаданием: знак доллара носят полтора
  # десятка валют мира. С замкнутостью она чтение: три знака, три кода, взаимно
  # однозначно.
  #
  # Замкнутость наблюдена ДВУМЯ независимыми путями, и это важно - один путь
  # оставил бы вопрос, полон ли перечень.
  currency_set_is_closed:
    confidence: observed
    evidence: [account_balance.ru.skeleton.txt]
    observed_at: "2026-08-31"
    codes: [eur, rub, usd]
    first_witness: >-
      Область вывода средств несёт настройки объектом в атрибуте data-data.
      Ключи объекта сохраняются в снимке ДОСЛОВНО - таково правило формата, -
      и ключей у currencies ровно три: eur, rub, usd. Это перечень самой
      площадки, а не наш.
    second_witness: >-
      Переключатель в шапке перечисляет ПРОЧИЕ валюты, не текущую. Наблюдён
      дважды при разной текущей: {USD, EUR} при рублёвой настройке и {RUB, EUR}
      после переключения на доллары. Две альтернативы при трёх валютах - то же
      число с другой стороны, и добыто оно иначе.
    symbols_observed: ["\u20bd", "$", "\u20ac"]
    symbols_witness: >-
      В span.unit наблюдалось ровно три знака на 877 вхождениях шести разных
      страниц: баланс, чат, заказ, список заказов, список продаж, профиль.

      Прочие трёхбуквенные строки на страницах есть - GTA, NBA, MIR - но лежат
      они в пунктах фильтра игр и в номерах заказов, а не в span.unit. Проверено
      прицельно: путать перечень валют с перечнем игр было бы дорого.
    what_a_fourth_currency_does: >-
      Заведи площадка четвёртую - появится четвёртый знак, и таблица его не
      найдёт. Реализация обязана отказать ГРОМКО, а не подставить правдоподобное:
      молчаливая подстановка приписала бы сумме чужую валюту, и увидел бы это не
      разработчик, а продавец.
  currency_switcher:
    selector: ".user-cy-switcher"
    reads: "@data-cy"
    type: opaque
    confidence: observed
    evidence: account-balance.logged.ru
    observed_at: "2026-08-31"
    what: >-
      Пункт переключателя валюты. Значение - код ISO 4217 строчными буквами.

      Перечисляются ПРОЧИЕ валюты, не текущая. Наблюдено дважды на одной
      странице при разных настройках: {USD, EUR} и {RUB, EUR}.
    why_no_signature: >-
      Подпись не объявлена: значение - код из закрытого перечня, то есть
      протокольная константа, а не чьи-то данные. Ровно по тому же правилу
      сохраняется дословно имя метода в адресе.

# --- Способы вывода средств -------------------------------------------------
#
# Раздел заведён 31.08.2026, и заведён по НАШЕМУ снимку - случай, где наше
# наблюдение точнее стороннего источника, и потому названный отдельно.
#
# Независимая реализация того же протокола держит перечень способов вывода
# рукописным списком из восьми. У площадки их ТРИНАДЦАТЬ, и два из восьми
# неверны: значение binance в перечне площадки отсутствует вовсе (там
# binance_usdc и binance_usdt), а fps и yandex - разные способы, слитые в один.
#
# Отсюда правило шире случая: рукописный перечень чужой стороны устаревает молча.
# Читать надо тот, который площадка объявляет сама.
withdrawal_options:
  carrier:
    selector: "div.withdraw-box[data-data]"
    reads: "@data-data"
    confidence: observed
    evidence: [account-balance.v9.logged.ru]
    observed_at: "2026-08-31"
    count_observed: 1
    scope: document
    role: >-
      Обёртка ВОКРУГ формы вывода, несущая настройки объектом. Прежде в перечне
      селекторов у области вывода был объявлен ровно один узел - сама форма, - и
      обёртка в него не попадала.

      Ключи объекта снимок сохраняет дословно, и потому перечень способов
      читается со снимка полностью, а значения остаются замаскированными.

  # ПЕРЕЧЕНЬ ПЛОЩАДКИН, А НЕ НАШ, и в этом всё дело. Записан он здесь не как
  # знание о мире, а как СНИМОК СОСТОЯНИЯ на дату: площадка вправе завести
  # четырнадцатый способ завтра.
  #
  # Поэтому реализация перечень НЕ ЗАШИВАЕТ: она читает ключи объекта. Здесь он
  # стоит ради проверки, что читаемое совпадает с наблюдённым.
  ext_currencies:
    confidence: observed
    evidence: [account-balance.v9.logged.ru]
    observed_at: "2026-08-31"
    count_observed: 13
    scope: document
    observed_keys:
      - binance_usdc
      - binance_usdt
      - card_eur
      - card_rub
      - card_usd
      - fps
      - qiwi
      - usdt_trc
      - wme
      - wmp
      - wmr
      - wmz
      - yandex
    fields_per_key: [name, unit, walletName, wallets]
    what_is_masked: >-
      Значения name, unit и walletName замаскированы подписями - это тексты на
      локали интерфейса. Читаются они как есть и не разбираются.
    wallets_were_empty: >-
      У нашего аккаунта список wallets пуст у ВСЕХ тринадцати. Строение
      наблюдено, наполнение - нет: что лежит в непустом списке, неизвестно.

      Это положительный признак, а не молчание: ключ присутствует и несёт пустой
      список, то есть площадка сказала «сохранённых кошельков нет».

  channels:
    confidence: observed
    evidence: [account-balance.v9.logged.ru]
    observed_at: "2026-08-31"
    count_observed: 3
    scope: row
    role: >-
      У каждой из трёх валют счёта - свой перечень каналов вывода, по три.
      Канал называет способ (extCurrency), своё имя и СВЕДЕНИЯ О КОМИССИИ.
    # ЧТО СО СНИМКА НЕ ЧИТАЕТСЯ, и находка эта стоит отдельной строки.
    #
    # Формат скелета сохраняет дословно КЛЮЧИ объектов, а не значения. Перечень
    # способов лежит ключами и уцелел целиком; ссылка канала на способ -
    # extCurrency - лежит ЗНАЧЕНИЕМ и замаскирована.
    #
    # То есть со снимка известно, какие способы вывода есть, и НЕ известно,
    # какой валютой какой из них доступен. Различие это не мелочь: первое
    # опровергает чужой рукописный перечень, второе требует живой страницы.
    link_to_option_is_masked_in_snapshots: >-
      Поле extCurrency канала - значение, а не ключ, и в снимке оно
      замаскировано. Связь «валюта счёта - способ вывода» читается только с
      живой страницы.
    fee_is_text: >-
      Комиссия приходит полем feeInfo - строкой на локали интерфейса, длиной от
      двадцати девяти до сорока трёх знаков. Слова «комиссия» в контракте до сих
      пор не было НИГДЕ, и это первое место, где она названа.

      Разбирать её мы не станем: это текст на локали, и правило
      text_is_not_a_signal запрещает выводить из него величину.

# --- Таблица операций ---------------------------------------------------------
transactions:
  table:
    selector: ".tc-finance"
    confidence: observed
    count_observed: 1
    scope: document
    note: >-
      Внешний контейнер таблицы операций. Класс собственный и смысловой, в
      отличие от прочих классов той же таблицы: tc, dyn-table, transactions -
      общие для семейства виджетов.

  rows_container:
    selector: ".dyn-table-body"
    confidence: observed
    count_observed: 1
    scope: document
    note: Тот же класс, что у списка продаж и у отзывов.

  row:
    selector: ".tc-item"
    confidence: observed
    count_observed: 25
    scope: document

  fields:
    transaction_id:
      selector: ".tc-item"
      confidence: observed
      count_observed: 1
      scope: row
      reads: attribute
      attributes:
        transaction_id:
          name: data-transaction
          type: entity_id
          confidence: observed
          evidence: account-balance.logged.ru
          observed_signature: "T9:d"
      role: Идентификатор операции. Девять цифр.

    status:
      selector: ".tc-item"
      confidence: observed
      count_observed: 1
      scope: row
      reads: class
      type: x-funora-plain
      observed_values: ["transaction-status-complete"]
      enum_is_closed: false
      unknown_fallback: required
      role: >-
        Состояние операции В ИМЕНИ КЛАССА строки, а не в тексте.

      values_note: >-
        Наблюдено ОДНО состояние на двадцати пяти строках: все двадцать пять
        завершены. Фильтр над таблицей перечисляет четыре значения, но их имена
        - локализованный текст, и связать текст с классом нечем.

        Перечисление поэтому открыто: незнакомый класс обязан дать
        ненаблюдённое значение, а не ошибку и не догадку.

    status_text:
      selector: ".tc-status"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: >-
        Состояние словами. Локализовано, разбору не подлежит; отдаётся строкой
        затем, что состояний наблюдено одно, и вызывающий, встретивший
        незнакомый класс, увидит хотя бы подпись.

    title_text:
      selector: ".tc-title"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: Описание операции. Локализовано, отдаётся строкой.

    date_text:
      selector: ".tc-date-time"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: >-
        Дата операции в том виде, в каком показана. Строкой, а не моментом
        времени: запись локализована.

    date_left_text:
      selector: ".tc-date-left"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: >-
        Вторая метка времени рядом с первой - похоже на «сколько назад».
        Локализована, отдаётся строкой.

    amount_text:
      selector: ".tc-price"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: >-
        Сумма операции. Знак валюты лежит ОТДЕЛЬНЫМ узлом внутри, и потому
        собственный текст ячейки даёт сумму без знака - то же устройство, что у
        цены в списке продаж.

    currency_symbol_text:
      selector: ".tc-price .unit"
      confidence: observed
      count_observed: 1
      scope: row
      reads: text
      type: x-funora-plain
      role: Знак валюты операции.

  header_is_not_a_row:
    selector: ".tc-header"
    confidence: observed
    count_observed: 1
    scope: document
    note: >-
      Заголовок таблицы. Несёт ячейку цены с тем же классом tc-price, что и
      строки, и потому по документу таких ячеек двадцать шесть, а не двадцать
      пять. Разбор обязан искать поля ВНУТРИ строки, а не по документу.

# --- Догрузка -----------------------------------------------------------------
# Этот раздел важнее, чем кажется: он закрывает вопрос, который полдня стоял
# открытым у отзывов.
pagination:
  continue_button:
    selector: "button.dyn-table-continue"
    confidence: observed
    count_observed: 1
    scope: document
    evidence: account-balance.logged.ru
    observed_classes: "btn btn-default dyn-table-continue"
    role: >-
      Кнопка догрузки. Здесь она НЕ СПРЯТАНА - при двадцати пяти строках и
      продолжении.

  form:
    selector: "form.dyn-table-form"
    confidence: observed
    count_observed: 1
    scope: document
    action_observed: "https://funpay.com/users/transactions"
    hidden_fields_observed: 3
    role: >-
      Форма догрузки. Три скрытых поля - той же формы, что у догрузки отзывов:
      у первого значение из восьми цифр, у второго на этой странице девять цифр,
      третье пусто.

      ИМЕНА ПОЛЕЙ В СНИМКЕ ЗАМАСКИРОВАНЫ, и по нему их не собрать. Наблюдены
      они запросом - см. раздел request ниже.

  request:
    observed: true
    observed_at: "2026-08-24"
    evidence_kind: network
    evidence_note: >-
      Наблюдение сетевое: имена полей формы в скелете замаскированы подписями, и
      снять их разметкой нельзя было в принципе.

      Само наблюдение НЕ СОХРАНЕНО. Ответ на догрузку - это разметка, а сборщик
      разобрал её как форму: знак равенства есть в каждом атрибуте, ключами
      стали куски HTML, и вместе с ними записались настоящие суммы операций.
      Файл удалён, сборщик починен с обеих сторон.

      Имена полей при этом наблюдены и не чувствительны - они и записаны здесь.

    method: POST
    url: "https://funpay.com/users/transactions"
    encoding: application/x-www-form-urlencoded
    request_headers: [accept, content-type, x-requested-with]
    shapes_source: >-
      Запись сетевого наблюдения, а не снимок. По репозиторию не проверяется -
      сетевого наблюдения там нет по устройству формата, - и по observations/
      тоже: файл удалён из-за утечки, случившейся при его разборе.

      Формы значений записаны здесь потому, что имена полей и длины ничего не
      сообщают о владельце счёта. Сами значения не записаны нигде.

    fields:
      user_id:
        shapes_source: Запись сетевого наблюдения, не снимок. Значения не записаны нигде.
        observed_shapes: ["восемь цифр"]
        role: Владелец счёта. Та же форма, что у идентификатора человека.
      continue:
        shapes_source: Запись сетевого наблюдения, не снимок. Значения не записаны нигде.
        observed_shapes: ["девять цифр"]
        role: >-
          Курсор догрузки. Девять цифр - та же форма, что у идентификатора
          операции.

          Что именно за значение туда кладут - НЕ НАБЛЮДЕНО. В скрытом поле
          формы на снимке стоит девятизначное значение, совпадающее с
          идентификатором ВТОРОЙ строки таблицы, а не первой и не последней.
          Объяснения этому нет, и придумывать его незачем: поле берётся из формы
          как есть.
      filter:
        observed_value: пусто
        role: >-
          Отбор по состоянию. На снимке пуст; фильтр над таблицей предлагает
          четыре значения, но их имена - локализованный текст.

    response: >-
      РАЗМЕТКА, а не JSON. Готовые строки таблицы, которые страница дописывает к
      существующим.

      Разбирать её предстоит тем же правилом, что и строки первой страницы:
      разметка та же. Проверить это по наблюдению нельзя - оно не сохранено.

    same_form_for_reviews: >-
      У догрузки отзывов форма той же формы: три скрытых поля, адрес
      /users/reviews. Что имена полей там те же - НЕ НАБЛЮДЕНО, а выведено из
      одинакового строения. Наблюдение одного запроса догрузки отзывов
      подтвердило бы это прямо.

  what_hidden_means:
    observed: true
    means: Догружать больше нечего.
    evidence: [account-balance.logged.ru, user.logged.ru]
    how: >-
      Контрольная пара между двумя страницами одного виджета:

        отзывы, показаны все шесть          -> кнопка С классом hidden
        операции, двадцать пять и есть ещё  -> кнопка БЕЗ класса hidden

      Виджет один и тот же, dyn-table; класс один и тот же; форма догрузки у
      обеих страниц одной формы. Два случая разошлись ровно так, как
      предсказывало объяснение «спрятана, когда догружать нечего».

    limit: >-
      Пара снята с РАЗНЫХ страниц. Обратное объяснение требует, чтобы один и тот
      же класс на одном и том же виджете означал разное в двух местах - это
      возможно, но требует большего.

      Пара на одной странице подтвердила бы вывод прямо.

