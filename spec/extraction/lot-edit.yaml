# Форма правки предложения: /lots/offerEdit?node={n}&offer={n}.
#
# Страница, ради которой три операции записи над лотами стояли ненаписанными.
# Снята 30.08.2026, и снята ЧТЕНИЕМ - ни одна запись на площадке для этого не
# понадобилась.
#
# КАК ОНА ОТКРЫЛАСЬ. Не походом на площадку, а починкой двух правил скелета.
# Имя метода в адресе маскировалось как идентификатор - у браузерного сборщика
# исключение для него было с 24.08.2026, у питона не было. Имена полей формы
# маскировались как всякое значение атрибута.
#
# Оба правила чинятся чтением, и оба чинились ради одного: не платить настоящей
# записью на чужом аккаунте за сведения, которые лежат в разметке.

form:
  selector: "form.form-offer-editor"
  confidence: observed
  count_observed: 1
  evidence: lot-edit.logged.ru
  # Адрес объявляется ЗДЕСЬ, а не блоком attributes. Блок attributes собирают
  # ворота имён атрибутов, и они требуют, чтобы имя искалось на снимке через
  # порождённый словарь. Этот файл не порождается: он описывает форму, а не
  # правило извлечения.
  endpoint_carrier: action
  endpoint_observed_value: "https://funpay.com/lots/offerSave"
  endpoint_role: >-
    Адрес сохранения. Записывается ДОСЛОВНО: это имя метода, а не
    идентификатор, и правило маскирования его пропускает - см. заметку о
    расхождении двух реализаций в шапке.

# --- Поля формы --------------------------------------------------------------
#
# Имена наблюдены дословно, значения НЕ наблюдены и наблюдаться не будут: в них
# цена, краткое и подробное описание лота и сообщение покупателю после оплаты.
fields:
  currency_symbol:
    selector: ".form-control-feedback"
    reads: text
    scope: document
    confidence: observed
    count_observed: 1
    evidence: lot-edit.logged.ru
    role: >-
      Знак валюты рядом с полем цены. Читается ЗНАКОМ, а не кодом: кода на
      странице нет, и перевод знака в код делает общая таблица - та же, что у
      списка продаж.

  csrf_token:
    confidence: observed
    evidence: lot-edit.logged.ru
    shape_in_prose: Шестнадцать знаков латиницы с цифрами - та же форма, что у токена канала.
    role: Защитный токен. Берётся из этой же формы, а не из настроек страницы.

  form_created_at:
    confidence: observed
    evidence: lot-edit.logged.ru
    shape_in_prose: Десять цифр.
    role: >-
      Метка времени сборки формы, по виду - секунды эпохи.
    what_is_not_known: >-
      Что площадка с ней делает. Правдоподобно, что это защита от повторной
      отправки старой формы, но проверить это чтением нельзя, а провоцировать
      отказ ради проверки - нельзя тем более.

      Для реализации это означает одно: поле обязано уходить тем значением,
      которое пришло со страницей. Придумать его нельзя.

  offer_id:
    confidence: observed
    evidence: lot-edit.logged.ru
    shape_in_prose: Восемь цифр.
    role: Предложение, которое правится.

  node_id:
    confidence: observed
    evidence: lot-edit.logged.ru
    shape_in_prose: Четыре цифры.
    role: Раздел, в котором лежит предложение.

  location:
    confidence: observed
    evidence: lot-edit.logged.ru
    role: Пустое на снимке. Назначение не установлено.

  deleted:
    confidence: observed
    evidence: lot-edit.logged.ru
    role: >-
      Пустое на снимке. Рядом с ним в форме стоит кнопка js-btn-delete, и
      правдоподобно, что удаление идёт этим же адресом с этим полем.
    why_it_is_not_declared_an_operation: >-
      Правдоподобно - не наблюдено. Удаление лота необратимо, и объявлять
      операцию по догадке о поле здесь дороже, чем где бы то ни было.

  price:
    confidence: observed
    evidence: lot-edit.logged.ru
    shape_in_prose: Пять знаков из цифр и пунктуации.
    role: Цена. Значение не наблюдено.

  active:
    confidence: observed
    evidence: lot-edit.logged.ru
    read_by: presence_of_checked
    role: >-
      ПРИЗНАК ВКЛЮЧЁННОСТИ ЛОТА, и это главная находка снимка.
    why_it_matters: >-
      Признака показа лота в выдаче в проекте не было НИ ОДНОГО. Модель Lot
      требует is_active обязательным, и потому со страницы своих лотов не
      собиралась вовсе: там его нет, и объявить его выдумкой значило бы сказать
      продавцу «лот скрыт» о показанном либо наоборот.

      Он есть здесь. Читается НАЛИЧИЕМ пометки checked у флажка - на снимке она
      стоит, и лот вправду показан.
    the_price_of_reading_it: >-
      Одно предложение - одна страница. Признак лежит на форме правки, а форма
      правки одна на лот: у продавца с двумя сотнями лотов это две сотни
      запросов.

      Поэтому чтение своих лотов списком его по-прежнему не отдаёт, и это не
      упущение, а цена.

  deactivate_after_sale:
    confidence: observed
    evidence: lot-edit.logged.ru
    read_by: presence_of_checked
    role: Выключать ли лот после продажи. На снимке помечен checked.
    paired_hidden_field: >-
      Поле объявлено ДВАЖДЫ: скрытым и флажком, с одним именем. Обычный приём
      для логического поля - скрытое даёт значение при снятом флажке.

      У active такой пары НЕТ, и это различие наблюдено, а не выведено. Что оно
      означает для запроса - не установлено: снятого флажка никто не видел.

  fields_summary:
    name: "fields[summary][ru], fields[summary][en]"
    confidence: observed
    evidence: lot-edit.logged.ru
    role: Краткое описание, по одному на язык. Показывается прямо в таблице.

  fields_desc:
    name: "fields[desc][ru], fields[desc][en]"
    confidence: observed
    evidence: lot-edit.logged.ru
    role: Подробное описание, по одному на язык.

  fields_payment_msg:
    name: "fields[payment_msg][ru], fields[payment_msg][en]"
    confidence: observed
    evidence: lot-edit.logged.ru
    role: >-
      Сообщение покупателю после оплаты. То самое, чем площадка выдаёт товар
      сама, без участия продавца.
    what_it_means_for_auto_delivery: >-
      У площадки есть СВОЯ выдача, и она устроена так: текст лежит в лоте и
      отправляется покупателю после оплаты.

      Это стоит знать тому, кто пишет автовыдачу поверх Funora: для простого
      случая - один лот, один неизменный текст - она уже есть, и писать бота
      незачем.

  fields_images:
    name: "fields[images]"
    confidence: observed
    evidence: lot-edit.logged.ru
    role: Картинки лота. Пустое на снимке.

# --- Сам запрос сохранения ---------------------------------------------------
#
# Наблюдён 31.08.2026. Сохранение сделано СВОИМИ ЖЕ значениями: форма отправлена
# без единой правки поля, и отпечатки всех значений до и после совпали.
save_request:
  observed: true
  observed_at: "2026-08-31"
  evidence: [network.lot-save-form]
  method: POST
  path: /lots/offerSave
  it_navigates: >-
    Отправка уходит ПЕРЕХОДОМ, а не запросом из страницы. Для сборщика это
    значило, что запроса не существует вовсе: он перехватывает fetch и
    XMLHttpRequest, а браузер уходит на новый адрес сам.

    Первое наблюдение так и потерялось - запись велась, кнопка нажата, страница
    ушла, а в записи оказался один фоновый опрос канала.
  fields_sent:
    - active
    - csrf_token
    - deactivate_after_sale
    - deleted
    - fields[desc][en]
    - fields[desc][ru]
    - fields[images]
    - fields[payment_msg][en]
    - fields[payment_msg][ru]
    - fields[summary][en]
    - fields[summary][ru]
    - form_created_at
    - location
    - node_id
    - offer_id
    - price
  checkbox_value: >-
    Отмеченный флажок уходит значением из двух знаков латиницы - то есть «on»,
    как принято у форм. Наблюдено у обоих флажков.
  what_an_unchecked_flag_does_is_still_unknown: >-
    Снятого флажка никто не видел. По устройству форм он не уходит вовсе, но
    это рассуждение, а не наблюдение, и на нём стоит различие между «выключить
    лот» и «не трогать лот».

    У deactivate_after_sale есть скрытый близнец с тем же именем - он-то и даёт
    значение при снятом флажке. У active близнеца НЕТ. Что это значит для
    выключения лота, наблюдением не закрыто.
  the_answer_is_a_redirect: >-
    Успех виден переходом на /lots/{node}/trade - список своих предложений
    раздела. Тела ответа страница не получает: его забирает браузер.

    Это и есть ответ на вопрос, ради которого сохранение делалось. Отличить
    успех от отказа можно: успех уводит на список, и адрес после отправки
    наблюдаем.
  what_a_refusal_looks_like_is_unknown: >-
    Отказа никто не видел, и добиваться его нарочно нельзя.
  a_limitation_of_the_record_itself: >-
    Поле с ОДНИМ именем, объявленное дважды, попало в запись однажды: сборщик
    складывает поля в словарь, и второе значение вытесняет первое.

    Видно это на deactivate_after_sale: в форме он и скрытый, и флажок, а в
    записи один. Для чтения записи это значит, что о скрытом близнеце она не
    свидетельствует - свидетельствует о нём снимок страницы.

# --- Чего снимок НЕ даёт -----------------------------------------------------
what_is_still_missing:
  the_request_itself: >-
    Форма наблюдена, ЗАПРОС нет. Неизвестно, чем площадка отвечает на
    сохранение, как выглядит отказ и в каком виде уходит флажок при снятой
    пометке.

    Снять это можно только настоящим сохранением лота, то есть записью. Решает
    её владелец аккаунта, а не реализация: правка чужого лота необратима в том
    смысле, что прежнего текста нам никто не вернёт.
  what_this_means_for_the_operations: >-
    lots.update_price, lots.activate и lots.deactivate стали ЗНАЧИТЕЛЬНО ближе:
    адрес известен, имена полей известны, носитель состояния известен.

    Ненаписанными они остаются по одной причине - неизвестен ответ. Операция
    записи, не умеющая отличить успех от отказа, хуже отсутствующей: она
    сообщает об успехе всегда.
