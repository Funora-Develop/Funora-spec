# Извлечение отзывов с профиля продавца.
#
# ОТКУДА ВЗЯЛОСЬ. Ни одного нового похода на площадку этот файл не стоил.
# Снимок /users/{id}/ лежал в observations/ с 23.08.2026, снятый ради другого -
# ради идентификатора аккаунта, - и всё это время в нём лежали шесть полных
# отзывов с адресуемой разметкой. Перечень нужных наблюдений при этом требовал
# снять reviews.logged.ru, потому что «службы отзывов нет вовсе: наблюдение
# покажет, что там есть».
#
# Мораль записана здесь, а не в заметках: прежде чем идти на площадку, надо
# перечитать то, что уже снято. Страница отдаёт целиком всё, что на ней есть, а
# снимали её ради одного поля.

# Собственной версии у файла нет нарочно. Настоящая ось одна и живёт в
# spec/version.yaml, раздел single_version_axis.

evidence: user.logged.ru

sources:
  profile:
    path: /users/{id}/
    evidence: user.logged.ru
    note: >-
      Снимок сделан с СОБСТВЕННОГО профиля: на нём есть редактор аватара,
      которого на чужом не будет. Для разбора отзывов это безразлично - вся
      разметка отзыва лежит внутри таблицы и от владельца не зависит, - но
      утверждать это про чужой профиль нельзя, пока чужой не снят.

# --- Таблица отзывов ---------------------------------------------------------
# Отзывы едут на той же машинерии, что и список продаж: dyn-table. Классы
# контейнеров те же самые, и это не совпадение - площадка переиспользует виджет.
table:
  selector: ".dyn-table"
  confidence: observed
  count_observed: 1
  scope: document
  note: >-
    Внешний контейнер. На профиле он один и содержит только отзывы: собственные
    лоты продавца лежат вне его, в четырнадцати блоках .offer.

rows_container:
  selector: ".dyn-table-body"
  confidence: observed
  count_observed: 1
  scope: document
  note: >-
    Контейнер строк. Тот же класс, что у списка продаж, и та же роль: по нему
    считают, все ли строки найдены.

# --- Строка отзыва -----------------------------------------------------------
row:
  selector: ".review-item"
  confidence: observed
  count_observed: 6
  scope: document

  wrapper:
    selector: ".review-container"
    confidence: observed
    count_observed: 6
    scope: document
    note: >-
      Имя обманывает: это НЕ обёртка всего списка, а обёртка ОДНОГО отзыва. Их
      шесть, ровно по числу отзывов, и каждая содержит ровно один .review-item.
      Разбор, принявший её за контейнер списка, нашёл бы один отзыв из шести и
      объявил бы чтение полным.

fields:

  rating:
    selector: ".review-item-rating .rating > div"
    confidence: observed
    count_observed: 2
    scope: row
    reads: class
    type: x-funora-plain
    role: >-
      Оценка стоит в ИМЕНИ КЛАССА, а не в тексте: div.rating5 значит пять
      звёзд. Текста у узла нет вовсе.

    value_from_class_suffix:
      pattern: "^rating([1-5])$"
      enum_is_closed: true
      note: >-
        Все пять значений наблюдены на одной странице. Пятое - на самих отзывах
        (все шесть пятизвёздочные), остальные четыре - в выпадающем списке
        фильтра, где площадка сама перечисляет уровни от одного до пяти внутри
        span.review-rating. Перечисление закрыто именно поэтому: не по догадке о
        том, что звёзд бывает пять, а по тому, что площадка их перечислила.

    duplicated_by_responsive_layout:
      count_observed: 2
      scope: row
      note: >-
        В строке ДВА узла оценки, а не один: .review-item-rating pull-right
        hidden-xs для широкого экрана и .review-item-rating visible-xs для
        узкого. Значение в них одно и то же. Разбор обязан брать первый и
        сверять со вторым: разошлись - повреждение строки, а не выбор наугад.

  author_name:
    selector: ".media-user-name a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли: шесть
      строк дали четыре разные подписи.
    role: Отображаемое имя автора. Свободный текст, ключом быть не может.

  author_href:
    selector: ".media-user-name a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      author_profile:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/users/{id}/"
    role: >-
      Адрес профиля автора. Идентификатор берётся из него, и это единственное
      место, где контракт разрешает разбирать идентификатор из адреса: форма
      адреса здесь ОБЪЯВЛЕНА, а не угадана.

      Значение остаётся непрозрачной строкой. Восемь цифр наблюдены, но их число
      площадка не обещала, и приводить к числу запрещено.

  order_href:
    selector: ".review-item-order a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      order_link:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/orders/{id}/"
    role: >-
      Адрес заказа, к которому отзыв относится. Связывает отзыв с продажей -
      единственный ключ, по которому отзыв можно сопоставить с записью списка
      продаж.

  text:
    selector: ".review-item-text"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли: шесть
      строк дали четыре разные подписи.
    role: >-
      Текст отзыва. Присутствует у всех шести наблюдённых; отзыв БЕЗ текста не
      наблюдался, и объявлять текст обязательным поэтому нельзя.

  date_text:
    selector: ".review-item-date"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли: шесть
      строк дали четыре разные подписи.
    role: >-
      Дата в виде, каком её показали. РАЗБОРУ В МОМЕНТ ВРЕМЕНИ НЕ ПОДЛЕЖИТ:
      тридцать один знак с буквами, цифрами и пунктуацией - это локализованная
      человеческая запись, и её форма меняется вместе с локалью.

      Отдаётся строкой. Строка, которую нельзя разобрать, честнее момента
      времени, угаданного по одной локали из трёх.

  detail_text:
    selector: ".review-item-detail"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли: шесть
      строк дали четыре разные подписи.
    role: >-
      Подпись под отзывом: что купили и почём. Тоже локализована и тоже
      отдаётся строкой.

  author_photo_href:
    selector: ".review-item-photo a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      author_photo:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/users/{id}/"
    role: >-
      Второй адрес профиля автора, на аватаре. Ведёт туда же, куда и имя.
      Объявлен затем, чтобы разбор мог их СВЕРИТЬ: разошлись - разметка
      изменилась, и брать наугад первый попавшийся нельзя.

      Именно на этой ошибке уже спотыкался разбор списка продаж: он брал первый
      [data-href] строки, в снимке их было два, оба вели на одного человека, и
      ошибка не была видна.

# --- Чего на странице НЕТ ----------------------------------------------------
absent:
  seller_reply:
    what: Ответ продавца на отзыв.
    evidence_of_absence: user.logged.ru
    how_checked: >-
      Перебор всех значений class на странице: ни одного, содержащего reply,
      answer или подобное. Ноль узлов, а не «не нашли селектор».
    consequence: >-
      Поля ответа в модели нет. Появится оно только вместе со снимком, где
      ответ есть, - а не по догадке, что ответы бывают.

  pagination:
    what: Управление постраничным выводом либо кнопка «показать ещё».
    evidence_of_absence: user.logged.ru
    how_checked: >-
      Перебор классов по образцу more|pagin|load|next|prev - ни одного
      совпадения внутри таблицы отзывов.
    consequence: >-
      Полнота чтения означает «прочитаны все строки, которые страница отдала», а
      НЕ «прочитаны все отзывы продавца». Разница записана в реестр
      неисполненного как reviews_page_totality: у продавца с шестью отзывами она
      нулевая, у продавца с шестью сотнями - неизвестна.

  total_count:
    what: Проверяемое число отзывов, с которым можно сверить длину списка.
    evidence_of_absence: user.logged.ru
    how_checked: >-
      В шапке профиля есть .rating-full-count со ссылкой на якорь #reviews, но
      содержимое её - локализованный текст в две строки (подписи T7:cds и T7:c).
      Вытащить оттуда число значило бы разбирать человеческую запись.
    consequence: >-
      Сверить длину списка не с чем. Это и есть причина, по которой полнота
      здесь слабее, чем у списка продаж.

# --- Фильтр ------------------------------------------------------------------
filter:
  selector: ".reviews-filter"
  confidence: observed
  count_observed: 1
  scope: document
  note: >-
    Тот же dyn-table-filter, что у списка продаж. Внутри - выпадающий список с
    пятью уровнями оценки, и он же служит свидетельством закрытости
    перечисления оценок.

  endpoint:
    selector: 'form[action$="/users/reviews"]'
    confidence: observed
    count_observed: 1
    scope: document
    note: >-
      Куда фильтр отправляется. Объявлено как наблюдение, а не как операция:
      фильтрация отзывов в контракте не объявлена и реализована не будет, пока
      не наблюдён её ответ.
