# Извлечение отзывов с профиля продавца.
#
# ОТКУДА ВЗЯЛОСЬ. Ни одного нового похода на площадку этот файл не стоил.
# Снимок /users/{id}/ лежал в observations/ с 23.08.2026, снятый ради другого -
# ради идентификатора аккаунта, - и всё это время в нём лежали шесть полных
# отзывов с адресуемой разметкой. Перечень нужных наблюдений при этом требовал
# снять reviews.logged.ru, потому что «службы отзывов нет вовсе: наблюдение
# покажет, что там есть».
#
# Мораль записана здесь, а не в заметках: прежде чем идти на площадку, надо
# перечитать то, что уже снято. Страница отдаёт целиком всё, что на ней есть, а
# снимали её ради одного поля.

# Собственной версии у файла нет нарочно. Настоящая ось одна и живёт в
# spec/version.yaml, раздел single_version_axis.

evidence: user.logged.ru

sources:
  profile:
    path: /users/{id}/
    evidence: user.logged.ru
    note: >-
      Снимок сделан с СОБСТВЕННОГО профиля: на нём есть редактор аватара,
      которого на чужом не будет. Для разбора отзывов это безразлично - вся
      разметка отзыва лежит внутри таблицы и от владельца не зависит, - но
      утверждать это про чужой профиль нельзя, пока чужой не снят.

# --- Таблица отзывов ---------------------------------------------------------
# Отзывы едут на той же машинерии, что и список продаж: dyn-table. Классы
# контейнеров те же самые, и это не совпадение - площадка переиспользует виджет.
table:
  selector: ".dyn-table"
  confidence: observed
  count_observed: 1
  scope: document
  note: >-
    Внешний контейнер. На профиле он один и содержит только отзывы: собственные
    лоты продавца лежат вне его, в четырнадцати блоках .offer.

rows_container:
  selector: ".dyn-table-body"
  confidence: observed
  count_observed: 1
  scope: document
  note: >-
    Контейнер строк. Тот же класс, что у списка продаж, и та же роль: по нему
    считают, все ли строки найдены.

# --- Строка отзыва -----------------------------------------------------------
row:
  selector: ".review-item"
  confidence: observed
  count_observed: 6
  scope: document

  wrapper:
    selector: ".review-container"
    confidence: observed
    count_observed: 6
    scope: document
    note: >-
      Имя обманывает: это НЕ обёртка всего списка, а обёртка ОДНОГО отзыва. Их
      шесть, ровно по числу отзывов, и каждая содержит ровно один .review-item.
      Разбор, принявший её за контейнер списка, нашёл бы один отзыв из шести и
      объявил бы чтение полным.

fields:

  rating:
    selector: ".review-item-rating .rating > div"
    confidence: observed
    count_observed: 2
    scope: row
    reads: class
    type: x-funora-plain
    role: >-
      Оценка стоит в ИМЕНИ КЛАССА, а не в тексте: div.rating5 значит пять
      звёзд. Текста у узла нет вовсе.

    value_from_class_suffix:
      pattern: "^rating([1-5])$"
      enum_is_closed: true
      note: >-
        Все пять значений наблюдены на одной странице. Пятое - на самих отзывах
        (все шесть пятизвёздочные), остальные четыре - в выпадающем списке
        фильтра, где площадка сама перечисляет уровни от одного до пяти внутри
        span.review-rating. Перечисление закрыто именно поэтому: не по догадке о
        том, что звёзд бывает пять, а по тому, что площадка их перечислила.

    duplicated_by_responsive_layout:
      count_observed: 2
      scope: row
      note: >-
        В строке ДВА узла оценки, а не один: .review-item-rating pull-right
        hidden-xs для широкого экрана и .review-item-rating visible-xs для
        узкого. Значение в них одно и то же. Разбор обязан брать первый и
        сверять со вторым: разошлись - повреждение строки, а не выбор наугад.

  # --- Односторонность полей автора -----------------------------------------
  #
  # Наблюдено 30.08.2026 сравнением ДВУХ профилей - своего и чужого.
  # --- Догрузка: адрес и поля наблюдены, правило курсора НЕТ ------------------
  pagination_request:
    observed: true
    observed_at: "2026-08-30"
    evidence: [network.dyn-table-continue]
    endpoint: "POST /users/transactions"
    fields: [continue, filter, user_id]
    shapes_in_prose: >-
      Подписи из записи: continue - девять цифр, user_id - восемь, filter пуст.
      Перечнем не объявляются нарочно: механизм подписей сверяет их со СНИМКОМ
      СТРАНИЦЫ, а эти пришли из записи запроса, и сверять их там не с чем.
    answer_is_markup_not_json: >-
      Ответ - СТРОКА РАЗМЕТКИ, а не JSON: двадцать четыре тысячи знаков строк
      таблицы, которые страница дописывает к уже показанным.

      Это важно для реализации: разбирать ответ надо тем же разбором строки, что
      и саму страницу, а не разбором ответа канала.
    endpoint_is_for_transactions: >-
      Наблюдён адрес операций по балансу. У отзывов форма догрузки объявляет
      СВОЙ адрес - form[action$="/users/reviews"], - и он на странице виден.
      Одинаково ли устроены оба, НЕ НАБЛЮДАЛОСЬ: совпадение имени механизма
      совпадением протокола не является.
    what_continue_is_not:
      observed: true
      observed_at: "2026-08-30"
      evidence: [account-balance.logged.ru]
      what: >-
        Значение continue - НЕ идентификатор последней показанной строки.
      how_it_was_established: >-
        Снимок страницы баланса несёт двадцать пять строк с data-transaction и
        форму догрузки после них. Формат снимка нумерует ОДИНАКОВЫЕ значения
        одним номером, и номер значения в форме совпал с номером ВТОРОЙ строки,
        а не двадцать пятой.
      why_it_matters: >-
        Наивная реализация берёт идентификатор последней строки - это первое,
        что приходит в голову, и это противоречит наблюдению. Ошибка тихая:
        догрузка вернёт не тот кусок, и часть строк пропадёт либо повторится, а
        отказа не будет.
      what_is_still_unknown: >-
        ЧЕМ значение является - не установлено. Совпадение со второй строкой по
        одному снимку не правило: строки могли идти не в порядке
        идентификаторов, и наименьший мог оказаться вторым.

        Установить можно только парным наблюдением: страница и запрос догрузки в
        одной записи, чтобы сравнить значение поля с идентификаторами строк
        напрямую. До тех пор операция не пишется.

  fields_only_on_your_own_profile:
    observed: true
    observed_at: "2026-08-30"
    evidence: [user.logged.ru, user-foreign.logged.ru]
    what: >-
      На ЧУЖОМ профиле отзывы анонимны. Имени автора, ссылки на его профиль,
      ссылки на его фото и ссылки на заказ там нет ни у одного отзыва.
    counted: >-
      На своём профиле шесть отзывов, и у всех шести есть все четыре поля. На
      чужом двадцать пять отзывов, и ни у одного нет ни одного из четырёх.
      Совпадение полное и в обе стороны.
    the_trap_it_closes: >-
      Единственный узел .media-user-name a на чужой странице ЕСТЬ - и лежит он в
      шапке виджета переписки, то есть это имя САМОГО ПРОДАВЦА, а не автора
      отзыва.

      Разбор, ищущий автора по документу, взял бы его и приписал каждому отзыву
      имя того, кому отзыв написан. Ошибка правдоподобная: поле заполнено,
      отказа нет, имя настоящее.

      Спасает область row, объявленная у поля. Она объявлена не случайно, но до
      этого наблюдения проверялась только там, где обе трактовки совпадают.
    consequence: >-
      Операция reviews.get читает ЛЮБОЙ профиль, и у чужого эти поля выходят
      ненаблюдёнными. Это не поломка разбора и не смена разметки: так устроена
      площадка.

      Вызывающий обязан различать пустое и ненаблюдённое - иначе он объявит
      анонимным отзыв, автор которого просто не показан посторонним.

  author_name:
    selector: ".media-user-name a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли. Разных
      подписей у шести строк оказалось: у имени автора пять, у текста шесть, у
      подписи под отзывом четыре, у даты две. «Четыре разные подписи» стояло
      здесь во всех четырёх копиях оговорки - число я взял не считая.
    role: Отображаемое имя автора. Свободный текст, ключом быть не может.

  author_href:
    selector: ".media-user-name a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      author_profile:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/users/{id}/"
    role: >-
      Адрес профиля автора. Идентификатор берётся из него, и это единственное
      место, где контракт разрешает разбирать идентификатор из адреса: форма
      адреса здесь ОБЪЯВЛЕНА, а не угадана.

      Значение остаётся непрозрачной строкой. Восемь цифр наблюдены, но их число
      площадка не обещала, и приводить к числу запрещено.

  order_href:
    selector: ".review-item-order a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      order_link:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/orders/{id}/"
    role: >-
      Адрес заказа, к которому отзыв относится. Связывает отзыв с продажей -
      единственный ключ, по которому отзыв можно сопоставить с записью списка
      продаж.

  text:
    selector: ".review-item-text"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли. Разных
      подписей у шести строк оказалось: у имени автора пять, у текста шесть, у
      подписи под отзывом четыре, у даты две. «Четыре разные подписи» стояло
      здесь во всех четырёх копиях оговорки - число я взял не считая.
    role: >-
      Текст отзыва. Присутствует у всех шести наблюдённых; отзыв БЕЗ текста не
      наблюдался, и объявлять текст обязательным поэтому нельзя.

  date_text:
    selector: ".review-item-date"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли. Разных
      подписей у шести строк оказалось: у имени автора пять, у текста шесть, у
      подписи под отзывом четыре, у даты две. «Четыре разные подписи» стояло
      здесь во всех четырёх копиях оговорки - число я взял не считая.
    role: >-
      Дата в виде, каком её показали. РАЗБОРУ В МОМЕНТ ВРЕМЕНИ НЕ ПОДЛЕЖИТ:
      тридцать один знак с буквами, цифрами и пунктуацией - это локализованная
      человеческая запись, и её форма меняется вместе с локалью.

      Отдаётся строкой. Строка, которую нельзя разобрать, честнее момента
      времени, угаданного по одной локали из трёх.

  detail_text:
    selector: ".review-item-detail"
    confidence: observed
    count_observed: 1
    scope: row
    reads: text
    type: x-funora-plain
    varies_across_rows: >-
      Подписи здесь нет НАРОЧНО. Подпись означает «во всех наблюдённых узлах
      значение выглядело так», а у свободного текста оно у каждой строки своё.
      Первая редакция объявила подпись первой строки, и ворота её сняли. Разных
      подписей у шести строк оказалось: у имени автора пять, у текста шесть, у
      подписи под отзывом четыре, у даты две. «Четыре разные подписи» стояло
      здесь во всех четырёх копиях оговорки - число я взял не считая.
    role: >-
      Подпись под отзывом: что купили и почём. Тоже локализована и тоже
      отдаётся строкой.

  author_photo_href:
    selector: ".review-item-photo a"
    confidence: observed
    count_observed: 1
    scope: row
    reads: attribute

    attributes:
      author_photo:
        name: href
        confidence: observed
        evidence: user.logged.ru
    observed_shape: "https://funpay.com/users/{id}/"
    role: >-
      Второй адрес профиля автора, на аватаре. Ведёт туда же, куда и имя.
      Объявлен затем, чтобы разбор мог их СВЕРИТЬ: разошлись - разметка
      изменилась, и брать наугад первый попавшийся нельзя.

      Именно на этой ошибке уже спотыкался разбор списка продаж: он брал первый
      [data-href] строки, в снимке их было два, оба вели на одного человека, и
      ошибка не была видна.

# --- Догрузка ----------------------------------------------------------------
# РАЗДЕЛ ЗАВЕДЁН ПОСЛЕ ОШИБКИ, и ошибка стоит того, чтобы её записать.
#
# 24.08.2026, за несколько часов до этой записи, тот же файл утверждал: узлов
# управления постраничным выводом на странице нет ни одного. Основанием был
# перебор классов по образцу more|pagin|load|next|prev, не давший совпадений.
#
# Узлы есть. Они стоят сразу за таблицей отзывов и названы иначе: форма
# dyn-table-form и кнопка dyn-table-continue - то же семейство dyn-table, что у
# самой таблицы. Образец искал слова, которых площадка не употребляет.
#
# Отсутствие было объявлено ПО НЕУДАЧЕ ПОИСКА. Это ровно то, что правило
# проекта запрещает делать с возможностями, и запрет распространяется на
# разметку по той же причине: неудача поиска говорит о том, кто искал, а не о
# том, что искали.
pagination:
  form:
    selector: "form.dyn-table-form"
    confidence: observed
    count_observed: 1
    scope: document
    evidence: user.logged.ru
    action_observed: "https://funpay.com/users/reviews"
    hidden_fields_observed: 3
    role: >-
      Форма догрузки. Три скрытых поля; у первого наблюдено значение из восьми
      цифр - по длине это идентификатор продавца, но соответствие не проверялось
      и утверждать его нельзя.

      Имена полей в снимке замаскированы подписями: формат скелета хранит
      дословно class, name и type у ЭЛЕМЕНТОВ, но значения атрибута name у
      скрытых полей формы под это правило не подпадают. Собрать запрос догрузки
      по снимку нельзя.

  continue_button:
    selector: "button.dyn-table-continue"
    confidence: observed
    count_observed: 1
    scope: document
    evidence: user.logged.ru
    observed_classes: "btn btn-default btn-block margin-top dyn-table-continue hidden"
    role: >-
      Кнопка догрузки. На наблюдённом снимке несёт класс hidden.

  what_hidden_means:
    observed: true
    means: Догружать больше нечего.
    evidence: [user.logged.ru, account-balance.logged.ru]
    how: >-
      Контрольная пара нашлась между двумя страницами одного виджета, и нашлась
      сама - отдельного наблюдения ради неё не делалось.

        отзывы, показаны все шесть          -> кнопка С классом hidden
        операции, двадцать пять и есть ещё  -> кнопка БЕЗ класса hidden

      Виджет один и тот же, dyn-table; класс один и тот же; форма догрузки у
      обеих страниц одной формы - три скрытых поля, первое с идентификатором
      владельца. Два случая разошлись ровно так, как предсказывало объяснение
      «спрятана, когда догружать нечего».

    what_this_inference_rests_on: >-
      Пара снята с РАЗНЫХ страниц, и это её слабое место: строго говоря,
      наблюдено, что на одной странице кнопка спрятана, а на другой нет.

      Обратное объяснение требует, чтобы один и тот же класс на одном и том же
      виджете означал разное в двух местах. Это возможно, но требует большего,
      чем объяснение, которое здесь принято.

      Пара на ОДНОЙ странице - профиль с сотнями отзывов - подтвердила бы это
      прямо. Пункт reviews_many из перечня наблюдений оставлен ради неё.

  consequence: >-
    Чтение объявляется полным, когда кнопка догрузки СПРЯТАНА, и неполным,
    когда она показана. Ни то ни другое не выводится из отсутствия узлов:
    решает признак, который наблюдён в обоих своих состояниях.

    Полнота при этом помечается ВЫВЕДЕННОЙ, а не наблюдённой: пара снята с
    разных страниц. Пометка уверенности существует ровно для таких случаев.

# --- Чего на странице НЕТ ----------------------------------------------------
absent:
  seller_reply:
    what: Ответ продавца на отзыв.
    evidence_of_absence: user.logged.ru
    how_checked: >-
      Перебор всех значений class на странице: ни одного, содержащего reply,
      answer или подобное. Ноль узлов, а не «не нашли селектор».
    consequence: >-
      Поля ответа в модели нет. Появится оно только вместе со снимком, где
      ответ есть, - а не по догадке, что ответы бывают.

  total_count:
    what: Проверяемое число отзывов, с которым можно сверить длину списка.
    evidence_of_absence: user.logged.ru
    how_checked: >-
      В шапке профиля есть .rating-full-count со ссылкой на якорь #reviews, но
      содержимое её - локализованный текст в две строки (подписи T7:cds и T7:c).
      Вытащить оттуда число значило бы разбирать человеческую запись.
    consequence: >-
