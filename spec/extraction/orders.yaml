# Извлечение списка заказов со страницы /orders/trade.
#
# Раздел описывает, что со списка заказов можно взять, а чего нельзя. Второе
# здесь важнее первого: список не даёт ни точного времени, ни валюты, поэтому
# полную запись Order из него собрать нельзя, и делать вид, что можно, - худший
# из вариантов. Неполная запись, выданная за полную, приводит к тому, что
# обработчик принимает решение по значению, которого никто не наблюдал.

version: "0.1.0"

# Снимок по умолчанию для всего файла. Правило, помеченное как наблюдённое,
# ссылается сюда, если не указало свой собственный.
evidence: orders-trade.logged.ru

source:
  path: /orders/trade
  requires_session: true
  evidence: orders-trade.logged.ru

# --- Контейнер и строка -----------------------------------------------------
container:
  selector: ".orders-table"
  confidence: observed
  evidence: orders-trade.logged.ru
  note: >-
    Адресуется по назначению, а не по оформлению. У элемента есть и классы вида
    table-hover, но они описывают внешний вид и меняются вместе с темой.

  header:
    selector: ".tc-header"
    confidence: observed
    count_observed: 1
    why_it_matters: >-
      Заголовок таблицы несёт те же классы ячеек, что и строки. Селектор
      .tc-price по всей странице находит четыре элемента при трёх заказах:
      четвёртый - заголовок. Поэтому все поля ищутся строго внутри строки, а не
      по документу.

row:
  selector: "a.tc-item"
  confidence: observed
  count_observed: 3
  evidence: orders-trade.logged.ru
  is_link: true
  href_shape: "https://funpay.com/orders/{n}/"
  note: >-
    Строка сама является ссылкой на заказ. Идентификатор заказа берётся из
    адреса, а не из текста.

  status_modifier:
    where: Второй класс элемента строки
    observed_value: info
    confidence: observed
    note: >-
      Наблюдалось единственное значение при трёх заказах в одном состоянии.
      Соответствие остальных модификаторов статусам неизвестно.

# --- Поля -------------------------------------------------------------------
# Все селекторы применяются внутри строки.
fields:
  order_id:
    from: Адрес строки
    selector: "self[href]"
    extract: Последний сегмент пути после /orders/
    charset: Латинские буквы в верхнем регистре и цифры
    example_shape: 8 знаков
    confidence: observed
    type: entity_id
    required: true
    warning: >-
      Идентификатор НЕ числовой. Прежняя формулировка называла его числовым
      сегментом, и реализация, прочитавшая её буквально, написала бы \d+ и не
      нашла бы ни одного заказа: наблюдённые идентификаторы состоят из латинских
      букв и цифр вперемешку. Скелет этого не показывал - маска сегмента с
      цифрами одинакова для 12345 и для QN2CW7HY, - и ошибка держалась до тех
      пор, пока страницу не прочитал человек.

  order_number_text:
    selector: ".tc-order"
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    note: >-
      Видимый номер заказа. Совпадает ли он с идентификатором из адреса, не
      проверялось: скелет прячет оба значения.

  description:
    selector: ".order-desc"
    confidence: observed
    count_observed: 1
    type: x-funora-plain

  counterparty_name:
    selector: ".tc-user .media-user-name"
    confidence: observed
    count_observed: 1
    type: x-funora-plain

  counterparty_link:
    selector: ".tc-user [data-href]"
    confidence: observed
    count_observed: 2
    note: >-
      Ссылка на профиль лежит в data-href, а не в href: у элемента обычного
      href нет вовсе. Разбор, ищущий ссылки только по a[href], пользователя не
      найдёт. Элементов два - изображение и подпись, - и ведут они в одно место.
      Селектор ограничен ячейкой контрагента намеренно: по всей строке первым
      мог бы оказаться data-href из описания лота, и контрагентом молча стал бы
      адрес товара.

  counterparty_online:
    selector: ".tc-user .media-user"
    read: Модификатор класса
    confidence: observed
    vocabulary:
      online: true
      offline: false
    evidence: orders-trade.states.logged.ru
    count_observed: 8
    note: >-
      Признак структурный. Соседний .media-user-status содержит локализованный
      текст и для разбора непригоден: наблюдалось «онлайн» против «был N назад»,
      и второе зависит и от языка, и от давности.
    normative: >-
      Перечень значений закрыт по наблюдению, но НЕ по умолчанию. Класс online
      даёт true, класс offline даёт false, любой другой либо отсутствие обоих -
      ненаблюдённое значение с причиной presence_marker_not_recognised.

      Вывод по отрицанию запрещён. Правило «нет offline, значит online»
      выглядит работающим ровно до переименования класса: переименуй площадка
      offline в is-offline - и каждый контрагент молча стал бы присутствующим,
      без повреждения и без способа об этом узнать. Именно поэтому положительное
      значение ждало собственного наблюдения, а не выводилось.

      Ненаблюдённость здесь не повреждение поля: она отражает границу словаря, а
      не поломку разметки, и в defects не попадает.
    history: >-
      До снимка orders-trade.states.logged.ru наблюдался только offline, и
      признак был односторонним. Снимок сделан в момент, когда трое покупателей
      были в сети, и дал оба класса разом: 5 offline и 3 online.

  status:
    carriers:
      - selector: ".tc-status"
        read: Цветовой класс ячейки
        values: [text-primary, text-success]
      - selector: "self"
        read: Модификатор строки
        values: [info, ""]
    confidence: observed
    evidence: orders-trade.states.logged.ru
    count_observed: 8
    enum_is_closed: false
    unknown_fallback: required
    rationale: >-
      Носителей два, оба структурные, оба локализации не подвержены. В снимке
      они совпали во всех восьми строках, и это свойство надо использовать, а не
      выбрасывать: два независимых носителя ловят переименование любого из них.
      Согласись реализация читать только один - и смена вёрстки поменяла бы
      ответ молча.
    normative: >-
      Читаются ОБА носителя. Совпали - значение выдаётся с уверенностью
      observed. Разошлись - значение ненаблюдённое с причиной
      status_carriers_disagree и повреждение уровня поля: расхождение означает,
      что разметка изменилась, и любой из двух ответов может быть неверным.

      Перечисление остаётся открытым. Наблюдались два состояния из скольких-то;
      носитель, которого нет в таблице, даёт ненаблюдённое значение с причиной
      status_carrier_not_mapped, а НЕ unknown.

  amount_text:
    selector: ".tc-price"
    scope: row
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    warning: >-
      Только внутри строки. По документу селектор находит и заголовок таблицы.

  seller_sum_text:
    selector: ".tc-seller-sum"
    scope: row
    confidence: observed
    count_observed: 1
    type: x-funora-plain

  time_text:
    selectors: [".tc-date-time", ".tc-date-left"]
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    exact_time: not_observed
    rationale: >-
      Машиночитаемого времени на странице нет: ни datetime, ни title, ни
      data-time. Существует только локализованный текст. Правило разбора времени
      описано в rules.yaml.

# --- Соответствие носителей статуса статусам --------------------------------
# Раздел намеренно пуст. Пустота здесь содержательнее любого заполнения.
status_mapping:
  each_entry_requires: [cell_class, row_class, status, evidence]

  entries:
    - cell_class: text-primary
      row_class: info
      status: paid
      display_ru: Оплачен
      evidence: orders-trade.states.logged.ru
      count_observed: 5
      meaning: >-
        Покупатель оплатил, деньги удерживает площадка, сделка не завершена.
        Это состояние, в котором продавец обязан выдать товар.

    - cell_class: text-success
      row_class: ""
      status: closed
      display_ru: Закрыт
      evidence: orders-trade.states.logged.ru
      count_observed: 3
      meaning: >-
        Сделка завершена, удержание снято. Дальнейших действий продавца не
        требует.

  how_it_was_established: >-
    Четырьмя независимыми свидетельствами, а не одним. Первое: два структурных
    носителя - класс ячейки и модификатор строки - совпали во всех восьми
    строках. Второе: подписи текста разошлись ровно там же, T7:c против T6:c.
    Третье: длины совпадают со словами «Оплачен» (7 букв) и «Закрыт» (6 букв)
    без остатка. Четвёртое: человек прочитал страницу и назвал оба слова вместе
    с цветом.

    Ни одного из четырёх по отдельности не хватило бы. Цвет success сам по себе
    ничего не значит: догадка «зелёное значит завершено» осталась бы догадкой.

  enum_is_open: true
  why_open: >-
    Наблюдались два состояния. Возврат, спор и отказ существуют - продавец их
    видел, - но в снимок не попали, и носителей для них никто не видел.
    Закрыть перечисление по двум наблюдениям значило бы отвергать остальные
    состояния как ошибочные.

  unmapped_carrier: >-
    Носитель, которого нет в таблице, даёт ненаблюдённое значение с причиной
    status_carrier_not_mapped, а НЕ unknown.

  why_not_unknown: >-
    Разница решает, соврёт реализация или нет. Запасное значение unknown в
    модели отвечает на случай «площадка показала статус, которого мы не знаем».
    У нас другой случай: не наблюдалось само соответствие. Выдать unknown значит
    утверждать, что статус прочитан и не опознан, тогда как он не прочитан вовсе.

  consequence: >-
    Список заказов отвечает на вопрос «оплачен ли заказ» для двух состояний из
    скольких-то. Это ровно тот раздел, куда площадка сама отправляет продавцов
    проверять оплату, и ровно то поле, ради которого пишут ботов выдачи.

  caution: >-
    Значение paid означает «площадка показывает состояние оплаты» и ничего
    больше. Оно не заменяет проверку на стороне продавца там, где цена ошибки
    высока, и не является финансовым подтверждением.

# --- Чего список не даёт ----------------------------------------------------
# Раздел существует потому, что молчаливая неполнота опаснее явного отказа.
cannot_be_built_from_list:
  money:
    reason: >-
      Валюта в разметке строки не наблюдалась, а тип money требует кода валюты и
      масштаба. Собрать значение из одной суммы нельзя.
    consequence: >-
      Поле суммы заполняется только текстом для показа. Числовое значение
      остаётся ненаблюдённым.

  exact_time:
    reason: Машиночитаемого времени нет.
    consequence: Поле остаётся ненаблюдённым, а не пустым.

  full_order_record:
    statement: >-
      Полная запись Order из списка не собирается. Список даёт достаточно, чтобы
      обнаружить заказ и его состояние, но не чтобы описать его целиком.
    consequence: >-
      Операция чтения списка возвращает сокращённое представление, отличимое от
      полного по типу. Дополнять его придётся чтением страницы отдельного
      заказа, которая пока не наблюдалась.

# --- Чего не наблюдалось ----------------------------------------------------
not_observed:
  - Страница отдельного заказа
  - >-
    Состояния, кроме оплачен и закрыт. Возврат, спор и отказ существуют, но в
    снимок не попали, и носителей для них никто не видел
  - Разметка постраничной навигации при длинном списке
  - Валюта в явном виде
  - Пустой список заказов и его отличие от сломанного селектора
  - >-
    Совпадает ли видимый номер заказа с идентификатором из адреса. Скелет
    прячет оба, а человек называл только видимый
