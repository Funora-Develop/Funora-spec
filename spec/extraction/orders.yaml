# Извлечение списка заказов со страницы /orders/trade.
#
# Раздел описывает, что со списка заказов можно взять, а чего нельзя. Второе
# здесь важнее первого: список не даёт ни точного времени, ни валюты, поэтому
# полную запись Order из него собрать нельзя, и делать вид, что можно, - худший
# из вариантов. Неполная запись, выданная за полную, приводит к тому, что
# обработчик принимает решение по значению, которого никто не наблюдал.

version: "0.1.0"

# Снимок по умолчанию для всего файла. Правило, помеченное как наблюдённое,
# ссылается сюда, если не указало свой собственный.
evidence: orders-trade.logged.ru

source:
  path: /orders/trade
  requires_session: true
  evidence: orders-trade.logged.ru

# --- Контейнер и строка -----------------------------------------------------
container:
  selector: ".orders-table"
  confidence: observed
  evidence: orders-trade.logged.ru
  note: >-
    Адресуется по назначению, а не по оформлению. У элемента есть и классы вида
    table-hover, но они описывают внешний вид и меняются вместе с темой.

  header:
    selector: ".tc-header"
    confidence: observed
    count_observed: 1
    why_it_matters: >-
      Заголовок таблицы несёт те же классы ячеек, что и строки. Селектор
      .tc-price по всей странице находит четыре элемента при трёх заказах:
      четвёртый - заголовок. Поэтому все поля ищутся строго внутри строки, а не
      по документу.

rows_container:
  selector: ".dyn-table-body"
  confidence: observed
  evidence: [orders-trade.logged.ru]
  note: >-
    Контейнер строк. Второй, независимый от класса строки признак: если
    сменится класс строки, но останется контейнер, реализация отличит смену
    разметки от пустого списка.

row:
  selector: "a.tc-item"
  confidence: observed
  count_observed: 8
  evidence: orders-trade.logged.ru
  is_link: true
  href_shape: "https://funpay.com/orders/{n}/"
  note: >-
    Строка сама является ссылкой на заказ. Идентификатор заказа берётся из
    адреса, а не из текста.
  see_also: >-
    Модификатор строки описан в fields.status.carriers как второй носитель
    состояния. Отдельного раздела для него нет намеренно: раздел разошёлся бы с
    таблицей соответствия, что однажды уже случилось.

# --- Поля -------------------------------------------------------------------
# Все селекторы применяются внутри строки. Область объявлена явно и наследуется
# всеми полями: без пометки счётчик «1» читался бы как «один на всю страницу»,
# и проверка по снимку отвергала бы верную запись.
fields:
  scope: row

  order_id:
    from: Адрес строки
    selector: "self[href]"
    extract: Последний сегмент пути после /orders/
    charset: Латинские буквы в верхнем регистре и цифры
    example_shape: 8 знаков
    confidence: observed
    type: entity_id
    required: true
    warning: >-
      Идентификатор НЕ числовой. Прежняя формулировка называла его числовым
      сегментом, и реализация, прочитавшая её буквально, написала бы \d+ и не
      нашла бы ни одного заказа: наблюдённые идентификаторы состоят из латинских
      букв и цифр вперемешку. Скелет этого не показывал - маска сегмента с
      цифрами одинакова для 12345 и для QN2CW7HY, - и ошибка держалась до тех
      пор, пока страницу не прочитал человек.

  order_number_text:
    selector: ".tc-order"
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    note: >-
      Видимый номер заказа. Совпадает ли он с идентификатором из адреса, не
      проверялось: скелет прячет оба значения.

  description:
    selector: ".order-desc > div:first-child"
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    note: >-
      Только первый узел. У .order-desc наблюдалось ровно два потомка, и текст
      контейнера целиком склеивал название лота с разделом. Склейка выглядит
      безобидной ровно до того, как по описанию начнут что-нибудь искать:
      граница между полями в ней ничем не помечена.

  category:
    selector: ".order-desc .text-muted"
    confidence: observed
    count_observed: 1
    evidence: orders-trade.logged.ru
    type: x-funora-plain
    note: >-
      Второй потомок описания. Наблюдался во всех восьми строках. Текст
      локализован и для разбора непригоден - хранится для показа.

  counterparty_name:
    selector: ".tc-user .media-user-name"
    confidence: observed
    count_observed: 1
    type: x-funora-plain

  counterparty_link:
    selector: ".tc-user [data-href]"
    confidence: observed
    count_observed: 2
    note: >-
      Ссылка на профиль лежит в data-href, а не в href: у элемента обычного
      href нет вовсе. Разбор, ищущий ссылки только по a[href], пользователя не
      найдёт. Элементов два - изображение и подпись, - и ведут они в одно место.
      Селектор ограничен ячейкой контрагента намеренно: по всей строке первым
      мог бы оказаться data-href из описания лота, и контрагентом молча стал бы
      адрес товара.
    empty_value: >-
      Пустой атрибут - это пустое значение, а не наблюдённая ссылка. Разница
      важна тем же, чем и везде: пустая строка, выданная как наблюдение,
      подставится в адрес и уведёт запрос неизвестно куда.

  counterparty_online:
    selector: ".tc-user .media-user"
    read: Модификатор класса
    confidence: observed
    vocabulary:
      online: true
      offline: false
    evidence: orders-trade.logged.ru
    count_observed: 1
    note: >-
      Признак структурный. Соседний .media-user-status содержит локализованный
      текст и для разбора непригоден: наблюдалось «онлайн» против «был N назад»,
      и второе зависит и от языка, и от давности.
    normative: >-
      Перечень значений закрыт по наблюдению, но НЕ по умолчанию. Класс online
      даёт true, класс offline даёт false, любой другой либо отсутствие обоих -
      ненаблюдённое значение с причиной presence_marker_not_recognised.

      Вывод по отрицанию запрещён. Правило «нет offline, значит online»
      выглядит работающим ровно до переименования класса: переименуй площадка
      offline в is-offline - и каждый контрагент молча стал бы присутствующим,
      без повреждения и без способа об этом узнать. Именно поэтому положительное
      значение ждало собственного наблюдения, а не выводилось.

      Ненаблюдённость здесь не повреждение поля: она отражает границу словаря, а
      не поломку разметки, и в defects не попадает.
    history: >-
      До 19.08.2026 наблюдался только offline, и признак был односторонним.
      В тот день снимок, сделанный в момент, когда покупатели были в сети, дал
      оба класса разом - и односторонность снялась наблюдением, а не догадкой.

  status:
    carriers:
      - selector: ".tc-status"
        read: Цветовой класс ячейки
        role: primary
        values: [text-primary, text-success]
        matching: >-
          Пересечение классов узла с перечнем, а не сравнение строки классов
          целиком. Ячейка вправе нести и косметические классы; требование
          точного совпадения делало бы состояние нечитаемым от добавления
          hidden-xs - на всех строках сразу и без единого повреждения.
      - selector: "self"
        read: Модификатор строки
        role: cross_check
        values: [info]
        one_way: true
        matching: Наличие класса info среди классов строки.
    confidence: observed
    evidence: orders-trade.logged.ru
    count_observed: 8
    enum_is_closed: false
    unknown_fallback: required
    rationale: >-
      Носителей два, оба структурные, оба локализации не подвержены. В снимке
      они совпали во всех восьми строках, и это свойство надо использовать, а не
      выбрасывать: два независимых носителя ловят переименование любого из них.
      Согласись реализация читать только один - и смена вёрстки поменяла бы
      ответ молча.
    normative: >-
      Читаются ОБА носителя, но роли у них разные, и разница существенна.

      Класс ячейки положителен в обе стороны: и оплаченный, и закрытый заказ
      несут свой класс. Это основной носитель, и состояние берётся из него.

      Модификатор строки положителен только для оплаченного. Закрытый узнаётся
      по отсутствию info, а отсутствие само по себе не свидетельство - под ним
      с равным успехом лежит переименование класса. Поэтому модификатор служит
      проверкой в одну сторону: info обязан стоять там и только там, где ячейка
      говорит paid.

      Отсюда три исхода. Класс ячейки опознан и согласен с модификатором -
      значение с уверенностью observed. Класс ячейки опознан, а модификатор
      противоречит, либо ячейка не опознана при стоящем info - ненаблюдённое
      значение с причиной status_carriers_disagree и повреждение уровня поля:
      разметка изменилась, и любой ответ может быть неверным. Ячейка не опознана
      и info не стоит - ненаблюдённое значение с причиной
      status_carrier_not_mapped и без повреждения: так выглядит состояние,
      которого в таблице ещё нет.

      Отдельно: если ни одна строка страницы не дала опознанного состояния при
      непустом списке, это повреждение уровня страницы
      (status_unreadable_on_every_row). Один заказ в новом состоянии
      правдоподобен, все восемь - нет, и такое чтение означает смену разметки.

      Перечисление остаётся открытым. Наблюдались два состояния из скольких-то.

  amount_text:
    selector: ".tc-price"
    scope: row
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    warning: >-
      Только внутри строки. По документу селектор находит и заголовок таблицы.

  currency_symbol_text:
    selector: ".tc-price .unit"
    scope: row
    confidence: observed
    count_observed: 1
    evidence: orders-trade.logged.ru
    type: x-funora-plain
    note: >-
      Символ валюты лежит в отдельном узле - наблюдался во всех восьми строках.
      Кода валюты по стандарту это не даёт: символ и код не в однозначном
      соответствии, а тип money требует именно кода и масштаба. Поэтому поле
      текстовое и сумму числом по-прежнему не собрать.

  seller_sum_text:
    selector: ".tc-seller-sum"
    scope: row
    confidence: observed
    count_observed: 1
    same_node_as: amount_text
    warning: >-
      В наблюдённой разметке это ТОТ ЖЕ узел, что и amount_text: ячейка несёт
      оба класса сразу (.tc-price.text-nowrap.tc-seller-sum). Отдельного поля
      реализация не заводит - оно повторяло бы amount_text и создавало бы
      впечатление, будто сумма продавца и сумма заказа наблюдаются раздельно.
      Разделятся - станет отдельным полем.

  time_text:
    selector: ".tc-date-time"
    confidence: observed
    count_observed: 1
    type: x-funora-plain
    exact_time: not_observed
    observed_shapes: ["сегодня, ЧЧ:ММ", "вчера, ЧЧ:ММ"]
    shapes_source: >-
      Формы записаны со слов наблюдателя, смотревшего живую страницу, а не взяты
      из снимка: скелет хранит подпись длины и классов знаков, и «сегодня, 13:56»
      неотличимо в нём от любой другой строки той же формы. Пометка нужна затем,
      чтобы никто не искал этих слов в файле и не счёл их проверяемыми по нему.
    rationale: >-
      Машиночитаемого времени на странице нет: ни datetime, ни title, ни
      data-time. Существует только локализованный текст, и он к тому же
      относительный - наблюдались «сегодня» и «вчера» вместо даты. Правило
      разбора времени описано в rules.yaml.

  time_ago_text:
    selector: ".tc-date-left"
    confidence: observed
    count_observed: 1
    evidence: orders-trade.logged.ru
    type: x-funora-plain
    observed_shapes: ["45 минут назад", "3 часа назад", "день назад"]
    shapes_source: >-
      Со слов наблюдателя, как и у time_text. По снимку видно только, что подпись
      этой ячейки отличается от подписи даты и что в части строк цифр в ней нет
      вовсе, - смысла поля это не даёт.
    note: >-
      Давность, а не остаток срока. Имя класса подсказывает второе, наблюдение
      говорит первое. Поле отдельное, а не второй селектор того же: два
      селектора без правила предпочтения означают, что каждая реализация
      выберет свой, и шесть SDK отдадут разное под одним именем.

# --- Соответствие носителей статуса статусам --------------------------------
# --- Соответствие носителей состояниям ---------------------------------------
status_mapping:
  each_entry_requires: [cell_class, row_class, status, evidence]

  entries:
    - cell_class: text-primary
      row_class: info
      status: paid
      display_ru: Оплачен
      evidence: orders-trade.logged.ru
      count_observed: 5
      meaning: >-
        Покупатель оплатил, деньги удерживает площадка, сделка не завершена.
        Это состояние, в котором продавец обязан выдать товар.

    - cell_class: text-success
      row_class: null
      status: closed
      display_ru: Закрыт
      evidence: orders-trade.logged.ru
      count_observed: 3
      meaning: >-
        Сделка завершена, удержание снято. Дальнейших действий продавца не
        требует.

  how_it_was_established: >-
    Четырьмя независимыми свидетельствами, а не одним. Первое: два структурных
    носителя - класс ячейки и модификатор строки - совпали во всех восьми
    строках. Второе: подписи текста разошлись ровно там же, T7:c против T6:c.
    Третье: длины совпадают со словами «Оплачен» (7 букв) и «Закрыт» (6 букв)
    без остатка. Четвёртое: человек прочитал страницу и назвал оба слова вместе
    с цветом.

    Ни одного из четырёх по отдельности не хватило бы. Цвет success сам по себе
    ничего не значит: догадка «зелёное значит завершено» осталась бы догадкой.

  enum_is_open: true
  why_open: >-
    Наблюдались два состояния. Возврат, спор и отказ существуют - продавец их
    видел, - но в снимок не попали, и носителей для них никто не видел.
    Закрыть перечисление по двум наблюдениям значило бы отвергать остальные
    состояния как ошибочные.

  unmapped_carrier: >-
    Носитель, которого нет в таблице, даёт ненаблюдённое значение с причиной
    status_carrier_not_mapped, а НЕ unknown.

  why_not_unknown: >-
    Разница решает, соврёт реализация или нет. Запасное значение unknown в
    модели отвечает на случай «площадка показала статус, которого мы не знаем».
    У нас другой случай: не наблюдалось само соответствие. Выдать unknown значит
    утверждать, что статус прочитан и не опознан, тогда как он не прочитан вовсе.

  consequence: >-
    Список заказов отвечает на вопрос «оплачен ли заказ» для двух состояний из
    скольких-то. Это ровно тот раздел, куда площадка сама отправляет продавцов
    проверять оплату, и ровно то поле, ради которого пишут ботов выдачи.

  caution: >-
    Значение paid означает «площадка показывает состояние оплаты» и ничего
    больше. Оно не заменяет проверку на стороне продавца там, где цена ошибки
    высока, и не является финансовым подтверждением.

# --- Чего список не даёт ----------------------------------------------------
# Раздел существует потому, что молчаливая неполнота опаснее явного отказа.
cannot_be_built_from_list:
  money:
    reason: >-
      Валюта в разметке строки не наблюдалась, а тип money требует кода валюты и
      масштаба. Собрать значение из одной суммы нельзя.
    consequence: >-
      Поле суммы заполняется только текстом для показа. Числовое значение
      остаётся ненаблюдённым.

  exact_time:
    reason: Машиночитаемого времени нет.
    consequence: Поле остаётся ненаблюдённым, а не пустым.

  full_order_record:
    statement: >-
      Полная запись Order из списка не собирается. Список даёт достаточно, чтобы
      обнаружить заказ и его состояние, но не чтобы описать его целиком.
    consequence: >-
      Операция чтения списка возвращает сокращённое представление, отличимое от
      полного по типу. Дополнять его придётся чтением страницы отдельного
      заказа, которая пока не наблюдалась.

# --- Чего не наблюдалось ----------------------------------------------------
not_observed:
  - Страница отдельного заказа
  - >-
    Список заказов покупателя по адресу /orders/. Все наличные снимки - взгляд
    продавца: об этом говорит класс tc-seller-sum в ячейке суммы. Совпадает ли
    разметка двух списков, неизвестно
  - >-
    Состояния, кроме оплачен и закрыт. Возврат, спор и отказ существуют, но в
    снимок не попали, и носителей для них никто не видел
  - Разметка постраничной навигации при длинном списке
  - Валюта в явном виде
  - Пустой список заказов и его отличие от сломанного селектора
  - >-
    Совпадает ли видимый номер заказа с идентификатором из адреса. Скелет
    прячет оба, а человек называл только видимый
