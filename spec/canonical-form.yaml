# Каноническая сериализация JSON: нормативные правила.
#
# Файл появился потому, что правила жили только в docs/canonical-json.md - в
# прозе, вне реестра покрытия, вне валидатора и вне классификатора изменений.
# Проверено живой мутацией: правила можно было переписать на противоположные -
# «нормализация Unicode ЗАПРЕЩЕНА», «отступ в четыре пробела ОБЯЗАТЕЛЕН», «-0
# обязателен» - и обе сборки оставались зелёными. Документ при этом обещал, что
# изменение правил всегда MAJOR.
#
# Теперь правила здесь. Правка этого файла видна классификатору изменений и
# поднимает версию канонической формы; документ остался объяснением, зачем всё
# это нужно, и нормативным больше не является.

version: "0.1.0"

applies_to:
  - >-
    Материал отпечатка события. Отпечаток - ключ идемпотентности, общий для всех
    реализаций: разойдясь в байтах, две реализации дадут одному событию два
    разных идентификатора, и гашение повторов у человека, подключившего обе, не
    сработает ни разу.
  - >-
    Файл состояния. Он штампует в себя canonical_form_version, то есть
    утверждает про себя, что собран этой формой.
  - >-
    Векторы conformance. Сравнивается не внутреннее устройство языков, а байты.

does_not_apply_to:
  - >-
    Журнал и диагностика: их читает человек, и отступы там полезны.
  - >-
    Снимки страниц. Они хранятся структурными скелетами, а не JSON.

rules:

  - id: 1
    rule: Кодировка UTF-8 без BOM.
    checked_by: реализация пишет файл состояния в UTF-8; BOM не добавляется нигде.

  - id: 2
    rule: Все строки приводятся к форме Unicode NFC перед сериализацией.
    why: >-
      Одна и та же буква записывается по-разному: «ё» бывает одним знаком и
      парой «е» с диакритикой. Глазами не отличить, байтами - разные строки, и
      хэш от них разный. Форму задаёт не площадка, а стек HTTP и разборщик
      разметки, через которые прошла страница: две реализации на разных языках
      получат из одной страницы разные байты одного идентификатора.
    vectors:
      - 'правило 2: NFC, составная запись равна разложенной'
      - 'разложенная форма даёт тот же отпечаток, что составная'
    checked_by: >-
      canonical-form.vectors.json -> serialize «правило 2» и fingerprint
      «разложенная форма даёт тот же отпечаток, что составная».

  - id: 3
    rule: >-
      Ключи объектов сортируются по возрастанию кодовых точек Unicode, не по
      алфавиту локали. Сортировка идёт ПОСЛЕ нормализации.
    why: >-
      Сортировка локали зависит от настроек машины и не воспроизводится. Порядок
      после нормализации, а не до: NFC меняет кодовые точки, и порядок, снятый с
      ненормализованных ключей, разошёлся бы с порядком, снятым с нормализованных.
    vectors:
      - 'правило 3: ключи по кодовым точкам, а не по алфавиту локали'
    checked_by: canonical-form.vectors.json -> serialize «правило 3».

  - id: 4
    rule: >-
      Порядок элементов массива значим и не сортируется. Если порядок не важен
      по смыслу, он всё равно обязан быть детерминированным - это
      ответственность схемы, а не сериализатора.
    vectors:
      - 'правило 4: порядок массива значим и не сортируется'
    checked_by: canonical-form.vectors.json -> serialize «правило 4».

  - id: 5
    rule: >-
      Ни одного незначащего пробела: без отступов, без пробела после двоеточия и
      запятой.
    why: >-
      Умолчание многих языков ставит пробел после двоеточия и запятой. JSON от
      этого не перестаёт разбираться, расходятся только байты - то есть ровно
      то, от чего берут хэш. Эталонная реализация нарушала это правило в
      единственном месте, где она пишет JSON, и файл при этом штамповал в себя
      номер канонической формы.
    vectors:
      - 'правило 5: ни одного незначащего пробела'
    checked_by: canonical-form.vectors.json -> serialize «правило 5».

  - id: 6
    rule: >-
      Экранирование минимальное: только то, что требует RFC 8259. Знаки вне
      ASCII выводятся как есть, а не как \uXXXX.
    vectors:
      - 'правило 6: не-ASCII выводится как есть, без \uXXXX'
      - 'правило 6: то, что RFC 8259 требует экранировать, экранируется'
    checked_by: canonical-form.vectors.json -> serialize «правило 6», два вектора.

  - id: 7
    rule: Целые числа выводятся без дробной части и без экспоненты.
    vectors:
      - 'правило 7: целое без дробной части и без экспоненты'
    checked_by: canonical-form.vectors.json -> serialize «правило 7».

  - id: 8
    rule: >-
      Числа с плавающей точкой запрещены. Величина, для которой они естественны,
      выражается через x-funora-type: деньги минорными единицами, время
      миллисекундами. Реализация обязана отвергать такое значение вслух, а не
      округлять его.
    why: >-
      У числа с плавающей точкой нет единственного десятичного вида, и две
      реализации запишут его по-разному. Округление - молчаливая подмена
      значения, и всплывёт она в чужом хэше через неделю.

      Отдельно запрещены NaN и Infinity: JSON таких значений не знает, и файл с
      ними перестаёт быть разбираемым чем-либо, кроме языка, который их записал.
    vectors:
      - 'правило 8: число с плавающей точкой'
      - 'правило 8: дробное даже при целом значении'
    checked_by: canonical-form.vectors.json -> serialize.reject, два вектора.

  - id: 9
    rule: Минус ноль запрещён, выводится 0.
    checked_by: >-
      Следует из правила 8: без чисел с плавающей точкой отрицательный ноль
      невыразим, а целый -0 неотличим от 0 в любом языке.

  - id: 10
    rule: >-
      Поле со значением null и отсутствующее поле - разные вещи и не
      взаимозаменяемы. null означает «не наблюдалось» либо «здесь этого не
      бывает». Наблюдение, давшее пустоту, выражается пустым значением своего
      типа, а не null.
    why: >-
      Прежняя редакция правила назначала null и отсутствию ПРОТИВОПОЛОЖНЫЕ
      смыслы: «null означает наблюдалось и пусто, отсутствие - не наблюдалось».
      Это расходилось и с реализацией, и со схемами, и с валидатором:
      spec/models/observed.schema.json прямо говорит, что null стоит при
      not_observed, а пустое наблюдение - это пустая строка.

      Два смысла null различаются пометками: x-funora-observability:
      unobserved-possible - «не наблюдали», x-funora-nullable: not_applicable -
      «здесь этого не бывает». Ровно одна из них обязана стоять у каждого поля,
      допускающего null.
    vectors:
      - 'правило 10: null сохраняется и не выбрасывается'
    checked_by: >-
      canonical-form.vectors.json -> serialize «правило 10»; scripts/validate.js
      требует одну из двух пометок у каждого поля с null.

  - id: 11
    rule: >-
      Правило зависит от того, что сериализуется, и это разделение нормативно.

      В КОНВЕРТЕ И НАГРУЗКЕ СОБЫТИЯ ключ присутствует всегда, а пустота
      выражается значением null. Опускать ключ запрещено.

      В МОДЕЛЯХ поле с пометкой x-funora-observability: unobserved-possible
      опускается, когда наблюдения не было, и не выводится как null.
    why: >-
      У события и у модели разная судьба. Событие уходит по сети, через очередь,
      в чужую систему: отсутствие ключа там неотличимо от потери по дороге, и
      получатель не может решить, «не наблюдали» это или «не доехало». Модель же
      живёт рядом с тем, кто её прочитал, и отсутствие поля у неё означает ровно
      то, что означает, - наблюдения не было.

      Прежняя редакция давала одно правило на оба случая («необязательное поле
      опускается»), и для событий оно было прямо противоположно тому, что
      требует scripts/validate.js и что делают схемы событий: status у
      order.created стоит в required при типе ["string", "null"].
    checked_by: >-
      scripts/validate.js: для kind === 'event' роняет проверку на поле с
      пустотой, не допускающей null. Схемы моделей держат ненаблюдаемые поля вне
      required.

  - id: 12
    rule: >-
      money - объект с ключами amount_minor, currency, scale. Сумма всегда целая,
      в минорных единицах. Порядок ключей задаётся правилом 3, а не этим
      перечислением: перечисление здесь - состав, а не последовательность.
    vectors:
      - 'правило 12: money в каноническом виде'
    checked_by: >-
      canonical-form.vectors.json -> serialize «правило 12». Проверяется
      сериализация уже собранного money. Сборка money со страницы проверяется
      отдельно и в другом месте: знак валюты лежит в собственном узле разметки,
      и переводится в код по таблице types.money.symbol_table.

  - id: 13
    rule: >-
      instant - строка RFC 3339 в UTC с суффиксом Z и ровно тремя знаками
      миллисекунд: 2026-08-18T04:12:33.000Z. Смещения, отличные от Z, в выводе
      запрещены.
    why: >-
      Три знака, а не шесть и не сколько получится: длина части после точки
      меняет байты, а байты входят в хэш. Реализация, выводящая микросекунды,
      разойдётся с реализацией, выводящей миллисекунды, на каждом моменте.

    sub_millisecond: truncate
    sub_millisecond_note: >-
      Доля миллисекунды ОТБРАСЫВАЕТСЯ, а не округляется. Округление вправе
      сдвинуть момент вперёд - объявить, что наблюдение случилось позже, чем
      случилось. Для метки времени это неверно всегда, а на границе секунды
      ещё и заметно: 12:00:00.9996 стало бы 12:00:01.000.

      Отбрасывание сдвигает назад, то есть говорит «не позже чем», и это
      единственная сторона, в которую метке времени ошибаться безопасно.

    other_offsets: convert_to_utc
    other_offsets_note: >-
      Вход со смещением, отличным от Z, переводится в UTC, а не отвергается.
      Смещение - законная запись того же момента, и отвергать её значило бы
      требовать от вызывающего работы, которую реализация делает одной строкой.
      Запрет из правила касается ВЫВОДА.

    naive_input: reject
    naive_input_note: >-
      Момент без пояса ОТВЕРГАЕТСЯ. Счесть его UTC либо местным - домысел, а
      цена домысла здесь до суток разницы: наблюдение окажется в будущем либо в
      прошлом, и отпечаток события разойдётся у двух реализаций, работающих в
      разных поясах.

      Это то же правило, по которому не выводится код валюты из символа.

    vectors:
      - 'правило 13: момент приводится к канонической форме'
      - 'правило 13: доля миллисекунды отбрасывается'
      - 'правило 13: смещение переводится в UTC'
    checked_by: >-
      canonical-form.vectors.json -> serialize, три вектора, и
      tests/test_canonical.py: один и тот же момент даёт одни и те же байты при
      любом часовом поясе машины.

  - id: 14
    rule: duration - целое число миллисекунд.
    checked_by: >-
      Следует из правила 8. Отдельного вектора нет: величины длительности
      наружу в JSON сегодня не уходят.

  - id: 15
    rule: >-
      entity_id и cursor - строки, выводятся как есть, без нормализации
      регистра. Идентификатор не выводится числом ни при каких условиях.
    why: >-
      9007199254740993 - первое целое, которое Number в JavaScript не
      представляет точно. Идентификатор, разобранный в число, тихо превращается
      в соседнее значение.
    vectors:
      - 'идентификатор остаётся строкой'
    checked_by: canonical-form.vectors.json -> serialize «идентификатор остаётся строкой».

changing_these_rules:
  bump: major
  class: canonical_form_change
  why: >-
    Смена правил обнуляет ВСЁ сохранённое: отпечатки событий, ключи гашения
    повторов, курсоры, ключи идемпотентности. Клиент, работавший месяц, после
    обновления получит заново всё, что уже обработал, - для обработчика выдачи
    это выданный дважды товар.

    Правило действует, даже если ни одна модель не менялась.
