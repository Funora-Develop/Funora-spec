# Сверка после неоднозначного исхода записи.
#
# Признак requires_reconciliation стоял у трёх операций и НЕ БЫЛ ОПРЕДЕЛЁН
# нигде. Смысл ему придавали два места, и оба - не определение: ворота требовали,
# чтобы поле стояло у всякой небезопасной операции (то есть оно вычислимо из
# safety и сведений не несёт), а матрица повторов ставила по нему запрет
# автоматического повтора.
#
# Чего не было: через сколько читать, по какому признаку искать своё сообщение,
# что делать при неполном чтении, кто решает о повторной отправке.

# --- Что это такое ----------------------------------------------------------
what_it_is: >-
  ПРОЦЕДУРА НАБЛЮДЕНИЯ, А НЕ ПЕТЛЯ УПРАВЛЕНИЯ. Сверка отвечает на вопрос «что
  вышло из отправки», и ничего не предпринимает.

  СВЕРКА НИКОГДА НЕ ОТПРАВЛЯЕТ ПОВТОРНО. Решение о повторной отправке принимает
  вызывающий, и только он: у отправленного сообщения нет отмены, и автоматика,
  решающая за человека, однажды напишет покупателю дважды.

# --- Когда сверяться ---------------------------------------------------------
# Стоимость чтения несимметрична, и это определяет весь механизм: при успехе
# сверка не делается ВОВСЕ.
trigger:
  rule: >-
    Сверка нужна тогда и только тогда, когда ЗАПРОС УШЁЛ, а признака успеха не
    наблюдали.
  not_needed_when:
    - >-
      Исход confirmed. Ответ канала сам несёт новое сообщение в том самом
      диалоге - положительное свидетельство, и читать историю незачем.
    - >-
      Отказ случился ДО ухода запроса: проверка доводов, исчерпанный бюджет,
      ограничитель исходящих, непригодная страница. Это локальное свидетельство,
      и оно тоже положительное - эффекта не было.
  needed_when:
    - Исход unconfirmed любого рода.
    - >-
      Исход refused. Форма отказа канала НЕ НАБЛЮДАЛАСЬ ни разу, и объявлять по
      ней «сообщение не ушло» нельзя: неизвестно даже, отказ ли это отправки или
      отказ чего-то другого в том же ответе.
    - Любой отказ после ухода запроса, включая транспортный.

  why_not_the_error_class: >-
    ТРИГГЕР БЕРЁТСЯ ИЗ ПОПЫТКИ, А НЕ ИЗ КЛАССА ОШИБКИ, и это не мелочь.

    Признак side_effects_possible объявлен свойством класса ошибки, а вопрос
    «мог ли эффект случиться» - свойство МОМЕНТА: ушёл ли запрос. Для чтений
    разница не значила ничего, потому что у чтения эффектов не бывает.

    Проверено на живом примере. У UnexpectedResponseError объявлено
    retryable: false и side_effects_possible: false. Строка матрицы
    reconcile_first требует retryable: true, значит для этого класса она
    НЕДОСТИЖИМА, и решение выйдет never. А сам класс означает «ответ получен и
    не относится к ожидаемому» - то есть запрос дошёл до площадки, и она
    ответила. Эффект не просто возможен, он вероятен.

    То же у ParseError: ответ получен, разобрать не вышло.

    Менять признаки этих классов на true нельзя: у чтения эффектов действительно
    нет, и утверждение стало бы ложным с другой стороны. Признак остаётся тем,
    что он есть, а триггер сверки берётся из другого места.

# --- Порядок шагов -----------------------------------------------------------
pipeline:
  order_is_normative: true
  classifies: исход сверки после неоднозначной записи
  steps:
    - step: 1
      name: Опорное чтение
      note: >-
        Берётся из ПРЕДПОЛЁТНОГО чтения страницы диалога - того самого, из
        которого отправка и так берёт токен, имя диалога и позицию последнего
        сообщения. Лишнего запроса нет.

        Запоминаются два: множество идентификаторов сообщений, бывших ДО
        отправки, и адрес собственного профиля.

    - step: 2
      name: Перечитывание истории
      note: >-
        Страница диалога читается заново. Число чтений и паузы между ними
        объявлены ниже: сообщение появляется в истории не мгновенно.

    - step: 3
      name: Полнота чтения
      verdict_when_failed: undetermined
      reason: incomplete_read
      note: >-
        Неполное чтение НИКОГДА не даёт вердикта отсутствия. Половина истории,
        принятая за целую, объявила бы неотправленным то, что отправлено, и
        вызывающий написал бы второй раз.

    - step: 4
      name: Признак себя показал себя
      verdict_when_failed: undetermined
      reason: self_marker_not_demonstrated
      note: >-
        В прочитанной истории обязано найтись ХОТЯ БЫ ОДНО собственное сообщение
        - любое, не обязательно искомое.

        Без этого условия отсутствие искомого означало бы что угодно: и что его
        нет, и что признак опознания не работает на этой странице. Условие
        превращает неудачный поиск в проверяемое утверждение.

        Это общий приём, и он применим всюду, где вывод притворяется
        наблюдением.

    - step: 5
      name: Опора прочитана
      verdict_when_failed: undetermined
      reason: anchor_not_read
      note: >-
        Пустое опорное множество при НЕПУСТОЙ странице означает, что
        идентификаторы не прочитались. Тогда своё СТАРОЕ сообщение выглядит
        новым, и вызывающий узнаёт «доставлено» о том, что не уходило.

        Пустой диалог - другое дело, и его надо отличать: там прежних сообщений
        вправду нет, и всякое найденное потом своё сообщение вправду новое.
        Отличаются они числом узлов, насчитанных предполётным чтением.

    - step: 6
      name: Своё новое сообщение найдено
      verdict: delivered
      reason: found_in_history
      note: >-
        Ищется сообщение, у которого ВСЕ четыре признака сразу: происхождение
        человеческое, адрес автора наблюдён, адрес автора равен адресу
        собственного профиля, идентификатор НЕ был в опорном множестве.

    - step: 7
      name: Не найдено при исправном признаке
      verdict: absent_from_history
      reason: not_in_history

# --- Вердикты ----------------------------------------------------------------
verdicts:
  delivered: >-
    Своё новое сообщение найдено в истории. Положительное свидетельство.
  absent_from_history: >-
    Чтение полное, признак себя показал себя, искомого сообщения нет.
  undetermined: >-
    Сверка ответа не дала. Честное незнание.

no_negative_verdict:
  rule: >-
    ВЕРДИКТА not_delivered НЕТ И НЕ БУДЕТ.
  why: >-
    Отсутствие сообщения в истории - свидетельство ОТРИЦАТЕЛЬНОЕ, а отсутствие в
    этом проекте объявляется только по положительному признаку. Здесь правило
    стоит дороже всего: объявив «не отправлено», реализация подтолкнула бы
    вызывающего написать второй раз.

    Вердикт absent_from_history говорит ровно то, что наблюдалось: в прочитанной
    истории сообщения нет. Он НЕ говорит, что сообщение не ушло. Площадка могла
    показать его позже, могла показать не там, могла не показать вовсе.

    Что с ним делать - решает вызывающий, и решает зная, что это лучшее
    доступное свидетельство, а не доказательство.

# --- Признак своего сообщения ------------------------------------------------
own_message_marker:
  predicate:
    - origin == human
    - author_href наблюдён
    - author_href равен адресу собственного профиля
    - идентификатор не входит в опорное множество
  source_of_own_href: a.user-link-dropdown, атрибут href
  observed_on: chat-thread.logged.ru
  observed_counts: >-
    Одиннадцать сообщений: у пяти адрес автора равен адресу собственного
    профиля, у шести не наблюдён вовсе - это системные сообщения.

  why_by_href_and_not_by_id: >-
    Идентификатор сообщения в ответе канала - ЧИСЛО, в разметке - строка, и что
    это одно значение, не наблюдалось. Опознание по ссылке делает этот затор
    НЕВАЖНЫМ, а не обходит его догадкой.

  why_not_by_text: >-
    Опознание по тексту запрещено. Текст - чужой ввод, и совпадение подделывает
    собеседник: достаточно прислать в ответ то же самое, и сверка объявит
    доставленным чужое сообщение.

    Тот же довод уже стоит у признака системного сообщения, и он там сработал.

  why_not_by_name: >-
    Имя автора ключом быть не может: оно меняется, и собеседник вправе назваться
    как продавец.

# --- Расписание чтений --------------------------------------------------------
schedule:
  reads: 3
  delays_ms: [1000, 3000, 8000]
  delays_are_provisional: true
  rationale: >-
    Числа ВЫБРАНЫ, а не наблюдены, и помечены так. Наблюдения о том, через
    сколько отправленное сообщение появляется в истории, нет ни одного: все
    записанные отправки подтверждались самим ответом канала, и читать историю не
    приходилось.

    Три чтения с растущей паузой - обычная осторожность: первое ловит быстрый
    случай, последнее даёт площадке двенадцать секунд суммарно. Больше ждать
    бессмысленно - вызывающий держит операцию, - меньше значит объявить
    отсутствие раньше времени.

    Уточняется наблюдением: одна отправка, чей ответ не подтвердил, с чтением
    истории по расписанию.

  budget: >-
    Чтения расходуют бюджет наравне с прочими. Сверка не бесплатна, и это
    сказано прямо: у неоднозначного исхода есть цена, и платить её лучше, чем
    отправлять вслепую.

# --- Кто решает ---------------------------------------------------------------
who_decides: >-
  Вызывающий. Сверка отдаёт вердикт и ничего не предпринимает.

  Правило то же, что у освобождения закрытого предохранителя: снятие только
  явное. Автоматика, решающая за человека о повторной отправке, однажды напишет
  покупателю дважды, и отменить это будет нельзя.

conformance:
  checked_without_network: >-
    Опознание проверяется НА СНИМКЕ: адрес собственного профиля и адреса авторов
    лежат в одном документе, и нумерация значений скелета внутридокументная -
    значит равенство видно прямо.
  required_mutations:
    - >-
      Чужому сообщению дан текст отправленного. Всякая реализация, опознающая по
      тексту, обязана упасть.
    - >-
      Адрес собственного профиля подменён. Ни одно сообщение не должно быть
      опознано своим, и вердикт обязан стать undetermined, а не
      absent_from_history: признак себя не показал.
    - >-
      Чтение объявлено неполным. Вердикта отсутствия быть не должно.
    - >-
      Опорное множество опустошено. Своё СТАРОЕ сообщение не должно быть принято
      за новое.
