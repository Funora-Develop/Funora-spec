# Исход обращения к каналу с действием и правило его установления.
#
# Файл появился, когда выяснилось, что отправку сообщения нельзя написать не
# потому, что неизвестна форма запроса - она наблюдена целиком, - а потому что
# неизвестно, ЧЕМ считать ответ.
#
# Разница между «отправлено» и «не отправлено» у операции без отмены дороже
# любой другой в этом контракте. Отменить сообщение покупателю нельзя, и повтор
# при неоднозначном исходе означает второе сообщение.

# --- Три исхода, а не два ---------------------------------------------------
# Третий заведён нарочно, и это тот же приём, что уже стоит у Origin и
# Completeness: unconfirmed - честное незнание, а не третий род неудачи.
#
# Двузначный ответ вынудил бы реализацию выбрать одно из двух зол. Объявить
# успехом всё, что вернулось с кодом 200, значит однажды сказать «отправлено» о
# неотправленном. Объявить неудачей значит однажды отправить второй раз.
outcomes:
  confirmed: >-
    Площадка вернула сообщение в ответе. Отправка состоялась, и это ПОЛОЖИТЕЛЬНОЕ
    свидетельство, а не отсутствие отказа.
  refused: >-
    Площадка сообщила об отказе. Сообщение не отправлено.
  unconfirmed: >-
    Ответ получен, но подтверждения в нём нет. Отправка могла состояться и могла
    не состояться, и вызывающему сказано именно это.

closed:
  rule: >-
    Перечень закрыт. Значения наши, а не площадки: их выводит наш же
    классификатор, и запасного варианта у него быть не может по определению -
    всякий неразобранный случай уже назван unconfirmed.
  why_it_differs_from_response_classes: >-
    У классов ответа запасное значение есть - unknown, - потому что там
    классифицируется чужая страница, и площадка вправе прислать невиданное.
    Здесь классифицируется НАШ разбор чужого ответа, и «невиданное» - это и есть
    unconfirmed.

# --- Порядок шагов ----------------------------------------------------------
# Порядок нормативен по той же причине, что и у классификации ответа: две
# реализации, проверившие условия в разном порядке, разойдутся ровно на том
# ответе, ради которого правило написано.
pipeline:
  order_is_normative: true
  classifies: исход обращения к каналу с действием
  steps:
    - step: 1
      name: Тело разбирается как JSON
      verdict_when_failed: unconfirmed
      reason: body_not_json
      note: >-
        Ответ канала наблюдался только объектом JSON. Тело, которое не
        разбирается, означает, что пришло не то, - но НЕ означает, что действие
        не выполнено: запрос ушёл.

    - step: 2
      name: Разобранное - объект
      verdict_when_failed: unconfirmed
      reason: body_not_an_object
      note: >-
        Массив либо число на верхнем уровне не наблюдались ни разу.

    - step: 3
      name: Поле response - объект
      verdict_when_failed: unconfirmed
      reason: response_not_an_object
      note: >-
        При ЗАПРОСЕ БЕЗ ДЕЙСТВИЯ поле response приходит булевым, и это наблюдено.
        Значит булево здесь - признак того, что ответ пришёл не на действие, а на
        опрос: подтверждать им отправку нечем.

        Реализация, разбирающая поле одним типом, споткнётся ровно на успешной
        отправке - об этом сказано в spec/extraction/updates.yaml.

    - step: 4
      name: Поле error пусто
      verdict_when_failed: refused
      reason: channel_reported_error
      note: >-
        ФОРМА ОТКАЗА НЕ НАБЛЮДАЛАСЬ НИ РАЗУ - error видели только пустым, и это
        записано в реестре как runner_error_shape. Но для решения форма и не
        нужна: довольно предиката «error не пусто».

        Отсюда цена той записи: она мешает НАЗВАТЬ причину отказа словами, а не
        отличить отказ от успеха. Прежде она считалась блокирующей операцию, и
        это было преувеличением.

    - step: 5
      name: Среди объектов есть узел диалога
      verdict_when_failed: unconfirmed
      reason: no_chat_node_in_answer
      note: >-
        Ищется объект с type == chat_node. При успешной отправке он приходил
        всегда - наблюдено шесть раз.

        Пустое поле objects тоже приводит сюда, и это верно: ответ без объектов
        отправку не подтверждает.

    - step: 6
      name: Узел диалога - тот самый
      verdict_when_failed: unconfirmed
      reason: node_mismatch
      note: >-
        Сверяется data.node.name с тем именем диалога, которое отправлено.
        Наблюдено, что это то же значение, что в атрибуте data-name страницы.

        Шаг нужен затем, что канал отвечает и о чужих диалогах: подписка едет в
        каждом запросе, и объект чужого диалога в ответе отправку не
        подтверждает.

    - step: 7
      name: Список сообщений непуст
      verdict_when_failed: unconfirmed
      reason: empty_message_list
      note: >-
        Узел диалога приходит и при простом обновлении, без новых сообщений.
        Пустой список подтверждением не является.

    - step: 8
      name: Подтверждено
      verdict: confirmed
      reason: confirmed_by_channel

# --- Причины ----------------------------------------------------------------
# Машиночитаемы и закрыты. Причина - не пояснение для человека, а то, по чему
# вызывающий принимает решение, и словарь у шести реализаций обязан быть один.
reasons:
  confirmed_by_channel: Ответ несёт новое сообщение в том самом диалоге.
  channel_reported_error: Поле error непусто. Что именно в нём - неизвестно.
  body_not_json: Тело ответа не разобралось.
  body_not_an_object: Разобранное - не объект.
  response_not_an_object: Поле response не объект, а значит ответ не на действие.
  no_chat_node_in_answer: Среди объектов ответа нет узла диалога.
  node_mismatch: Узел диалога в ответе - не тот, в который отправляли.
  empty_message_list: Узел диалога есть, новых сообщений в нём нет.

# --- Что из ответа читается -------------------------------------------------
readable_from_the_answer:
  channel_message_id: >-
    Поле id последнего элемента data.messages узла диалога. ЧИСЛО.

    Имя нарочно не message_id: в разметке идентификатор сообщения - строка, в
    канале - число, и что это одно значение, НЕ НАБЛЮДАЛОСЬ. Сложить их в одно
    поле значило бы утверждать непроверенное.
  node: >-
    Поле data.node.name узла диалога. Подтверждение диалога площадкой, а не эхо
    запроса.
  messages_in_answer: Длина списка data.messages.

not_readable_from_the_answer:
  text: >-
    В ответе лежит готовая РАЗМЕТКА сообщения - поле html, шестьсот с лишним
    знаков. Значения её не наблюдают намеренно: это чужая переписка, и фикстуры
    фрагмента нет.

    Подставить эхо своего ввода - не то же самое: что площадка сохранила,
    неизвестно. Сообщение могло быть обрезано, экранировано или изменено.
  sent_at: Ни одной метки времени в ответе нет.
  author_as_a_user: >-
    Поле author - число. Объект пользователя из него не собрать: имени в ответе
    нет.

# --- Правило для вызывающего ------------------------------------------------
caller_rule: >-
  ИСКЛЮЧЕНИЕ ОЗНАЧАЕТ, ЧТО СООБЩЕНИЕ НЕ УШЛО. Всё, что случилось после ухода
  запроса, возвращается исходом, а не бросается.

  Правило заведено затем, что иначе неоднозначность выражать нечем: брошенное
  исключение читается как неудача, а неудачей неоднозначный исход не является.

  Отсюда следствие для реализации: транспортный отказ ПОСЛЕ ухода запроса даёт
  unconfirmed, а не ошибку. Ошибка остаётся за тем, что случилось ДО: непригодная
  страница, исчерпанный бюджет, отказ установить соединение.

conformance:
  checked_without_network: >-
    Правило проверяется на ответах, собранных по наблюдённой ФОРМЕ. Сетевые
    записи хранят форму, а не значения, и подставить настоящий ответ неоткуда -
    но форма и есть то, что наблюдалось.

    Проверка обязана сверять читаемые ключи с записью наблюдения: разойдись они,
    и правило станет описывать ответ, которого площадка не присылает.
  every_step_needs_a_case: >-
    У каждого шага обязан быть свой случай, и мутация шага обязана его убивать.
    Шаг, чей случай не отличается от соседнего, - не шаг, а украшение.
