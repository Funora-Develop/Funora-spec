# Политика повторов.
#
# Вынесена из прозы в данные. Причина: conformance обязан сравнивать решение о
# повторе между языками, а сравнить можно только то, что записано машиночитаемо.
# Пока политика живёт словами «bounded retry, circuit state и telemetry», каждая
# реализация выбирает свои числа совершенно законно, и расхождение обнаруживается
# на аккаунте пользователя.
#
# Решение о повторе принимает пересечение двух вещей:
#   1. класс ошибки из spec/errors/errors.yaml (retryable, side_effects_possible);
#   2. безопасность операции из spec/services/*.yaml (safety).
# Ни одна из них по отдельности недостаточна. Ошибка может быть retryable, но
# операция небезопасной - тогда повтор запрещён без ключа идемпотентности.

version: "0.1.0"

# --- Матрица допустимости повтора ------------------------------------------
# safety операции:
#   safe       - чтение, побочных эффектов нет
#   idempotent - повтор с тем же ключом даёт тот же результат
#   unsafe     - повтор производит действие заново
decision_matrix:
  - error_retryable: false
    result: never
    summary: Класс ошибки повтор не допускает независимо от операции.

  - error_retryable: true
    operation_safety: safe
    result: allowed
    summary: Чтение можно повторять свободно в пределах бюджета.

  - error_retryable: true
    operation_safety: idempotent
    requires: idempotency_key
    result: allowed_with_key
    summary: >-
      Повтор допустим только если ключ идемпотентности вычислен и передан.
      Без ключа операция ведёт себя как unsafe.

  - error_retryable: true
    operation_safety: unsafe
    error_side_effects_possible: true
    result: reconcile_first
    summary: >-
      Автоматический повтор запрещён. Требуется сверка состояния: прочитать
      фактическое положение дел и решить по нему. Это тот случай, когда покупатель
      получает второе сообщение или второй ключ автовыдачи.

  - error_retryable: true
    operation_safety: unsafe
    error_side_effects_possible: false
    result: allowed
    summary: >-
      Ошибка гарантированно возникла до отправки, побочного эффекта не было.
      Пример: локальный отказ бюджета.

# --- Параметры по классам ошибок -------------------------------------------
# Ключ - stable_id из spec/errors/errors.yaml.
policies:

  # Политика родительского класса. Существует не для красоты: если завтра появится
  # новый подтип транспортной ошибки, а политику для него забудут, он унаследует
  # эти консервативные значения, а не отсутствие политики. Отсутствие политики
  # реализация вправе истолковать как «ограничений нет».
  funora.transport:
    max_attempts: 2
    base_ms: 1000
    multiplier: 2.0
    cap_ms: 15000
    jitter: full
    respect_retry_after: true
    max_retry_after_ms: 300000
    fallback: true
    summary: >-
      Запасные значения для транспортных ошибок без собственной политики.
      Намеренно строже конкретных: неизвестный класс отказа не повод быть смелее.

  funora.transport.timeout:
    max_attempts: 3
    base_ms: 1000
    multiplier: 2.0
    cap_ms: 30000
    jitter: full
    respect_retry_after: false
    summary: >-
      Исход неизвестен. Повтор только для safe-операций; для остальных требуется
      сверка состояния.

  funora.transport.network:
    max_attempts: 3
    base_ms: 500
    multiplier: 2.0
    cap_ms: 30000
    jitter: full
    respect_retry_after: false

  funora.transport.rate_limited:
    max_attempts: 2
    base_ms: 5000
    multiplier: 3.0
    cap_ms: 120000
    jitter: full
    respect_retry_after: true
    max_retry_after_ms: 300000
    account_scoped: true
    summary: >-
      Обрабатывается на уровне бюджета аккаунта, а не отдельного запроса.
      Источников запросов много - цикл опроса, планировщики наблюдений,
      пользовательские записи - и по отдельности они друг о друге не знают.
      Если каждый отступит только за себя, суммарное давление почти не упадёт.

    scoped_rule: >-
      Отступление держит вся сетевая идентичность, а не только запрос,
      получивший отказ. Пока оно держится, запросы этой идентичности не уходят
      вовсе - ни повторы, ни первые попытки, ни чужие вызовы того же процесса.

    scoped_duration: >-
      Держится дольшее из двух: собственное остывание идентичности из
      spec/runtime/budget.yaml и значение заголовка Retry-After, урезанное по
      max_retry_after_ms.

      Дольшее, а не своё. Заголовок - это просьба площадки, и ждать меньше
      просимого значит спорить с ней без единого довода: она знает свою
      нагрузку, а мы нет. Ждать дольше безопасно всегда.

      Прежде эталонная реализация ждала только своё: площадка просила пять
      минут, клиент отступал на минуту и возвращался. Ровно поведение, из-за
      которого ограничение и переходит в блокировку.

  funora.transport.remote_server:
    max_attempts: 3
    base_ms: 2000
    multiplier: 2.0
    cap_ms: 60000
    jitter: full
    respect_retry_after: true
    max_retry_after_ms: 300000

  # Ниже - классы, для которых повтор запрещён. Записаны явно, чтобы отсутствие
  # записи нельзя было истолковать как «политика не определена, попробуем ещё раз».
  funora.auth.invalid_credentials:
    max_attempts: 1
    summary: >-
      Повтор запрещён. Серия попыток входа с неверным ключом выглядит со стороны
      площадки как подбор и приближает блокировку.

  funora.auth.session_expired:
    max_attempts: 1
    requires: single_flight_reauth
    summary: >-
      Не повтор запроса, а однократное восстановление сессии. Обязателен
      single-flight: десять параллельных запросов, одновременно получивших отказ,
      не должны дать десять параллельных входов.

  funora.auth.access_blocked:
    max_attempts: 1
    fail_closed: true
    summary: >-
      Опрос останавливается полностью. Короткий автоматический backoff запрещён:
      продолжать стучаться после отказа в доступе означает подтверждать подозрение.

  funora.auth.challenge_required:
    max_attempts: 1
    fail_closed: true
    summary: >-
      То же поведение. Funora проверку не обходит и не решает, это явная не-цель.
      Ошибка нужна, чтобы отличить проверку от поломки разметки.

  funora.protocol.changed:
    max_attempts: 1
    degrade: true
    summary: >-
      Повторять бессмысленно: разметка не изменится от повторного запроса.
      Клиент переходит в состояние protocol-changed, автоматика записи
      приостанавливается.

  funora.budget.exhausted:
    max_attempts: 1
    summary: >-
      Локальный отказ SDK. Повтор означает крутиться вхолостую: бюджет
      восстанавливается по времени, а не по числу попыток.

# --- Обязательные ограничения ----------------------------------------------
limits:
  max_retry_after_ms:
    value: 300000
    summary: >-
      Верхняя граница уважения заголовка Retry-After. Без неё битое или враждебное
      значение вида 86400 вешает цикл опроса на сутки, и внешне это неотличимо от
      зависшего процесса.

  global_max_attempts:
    value: 5
    summary: Потолок числа попыток независимо от политики класса ошибки.

  jitter:
    kind: full
    summary: >-
      Полный разброс, а не половинный. При нескольких клиентах на одном адресе
      детерминированный backoff синхронизирует их и превращает отступление
      в согласованную волну.

# --- Что этим проверяется --------------------------------------------------
conformance:
  suite: retries
  summary: >-
    Вектор задаёт трассу из логических операций и ожидает нормализованный журнал
    решений вида [{attempt, classified_as, retried, delay_ms, reason_code}].
    Утверждается окно [lo, hi] для задержки, а не точное значение: при полном
    разбросе точное совпадение недостижимо и требовать его бессмысленно.
  requires:
    - >-
        Виртуальные часы. Без них suite проверяет скорость машины, а не логику.
    - >-
        Подменяемый транспорт. Внешний mock управляет временем ответа, но не может
        промотать sleep внутри клиента, а именно клиентский sleep здесь и проверяется.
