# Классификация ответа и её отображение в ошибки.
#
# Файл появился, когда выяснилось, что порядок шагов классификатора и таблица
# соответствия причин ошибкам жили внутри одной реализации. Сверять поведение
# шести SDK на негативных ветках было бы нечем: у каждой свой словарь причин, и
# любое расхождение выглядело бы как разница в мелочах.
#
# Здесь оба нормативны. Порядок шагов - потому что две реализации, проверившие
# условия в разном порядке, разойдутся именно на той странице, ради которой
# правило написано. Таблица - потому что от неё зависит, повторит клиент запрос
# или остановится навсегда.

version: "0.1.0"

# --- Классы ответа ----------------------------------------------------------
classes:
  ok: Ответ пригоден для проверки отпечатка и разбора.
  login_required: Сессия недействительна.
  challenge: Площадка требует подтверждения, что запрос не автоматический.
  blocked: Доступ закрыт.
  rate_limited: Запросов слишком много. Отличается от blocked принципиально.
  maintenance: Площадка временно недоступна.
  wrong_identity: Ответ пришёл не оттуда, откуда ожидался.
  transport_error: Ответ не получен либо получен с кодом ошибки.
  unknown: Класс установить не удалось.

rate_limited_is_separate:
  statement: >-
    Превышение частоты - это «слишком быстро», а не «вам сюда нельзя».
  rationale: >-
    Раньше код 429 отображался в blocked. Поскольку blocked трактуется как отказ
    с закрытым замком, первое же попадание в ограничение частоты остановило бы
    опрос навсегда, а политика повторов для RateLimitedError осталась бы
    недостижимым кодом.

# --- Порядок шагов ----------------------------------------------------------
pipeline:
  order_is_normative: true
  steps:
    - step: 1
      name: Код ответа
      note: >-
        Коды из таблицы status_codes в spec/extraction/session.yaml решают сразу:
        тело при них разбирать бессмысленно.

    - step: 2
      name: Целостность тела
      note: >-
        Объявленная длина сверяется с полученной. Обрыв чтения даёт транспортный
        отказ, а не изменение разметки. Без этого шага страница, оборванная
        посреди таблицы, проходит классификацию как ok и разбор как полный, и
        вызывающий получает половину заказов с нулём повреждений - правдоподобный
        неверный ответ, о неверности которого узнать неоткуда.

    - step: 3
      name: Личность
      note: >-
        Конечный URL после переходов принадлежит ожидаемому хосту. Ответ с
        чужого адреса не заслуживает разбора, как бы он ни выглядел. Тот же шаг
        ловит перепутанные cookie при работе с несколькими аккаунтами.

    - step: 4
      name: Детекторы страниц-перехватчиков
      note: >-
        Идут раньше проверки маркера вошедшего. На странице входа маркера нет по
        определению, и при обратном порядке вердиктом стало бы unknown вместо
        login_required: пользователь не узнал бы, что надо просто войти заново.

    - step: 5
      name: Маркер вошедшего
      note: >-
        Отсутствие маркера само по себе не означает, что мы не вошли. Оно может
        означать изменившуюся разметку, и это разные диагнозы: во втором случае
        повторный вход не поможет.

# --- Область поиска текстовых сигнатур --------------------------------------
text_signatures:
  scope_is_normative: true
  rule: >-
    Текстовые сигнатуры ищутся только вне контейнеров, содержимое которых пишут
    люди. Перечень объявляет адаптер страницы.
  rationale: >-
    Без ограничения собеседник останавливает чужого клиента одним словом в
    переписке. Проверено на шести обычных сообщениях вида «мой аккаунт
    заблокирован» - шесть из шести давали вердикт блокировки или проверки.
  details: spec/extraction/rules.yaml

# --- Соответствие вердикта ошибке -------------------------------------------
# Ключ - пара из класса ответа и машиночитаемой причины. Таблица обязана быть
# полной: пара без записи означает, что реализации выберут ошибку сами.
verdict_errors:
  ok:
    identity_confirmed: null
    no_signature_matched_identity_unchecked: null

  login_required:
    http_401: funora.auth.session_expired
    "signature:guest_navbar": funora.auth.session_expired
    "signature:login_page": funora.auth.session_expired
    "signature:login_form": funora.auth.session_expired

  challenge:
    "signature:challenge_widget": funora.auth.challenge_required
    "signature:challenge_text": funora.auth.challenge_required

  blocked:
    http_403: funora.auth.access_blocked
    "signature:blocked_text": funora.auth.access_blocked

  rate_limited:
    http_429: funora.transport.rate_limited

  maintenance:
    http_503: funora.transport.remote_server
    "signature:maintenance_text": funora.transport.remote_server

  wrong_identity:
    host_mismatch: funora.protocol.unexpected_response

  transport_error:
    http_5xx: funora.transport.remote_server
    http_4xx: funora.protocol.unexpected_response

  unknown:
    empty_body: funora.protocol.unexpected_response
    identity_marker_absent: funora.protocol.changed

# --- Уточнения, не выразимые таблицей ---------------------------------------
refinements:
  session_never_confirmed:
    applies_to: login_required
    rule: >-
      Если сессия ни разу не подтверждалась за время жизни клиента, вместо
      funora.auth.session_expired поднимается funora.auth.invalid_credentials.
    rationale: >-
      Разные диагнозы с разным лечением. Истёкшую сессию имеет смысл обновить и
      повторить; неверный секрет повторять бессмысленно, и попытка обновления
      только добавит подозрительных запросов.

  provisional_verdict:
    rule: >-
      Вердикт, принятый непроверенной сигнатурой, свою ошибку поднимает, но
      признак непроверенности переносится в экземпляр ошибки. По такой ошибке
      не наступает процессный отказ с закрытым замком и не меняется состояние
      возможности.
    rationale: >-
      Не заметить настоящую страницу проверки опаснее, чем сработать по тексту,
      поэтому ошибка поднимается. Но остановиться навсегда по догадке нельзя:
      таких страниц никто не видел, и сигнатура составлена умозрительно.

  retry_decision:
    rule: >-
      Повтор допустим при retryable, и НЕ provisional, и safety=safe.
    rationale: >-
      Без второго условия клиент повторяется против страницы, которой никто не
      видел. Без третьего повтор небезопасной операции может выполнить её дважды.
