# Словарь `x-funora-type` - скалярные типы предметной области.
#
# JSON Schema не умеет выражать decimal, момент времени и непрозрачный идентификатор.
# Если оставить в схемах сырые `number` и `string`, шесть SDK выберут шесть разных
# представлений совершенно законно, и conformance этого не поймает: он сравнивает
# нормализованный JSON, то есть ровно тот слой, где числа разойдутся первыми.
#
# Правило: в доменных полях сырые `number` и `string` запрещены. Проверяется
# scripts/validate.js, нарушение - падающая проверка.

types:

  money:
    json: object
    description: >-
      Денежная сумма. Хранится в минорных единицах целым числом - не строкой и не
      числом с плавающей точкой.
    properties:
      amount_minor:
        type: integer
        format: int64
        description: >-
          Сумма в минорных единицах валюты. 1234.10 RUB это 123410 при scale 2.
          Знак допустим: возвраты и корректировки бывают отрицательными.
      currency:
        type: string
        pattern: "^[A-Z]{3}$"
        description: Код валюты по ISO 4217 заглавными буквами.
      scale:
        type: integer
        minimum: 0
        maximum: 4
        description: >-
          Число знаков после запятой. Хранится в самой записи, а не выводится из
          валюты: это бесплатно закрывает валюты с нулём знаков и любые будущие
          сюрпризы разметки.
    required: [amount_minor, currency, scale]
    rules:
      - Сгенерированный код не выполняет арифметику над money. Сложение, вычитание и
        сравнение живут в рукописном helper на decimal-типе языка.
      - Арифметика между разными валютами запрещена, выбрасывается CurrencyMismatchError.
      - Неявное преобразование во float в публичном API запрещено.
      - Сравнение на равенство побайтное по всем трём полям. {123410, RUB, 2} и
        {12341, RUB, 1} - разные значения, даже если численно равны.
    language_mapping:
      python: int + Decimal в helper
      typescript: bigint
      java: long + BigDecimal в helper
      dotnet: long + decimal в helper
      cpp: int64_t
      c: int64_t

  instant:
    json: string
    description: Момент времени в UTC.
    format: RFC3339 с обязательным суффиксом Z, миллисекундная точность
    example: "2026-08-18T04:12:33.000Z"
    attributes:
      precision:
        enum: [exact, minute, hour, day]
        description: >-
          Фактическая точность наблюдения. Площадка часто показывает «вчера, 14:32»
          или «3 дня назад» - такая метка не является exact, и это должно быть видно
          в модели, а не теряться при нормализации.
      origin:
        enum: [absolute, relative_to_observation]
        description: >-
          absolute - метка была абсолютной в исходных данных.
          relative_to_observation - вычислена из относительной формулировки.
    rules:
      - Относительные метки резолвятся ТОЛЬКО относительно `observed_at` того же ответа
        адаптера, никогда относительно системных часов процесса. Иначе два инстанса
        в разных часовых поясах получат разное время для одного и того же события.
      - Адаптер фиксирует `observed_at` один раз на ответ.
      - Поле с precision, отличной от exact, запрещено использовать в ключе
        дедупликации и в ordering key.
      - Таймеры SLA, аренды и backoff считаются по монотонным часам, а не по wall clock.
        Отображаемое пользователю время - по wall clock.

  duration:
    json: integer
    description: Промежуток времени в целых миллисекундах.
    rationale: >-
      Не ISO-8601-строка. Строку пришлось бы парсить в шести языках, из которых
      два не имеют для этого ничего в стандартной библиотеке.

  entity_id:
    json: string
    description: Непрозрачный идентификатор сущности на стороне площадки.
    rules:
      - Сравнение строго побайтное.
      - Парсить в целое запрещено. В JavaScript числовой идентификатор длиннее 2^53
        теряет точность молча, и это обнаруживается уже на пользовательских данных.
      - >-
          Не разбирать на части и не выводить из него ничего: формат может измениться.

  cursor:
    json: string
    description: >-
      Непрозрачный токен позиции. base64url от канонического JSON, внутрь которого
      входят версия формата, `adapter_family` и позиция.
    rules:
      - Пользователь не разбирает содержимое и не конструирует курсор сам.
      - Курсор чужой версии формата или чужого adapter_family даёт
        CursorIncompatibleError, но никогда - молчаливое чтение с начала.

  revision:
    json: string
    description: >-
      Непрозрачная метка версии состояния сущности. Хэш нормализованного доменного
      состояния, не идентификатор и не время.
    rules:
      - Передаётся обратно как `expected_revision` в операциях изменения. Если ревизия
        на стороне площадки успела измениться, операция обязана завершиться
        PreconditionFailedError, а не перетереть параллельную правку.
      - Это правило - про поле МОДЕЛИ. Одноимённое поле в конверте события
        подчиняется другому. Там версией служит только то, о чём событие, а не
        весь состав. Перечень нормативен и лежит в
        spec/events/delivery.yaml -> revision_source.
      - Разница не косметическая. Весь состав нужен для expected_revision,
        потому что поймать надо ЛЮБУЮ параллельную правку. Одна грань нужна для
        отпечатка, потому что разбудить получателя должна ТОЛЬКО она; хэш всего
        состояния прислал бы событие о статусе после переименования покупателя.
      - >-
          Не разбирать и не сравнивать на больше-меньше: порядковой семантики нет.
      - >-
          Не путать с `adapter_revision`. Версия адаптера - диагностическая величина,
          участвовать в идентичности событий и ключах идемпотентности ей запрещено.

  user_ref:
    json: object
    description: Ссылка на пользователя площадки без загрузки его профиля.
    properties:
      id: { x-funora-type: entity_id }
      username:
        type: string
        description: >-
          Отображаемое имя. Может меняться и не является идентификатором.
          Использовать в качестве ключа запрещено.
    required: [id]
