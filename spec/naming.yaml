# Правила именования и зарезервированные слова.
#
# Спецификация выпускается тегом, а тег неизменяем. Если в модели появится поле
# с именем, которое в одном из шести языков является ключевым словом, генератор
# выдаст не компилирующийся код, и откатить это уже нельзя - придётся выпускать
# новую версию с переименованием, то есть ломающее изменение.
#
# Проверка дешёвая: список слов известен заранее. Отсутствие проверки обходится
# в major-релиз.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# --- Форма идентификаторов -------------------------------------------------
form:
  spec_identifiers:
    style: snake_case
    pattern: "^[a-z][a-z0-9_]*$"
    summary: >-
      Спецификация пишет имена в нижнем регистре с подчёркиваниями. Каждый язык
      приводит их к своему стилю сам, но исходная форма одна: иначе обратное
      преобразование неоднозначно.

  event_types:
    pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
    summary: Область и действие через точку.

  capability_ids:
    pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"

  error_stable_ids:
    pattern: "^funora(\\.[a-z][a-z0-9_]*)+$"

  ascii_only: true
  ascii_rule: >-
    Идентификаторы только ASCII. Ограничение не стилистическое: экспортируемые
    символы C не могут стабильно быть не-ASCII ни в одном распространённом
    наборе инструментов, а conformance сравнивает идентификаторы перечислений
    как строки - любая кириллица превращает его в тест на кодировку файла.

# --- Приведение к стилю языка ----------------------------------------------
casing:
  python: snake_case
  typescript: camelCase
  java: camelCase
  csharp: PascalCase
  cpp: snake_case
  c: snake_case_with_prefix

c_prefix: funora_
c_rule: >-
  В C нет пространств имён, поэтому каждое публичное имя несёт префикс. Без него
  библиотека конфликтует с чужими символами при статической сборке.

# --- Экранирование ---------------------------------------------------------
escaping:
  strategy: trailing_underscore
  summary: >-
    Имя, совпавшее с ключевым словом языка, получает подчёркивание в конце:
    class -> class_. Правило одно для всех языков, чтобы соответствие оставалось
    обратимым.
  applies_to: [field_names, enum_values, operation_segments, parameter_names]

# --- Зарезервированные слова ------------------------------------------------
# Списки намеренно избыточны: сюда включены не только ключевые слова, но и имена,
# столкновение с которыми даёт неочевидные ошибки - встроенные типы, контекстные
# ключевые слова, макросы стандартной библиотеки.
