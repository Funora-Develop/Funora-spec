# --- Затеняемые имена -------------------------------------------------------
# Встроенные типы, функции и контекстные ключевые слова. Использовать их можно:
# затенение легально и обычно безвредно. Проверка о них только сообщает, но не
# требует экранирования - иначе единственное настоящее срабатывание утонет в шуме.
shadows:
  python:
    - bool
    - bytes
    - dict
    - filter
    - float
    - format
    - hash
    - id
    - int
    - list
    - next
    - object
    - property
    - set
    - str
    - type
  typescript:
    - any
    - boolean
    - constructor
    - never
    - number
    - object
    - string
    - symbol
    - unknown
  java:
    - clone
    - equals
    - finalize
    - hashCode
    - notify
    - permits
    - record
    - sealed
    - toString
    - var
    - wait
    - yield
  csharp:
    - init
    - record
    - value

# --- Дополнительные запреты -------------------------------------------------
forbidden_prefixes:
  - value: "_"
    reason: Ведущее подчёркивание означает приватность в Python и служебность в C.
  - value: "__"
    reason: Двойное подчёркивание запускает искажение имён в Python и зарезервировано в C и C++.

forbidden_suffixes:
  - value: "_t"
    reason: >-
      Суффикс _t зарезервирован POSIX за именами типов. Столкновение проявляется
      не при сборке библиотеки, а при сборке пользовательского кода вместе с
      системными заголовками, и потому находится позже всего.

max_identifier_length: 48
max_length_reason: >-
  Ограничение не про читаемость: длинные имена в C после добавления префикса и
  суффикса приближаются к пределам старых компоновщиков.
