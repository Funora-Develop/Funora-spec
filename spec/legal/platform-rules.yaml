# Правила площадки, на которые ссылается контракт.
#
# Файл появился после того, как выяснилось: контракт трижды ссылается на пункты
# публичных правил площадки по номеру, и ни одна ссылка никуда не разрешается.
# Номер пункта в тексте выглядит проверенным - он точен на вид, - а проверить
# его читателю нечем: ни перечня, ни даты, ни указания, кто и когда смотрел.
#
# ЗАЧЕМ ЭТО ВАЖНЕЕ ОБЫЧНОГО УКАЗАТЕЛЯ. Ссылки на правила площадки стоят там, где
# объясняется ЗАПРЕТ: почему нет метода массовой рассылки, почему отправка вне
# окна требует явного флага. Наказание за нарушение получает не автор SDK, а
# продавец, чей аккаунт работает через него. Обоснование запрета, которое нельзя
# проверить, - худший вид обоснования: снять запрет легко, а восстановить
# аккаунт нельзя.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ. Текста правил площадки. Он чужой, и переписывать
# его сюда нельзя - ни целиком, ни абзацами. Здесь только то, ЧТО пункт
# запрещает, своими словами и настолько коротко, насколько хватает для
# обоснования нашего решения.
#
# ПОЧЕМУ verified: false У ВСЕХ. Номера пришли из ранних заметок проекта и с
# площадкой не сверялись ни разу. Пометить их проверенными значило бы выдать
# догадку за наблюдение - ровно то, чего проект не делает нигде. Сверка требует
# человека: открыть публичные правила, найти пункт, сличить смысл. До этого
# номер остаётся указанием «смотри примерно здесь», и так он и объявлен.

clauses:
  "1.9":
    prohibits: >-
      Массовую рассылку одинаковых сообщений пользователям площадки.
    why_we_cite_it: >-
      Обосновывает отсутствие метода массовой рассылки и ограничитель исходящих
      сообщений. Отсутствие метода само по себе не защищает: цикл в пять строк
      пишется за минуту, а наказание получает продавец.
    verified: false
    verification_needs: >-
      Открыть публичные правила площадки, найти пункт 1.9, сличить смысл с
      формулировкой выше. Если номер сместился - поправить здесь, а не в местах
      ссылок: там его больше нет.
    cited_in:
      - spec/services/chats.yaml
      - spec/runtime/budget.yaml

  "1.12":
    prohibits: >-
      Ссылки на сторонние файлообменники в переписке.
    why_we_cite_it: >-
      Объясняет, почему отправка вложения через внешний хостинг - не обходной
      путь, а столкновение с правилами: возможность, реализованная так, подводит
      пользователя под наказание, формально работая.
    verified: false
    verification_needs: >-
      Открыть публичные правила площадки, найти пункт 1.12, сличить смысл.
    cited_in:
      - spec/capabilities.yaml
      - spec/services/chats.yaml
      - spec/extraction/updates.yaml
    what_observation_showed: >-
      24.08.2026 наблюдена отправка изображения. Загрузка идёт НА САМУ ПЛОЩАДКУ
      отдельным запросом, отдающим идентификатор файла, а не через внешний
      хостинг. Столкновения с этим пунктом у отправки изображения нет.

      Пункт остаётся в перечне: он объясняет, почему нельзя реализовать вложение
      через внешний хостинг, если собственный путь однажды окажется закрыт.

rules:
  verification_carries_accountability: >-
    Объявить пункт сверенным можно и не сверив: машина этого не отличит. Отличить
    она может другое - несёт ли утверждение ответственность. Поэтому verified:
    true требует трёх полей: verified_on (дата вида ГГГГ-ММ-ДД), verified_by (кто
    смотрел) и verified_against (что именно читалось).

    Дата обязательна не для порядка. Правила площадки меняются, и сверка без даты
    не говорит, устарела она или нет.

  every_citation_resolves: >-
    Всякая ссылка на пункт правил площадки в тексте контракта обязана
    разрешаться в запись этого перечня. Номер, не разрешающийся никуда, читается
    как проверенный и таковым не является.

  every_clause_is_cited: >-
    Всякая запись перечня обязана быть названа хотя бы одним местом контракта, и
    перечень cited_in обязан говорить правду. Запись, на которую никто не
    ссылается, - обоснование запрета, который сняли и забыли снять обоснование.

  no_verbatim_text: >-
    Текста правил площадки здесь нет и не будет: он чужой. Своими словами и
    только то, что нужно для обоснования нашего решения.
