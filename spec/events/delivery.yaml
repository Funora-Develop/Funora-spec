# Гарантии доставки событий.
#
# Это тот файл, отсутствие которого в blueprint было самой дорогой находкой аудита.
# Документ описывал поток событий подробно, но нигде не отвечал на вопрос: что
# происходит при рестарте процесса. Без ответа обе реализации законны, и обе
# катастрофичны по-своему - одна теряет оплаченный заказ, другая выдаёт товар дважды.
#
# Здесь ответ зафиксирован один раз для всех шести SDK.

version: "0.1.0"

# --- Гарантия --------------------------------------------------------------
guarantee:
  kind: at_least_once
  scope: ordering_key
  statement: >-
    Funora доставляет события не менее одного раза в пределах одного ключа
    упорядочивания. Обработчик обязан быть идемпотентным. Курсор продвигается
    только после того, как все обработчики событий до этой позиции завершились
    или ушли в очередь неразобранных.

  scope_limit: >-
    Гарантия распространяется на обнаружение изменения, а не на восстановление
    каждого промежуточного состояния. Если между двумя чтениями произошло
    несколько изменений одного объекта, наблюдению доступно последнее.
    Обработчик обязан считать событие поводом перечитать объект, а не полным
    описанием того, что случилось.

  rationale: >-
    Выбор между at-least-once и at-most-once не технический, а про то, какую беду
    предпочесть. At-most-once теряет событие: оплаченный заказ не обработан, товар
    не выдан, покупатель открывает спор. At-least-once даёт повтор: товар выдан
    дважды. Повтор можно погасить идемпотентностью на стороне обработчика, потерю
    восстановить нельзя ничем. Поэтому выбран повтор.

  # Вопрос, стоявший здесь до наблюдений 18.08.2026, звучал так: отдаёт ли канал
  # обновлений устойчивую монотонную позицию, по которой можно переигрывать
  # пропущенное. Наблюдения дали половину ответа, и половина оказалась не той, на
  # которую рассчитывали.
  observation_result:
    date: 2026-08-18
    details: spec/extraction/updates.yaml

    what_was_found: >-
      Позиция существует: атрибуты data-node-msg и data-user-msg на элементе
      диалога числовые и после события выросли. Отдельно от них есть метки
      состояния, которые меняются без направления. То есть площадка различает
      «изменилось ли» и «на чём я остановился», и второе доступно наблюдению.

    what_was_not_found: >-
      Способа получить пропущенное. Список диалогов хранит по одному значению на
      диалог - последнее. Если за время простоя пришло пять сообщений, видно
      одно.

      Разметки дочитывания у списка не наблюдалось, а полнота его неизвестна:
      два захвата одного и того же списка дали 47 и 50 элементов, то есть
      границу никто не видел. Диалог, оказавшийся за пределом списка, исчезнет
      из наблюдения целиком - но существует ли такой предел, не установлено.

    why_position_alone_is_not_enough: >-
      Позиция позволяет обнаружить пропуск и не позволяет его восстановить. Это
      разные возможности, и гарантия переигрывания требует второй.

    unresolved: >-
      Что закодировано в десятизначном значении, неизвестно. Счётчик и время в
      секундах объясняют наблюдение одинаково: десять знаков - ровно ширина
      текущего unix-времени, а наблюдённая дельта 2 097 969 секунд это 24 дня.
      Время в секундах не уникально, и позиция тогда не адресует сообщение. Пока
      это не разрешено, значение сравнивается только на равенство.

    consequence_for_this_document: >-
      Гарантия остаётся at-least-once, но её предмет сужен: повторно может прийти
      сообщение об изменении диалога, а не о каждом отдельном событии внутри
      него. Переигрывание с произвольной позиции не обещается. Дедупликация на
      стороне обработчика остаётся обязательной по той же причине, что и раньше.

    how_it_would_be_closed: >-
      Только просмотром сетевых запросов страницы: адрес такой ручки живёт внутри
      кода страницы, а наблюдение сохраняет разметку без содержимого скриптов.
      Если ручка найдётся, её появление будет расширением контракта, а не
      исправлением: нынешняя формулировка останется верной.

# --- Ключ упорядочивания ---------------------------------------------------
ordering:
  statement: >-
    Порядок сохраняется внутри одного ключа. События с разными ключами
    обрабатываются параллельно и порядка между собой не имеют.

  key_required: true
  note: >-
    Ключ обязателен, а не опционален. Опциональный ключ означает, что часть событий
    не имеет порядка ни с чем, и реализация вправе обработать их в любой момент -
    в том числе после события, которое логически следует за ними.

  # Правило вывода ключа нормативно: если две реализации выведут разные ключи,
  # они получат разную степень параллелизма и разный наблюдаемый порядок.
  derivation:
    message.created: chat:{chat_id}
    chat.unread_changed: chat:{chat_id}
    order.created: order:{order_id}
    order.status_changed: order:{order_id}
    review.changed: order:{order_id}
    lot.price_changed: lot:{lot_id}
    lot.stock_changed: lot:{lot_id}
    market.offer_appeared: watch:{watch_id}
    market.offer_disappeared: watch:{watch_id}
    market.price_changed: watch:{watch_id}
    seller.online_changed: watch:{watch_id}
    protocol.health_changed: account:{account_id}
    watch.primed: watch:{watch_id}
    watch.degraded: watch:{watch_id}
    snapshot.incomplete: watch:{watch_id}
    event.loss: account:{account_id}

  causality_rule: >-
    События, причинно связанные с одним заказом, получают ключ заказа, даже если
    физически наблюдаются в переписке. Иначе сообщение о оплате и смена статуса
    заказа окажутся в разных ключах и будут обработаны параллельно, а обработчик
    выдачи товара увидит их в произвольном порядке.

# --- Когда порождается snapshot.incomplete ------------------------------------
# Раздел появился потому, что цикл наблюдения умел обращаться с неполным чтением
# и молчал о нём. Курсор он не двигал - это верно, - но обработчик получал
# события по неполному списку и ничего не знал: обработал часть заказов как всё.
snapshot_incomplete_source:
  rule: >-
    Неполное чтение списка обязано порождать snapshot.incomplete в той же
    партии, что и события по этому списку.

  why_the_same_batch: >-
    Отдельный поздний сигнал бесполезен: обработчик к тому времени уже принял
    решение по неполным данным. Событие обязано приходить вместе с ними, чтобы
    решение можно было принять с оглядкой.

  why_not_only_the_cursor: >-
    Несдвинутый курсор защищает будущее: строки, выпавшие из неполного чтения,
    не будут сочтены исчезнувшими. Настоящее он не защищает никак - события по
    прочитанному порождаются, и получатель принимает их за полную картину.

  revision: >-
    Версией служит связка сущности, причины и числа принятых строк. Одна и та же
    неполнота, держащаяся много шагов подряд, доходит один раз за срок гашения,
    а изменение числа строк доходит сразу: перешло от «двух строк не хватает» к
    «не хватает двадцати» - это новость.

  ordering_key: >-
    Ключ наблюдения, а не сущности: событие говорит о снимке целиком, и связывать
    его порядком с отдельным заказом было бы неверно.

# --- Что служит версией в отпечатке -------------------------------------------
# Отпечаток строится из четырёх полей, и три из них не оставляют выбора:
# account_id, тип, entity_id. Четвёртое, entity_revision, до сих пор описывалось
# только словарём типов: «хэш нормализованного доменного состояния».
#
# Для отпечатка события это правило неверно, и неверно опасно.
#
# Хэш ВСЕГО состояния меняется от посторонней правки. Покупатель переименовался -
# хэш заказа другой - отпечаток события «статус изменился» другой - событие
# доходит второй раз, хотя статус не менялся. Для обработчика выдачи это выданный
# дважды товар.
#
# Версией в отпечатке служит ТО, О ЧЁМ СОБЫТИЕ, и ничего сверх. Правило обратное
# правилу для expected_revision: там нужен весь состав, потому что поймать надо
# любую параллельную правку; здесь нужна одна грань, потому что разбудить должна
# только она.
#
# Перечень нормативен. Отпечаток - ключ идемпотентности, общий для всех
# реализаций: разошедшись в том, что кладут четвёртым полем, две реализации
# перестают гасить повторы друг друга, и подключивший обе получает каждое
# событие дважды. Выводить это поле «по смыслу» нельзя - смысл у каждого свой.
revision_source:
  rule: >-
    Каждый тип события обязан объявить, что служит его версией в отпечатке.
    Реализация обязана брать объявленное, а не выводить самостоятельно.

  why_not_whole_state: >-
    Хэш всего состояния сущности повторно порождает событие при правке, к
    событию не относящейся. Событие о цене приходило бы при смене описания.

  why_not_observation_time: >-
    Момент наблюдения различается у каждого чтения, и гашение повторов не
    сработало бы ни разу: каждый опрос давал бы новый отпечаток.

  sources:
    message.created: message_id
    chat.unread_changed: >-
      позиция последнего сообщения + признак прочитанности. Именно ПОЗИЦИЯ, а
      не идентификатор: прежде здесь было объявлено last_message_id, и это было
      неверно. Значение атрибута непрозрачно, сравнивается только на равенство,
      и что оно означает - порядковый номер, метку времени или что-то третье -
      не установлено. Арифметика над ним запрещена.
    order.created: константа appeared
    order.status_changed: статус заказа
    review.changed: оценка + отпечаток текста отзыва
    lot.price_changed: цена + валюта
    lot.stock_changed: остаток
    market.offer_appeared: константа appeared
    market.offer_disappeared: константа disappeared
    market.price_changed: цена + валюта
    seller.online_changed: признак присутствия
    protocol.health_changed: класс состояния протокола
    watch.primed: константа primed
    watch.degraded: причина ухудшения
    snapshot.incomplete: сущность + причина + число принятых строк
    event.loss: причина + число потерянных

  part_separator: "U+001E"
  part_separator_note: >-
    Версия из нескольких частей склеивается этим знаком, и знак назван здесь
    затем, что прежде он не был назван нигде. Спецификация говорила только
    «разделяются знаком, который не встречается внутри самих значений», и две
    реализации, обе следующие спецификации, брали бы разные знаки - двоеточие,
    вертикальную черту, дефис. Отпечаток строится из версии, значит на каждом
    событии с составной версией они бы разошлись. Это ровно то расхождение,
    ради предотвращения которого раздел fingerprint_algorithm и написан.

  why_not_the_fingerprint_separator: >-
    U+001E, а НЕ U+001F, которым склеивается сам отпечаток. Эталонная
    реализация брала один и тот же знак для обеих склеек и своими руками
    клала разделитель отпечатка внутрь его же части: материал получал пять
    кусков там, где объявлено четыре, и склейка переставала различать
    четвёрки полей.

    Порядок обратен привычному по ASCII, где U+001E разделяет записи, а
    U+001F - поля внутри записи. Внешняя склейка зафиксирована спецификацией
    первой, и менять её значило бы обнулить все сохранённые отпечатки ради
    соответствия обычаю.

  parts_must_not_contain_it: >-
    Часть, содержащая любой из двух разделителей, отвергается вслух. Подмена
    либо экранирование дали бы два разных события с одним отпечатком, и второе
    исчезло бы молча - а молчаливое исчезновение здесь и есть худший исход.

  why_appeared_is_a_constant: >-
    Заказ появляется в списке однажды. Различать разные появления одного и того
    же заказа не требуется, и любая переменная часть - время, порядковый номер,
    состав строки - сделала бы отпечаток разным при повторном чтении того же
    списка, то есть отменила бы гашение повторов для самого частого события.

  why_read_flag_belongs_to_the_chat: >-
    Событие о непрочитанном обязано отличать «пришло новое» от «прочитали
    старое». Один last_message_id не отличает: он тот же в обоих случаях, и
    второе событие погасло бы как повтор первого.

# --- Подписка на то, чего реализация не порождает -----------------------------
# Раздел вырос из соседнего. Там записано, что message.created был объявлен и не
# порождался, а обработчик принимался без возражений и не срабатывал ни разу.
# Починили тогда одно событие; правило, по которому этого не случится снова, не
# написали - и в эталонной реализации таких событий осталось одиннадцать из
# шестнадцати.
producible:
  rule: >-
    Реализация обязана объявлять, какие виды событий она способна породить, и
    отказывать в регистрации обработчика на все прочие.

  refusal: configuration

  why_configuration_and_not_capability: >-
    Отказ говорит не о площадке, а о реализации. Класс «возможность
    отсутствует» выставляется по позитивному свидетельству со страницы -
    страница получена, отпечаток совпал, элемента функции нет, - и здесь ничего
    подобного не наблюдалось. Подписка на несуществующий вид - неверно собранный
    клиент, и исправляется она правкой вызывающего кода.

  why_not_silence: >-
    Молчание здесь неотличимо от «ничего не произошло». Продавец, подписавшийся
    на review.changed, увидит ровно то же, что увидел бы при отсутствии новых
    отзывов: ничего. Ошибка обнаружится не при запуске, а в тот день, когда
    отзыв придёт, - и обнаружит её покупатель.

  why_not_a_warning: >-
    Предупреждение в журнале - то же молчание с отсрочкой: журнал читают после
    происшествия, а не до. Отказ происходит при регистрации, то есть при
    запуске, когда его ещё некому пропустить.

  catch_all_is_exempt: >-
    Обработчик, зарегистрированный без указания вида, отказа не получает: он
    просит поток целиком, а не конкретный вид, и молчания в нём нет - он видит
    ровно то, что пришло.

  declaration_must_be_earned: >-
    Объявить вид порождаемым и не порождать его - вернуться к тому же молчанию с
    другой стороны. Перечень обязан проверяться против того, что реализация
    вправду порождает на своих снимках, а не быть списком намерений.

  version_note: >-
    Перечень - свойство реализации, а не контракта: он меняется по мере того,
    как реализация растёт. Контракт требует лишь того, чтобы перечень был и
    чтобы отказ был громким.

# --- Откуда берётся message.created ------------------------------------------
# Раздел существует потому, что событие долго было объявлено и не порождалось:
# цикл наблюдения читал два списка и не читал переписок вовсе. Обработчик новых
# сообщений при этом принимался без возражений и не срабатывал ни разу.
message_created_source:
  statement: >-
    Сообщение видно только на странице переписки. Список диалогов говорит, что
    диалог изменился, но не говорит чем.

  rule: >-
    Переписка читается тогда, и только тогда, когда список диалогов показал её
    изменившейся. Читать все переписки на каждом шаге запрещено: полсотни
    диалогов дали бы полсотни запросов, а операция chats.history отнесена к
    разряду interactive.

  per_step_limit:
    required: true
    reason: >-
      Изменись разом больше диалогов, чем предел, шаг превратился бы в столько
      же запросов. Предел обязателен, а его значение оставлено реализации:
      наблюдений о порогах площадки нет.

  queue_is_mandatory: >-
    Непрочитанные диалоги обязаны ждать очереди, а не выбрасываться сразу.
    Событие об изменении диалога к этому моменту уже доставлено, курсор диалогов
    сдвинут, и повода вернуться к такому диалогу больше нет - выброшенный диалог
    означает потерянные сообщения.

  queue_is_bounded: >-
    Очередь при этом ограничена, и предел обязателен. Прежняя редакция
    запрещала выбрасывать вовсе, и запрет был невыполним: очередь пополняется
    на каждом изменении диалога, а вычерпывается по несколько штук за шаг. У
    продавца с полусотней активных переписок она растёт быстрее, чем убывает, и
    не кончается никогда - а вместе с ней растёт файл состояния, в который она
    входит.

    Невыполнимый запрет хуже разрешения с условием: реализация его нарушит, и
    нарушит молча, потому что признаваться будет нечему.

  queue_overflow_rule: >-
    За пределом выбрасывается ХВОСТ, а не голова. В голове самые давние
    диалоги, они ждут дольше всех, и выбросить их значило бы гарантировать, что
    именно они не дочитаются никогда. Очередь остаётся честной к тому, кто
    пришёл раньше.

  queue_overflow_is_loud: >-
    Всякая потеря порождает event.loss с числом выбывших и причиной. Запрещено
    не выбрасывание, а МОЛЧАНИЕ: сообщение покупателя, которое не будет
    прочитано никогда, и об этом никто не узнает, - худший исход из возможных.

    Это то же правило, что и loss_rule раздела backpressure, и записано оно
    здесь потому, что очередь дочитывания - не очередь доставки, и читатель,
    ищущий правило про неё, ищет его тут.

  queue_survives_restart: >-
    Очередь входит в сохраняемое состояние. Не переживи она перезапуск -
    диалог, изменившийся перед остановкой, не дочитался бы уже никогда.

  first_read_is_silent: >-
    Первое чтение переписки событий не порождает: курсора для неё не было, и
    отличить новое сообщение от давнего нечем. Объявить новыми все сообщения
    значило бы разослать историю целиком. Это то же правило, по которому молчит
    холодный старт.

  cursor_commit: after_handlers
  cursor_commit_note: >-
    Курсор переписки сдвигается ПОСЛЕ раздачи, как и курсоры списков, и
    откатывается вместе с ними. Сдвинутый раньше, он превращал упавший
    обработчик в безвозвратную потерю: событие о диалоге к тому моменту уже
    доставлено и погашено, повторно оно не придёт, и повода перечитать переписку
    больше нет.

    Отсюда второе требование, без которого первое не работает: при откате диалог
    возвращается в очередь дочитывания. Откатить курсор и не вернуть узел значит
    не изменить ничего - список диалогов после отказа может замереть навсегда,
    и как раз так выглядит покупатель, написавший один раз и ждущий ответа.

  cursor_from_incomplete_reads: allowed
  cursor_from_incomplete_reads_note: >-
    Курсор переписки снимается с любого чтения, включая неполное, - в отличие от
    курсоров списков, где это запрещено. Разница в том, что означает событие.

    Курсор списка, снятый с неполного чтения, теряет выпавшие строки, и при
    следующем чтении они выглядят новыми заказами: это утверждение о мире, и оно
    оказывается ложным.

    Сообщение, выпавшее из неполного чтения, при следующем чтении действительно
    новое - для получателя: события о нём никто не выдавал. Повторить такое
    дешевле, чем промолчать, и доставка объявлена как минимум однократной.

    Запрет обратного стоил бы дорого: неполное первое чтение оставляло бы курсор
    пустым, а пустой курсор молчит по правилу первого чтения. Диалог замолкал бы
    навсегда, тратя запрос на каждом шаге. Для торгового бота первое чтение
    переписки - это первое сообщение нового покупателя.

  failure_classes:
    account:
      errors: [funora.auth.*]
      action: Остановить шаг, диалог вернуть в очередь
      why: >-
        Условие аккаунта к переписке отношения не имеет и отвергнет их все
        подряд. Перебирать очередь значит стучать столько раз, сколько в ней
        узлов, при заблокированном доступе - и ровно то, что запрещает
        retry-policy для access_blocked.
    transient:
      errors: [funora.transport.*, funora.budget.*]
      action: Диалог вернуть в очередь, дочитывание на этом шаге прекратить
      why: >-
        Выбросить диалог по временному отказу значит поставить доставку в
        зависимость от того, напишет ли покупатель ещё раз. Написавший один раз
        и ждущий ответа не напишет.
    the_thread_itself:
      errors: [funora.validation.*, funora.protocol.*]
      action: Диалог выбывает из очереди
      why: >-
        Отказ относится к самой переписке. Повторять вечно нечитаемое значило бы
        жечь слот каждый шаг; следующее изменение того же диалога вернёт узел
        обратно.

  failure_is_not_fatal: >-
    Отказ, относящийся к самой переписке, не отменяет ни остальные, ни шаг.

  known_latency: >-
    Отсюда следует задержка в один шаг на каждый диалог: первое изменение
    вызывает первое чтение, а события даёт только второе. Убрать её нечем -
    сведений о том, какие сообщения были в диалоге до начала наблюдения, нет.

# --- Из чего складывается версия диалога -------------------------------------
chat_revision:
  parts: [last_message_position, unread_flag]

  why_both: >-
    Событие называется «изменилось непрочитанное», а версией была одна позиция
    последнего сообщения. Прочтение диалога её не двигает - и события о
    прочтении не порождалось вовсе, при том что признак лежал прямо в нагрузке.

    Одного сравнения флага мало: версия входит в отпечаток, и оставь её прежней,
    событие о прочтении получило бы отпечаток уже доставленного и было бы съедено
    гашением повторов. Снова молча.

  unknown_flag_is_not_a_change: >-
    Переход признака из невыведенного в выведенный изменением не считается: он
    говорит, что реализация научилась выводить, а не что диалог переменился. То
    же правило, что у состояния заказа.

  separator_note: >-
    Части версии разделяются знаком, который не встречается внутри самих
    значений. Позиция непрозрачна, и разделитель вроде двоеточия резал бы её
    пополам - в снимках позиция сама содержит двоеточие.

# --- Что лежит в нагрузке ----------------------------------------------------
# Раздел появился после того, как выяснилось: схемы событий требовали вложить в
# нагрузку модель целиком, а эталонная реализация клала туда идентификаторы - и
# так во всех видах, кроме одного. Ни одна проверка этого не смотрела.
payload_rule:
  rule: >-
    Нагрузка события - указатель на сущность, а не её копия: идентификаторы и то,
    что переменилось, но не содержимое.

  why: >-
    Событие уходит обработчику, а оттуда в журнал, в очередь, в чужую систему.
    Модель заказа обязывает нести имя покупателя и имя продавца, модель сообщения
    - его текст. Нести туда чужую переписку незачем: кому нужны подробности, тот
    читает страницу сам и знает, что делает.

    Второй довод - наблюдаемость. Модель заказа требует сумму в минорных
    единицах, а со страницы списка сумма читается текстом вместе с символом
    валюты. Требовать в нагрузке то, чего не наблюдали, значит заставлять
    реализацию либо выдумывать значение, либо не порождать событие вовсе.

  self_sufficient: >-
    Нагрузка несёт идентификатор своей сущности, даже когда тот же
    идентификатор есть в конверте. Нагрузку принято передавать дальше отдельно
    от конверта, и там она обязана оставаться самодостаточной.

  no_sentinels: >-
    Ненаблюдённое значение передаётся как null, а не меткой вроде «?». Метка
    живёт в курсоре, где нужна строка, и наружу ей выходить незачем: получатель,
    увидевший «?», решит, что это состояние заказа.

  naming: >-
    Ключ нагрузки читают шесть языков. Имя, которое хотя бы в одном из них
    приходится экранировать, - плохое имя: пара from и to заменена на previous и
    current после того, как валидатор спецификации сам предупредил, что from -
    ключевое слово в Python.

# --- Как считается отпечаток -------------------------------------------------
# Раздел существует потому, что отпечаток и есть ключ идемпотентности, а
# спецификация задавала только СОСТАВ полей. Ни алгоритма, ни разделителя, ни
# кодировки, ни длины - то есть шесть SDK, написанных строго по спецификации,
# дали бы шесть разных идентификаторов одному и тому же событию, и гашение
# повторов у пользователя, подключившего две реализации, не сработало бы ни разу.
fingerprint_algorithm:
  normative: true
  fields_in_order: [account_id, type, entity_id, entity_revision]
  encoding: utf-8
  separator: "U+001F"
  separator_note: >-
    Управляющий знак, а не двоеточие и не дефис: все четыре части приходят
    снаружи, и любой печатный разделитель рано или поздно встретится внутри
    части. Тогда две разные четвёрки склеятся в одну строку, и два разных
    события получат один отпечаток - молча.
  hash: blake2s
  digest_size_bytes: 16
  representation: hex_lowercase
  length_chars: 32
  length_note: >-
    Тридцать два знака от шестнадцатибайтного хэша - это он сам целиком, а не
    срез. Длина зафиксирована отдельно, чтобы реализация не удлинила её вслед за
    сменой хэша, не заметив, что этим обнулила сохранённые ключи.

  why_not_sha256: >-
    Выбор не про стойкость: отпечаток не защищает ни от кого, он различает.
    Зафиксирован он потому, что должен совпасть у шести реализаций, а не потому,
    что blake2s чем-то лучше.

  stability: >-
    Алгоритм менять нельзя без смены версии формата состояния. Смена алгоритма
    обнуляет гашение повторов у каждого, кто уже работает: сохранённые
    идентификаторы не совпадут ни с чем, и всё, что было доставлено, придёт
    заново.

# --- Идентичность события --------------------------------------------------
identity:
  preferred: remote_id
  fallback: deterministic_fingerprint

  fingerprint_from:
    - account_id
    - type
    - entity_id
    - entity_revision

  forbidden_in_fingerprint:
    - >-
        observed_at. Момент наблюдения меняется от запуска к запуску, и событие,
        пережившее рестарт, получит новый идентификатор. Дедупликация перестанет
        работать ровно там, где она нужнее всего.
    - >-
        adapter_revision. Версия адаптера меняется при каждом исправлении разметки,
        то есть при самом частом релизе проекта. Включение её в идентичность
        обнулит ключи идемпотентности, сохранённые пользователями в своих базах.
    - >-
        Любое поле времени с точностью, отличной от exact. Относительная метка
        резолвится по-разному в разных запусках.

# --- Дедупликация ----------------------------------------------------------
deduplication:
  scope: ordering_key
  eviction: lru
  min_entries_per_key: 256
  ttl_ms: 3600000
  ttl_rule: >-
    Время жизни записи не меньше удвоенного максимального интервала опроса после
    отступления. Иначе после длинного backoff запись успевает истечь, и то же
    событие проходит как новое.
  durability_required: true
  durability_rule: >-
    Кэш дедупликации переживает рестарт. Кэш только в памяти означает, что после
    любого перезапуска повторно приходит всё, что успело прийти до него.
  metric: events_deduplicated
  metric_rule: >-
    Число погашенных повторов обязано быть наблюдаемым. Ложная дедупликация -
    когда два разных события схлопнулись в одно из-за грубого отпечатка - иначе
    невидима: событие просто не приходит, и найти причину не по чему.

# --- Переполнение очереди --------------------------------------------------
backpressure:
  bounded: true
  lanes:
    control_plane:
      carries:
        - protocol.health_changed
        - event.loss
        - watch.degraded
        - watch.primed
        - snapshot.incomplete
      droppable: false
      rule: >-
        События о состоянии системы не выбрасываются никогда. Выбросить сообщение
        о потере событий - значит потерять и сам факт потери.
    data_plane:
      carries:
        - message.created
        - chat.unread_changed
        - order.created
        - order.status_changed
        - review.changed
        - lot.price_changed
        - lot.stock_changed
      droppable: false
      rule: >-
        События с ключом упорядочивания не выбрасываются из очереди ДОСТАВКИ.

        Оговорка про производителя, стоявшая здесь прежде, для опрашивающего
        клиента неисполнима: производитель - площадка, и остановить её нельзя.
        Ограничение у такого клиента ложится не на доставку, а на очередь
        РАБОТЫ - список диалогов, которые предстоит дочитать. Её переполнение
        означает, что часть событий этой полосы не будет порождена вовсе, и об
        этом обязано быть сказано вслух: см. restart.queue_overflow_is_loud.

        Называть это остановкой производителя значило бы прятать настоящую
        потерю за успокоительным словом.
    monitoring:
      carries:
        - market.price_changed
        - market.offer_appeared
        - market.offer_disappeared
        - seller.online_changed
      droppable: true
      coalescing: allowed
      rule: >-
        Наблюдения за рынком можно сжимать: десять последовательных изменений цены
        сводятся к паре before и latest. Сжатое событие обязано нести before,
        latest, min, max, число наблюдений и границы окна - иначе пороговый фильтр
        на стороне пользователя получит не тот вход, на который рассчитан.
  loss_visible: true
  loss_rule: >-
    Любая потеря порождает event.loss с указанием ключа, числа потерянных событий
    и причины. Молчаливый сброс запрещён: он неотличим от отсутствия событий.

# --- Рестарт ---------------------------------------------------------------
restart:
  cursor_commit: after_handlers
  cold_start_rule: >-
    При первом запуске наблюдения снимок сохраняется молча, без порождения событий
    на каждую сущность, и выдаётся одно watch.primed. Иначе холодный старт даёт
    лавину «изменений» по всему наблюдаемому множеству сразу.
  incompatible_cursor: >-
    Курсор чужой версии формата или чужого семейства адаптера даёт
    CursorIncompatibleError. Молчаливое чтение с начала запрещено: оно порождает
    повторную обработку всего, что уже обработано.
  conformance_suite: resume
  conformance_vector: >-
    Убийство процесса после старта обработчика, перезапуск, то же событие с тем же
    идентификатором и тем же ключом идемпотентности, ноль потерь.
