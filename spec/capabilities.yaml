# Реестр возможностей.
#
# Зачем это отдельный файл, а не набор оговорок в описаниях операций.
# В любой библиотеке над неофициальным интерфейсом половина функций существует
# условно: «если протокол подтверждён», «если интерфейс позволяет», «там, где
# проверено». Пока такие оговорки живут прозой, каждая из шести реализаций решает
# их по-своему, и ни один тест этого не видит, потому что негативная ветка вектором
# не покрыта. Здесь у каждой оговорки есть идентификатор, состояние и обязательный
# вектор на обе ветки.
#
# ГЛАВНОЕ ПРАВИЛО: unsupported выставляется ТОЛЬКО по позитивному свидетельству.
# Страница получена, отпечаток совпал, элемента функции нет. Любая транспортная,
# протокольная или бюджетная ошибка при пробе даёт unknown, а не unsupported.
# Нарушение этого правила означает: одно попадание в 429 при старте навсегда
# записывает возможность в «отсутствует», пользовательский код уходит в else-ветку
# и молча делает не то, что задумано, до перезапуска процесса.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

# --- Состояния -------------------------------------------------------------
states:
  supported:
    summary: Возможность подтверждена и доступна.
    usable: true
    opt_in_required: false

  unsupported:
    summary: >-
      Возможность отсутствует по позитивному свидетельству. Вызов завершается
      UnsupportedCapabilityError.
    usable: false
    opt_in_required: false

  experimental:
    summary: >-
      Возможность реализована, но контракт может измениться. Требует явного
      включения; без него вызов завершается ExperimentalCapabilityError.
    usable: true
    opt_in_required: true
    note: >-
      Признак usable здесь означает «возможность работает», а не «звать
      разрешено». Решение о вызове принимается по предикатам ниже, и в is_usable
      это состояние не входит. Реализация, выведшая решение из этого признака,
      пропустит экспериментальную возможность без включения, то есть отменит ту
      единственную ветку, ради которой состояние заведено. Так и произошло в
      первой порождённой реализации.

  degraded:
    summary: >-
      Возможность работает, но адаптер наблюдает частичную деградацию извлечения
      на связанной странице. Вызов разрешён, результат может быть неполным, и это
      отражено в поле completeness результата. Состояние существует, чтобы отличить
      «работает не полностью» от «не работает»: без него оба случая пришлось бы
      кодировать одним значением, и на такое состояние невозможно написать тест.
    usable: true
    opt_in_required: false

  unknown:
    summary: >-
      Состояние не установлено. Вызов НЕ блокируется: выполняется оптимистично, и
      при отказе пользователь получает типизированную ошибку. Молчаливый уход в
      else-ветку невозможен по построению.
    usable: true
    opt_in_required: false

# --- Предикаты -------------------------------------------------------------
# Приведение состояния к булеву значению запрещено во всех SDK. В Python это
# означает отказ приведения к логическому значению - в питоне это __bool__,
# поднимающий встроенную ошибку типа с подсказкой. Причина: в §8.2 blueprint
# сначала приведён пример `if cap.chats.send_images`, а строкой ниже объявлено пять
# состояний. Булев тест над пятизначным перечислением разрешается в каждом языке
# по-своему, и один и тот же пример из документации в Python и TypeScript уходит
# в разные ветки.
# Предикаты нормативны, признаки внутри states описательны.
#
# Различие пришлось назвать вслух после того, как порождённый из states код
# оказался неверным. У состояния experimental признак usable равен true, и это
# правда: возможность работает. Но решение «звать или отказать» принимается не
# по нему, а по предикату, и в предикате experimental отсутствует.
#
# Вопросов на самом деле два, и путать их нельзя. Первый: работает ли
# возможность вообще. Второй: можно ли звать её прямо сейчас, без
# дополнительных условий. Реализация обязана выводить решение из предикатов.
predicates:
  normative: true
  decision_rule: >-
    Вызов разрешён, если состояние перечислено в is_usable, либо если оно
    перечислено в requires_opt_in и вызывающий включил возможность явно. Во всех
    прочих случаях вызов отклоняется.
  is_usable:
    true_for: [supported, degraded, unknown]
    summary: Вызов допустим. Не гарантирует успех, гарантирует отсутствие запрета.
  requires_opt_in:
    true_for: [experimental]
    summary: Нужно явное включение перед вызовом.

# --- Правила пробы ---------------------------------------------------------
probe:
  rules:
    - Статические возможности объявляются таблицей в адаптере и не требуют сети.
      Проба нужна только для тех, что зависят от конкретного аккаунта.
    - Неуспешная проба даёт unknown. Ошибка сети, 429, изменившаяся разметка и
      истёкшая сессия не являются свидетельством отсутствия функции.
    - Проба выполняется лениво по группе, а не залпом сразу после логина. Момент
      сразу после входа - самый подозрительный для площадки, и серия запросов в
      этот момент даёт худший возможный первый след.
    - >-
        На capabilities() действует single-flight. Параллельные вызовы дожидаются
        одной пробы, а не запускают по своей.
    - Профиль возвращается с полями evaluated_at и source (static, probe,
      observed_failure) и инвалидируется при смене сессии и при первом
      ProtocolChangedError на связанной странице.

# --- Реестр ----------------------------------------------------------------
# source: static  - объявляется адаптером без сети
# source: probe   - зависит от аккаунта, требует лёгкой пробы
# source: derived - выводится из результата другой возможности
capabilities:

  account.profile:
    summary: Чтение профиля аккаунта, от имени которого работает клиент.
    source: static
    initial: supported

  account.transactions:
    summary: Чтение операций по счёту.
    source: probe
    initial: unknown
    governed_without_operation: engine_state
    note: >-
      Своей операции у возможности нет НАРОЧНО. Таблица операций лежит на той же
      странице, что и балансы, и приходит тем же чтением: отдельный запрос за
      ней означал бы два похода на площадку за одним ответом.

      Возможность объявлена отдельно потому, что площадка вправе показать баланс
      и не показать историю - например новому аккаунту. Тогда балансы прочтутся,
      а перечень операций окажется пуст.

      Состояние выставляется движком по наблюдению, а не указателем на поле
      модели: перечень операций возвращается всегда - пустой либо нет, - и
      пометка «может не наблюдаться» на нём была бы ложью. Различие несёт пара
      полноты с причиной: пустая таблица даёт unknown, потому что счёта без
      единой операции никто не видел.


      Таблица операций лежит на той же странице, что и балансы, и наблюдена
      вместе с ними 24.08.2026. Отдельной возможностью объявлена потому, что
      площадка вправе показывать баланс и не показывать историю - например
      новому аккаунту.

      source остаётся probe по той же причине: наблюдён один счёт, и притом свой.
      Чужого счёта не бывает, второй стороны у этого наблюдения не будет никогда.

  account.balance:
    summary: Чтение баланса аккаунта.
    source: probe
    initial: unknown
    note: >-
      Баланс показан не на всех страницах и не всем типам аккаунтов - потому
      source и probe, а не static.

      До 0.10.0 у возможности не было ни одной операции, и она объяснялась
      указателем на поле модели. Операция account.balance появилась, объяснение
      снято: объяснять отсутствие того, что присутствует, хуже умолчания.

      Указатель вёл на balances, а не на balance, и это было не переименование.
      Перепись знаков валют по /account/balance от 23.08.2026 нашла на одной
      странице три разные валюты в узлах span.balances-value. Скалярного баланса
      у аккаунта нет; есть перечень по валютам.

      Прежде здесь стояло второе предложение: «отсутствие значения не равно нулю:
      поле помечено unobserved-possible в модели». Это утверждение о СХЕМЕ, а не
      объяснение решения, и сверял его никто. Сняли бы пометку со схемы -
      примечание осталось бы обещать различие, которого нет. Теперь на поле
      указывает model_field_declared_in, а поле указывает обратно, и снять
      можно только обе стороны сразу.

  catalog.categories:
    summary: Чтение дерева разделов каталога.
    source: static
    initial: supported

  catalog.field_schema:
    summary: Чтение схемы полей конкретной подкатегории.
    source: probe
    initial: unknown
    note: >-
      В blueprint это была оговорка «если удаётся достоверно нормализовать».
      Теперь у неё есть идентификатор и обязательный вектор на unsupported-ветку.

  market.offers:
    summary: Чтение публичных предложений по подкатегории.
    source: static
    initial: supported

  market.snapshot:
    summary: Снимок рынка для сравнения и мониторинга.
    source: derived
    derived_from: market.offers
    initial: supported

  lots.list_own:
    summary: Чтение собственных предложений продавца.
    source: static
    initial: supported

  lots.activate:
    summary: Включение лота в выдачу.
    source: probe
    initial: unknown

  lots.deactivate:
    summary: Снятие лота с выдачи.
    source: probe
    initial: unknown

  lots.update_price:
    summary: Изменение цены лота.
    source: probe
    initial: unknown
    note: Требует expected_revision, иначе параллельная правка будет перетёрта.

  lots.promote:
    summary: Поднятие лота в выдаче.
    source: probe
    initial: unknown
    note: >-
      Доступность зависит от режима и от того, сколько времени прошло с прошлого
      поднятия. Вывод «поэтому состояние вычисляется пробой» отсюда снят: он
      повторял поле source, у которого есть читатели - генератор и набор
      соответствия, - и был объявлен ТРИЖДЫ, считая примечания самой операции.
      Третья копия одного факта расходится с двумя первыми молча.

  orders.list:
    summary: Чтение списка заказов.
    source: static
    initial: supported

  orders.get:
    summary: Чтение конкретного заказа.
    source: static
    initial: supported

  orders.events:
    governed_without_operation: not_implemented
    summary: Распознавание событий заказа из канала обновлений.
    source: probe
    initial: unknown
    note: >-
      Зависит от того, есть ли структурный признак системного сообщения. Если его
      нет и распознавание идёт по тексту, возможность объявляется degraded, а не
      supported: текст пишет контрагент, и он может его подделать.

  chats.list:
    summary: Чтение списка личных переписок.
    source: static
    initial: supported

  chats.history:
    summary: Чтение недавней истории переписки.
    source: static
    initial: supported

  chats.history_pagination:
    summary: Догрузка более старых сообщений через курсор.
    source: probe
    initial: unknown
    note: Оговорка blueprint «если интерфейс позволяет».

  chats.send_text:
    summary: Отправка текстового сообщения.
    source: static
    initial: supported

  chats.send_image:
    summary: Отправка изображения или вложения.
    source: probe
    initial: unknown
    note: >-
      Оговорка blueprint «только при подтверждённой capability». Отдельно учесть
      п.1.12 правил площадки про ссылки на файлообменники: если возможность
      реализуется через внешний хостинг, это столкновение с правилами.

  chats.mark_read:
    summary: Отметка переписки прочитанной.
    source: probe
    initial: unknown
    note: Оговорка blueprint «если операция существует и протестирована».

  reviews.get:
    summary: Чтение отзывов с профиля продавца.
    source: probe
    initial: unknown
    note: >-
      До 0.8.0 здесь стояло governed_without_operation: not_implemented -
      возможность объявлена, а звать через неё нечего. Операция появилась, и
      пометка снята.

      source остаётся probe, а не static: наблюдался только собственный профиль.
      Отдаёт ли чужой ту же разметку - неизвестно, и объявлять поддержку
      заранее значило бы обещать непроверенное.

  protocol.locale:
    summary: >-
      Умеет ли адаптер распознавать системные тексты на той локали, которую
      площадка отдаёт этому аккаунту.
    source: static
    initial: supported
    governed_without_operation: engine_state
    value_set_declared_in: spec/version.yaml#supported_locales
    what_changed_here: >-
      Стояло value_kind: locale_set и «не булева возможность: значением является
      множество локалей». Это обещало вызывающему, что возможность ВЕРНЁТ ему
      набор локалей. Она возвращает состояние, как и все прочие: наблюдённая
      локаль либо входит в объявленный набор, либо нет.

      Само множество никуда не делось - оно объявлено в spec/version.yaml и
      порождается оттуда в реализацию. Указатель ведёт туда, и ворота требуют,
      чтобы он разрешался в непустой перечень: возможность, чей набор пуст,
      отвечала бы «не поддерживается» на любую локаль, включая ту, на которой
      площадка и работает.
    rationale_declared_in: spec/extraction/session.yaml#unsupported_locale_rule
    note: >-
      Вынесено в capability, потому что смена языка интерфейса ломает разбор,
      не ломая отпечаток страницы: отпечаток проверяет структуру, а меняется
      только текст, и защита от смены разметки такой отказ не ловит - он тихий.

      Чем именно грозит чужая локаль, здесь не перечисляется: это объявлено
      нормативно в spec/extraction/session.yaml, и повторять перечень значило бы
      завести ему вторую редакцию.

# --- Требования к спецификации ---------------------------------------------
# Требования к набору соответствия, машиночитаемо.
#
# Раздел появился после того, как выяснилось: набор умел тихо уменьшаться. Убери
# из spec/conformance/capabilities.vectors.json ветку unsupported - и двадцать
# два вектора исчезают, а раннер печатает «отказов: 0» и выходит с нулём. То же
# самое делал initial_state.check: false.
#
# Требование стоит ЗДЕСЬ, а не в самом наборе, нарочно. Требование, лежащее
# внутри того, что оно требует, снимается вместе с ним: сотри обе строки, и
# сверять станет нечего, а обе сборки останутся зелёными.
conformance_requirements:
  per_capability_branches:
    - state: supported
      allowed: true
    - state: unsupported
      allowed: false
      typed_error: required

  initial_state_required: true

  why: >-
    Ветка unsupported обязательна не для симметрии. Отказ при отсутствующей
    возможности - единственная ветка, которую вызывающий обязан уметь ловить, и
    единственная, которую негативным вектором не покрывали НИКОГДА: набор
    показывал бы согласие двух реализаций, ни разу не спросив у них, что они
    делают, когда возможности нет.

  enforced_by: >-
    scripts/conformance.js отказывается собирать набор, если объявленные ветки
    не покрывают требуемых. scripts/validate.js требует, чтобы сам этот раздел
    существовал и был непуст.

requirements:
  - Любая условная формулировка в описании операции обязана ссылаться на
    идентификатор возможности. Проверяется scripts/validate.js.
  - У каждой возможности обязан быть вектор conformance на supported-ветку и
    ОБЯЗАТЕЛЬНЫЙ вектор на unsupported-ветку с типизированной ошибкой.
  - >-
      Таблица состояний в документации генерируется из манифестов SDK, а не пишется
      руками: рукописная таблица расходится с реальностью на первом же релизе.
  - Операция может стоять в стабильном наборе, только если для неё существует
    наблюдаемое обратное чтение и оно выполняется в canary. Иначе гарантия
    непроверяема, что противоречит собственному правилу проекта.
