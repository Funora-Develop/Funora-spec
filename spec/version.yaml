# Версия спецификации и всех форматов, от которых зависит совместимость.
#
# Три оси намеренно разведены. SDK и спецификация версионируются независимо:
# пользователю важна не версия пакета, а то, какую версию контракта он поддерживает.

# 0.2.0: четыре захода подряд меняли контракт ломающе, а версия стояла на
# месте - отличить одну редакцию от другой было нечем.
#
# Что сломалось: версия канонической формы поднята до 2 (правила 2, 5, 8
# заработали, правила 10 и 11 исправлены на обратные), формат файла состояния
# поднят до v4 (метки гашения стали моментами, а не показанием секундомера),
# несовместимость курсора отделена от несовместимости схемы файла, разделитель
# частей версии назван и сменён на U+001E, у операций появился перечень ошибок.
#
# Вторая часть, а не первая: пока мажор - ноль, контракт объявлен
# неустоявшимся, и ломающее выражается минором. См. spec/compat-rules.yaml,
# раздел zero_major.
# 0.4.0: порядок шагов классификации был объявлен ДВАЖДЫ, и два объявления
# разошлись. spec/extraction/session.yaml ставил пустое тело первым шагом,
# раньше проверки личности; единый перечень и эталонная реализация проверяют
# личность раньше.
#
# Что это меняет для читавшего второе объявление: пустой ответ с ЧУЖОГО адреса
# он классифицировал бы как «непонятно, что пришло» и повторил бы запрос.
# Верное - «ответ с чужого адреса»: остановиться и разобраться с настройкой.
# Молча повторять запрос на чужой хост - именно то, чего порядок и не должен
# был допустить.
#
# Второе объявление снято, недостающий шаг внесён в единый перечень на своё
# место, и второй перечень запрещён воротами.

# 0.4.1: у lots.promote описано предусловие остывания, которое площадка
# накладывала и прежде. Патч, а не мажор: предусловие вида state вызывающий не
# подаёт и повлиять на него не может, отказ PreconditionFailedError у операции
# уже был объявлен, и нового ограничения появление не вводит.
#
# Различие ввёл сам классификатор. Он потребовал мажор за документирование
# бывшего - то есть не отличал «ввели новое» от «описали то, что было. Теперь
# у предусловия объявляется вид, и оба случая классифицируются раздельно.

# 0.5.0: в словарь типов добавлен opaque - непрозрачный скаляр без домена.
# Слово стояло в правилах извлечения у двух полей и не было объявлено нигде.
#
# Тип - не украшение: на нём стоит всё, что о поле известно, - можно ли разбирать
# значение, можно ли считать, можно ли показывать. Необъявленный тип шесть
# реализаций истолкуют по-своему, а opaque от entity_id отличается существенно:
# второй называет сущность, первый не называет ничего, он просто меняется.

# 0.6.0: заведён отказ NotImplementedOperationError - «операция объявлена
# контрактом и не написана этой реализацией». Отличается от unsupported тем, что
# говорит о SDK, а не о площадке: площадка функцию имеет, руки не дошли.
#
# Прежде обращение к ненаписанной службе давало отказ САМОГО ЯЗЫКА, и вызывающий,
# обернувший работу в общий перехват, падал не операцией, а всем процессом.
#
# Вместе с ним заведён раздел behaviours: контракт называет намерение
# (absent_member), а перевод в идиом языка делает генератор. Назвать в
# языконезависимом контракте класс одного языка значило бы отдать контракт ему.

# 0.7.0: описан пустой список продаж - по НАБЛЮДЕНИЮ, а не по рассуждению.
#
# Площадка при пустом списке не рисует таблицу совсем: вместо неё короткое
# сообщение в отдельном абзаце, а форма фильтра остаётся. Снято контрольной
# парой в одну минуту - та же страница с фильтром, дающим пустоту, и без него.
#
# Это закрыло молчаливый дефект. Курсор снимается только с полного чтения;
# пустой список объявлялся неполным, курсор на нём не заводился, и заводился он
# на следующем чтении - том, где первая продажа уже была. Событие о ней
# поглощалось и не приходило вовсе.

# 0.8.0: наблюдение, которое всё это время лежало непрочитанным.
#
# Служба отзывов написана целиком - и без единого нового похода на площадку.
# Снимок профиля от 23.08.2026, снятый ради идентификатора аккаунта, нёс шесть
# полных отзывов с адресуемой разметкой: оценку в имени класса, автора, заказ,
# текст, дату. Перечень нужных наблюдений при этом требовал снять reviews.ru,
# потому что «службы отзывов нет вовсе».
#
# Тем же перечитыванием сняты два ложных утверждения схем. Первое: «идентификатор
# пользователя из наблюдённых страниц не читается» - собственный читается, он
# стоит в data-user на всех четырёх авторизованных снимках. Второе: «баланс
# объявлен обязательным, а страница с балансом не наблюдалась» - обязательным он
# не объявлен, страница наблюдалась, и перепись нашла на ней ТРИ валюты. Поле
# balance стало перечнем balances: одно скалярное значение такую страницу
# описать не может.
#
# ПРАВИЛО, КОТОРОЕ ИЗ ЭТОГО СЛЕДУЕТ. Прежде чем идти на площадку, надо
# перечитать снятое. Страница отдаёт всё, что на ней есть, а снимают её ради
# одного поля.

# 0.9.0: ревизия по наблюдениям, которые уже лежали на диске.
#
# Сорок три проверяющих обошли контракт и сверили каждое утверждение с файлами
# наблюдений. Двадцать находок устояли после проверки скептиком.
#
# Самая дорогая - моя же, сделанная в тот же день. Раздел об отзывах утверждал,
# что управления постраничным выводом на странице нет ни одного узла, и ссылался
# на перебор классов по образцу more|pagin|load|next|prev. Узлы есть - форма
# dyn-table-form и кнопка dyn-table-continue, обе сразу за таблицей, - и названы
# они не теми словами. ОТСУТСТВИЕ БЫЛО ОБЪЯВЛЕНО ПО НЕУДАЧЕ ПОИСКА.
#
# Чтение отзывов больше не объявляется полным ни разу: смысл класса hidden у
# кнопки догрузки не наблюдён, и до наблюдения всякий вызывающий обязан
# признавать неполноту.
#
# Прочее того же рода: страница заказа объявлена ненаблюдённой при снимке в
# фикстурах; свидетельство взаимной исключительности признаков сессии записано
# перевёрнутым; метка обновлений объявлена непроверяемой по снимку, хотя лежит в
# нём отдельным атрибутом; «десять сообщений» при одиннадцати; «три страницы» в
# шести обоснованиях при семи снимках.
#
# Канал /runner/ переписан по машиночитаемым записям. Он оказался не «способом
# узнать об изменении», а общим каналом: тем же запросом идёт опрос и действие.
# Отправка изображения - то же действие chat_message с пустым содержимым и
# добавленным image_id, а загрузка файла идёт НА САМУ ПЛОЩАДКУ, что снимает
# опасение о столкновении с публичными правилами про сторонние файлообменники.

# 0.10.0: страница одного заказа читается. Пятая операция из двадцати двух.
#
# Наблюдение стоило нуля походов на площадку: снимок лежал в проекте с
# 23.08.2026, а реестр всё это время утверждал, что операцию нельзя написать,
# потому что «наблюдать пока удалось три страницы».
#
# ГЛАВНОЕ ПРО ЭТУ СТРАНИЦУ. Восемь её параметров подписаны локализованными
# метками в узлах БЕЗ КЛАССА, и различить поля между собой разметка не даёт. Два
# из восьми совпадают ПОБАЙТОВО вместе с обёрткой и цепочкой предков - 624 байта
# против 624, - и отличаются только положением.
#
# Отсюда решение: именованными полями отдаётся то, у чего есть свой якорь -
# атрибут, класс, ссылка; остальное отдаётся перечнем «метка и значение» как
# есть. Разбор, назвавший восьмой параметр по его месту, соврал бы в тот день,
# когда площадка переставит колонки, - и соврал бы молча.
#
# Проверено пятьюдесятью семью независимыми разборами: из пятидесяти трёх
# утверждений об адресуемости устояло одиннадцать. Опровержения почти все
# улучшали адрес, а не отменяли поле, и три из них сняли опору на утилитарные
# классы оформления.
#
# Что страница дала сверх заказа: идентификатор диалога - по нему переписку
# читают целиком; признак блокировки контрагента - класс, которого словарь
# присутствия не знал вовсе; и положительный признак отсутствия отзыва -
# атрибут оценки присутствует и пуст.

# 0.11.0: страница баланса читается, и она же закрыла вопрос про догрузку.
#
# Шли за балансами: схема с 0.8.0 объявляла перечень, а не одно значение, по
# переписи знаков валют. Разметка подтвердила - три узла значения, ровно три.
#
# Нашли сверх того ТАБЛИЦУ ОПЕРАЦИЙ. Двадцать пять строк на той же машинерии
# dyn-table, с идентификатором в атрибуте, состоянием в имени класса строки и
# суммой, отделённой от знака валюты. Операции для неё в контракте не было
# объявлено вовсе - ни реализации, ни записи в реестре.
#
# И ЭТА ЖЕ СТРАНИЦА ДАЛА ВТОРУЮ СТОРОНУ ПАРЫ, которой полдня не хватало отзывам:
#
#   отзывы, показаны все шесть          -> кнопка догрузки С классом hidden
#   операции, двадцать пять и есть ещё  -> кнопка догрузки БЕЗ класса hidden
#
# Виджет один и тот же, класс один и тот же, и два случая разошлись ровно так,
# как предсказывало объяснение «спрятана, когда догружать нечего». Чтение отзывов
# снова объявляет полноту - но помечает её ВЫВЕДЕННОЙ: пара снята с разных
# страниц.
#
# Догрузка при этом не выполняется ни на одной странице: имена скрытых полей
# формы в скелете замаскированы, и собрать запрос по снимку нельзя. Запись
# dyn_table_continue_request закроется наблюдением ОДНОГО запроса - и закроет
# догрузку сразу у обеих страниц.

# 0.12.0: витрина продавца читается. Седьмая операция из двадцати четырёх.
#
# Витрина - ПУБЛИЧНЫЙ вид предложений: то, что видит покупатель. Она не то же,
# что страница управления лотами: ни признака включённости, ни правки цены, ни
# кнопки поднятия на ней нет, и запись потому отличается от Lot по типу.
#
# ЛОВУШКА, СТОИВШАЯ БЫ ЦЕЛОГО РАЗДЕЛА. Класс offer на профиле носят
# ЧЕТЫРНАДЦАТЬ узлов, а разделов витрины тринадцать: четырнадцатый - блок
# отзывов, переиспользующий тот же класс. Разбор, взявший .offer за раздел,
# отдал бы вызывающему пустую категорию без заголовка.
#
# ПОЛНОТА НЕ ОБЪЯВЛЯЕТСЯ НИ РАЗУ, и это не осторожность впрок. Признака усечения
# на странице нет ни одного - но у семи разделов из тринадцати ровно по двадцать
# строк. Двадцать круглое число, и семь совпадений подряд на случайность не
# похожи: это положительный довод в пользу обрезания, а не отсутствие довода
# против. Доказательством он не является, и закроет вопрос страница управления
# лотами, где число предложений раздела видно продавцу прямо.
#
# Адрес предложения отдаётся целиком, непрозрачной строкой: идентификатор лежит
# в строке запроса, а формат скелета заменяет её одной подписью. Разобрать
# параметр по снимку нельзя, и проверить такой разбор тоже нечем.

# 0.13.0: каталог читается. Восьмая операция и последняя из чтения страниц.
#
# Страница крупнейшая из наблюдённых - тридцать три тысячи строк, восемьсот сорок
# две игры, четыре с лишним тысячи ссылок на разделы, - и ловушек в ней больше,
# чем на любой другой. Разобрана пятьюдесятью одним независимым чтением; из сорока
# семи утверждений об адресуемости устояло тринадцать.
#
# СЕМЬ ЛОВУШЕК, и каждая даёт молчаливо неверный ответ - при полноте и нуле
# повреждений. Перечислены поимённо в spec/extraction/catalog.yaml; самые дорогие
# три:
#
#   Списков ДВА, и все восемь карточек избранного повторяют основной каталог.
#   Обход по документу удвоил бы восемь игр.
#
#   Заголовков 872 при 842 карточках. Четырнадцать карточек несут по нескольку -
#   это ВАРИАНТЫ игры, и лишние помечены классом hidden. Фильтр по нему потерял
#   бы двадцать два настоящих варианта с собственными идентификаторами.
#
#   Ссылка на игру - это ОДНОВРЕМЕННО первая ссылка её списка разделов, 864 раза
#   из 864. Наивный сбор «заголовок плюс все разделы» удвоил бы главный раздел
#   каждой игры. Он помечается, а не выбрасывается: выброшенный, он унёс бы
#   сведение о том, какой раздел у игры главный.
#
# ПОЛНОТА ОБЪЯВЛЯЕТСЯ ПО ПОЛОЖИТЕЛЬНОМУ ДОВОДУ, и это первый такой случай за
# день. Указатель по буквам не обещает ни одной группы, которой на странице нет:
# число ссылок равно числу групп, подписи текста совпадают по порядку. Кнопки
# догрузки на странице нет, но её ненаходка доводом не является - и здесь не
# нужна.

# 0.14.0: аккаунт, сессия и профиль возможностей. Двенадцать операций из
# двадцати четырёх, и ни одна из четырёх новых не потребовала наблюдения.
#
# ДВА ТИПА БЫЛИ ОБЪЯВЛЕНЫ ВОЗВРАЩАЕМЫМИ И НЕ ИМЕЛИ СХЕМ. SessionHealth и
# CapabilityProfile назывались в spec/services, а формы у них не было: реализовать
# по контракту нельзя, сверить ответы двух SDK нечем. Про второй это было записано
# в реестре прямым текстом и лежало там непрочитанным.
#
# У СРОКА ДРОССЕЛЯ ПОЯВИЛОСЬ ЧИСЛО. Прежде min_health_interval_ms имел имя и не
# имел значения: операция обещала кэш, механизма не существовало, договориться о
# частоте шесть реализаций не смогли бы при всём желании. Число ВЫБРАНО, а не
# измерено, и это сказано там же - срок дросселя наша политика, а не свойство
# площадки.
#
# ЧТЕНИЕ АККАУНТА БЕРЁТ СТРАНИЦУ ПЕРЕПИСКИ, и выбор не случаен: собственный
# идентификатор лежит в data-user, а тот есть только там, где есть виджет
# переписки. На списке продаж и на странице баланса его нет вовсе - с любой
# авторизованной страницы прочесть себя нельзя.
#
# ПРОВЕРКА СЕССИИ ОТЧИТЫВАЕТСЯ, А НЕ ПАДАЕТ. Отказ площадки здесь ответ, а не
# происшествие: её зовут именно затем, чтобы узнать о нём заранее.
#
# И ещё одно расхождение вскрылось попутно. Реестр числил chats.history
# нереализованной - при том что соседний абзац той же записи говорил обратное.
# Ворота не видели этого, потому что выводили реализованность из имени вида
# «служба.метод», а операция выполняется методом thread.

# 0.15.0: формат скелета v8. Атрибут-объект сохраняет КЛЮЧИ и маскирует
# значения.
#
# Заведено ради одного места, и место это перекрывает СЕМЬ операций записи.
# Защитный токен площадки лежит в объекте JSON атрибута data-app-data; пока
# атрибут маскировался целиком, в снимке не было ни одного ключа этого объекта, и
# разбор, достающий оттуда токен, проверить было НЕ НА ЧЕМ.
#
# Токен читаемым не становится и не должен. Читаемым становится ПУТЬ до него.
#
# Третий случай одного и того же за проект: сумма на странице заказа делилась
# образцом по тексту и на снимке не работала вовсе; идентификатор предложения на
# витрине лежит в строке запроса, которую скелет заменяет одной подписью. Оба
# раза правило удалось переписать на структуру - здесь так не выйдет, токен это
# значение.
#
# ПРАВИЛО УЗКОЕ ПО ПОСТРОЕНИЮ. Значение обязано разбираться как объект, и каждый
# его ключ - на всех уровнях вложенности - иметь вид имени поля. Один ключ,
# пришедший из данных, отменяет правило для всего атрибута: ключом бывает и то,
# что написал человек, и сборщик наблюдений на этом уже обжёгся.
#
# ЧТО ПОТРЕБУЕТСЯ ДАЛЬШЕ. Старые снимки ключей не несут и нести не будут -
# формат применяется при съёмке. Любая авторизованная страница, переснятая
# новым форматом, откроет разбор токена.

# 0.16.0: чужой текст на странице приложения больше не даёт вердикта.
#
# Признаком страницы приложения объявлено МЕНЮ ВОШЕДШЕГО, и текстовые подписи -
# challenge_text, blocked_text, maintenance_text - на такой странице не
# применяются вовсе.
#
# Прежде признаками служил перечень из пяти селекторов отдельных страниц, и он
# был объявлен закрытым по построению. Сверка с двадцатью снимками нашла СЕМЬ
# страниц вошельца, где не было ни одного из пяти. Двое из них показывают цену:
# пустой список продаж (таблица заказов - признак, а её нет, когда заказов нет)
# и чужой профиль, где весь текст пишет посторонний.
#
# Поймано не рассуждением. Собственная страница лотов продавца, торгующего
# защитой игровых серверов от ботов, получила вердикт challenge - по слову
# «captcha» из его же описания лота. То есть текст продавца заставлял SDK
# считать, что площадка его проверяет.
#
# Что меняется у читающего: страница вошельца, где встретилось одно из слов
# подписи, прежде классифицировалась как challenge, blocked или maintenance, а
# теперь - как ok. Обратно это не сломает ничего: рабочая страница и была
# рабочей. Ломает оно только тех, кто на ложный вердикт полагался.
#
# Что НЕ меняется: стену проверки, подставленную вместо страницы, ловят
# guest_navbar и challenge_widget - они разбирают разметку, а не текст. Проверку
# внутри страницы вошельца ловит challenge_widget по узлу виджета.

# 0.17.0: описан ПУБЛИЧНЫЙ список предложений раздела - страница, которую видит
# покупатель, ищущий товар.
#
# Она отличается от витрины продавца и от страницы своих лотов одним: здесь
# предложения многих продавцов, и потому здесь есть колонка, которой нет больше
# нигде, - сам продавец.
#
# И ровно на этой колонке лежала ловушка. У строки есть атрибут data-user, и по
# имени он выглядит как продавец. Он не продавец: он есть у строки тогда и
# только тогда, когда предложение ПОДНЯТО. Совпадение точное и в обе стороны -
# семьдесят строк с классом offer-promo, и ровно у этих семидесяти он есть; две
# тысячи девятьсот тридцать одна строка без класса, и ни у одной его нет.
#
# Разбор по нему отдал бы продавца у двух процентов списка и выглядел бы
# работающим: поля заполняются, ошибок нет, а поднятые предложения показываются
# первыми и попадают в глаза первыми. Настоящий продавец лежит в data-href узла
# .avatar-photo внутри строки: он есть у всех трёх тысяч одной строки, и
# различных значений четыреста семьдесят восемь против четырёх различных
# data-user. Числа расходятся на два порядка.
#
# ВТОРОЕ, И ОНО ВАЖНЕЕ ПЕРВОГО. Этот файл заводился под проверку изменений - и
# проверка его не увидела. scripts/compat.js сравнивал правила извлечения
# только тогда, когда файл есть с ОБЕИХ сторон; появление целого файла и
# исчезновение целого файла не давали ни одного изменения. Классификатор
# объявлял «изменений контракта не обнаружено» о правке, меняющей разбор у всех
# реализаций сразу.
#
# Класс add_extraction_field при этом был объявлен и действовал - но только
# внутри уже существовавшего файла. Объявлено и молчит: ровно то, что этот
# репозиторий запрещает. Исправлено в обе стороны, и опасная из них - вторая:
# удаление файла правил прежде тоже проходило молча.

# 0.18.0: у события о новом сообщении появилось направление.
#
# Поле direction: inbound, outbound, unknown. Обязательное, и потому у версии
# есть заметка о переносе - первая в проекте: механизм заметок заводился ровно
# под такой случай и до сих пор стоял пустым.
#
# ЧТО ОНО ЧИНИТ. Два объявленных механизма не работали, и один из них - молча.
#
# spec/runtime/budget.yaml, раздел warming, требует греть переписку событием
# message.created с направлением inbound. Направления в событии не было.
# Реализация поэтому не звала согревание ниоткуда: методы note_incoming и
# note_event написаны, проверены поодиночке и не вызываются из рабочего кода ни
# разу. Всякая переписка оставалась холодной навсегда.
#
# Цена этого - не мелкая неточность. Холодное обращение требует явного признака
# и ограничено тремя в сутки; тёплое - тридцатью в час. Продавец, написавший
# автоответчик, получал отказ cold_outreach_not_declared на КАЖДЫЙ ответ
# покупателю, который сам ему только что написал. То есть объявленный
# ограничитель исходящих запрещал ровно тот случай, ради разрешения которого
# согревание и заводилось.
#
# Второе, что чинится, - петля. Получатель, не различающий своё сообщение от
# чужого, отвечает на собственный ответ. Материал для различения на странице
# был: адрес собственного профиля снимается сверкой отправки с той же страницы
# и тем же приёмом. В событие он не попадал.
#
# ПОЧЕМУ СТРУКТУРНО, А НЕ ПО ИМЕНИ. Имя меняется, и совпадение имён
# подделывается собеседником, назвавшимся как продавец. Адреса нормализуются
# перед сравнением: площадка отдаёт их и с завершающей косой чертой, и без неё.
#
# ПОЧЕМУ unknown, А НЕ ПУСТОТА. Незнание выражено значением перечисления - так
# же, как у origin в том же событии. Иначе у получателя было бы два разных вида
# незнания, и обрабатывать пришлось бы оба. Греть переписку unknown не вправе:
# тепло требует положительного свидетельства.

# 0.19.0: снятую защиту стало видно, а объявленный набор векторов - существовать.
#
# Три вещи, и все три - об одном: механизм, объявленный и не действующий, хуже
# отсутствующего.
#
# ПЕРВОЕ. У состояния здоровья появилось поле unsafe_marks. Перечень имён
# закрыт: снять защиту молча нельзя, новое послабление обязано сперва получить
# здесь имя, и потому появление имени видно в перечне изменений.
#
# Отметки существовали и раньше. Понижение нижнего предела опроса помечалось
# внутри расписания с самого его появления - и не читал эту пометку никто.
# Защита снималась, след оставался, и вёл он в никуда.
#
# ВТОРОЕ. Долговечность реестра отправок получила имя опции и имя отметки:
# unsafe_sends_without_ledger. Прежде правило говорило «послабление возможно
# только через опцию с приставкой unsafe_», не называя ни опции, ни места, где
# её видно. Шесть реализаций назвали бы её шестью способами.
#
# ТРЕТЬЕ. spec/conformance/outbound-governor.vectors.json объявлялся в
# budget.yaml и НЕ СУЩЕСТВОВАЛ. Раннер соответствия пропускает ненайденный набор
# молча, и обещание сверять поведение между реализациями оставалось украшением.
#
# Ограничитель исходящих - единственное, что стоит между продавцом и наказанием
# площадки за рассылку. Реализация, посчитавшая пределы иначе, выглядит
# работающей: сообщения уходят, ошибок нет. Расхождение обнаруживает площадка, и
# обнаруживает она его на аккаунте пользователя.
#
# Проверка спецификации теперь требует, чтобы объявленный набор векторов
# существовал. Она же и нашла этот случай.
#
# ЗАОДНО ЗАПИСАНА НЕСИММЕТРИЧНОСТЬ, которая до сих пор жила только в коде.
# Метка из будущего у отправки считается свежей - квота не обнуляется; метка из
# будущего у входящего означает, что переписка не тёплая - отправка отвергается.
# Направление у обоих одно, к отказу, но правило разное, и симметричное
# ослабило бы одно из двух.

# 0.20.0: форма правки предложения, и открыта она ЧТЕНИЕМ.
#
# Три операции записи над лотами стояли ненаписанными, и причиной значилось
# «запроса никто не наблюдал». Снять его предлагалось настоящим сохранением
# лота - то есть заплатить необратимой правкой за сведения, которые лежали в
# разметке.
#
# Они и лежали. Скрывали их ДВА СОБСТВЕННЫХ ПРАВИЛА, а не площадка.
#
# ПЕРВОЕ: имя метода в адресе маскировалось как идентификатор. Браузерный
# сборщик получил исключение для него 24.08.2026 - без него адрес загрузки файла
# писался как /file/{n}. В питон правило не перенесли, и одно правило
# существовало в двух описаниях, которые разошлись.
#
# Цена расхождения: адрес сохранения лота выглядел как /lots/{n12}. Он всё это
# время был на странице.
#
# ВТОРОЕ: имена полей формы маскировались как всякое значение атрибута. Двадцать
# полей вышли подписями вида T19:ap, и собрать по такой форме запрос нельзя. Имя
# поля при этом выбирает площадка, а не человек: csrf_token, price,
# fields[summary][ru].
#
# Теперь имя сохраняется дословно, но ТОЛЬКО ПО ФОРМЕ, и форма берётся готовая -
# та же, которой проверяются ключи объекта настроек. Второго описания одного
# правила не заводится: копия расходится, и в этом же файле такое уже случилось
# с именем метода.
#
# ЗНАЧЕНИЕ поля не раскрывается никогда - в нём цена, описание лота и сообщение
# покупателю после оплаты.
#
# ЧТО ОТКРЫЛОСЬ. Адрес POST /lots/offerSave. Имена всех двадцати полей. Метка
# form_created_at десятью цифрами. И главное - флажок active с пометкой checked,
# то есть ПРИЗНАК ВКЛЮЧЁННОСТИ ЛОТА, которого в проекте не было ни одного.
#
# Модель Lot требует is_active обязательным и потому со страницы своих лотов не
# собиралась вовсе. Признак есть - но на форме правки, а она одна на лот: у
# продавца с двумя сотнями лотов это две сотни запросов. Поэтому чтение списком
# его по-прежнему не отдаёт, и это цена, а не упущение.
#
# ЧЕГО ПО-ПРЕЖНЕМУ НЕТ: самого запроса. Неизвестно, чем площадка отвечает на
# сохранение и как выглядит отказ. Операция записи, не умеющая отличить успех от
# отказа, хуже отсутствующей: она сообщает об успехе всегда.
#
# В ту же версию - наблюдения трёх сеансов: отзывы на чужом профиле анонимны,
# прикрепление картинки ничего не грузит, а адрес догрузки таблицы отвечает
# разметкой, и его курсор НЕ равен последней показанной строке.

# 0.21.0: правка цены стала операцией, и вместе с ней впервые исполнено
# единственное в контракте требование аудита.
#
# ЧТО ОТКРЫЛОСЬ НАБЛЮДЕНИЕМ 31.08.2026. Сохранение - навигационный POST на
# /lots/offerSave. Успех виден ПЕРЕХОДОМ на список своих предложений раздела;
# тела ответа страница не получает, его забирает браузер. Отмеченный флажок
# уходит значением «on». Лот до и после сохранения сверен отпечатками прямо в
# странице и совпал посимвольно: сохранение прочитанного как есть ничего не
# стирает.
#
# ЧТО ЭТО МЕНЯЕТ У ЧИТАЮЩЕГО КОНТРАКТ.
#
# ПЕРВОЕ. У lots.update_price появились правила аудита: журнал ДОЛГОВЕЧЕН и
# пишется ВПЕРЕДИ отправки, без него правка отказывает, послабление называется
# unsafe_price_changes_without_audit и оставляет отметку. Прежде стояло голое
# audit: before_state - два слова, не сказавшие ни где хранить, ни когда
# писать, ни что делать без хранилища. Реализация, прочитавшая их буквально,
# держала бы состояние в памяти процесса и теряла его перезапуском, ни разу
# при этом не нарушив контракта.
#
# Довод у требования не тот же, что у отправки без реестра. Там защита бережёт
# аккаунт от предела, здесь - продавца от цены, которую нечем вернуть: истории
# цен у площадки нет, отката нет, и «как было до бота» знает только наша
# запись.
#
# ВТОРОЕ. В закрытый перечень unsafe_marks добавлено третье имя. Читающий
# перечень исчерпывающе - обязан добавить ветку; читающий как строку - не
# обязан ничем.
#
# СНЯТО С НЕИСПОЛНЕННОГО: lots.update_price и требование аудита к ней.
# Осталось три операции лотов: включение, выключение и поднятие. Первые две
# упираются в одно наблюдение - что уходит при СНЯТОМ флажке; поднятие
# необратимо и тратит суточный предел.

# 0.22.0: формат скелета поднят до v9 - строка запроса перестала маскироваться
# целиком.
#
# Было «?{q7}», стало «?id={q7}»: имя параметра сохраняется дословно, значение
# по-прежнему не раскрывается никогда.
#
# ЧЕТВЁРТЫЙ РАЗ ОДНО И ТО ЖЕ. Сумма заказа делилась образцом по тексту и на
# снимке не работала. Имя метода в пути маскировалось как идентификатор - и
# скрывало адрес сохранения лота. Имена полей формы маскировались как всякое
# значение - и по форме нельзя было собрать запрос. Теперь имена параметров
# запроса.
#
# Каждый раз недостающее лежало на странице, и скрывали его МЫ САМИ. Каждый раз
# причиной называли площадку либо модель.
#
# ЧТО ЭТО ОТКРЫВАЕТ. Идентификатор ЧУЖОГО предложения лежит только в строке
# запроса ссылки - так записано в spec/extraction/market.yaml, - и market.offers
# из-за этого не собиралась вовсе. Причиной в реестре неисполненного значилась
# модель: «ни одного из трёх обязательных полей со страницы не собрать».
#
# Одно из трёх теперь наблюдаемо. Двух других - цены числом с кодом валюты - это
# не касается, и операция по-прежнему неисполнена. Но причина у неё сменилась, и
# сменилась она с нашей собственной на настоящую.
#
# ПРАВИЛО НЕ НОВОЕ, А ВОССТАНОВЛЕННОЕ. Браузерный сборщик записывал имена
# параметров с самого своего появления - searchParams.keys(). Записи запросов их
# несли, снимки страниц нет. То есть одно правило существовало в двух описаниях,
# и описания разошлись молча - ровно как перед этим с именем метода в пути.
#
# СНИМКИ ПРЕЖНИХ ВЕРСИЙ НЕ ОБНУЛЯЮТСЯ: v9 добавлена к принимаемым, и всё, что
# снято до неё, читается как читалось. Переснимать под новое правило имеет смысл
# только там, где в строке запроса лежит нужное, - на публичном списке
# предложений.

# 0.23.0: чтение формы правки стало объявленной операцией, а правка цены
# перестала обещать Lot.
#
# ПОВОД - НАЙДЕННОЕ РАСХОЖДЕНИЕ, а не желание что-нибудь объявить. Метод
# lots.form жил в обоих фасадах эталонной реализации, был описан в руководстве и
# возвращал модель, а контракт о нём не знал ничего. Автор второго SDK, читающий
# spec/services как перечень того, что бывает, такой операции не написал бы
# никогда.
#
# Ворота смотрели только в одну сторону: объявленное обязано быть либо
# написанным, либо записанным в реестр неисполненного. Обратное - что написанное
# объявлено - не проверял никто. Теперь проверяет.
#
# ЧТО МЕНЯЕТСЯ У ЧИТАЮЩЕГО КОНТРАКТ.
#
# ПЕРВОЕ, и это ЛОМАЮЩЕЕ. lots.update_price объявляла returns: Lot, а возвращает
# форму. Lot требует обязательным price типа Money, Money требует КОДА валюты, а
# со страницы читается знак. Соответствие знака коду однозначным не наблюдалось -
# ровно то, что мешает market.offers.
#
# Собрать Lot из формы значило бы выдумать валюту чужому лоту, и заметил бы это
# не разработчик, а продавец. Объявлено то, что вправду возвращается: LotForm.
#
# ВТОРОЕ. Объявлена операция lots.form и возможность lots.form под неё. Отдельная
# от lots.list_own: страница другая, и отвечать на них площадка вправе
# по-разному. Отдельная и от lots.update_price: там запись, здесь чтение, и
# обнаруживший недоступность правки обязан сохранить право посмотреть, что у лота
# стоит сейчас.
#
# ТРЕТЬЕ. Объявлена модель LotForm - то, что страница вправду отдаёт: цену
# текстом, знак валюты признаком наблюдённости, форму целиком и наш собственный
# отпечаток состояния.
#
# ЧТО ПОЧИНЕНО В ЭТАЛОННОЙ РЕАЛИЗАЦИИ ЗАОДНО. Правка цены не спрашивала своей
# возможности вовсе - объявленная площадкой недоступной, она всё равно уходила
# бы запросом. Чтение формы шло под возможностью СПИСКА своих лотов, и успех на
# одной странице объявлял доступной другую. Обе возможности вдобавок не значились
# среди выполняемых: capability(lots.update_price) отвечал «операции под неё
# нет» при работающей операции.

# 0.24.0: market.offers написана. Публичный список раздела читается.
#
# Последняя из шести служб контракта, у которой не было ни одной операции.
# Теперь их нет ни у одной.
#
# ЧТО ЭТО ДАЁТ. Это вход в переоценку: прочитать цены соседей, решить, поменять
# свою через lots.update_price. До неё цикл замыкать было нечем - чужие цены
# читались только глазами.
#
# ПОЧЕМУ ОНА СТАЛА ВОЗМОЖНА ТОЛЬКО СЕЙЧАС. Адресовать чужое предложение было
# нечем: идентификатор лежит в строке запроса ссылки и больше нигде, а формат
# скелета до v9 заменял строку запроса одной подписью. То есть мешало
# собственное правило, а не площадка.
#
# ЧТО МЕНЯЕТСЯ У ЧИТАЮЩЕГО КОНТРАКТ.
#
# ПЕРВОЕ, и это ЛОМАЮЩЕЕ. market.offers объявляла returns: Offer[], теперь
# объявляет MarketPage.
#
# Offer требует обязательным price типа Money, Money требует КОДА валюты, а
# страница отдаёт ЗНАК. Проверено наблюдением 31.08.2026: кода нет ни ссылкой
# переключателя, ни полем в data-app-data, где ключей ровно четыре. Тот же
# довод, по которому lots.update_price перестала обещать Lot версией раньше.
#
# И не массив: голый список делает неполноту незаметной. По этому списку
# принимают решение о ЦЕНЕ, и увидев половину предложений, бот посчитает себя
# дешевле всех.
#
# ВТОРОЕ. Объявлены модели MarketOffer и MarketPage - то, что страница вправду
# отдаёт.
#
# ТРЕТЬЕ. Заведена четвёртая форма reads - «?имя»: значение лежит параметром
# строки запроса внутри объявленного адреса. До формата v9 объявить такое
# правило было нечем: проверить его по снимку значило бы гадать.
#
# ЧТО ВСКРЫЛОСЬ ПРИ НАПИСАНИИ. Публичная страница получает от классификатора
# вердикт login_required - про сессию он прав, про ответ нет. Операция рынка
# отказывала бы на каждом чтении, и объявленная дорожка public_read была бы
# непригодна, даже будь она заведена.
#
# Теперь чтение умеет не требовать сессии. Гасится РОВНО ОДИН вердикт и ровно у
# той операции, которая объявила, что сессия ей не нужна; ограничение частоты,
# страница проверки и отказ в доступе остаются отказом.
#
# ЧТО ОСТАЛОСЬ У РЫНКА: market.snapshot. Мешают две вещи, и обе не про
# разметку - состав отпечатка запроса и правило узнавания предложения между
# снимками.

# 0.25.0: код валюты наблюдён - и оказался не тем, который нужен.
#
# ЧТО НАБЛЮДЕНО. В шапке всякой страницы стоит переключатель валюты. Пункты его
# несут код ISO 4217 в атрибуте data-cy и перечисляют ПРОЧИЕ валюты, не текущую:
# наблюдено дважды на одной странице - {USD, EUR} при рублёвой настройке и
# {RUB, EUR} после переключения. Текущая вычисляется дополнением.
#
# Это первое место на площадке, где валюта названа КОДОМ, а не знаком.
#
# ПОЧЕМУ ЭТО НЕ СНИМАЕТ ЗАТОР С Money. Переключатель говорит о настройке
# ПОКАЗА, а сумма заказа за ней не следует: после переключения на доллары
# список продаж остался с рублёвым знаком у всех тридцати четырёх сумм. Сумма
# заказа показана в валюте ЗАКАЗА.
#
# Приписать сумме код из шапки значило бы приписать чужую валюту чужому заказу -
# ровно то, от чего правило и заведено. Затор остаётся, но причина у него
# теперь названа точно: не «кода нет», а «код есть, и он не о сумме».
#
# СЕЛЕКТОР ОБЪЯВЛЕН И НЕ ЧИТАЕТСЯ, с обоснованием в перечне известных
# нечитаемых. Прочитанный и выставленный наружу, он звал бы применить себя к
# суммам.
#
# ЧТО ИСПРАВЛЕНО ЗАОДНО, и оба - наши собственные помехи.
#
# ПЕРВОЕ. Сбор валюты был несовместим с приёмником: тот пишет ключи дословно, а
# сбор клал в ключ сам знак. Обе стороны правы порознь; проверок на стыке не
# было ни одной, и разрыв нашёлся живым сбором, а не сборкой. Знак и код
# переехали в значение.
#
# ВТОРОЕ. Ответ 404 сохранялся снимком страницы и занимал имя, выведенное из
# пути, - после чего съёмка ВЕРНОГО адреса упиралась в собственный мусор.
# Теперь отвергается: 404 это ответ об адресе, а не страница. Страница входа и
# страница проверки снимаются по-прежнему - они настоящие.

# 0.26.0: три точки записи площадки наблюдены формами.
#
# Пересъёмка трёх страниц форматом v9 - первым, что сохраняет имена полей формы
# дословно, - открыла то, что лежало в снимках с самого начала:
#
#   POST /orders/refund       csrf_token, id
#   POST /withdraw/withdraw   девять полей, среди них twofactor_code
#   POST /users/transactions  user_id, continue, filter
#
# Адреса были видны и раньше. Не были видны ПОЛЯ, а по адресу без полей запроса
# не собрать - и три области площадки числились ненаблюдёнными не потому, что их
# не смотрели, а потому, что наше собственное правило маскировало имена.
#
# ЧТО ПОДТВЕРДИЛОСЬ ПОПУТНО. У поля currency_id формы вывода ровно ТРИ варианта.
# Это первое положительное свидетельство, что набор валют площадки - три; прежде
# он был известен только по нашему же types.yaml, и на нём стоит вывод текущей
# валюты дополнением по переключателю.
#
# ЧТО ВЫЯСНИЛОСЬ ОБ ОДНОЙ ФОРМЕ НА ТРИ МЕСТА. Поля user_id, continue и filter
# несут и догрузка отзывов, и догрузка операций счёта. Значит правило догрузки
# одно, а не три, и разгаданное однажды закрывает chats.history_before,
# постраничность отзывов и dyn_table_continue_request разом.
#
# ОПЕРАЦИЙ ПОД ЭТИМ НЕТ И НЕ БУДЕТ, пока не наблюдён сам запрос. Видно, куда
# отправлять и что класть; неизвестно, чем площадка отвечает и как выглядит
# отказ. Операция записи, не умеющая отличить успех от отказа, хуже
# отсутствующей.
#
# Возврат и вывод к тому же необратимы и оба про деньги. Объявлять их операциями
# - решение не техническое, и принимает его владелец счёта, а не реализация.

# 0.27.0: market.snapshot написана. Обе операции витрины есть.
#
# ЧТО ЭТО ДАЁТ. Слежение за рынком во времени: снять выдачу раздела, снять её же
# позже, сравнить. Появилось, пропало, подешевело - и всё это без единого
# взгляда на площадку глазами.
#
# ПОЧЕМУ ОНА СТАЛА ВОЗМОЖНА ТОЛЬКО СЕЙЧАС. Сравнивать выдачу надо ПО
# ИДЕНТИФИКАТОРУ: порядок строк меняется от поднятия чужого лота, и сравнение по
# позициям давало бы поток ложных изменений каждую минуту. Идентификатор чужого
# предложения стал наблюдаем 31.08.2026, с формата скелета v9.
#
# ГЛАВНОЕ В НЕЙ - НЕ ТО, ЧТО ОНА СЧИТАЕТ, А ЧЕГО НЕ УТВЕРЖДАЕТ.
#
# Отсутствия считаются только по двум ПОЛНЫМ снимкам. Неполный не отличает
# «предложение пропало» от «мы его не прочитали», а для следящего за рынком это
# разница между «конкурент ушёл, можно поднять цену» и «мы плохо прочитали
# страницу».
#
# Появления считаются по любым: неполнота могла скрыть предложение прежде, но не
# могла выдумать его сейчас.
#
# Сравнение снимков РАЗНЫХ запросов отвергается. Снимок раздела с фильтром и
# снимок того же раздела без фильтра описывают разные множества; сравнив их,
# получишь исчезновение всего, что отфильтровано.
#
# ЧЕГО НЕТ: порождения объявленных событий рынка. market.offer.appeared требует
# обязательным price типа Money, а Money требует кода валюты, которого страница
# не даёт. Событие об исчезновении вдобавок требует счётчика подряд идущих
# отсутствий - его ведёт тот, кто хранит снимки, а не чистое сравнение.
#
# Разница поэтому выдаётся ДАННЫМИ, а не событиями. Записано в реестре.

# 0.28.0: у площадки два рынка, и контракт впервые знает о втором.
#
# /chips/{id}/ - предложения ПО КОЛИЧЕСТВУ: игровая валюта, ресурсы,
# внутриигровые единицы. Сто восемьдесят восемь разделов на корневой странице,
# и до сих пор контракт не знал о них ничего.
#
# ЧЕМ ЧИП ОТЛИЧАЕТСЯ ОТ ЛОТА. Лот - штучное предложение с описанием. Чип
# продаётся объёмом, и цена у него стоит ЗА ЕДИНИЦУ; общей суммы на странице нет
# вовсе - её считает покупатель, выбрав количество.
#
# В разметке разница ровно двумя вещами:
#
#   .tc-amount ЕСТЬ у чипа и нет у лота - количество с единицей измерения;
#   .tc-desc НЕТ у чипа и есть у лота - описания у него не бывает.
#
# ОТСУТСТВИЕ ОПИСАНИЯ ЗАПИСАНО ПОЛОЖИТЕЛЬНО. Без этого разбор, написанный по
# образцу лотов, искал бы описание и объявлял бы повреждённой КАЖДУЮ строку -
# весь рынок читался бы неполно, и неполноту пришлось бы признавать вручную на
# каждом чтении.
#
# ОТДЕЛЬНАЯ СЛУЖБА, А НЕ ПОЛЕ В MARKET. Свести их значило бы завести модель с
# полями «иногда описание, иногда количество», а такая модель не отвечает ни на
# один вопрос определённо.
#
# Отдельная и возможность: страницы разные, и отвечать на них площадка вправе
# по-разному.
#
# Наблюдено 31.08.2026 гостем: раздел 1, сто семнадцать строк, все с
# идентификатором и знаком валюты. Страница отдаётся без сессии, как и рынок
# лотов.

# 0.29.0: пять наблюдений за вечер, и три затора сняты.
#
# ОТПРАВКА КАРТИНКИ - протокол наблюдён целиком. Загрузка идёт на
# /file/addChatImage одним полем file и возвращает {"fileId": int}; дальше то же
# действие chat_message, что у текста, с image_id вместо текста. Прежде значилось
# «адрес наблюдён, сам запрос - нет, и image_id взять неоткуда».
#
# ПОДНЯТИЕ - оба вопроса закрыты одним нажатием. POST /lots/raise с game_id и
# node_id отвечает {error, msg, unlock_at, wait}. Признак error - то самое, из-за
# чего операция была невозможна: без него поднятие не отличало успех от отказа и
# повторяло бы, а повтор тратит суточный предел. unlock_at - срок остывания,
# который контракт объявлял ненаблюдённым; площадка называет его сама.
#
# СХЕМА ПОЛЕЙ РАЗДЕЛА - лежала в форме фильтра, а не отдельным запросом. У
# каждого поля свой data-id, имя в запросе f-{id}, вид управления читается
# классом. Значения полей лежат и на строках предложений - значит фильтровать
# выдачу можно, не спрашивая площадку заново.
#
# ДОГРУЗКА - половина. Запрос наблюдён целиком, ответ приходит разметкой; не
# наблюдено, содержит ли он следующую форму и как выглядит конец списка.
#
# ОПЕРАЦИЙ ПОД ЭТИМ ПОКА НЕТ. Наблюдение снимает затор, но операция - это ещё и
# модель, и обращение с отказом, и проверки. Записано то, что наблюдено.

# 0.30.0: у своих лотов появился признак показа - исправлением нашей ошибки.
#
# ЧТО БЫЛО НАПИСАНО. own-lot.schema.json утверждал прямым текстом: «признака
# показа лота в выдаче на странице не наблюдалось ни одного, все строки
# структурно одинаковы, различающего класса нет». Утверждение сторожила
# проверка, требовавшая, чтобы поля is_active в модели НЕ БЫЛО.
#
# ЧТО НА САМОМ ДЕЛЕ. Выключенная строка несёт класс warning. Строки одинаковы,
# пока все лоты включены, - а у владельца все и были включены, и снимок вышел
# однородным.
#
# ОТСУТСТВИЕ ПРИЗНАКА НА ОДНОРОДНОМ СНИМКЕ НЕ ЗНАЧИТ ЕГО ОТСУТСТВИЯ НА СТРАНИЦЕ.
# Это ровно тот случай, ради которого заведено правило «отсутствие объявляется
# только по положительному признаку». Правило было нарушено, и три недели
# модель, проверка и документация повторяли неправду хором.
#
# Снять это можно было одним опытом: выключить лот и посмотреть. Владелец так и
# сделал - выключил самый малозначимый, снял страницу, включил обратно.
#
# ЧТО МЕНЯЕТСЯ У ЧИТАЮЩЕГО. У OwnLot появилось ОБЯЗАТЕЛЬНОЕ поле is_active.
# Читающему модель делать нечего; собирающему её самому - в проверках, в
# фикстурах - добавить поле.
#
# ЧЕГО МЫ ПО-ПРЕЖНЕМУ НЕ ЗНАЕМ: означает ли warning именно выключенность либо «с
# лотом что-то не так вообще». Класс общий по имени, и площадка вправе красить им
# истёкший срок, нехватку остатка, отказ модерации. Наблюдался один способ его
# получить, прочих не искали, и объявлять их отсутствие нельзя - второй раз ту же
# ошибку делать не станем.

spec_version: "0.30.0"

# draft - контракт может меняться без соблюдения compat-rules.
# released - с этого момента любое изменение классифицируется по spec/compat-rules.yaml.
status: draft

# Версия правил канонической сериализации (spec/canonical-form.yaml).
# Меняется отдельно от spec_version: одна и та же модель может сериализоваться
# по-новому, и это ломает сохранённые хэши снимков и ключи дедупликации.
#
# v2: правила переехали из прозы docs/canonical-json.md в нормативный файл,
# два из них исправлены на обратные, и форма впервые применяется на деле.
# Перечень изменений:
#   - правило 2 (NFC) теперь ВЫПОЛНЯЕТСЯ, в том числе в материале отпечатка.
#     Составная и разложенная записи одной строки дают один отпечаток, прежде
#     давали два;
#   - правило 5 (никаких незначащих пробелов) теперь выполняется в файле
#     состояния, который прежде штамповал в себя номер формы и писался с
#     пробелами после двоеточия и запятой;
#   - правило 8 (запрет чисел с плавающей точкой) теперь применяется, и
#     нарушение отвергается вслух;
#   - правило 10 исправлено: null означает «не наблюдалось» либо «здесь этого
#     не бывает», а не «наблюдалось и пусто». Прежняя редакция была обратна
#     схемам, реализации и валидатору;
#   - правило 11 разделено: в конверте и нагрузке события ключ присутствует
#     всегда и пустота выражается null, в моделях ненаблюдённое поле
#     опускается. Прежняя редакция давала одно правило на оба случая.
#
# Сохранённые отпечатки прежней формы не совпадут с новыми. Файлы состояния
# отвергаются громко: STATE_FORMAT поднят до funora-state-v4.
# v3: правило 13 получило три недостающих решения - доля миллисекунды
# отбрасывается, смещение переводится в UTC, момент без пояса отвергается, -
# и момент впервые приводится к объявленной форме на деле.
#
# Сохранённое этой правкой НЕ обнуляется: момент запрещён в отпечатке события
# правилом forbidden_in_fingerprint, а файл состояния моментов не хранит.
# Версия поднята всё равно: правило changing_these_rules не знает исключений,
# и заводить их ради одного удобного случая значило бы разменивать защиту на
# экономию. Цена соблюдения здесь - один потерянный кэш гашения, цена
# исключения - привычка находить причины его не соблюдать.
canonical_form_version: 3

# Версия протокола запуска conformance-раннера. Отдельная ось: набор векторов
# может расти, не меняя способ их запуска, и наоборот.
runner_protocol: 1

# Локали интерфейса площадки, для которых спецификация обязуется иметь фикстуры.
# Парсер, завязанный на текст, обязан объявить поддерживаемый набор: при локали
# вне набора он возвращает типизированную ошибку, но никогда - пустой результат.
supported_locales:
  - ru
  - en

# Семейство протокольного адаптера. Появится второе, если у площадки возникнет
# принципиально иной интерфейс - тогда старые курсоры и снимки станут несовместимы.
adapter_family: funpay-web

# Заметки о переносе.
#
# Раздел появился после того, как выяснилось: правило add_required_field требует
# упоминания в migration note, а места для такого упоминания в контракте не
# было. Требование читалось как действующее и не исполнялось ничем.
#
# Зачем это здесь, а не отдельным файлом. Заметка привязана к версии, а версия
# живёт тут; отдельный файл разошёлся бы с ней молча - подняли версию, забыли
# заметку, и ни одна проверка бы не заметила.
#
# Почему обязательное поле вообще требует заметки. Для ЧИТАЮЩЕГО модель это
# усиление гарантии, и он не ломается. Ломается тот, кто СОБИРАЕТ объект сам -
# в тестах, в фикстурах, в собственных адаптерах: у него перестаёт собираться
# код. Он не увидит этого в перечне изменений, потому что класс - минор.
migration_notes:
  # Ключ - версия спецификации, в которой изменение выпускается. Значение -
  # перечень заметок. У каждой обязательны about (куда указывает) и what (что
  # делать тому, кто собирает объект сам).
  #
  # Первое изменение, замеченное классификатором внутри массива. Прежде он
  # смотрел перечисление только на самом поле, а у unsafe_marks оно лежит на
  # уровень глубже - в items, - и любое пополнение проходило молча. Схема при
  # этом обещала обратное: «появление имени видно в перечне изменений».
  # Ломающее здесь одно, и оно про ТИП РЕЗУЛЬТАТА.
  "0.30.0":
    - about: spec/models/own-lot.schema.json#is_active
      what: >-
        У OwnLot появилось ОБЯЗАТЕЛЬНОЕ поле is_active - показывается ли лот в
        выдаче.

        Читающему модель делать нечего: у него поле прибавилось. Собирающему её
        самому - в проверках, в фикстурах, в своих адаптерах - добавить поле.
        Читается оно НАЛИЧИЕМ класса warning у строки.
      why: >-
        Прежде здесь стояло, что признака на странице нет вовсе, и проверка
        сторожила отсутствие поля. И утверждение, и проверка были неверны:
        строки одинаковы, пока все лоты включены, а выключенная несёт лишний
        класс.

        Отсутствие признака на однородном снимке не значит его отсутствия на
        странице.

  "0.24.0":
    - about: spec/services/market.yaml#market.offers.returns
      what: >-
        market.offers объявляла returns: Offer[], теперь объявляет MarketPage.

        Читающему результат - переписать разбор дважды. Во-первых, это не
        массив: предложения лежат внутри и выдаются за признанием неполноты.
        Во-вторых, у предложения нет поля price типа Money: цена приходит
        ТЕКСТОМ в price_text, знак валюты отдельно в currency_symbol_text, и оба
        - признаком наблюдённости.

        Собирающему объект самому - собирать MarketPage и MarketOffer.
      why: >-
        Объявление обещало то, чего собрать нельзя, и обещало дважды.

        Money требует кода валюты по ISO 4217, а страница отдаёт знак;
        соответствие знака коду однозначным не наблюдалось. Голый же массив
        делает неполноту незаметной - а по этому списку принимают решение о
        цене, и неполный он неотличим от короткого.

  "0.23.0":
    - about: spec/services/lots.yaml#lots.update_price.returns
      what: >-
        lots.update_price объявляла returns: Lot, теперь объявляет LotForm.

        Читающему результат - переписать разбор: полей другое число и названия
        другие. Цена приходит ТЕКСТОМ в price_text, знак валюты отдельно в
        currency_symbol признаком наблюдённости, а признак показа лота - булевым
        is_active.

        Собирающему объект самому - в проверках, в фикстурах - собирать LotForm.

        Операции lots.form, объявленной той же версией, это касается так же: она
        возвращает ту же модель.
      why: >-
        Объявление обещало то, чего собрать нельзя. Lot требует обязательным
        price типа Money, Money требует кода валюты по ISO 4217, а страница
        отдаёт ЗНАК. Соответствие знака коду однозначным не наблюдалось: один и
        тот же знак доллара носят несколько валют.

        Пока объявление стояло, у реализации было два выхода, и оба плохие:
        выдумать валюту либо не написать операцию. Эталонная выбрала третий -
        написала и вернула не то, что обещано, - и расхождение это нашли ворота,
        а не человек.

  "0.21.0":
    - about: spec/models/session-health.schema.json#unsafe_marks
      what: >-
        В закрытый перечень unsafe_marks добавлено третье имя -
        unsafe_price_changes_without_audit.

        Читающему перечень как набор строк делать нечего. Читающему его
        ИСЧЕРПЫВАЮЩЕ - разбором по всем известным значениям, сопоставлением с
        образцом без ветки «прочее» - добавить ветку: незнакомое имя иначе
        уронит разбор либо потеряется молча.
      why: >-
        Правка цены без долговечного журнала теперь ОТКАЗЫВАЕТ, и у отказа есть
        послабление. Всякое послабление обязано оставлять след: снять защиту
        можно, снять её незаметно нельзя.

        Довод у этой защиты не тот же, что у отправки без реестра. Там она
        бережёт аккаунт от предела площадки. Здесь - продавца от цены, которую
        нечем вернуть: истории цен у площадки нет, отката нет, и «как было до
        бота» знает только наша запись. Журнал в памяти процесса аудитом не
        является - перезапуск стирает его целиком.

  "0.19.0":
    - about: spec/models/session-health.schema.json#unsafe_marks
      what: >-
        У состояния здоровья появилось ОБЯЗАТЕЛЬНОЕ поле unsafe_marks - перечень
        защит, которые вызывающий снял с себя сам.

        Читающему делать ничего не нужно. Собирающему объект самому - в
        проверках, в фикстурах, в своих адаптерах - добавить поле. Пустой массив
        обычное состояние, а не отсутствие сведений: он означает, что ни одна
        защита не снята.
      why: >-
        Отметки о снятых защитах ставились и не читались. Понижение нижнего
        предела опроса помечалось внутри расписания с самого его появления, и не
        смотрел на эту пометку никто: защита снималась, след оставался, и вёл он
        в никуда.

        Сюда же отнесена отправка без долговечного реестра: budget.yaml требует
        отказывать без него, а послабление разрешает только через опцию с
        приставкой unsafe_ и с отметкой в состоянии здоровья. Отметке до сих пор
        негде было стоять.

  # Механизм заводился под первое такое добавление. Вот оно.
  "0.18.0":
    - about: spec/events/message-created.schema.json#direction
      what: >-
        У нагрузки события о новом сообщении появилось ОБЯЗАТЕЛЬНОЕ поле
        direction со значениями inbound, outbound, unknown.

        Читающему событие делать ничего не нужно: у него поле прибавилось, а
        прибавление обязательного поля читателя не ломает.

        Ломается СОБИРАЮЩИЙ нагрузку сам - в проверках, в фикстурах, в
        собственных адаптерах: у него перестанет собираться объект. Добавьте
        поле. Если направление вам неизвестно, ставьте unknown - это и есть его
        назначение, а не заглушка.

        Незнание выражено значением перечисления, а не пустотой: так у
        получателя не появляется двух разных видов незнания.
      why: >-
        Без направления не работали ДВА уже объявленных механизма.

        Первый - согревание переписки. spec/runtime/budget.yaml требует греть её
        событием message.created с направлением inbound, а направления в
        событии не было: решать было не по чему. Ограничитель исходящих поэтому
        считал холодной всякую переписку, и автоответ отвергался с
        cold_outreach_not_declared - то есть автоответчик был невозможен
        физически.

        Второй - сам автоответ. Получатель, не различающий направления,
        отвечает на собственный ответ, и переписка уходит в петлю.

# Ось версий одна.
#
# Раздел появился после того, как выяснилось: двадцать два файла спецификации
# объявляли в шапке собственную version, все двадцать две стояли на 0.1.0 при
# spec_version 0.3.0, и не читал их никто. Проверка требовала, чтобы поле БЫЛО,
# и не требовала, чтобы оно что-нибудь значило.
#
# Вторая ось на одну вещь хуже отсутствия оси. Она выглядит как обещание, что
# файл версионируется отдельно, - и читающий рассчитывает по ней на
# совместимость, которой никто не поддерживает.
single_version_axis:
  rule: >-
    Собственной версии у отдельного файла спецификации нет. Осей ровно три, и
    все три объявлены здесь: spec_version, canonical_form_version,
    runner_protocol.
  enforced_by: >-
    scripts/validate.js. Поле version верхнего уровня в любом файле spec/, кроме
    этого, - нарушение.
  # ЧЕТВЁРТАЯ ОСЬ ЕСТЬ, и называется она здесь, чтобы не быть необъявленной.
  #
  # Формат структурного скелета версионируется отдельно - structural-skeleton-vN
  # - и обнуляет у пользователя вот что: снимок, снятый прежней версией, не
  # обязан нести того, что новая сохраняет. Проверка, ищущая в снимке имя
  # параметра запроса, на снимке v8 не найдёт его никогда, и это не поломка
  # снимка.
  #
  # ЗНАЧЕНИЕ ОСИ ЖИВЁТ НЕ ЗДЕСЬ, а в spec/conformance/skeleton-format.yaml, и
  # это осознанное отступление от образца двух соседних осей. Значение оттуда
  # читает генератор; продублировав его здесь, мы завели бы два описания одного
  # числа - ровно ту болезнь, от которой этот раздел и заведён.
  #
  # Объявлено, стало быть, не число, а САМА ОСЬ: она есть, у неё своя дорожка
  # версий, и файл, где она живёт, назван поимённо.
  fourth_axis_lives_in_its_own_file: >-
    Формат скелета (structural-skeleton-vN) - четвёртая ось. Значение объявлено
    в spec/conformance/skeleton-format.yaml вместе с перечнем принимаемых
    версий; здесь названа сама ось и то, что она обнуляет.
  what_to_do_instead: >-
    Файл, которому вправду нужна своя ось, заводит её ЗДЕСЬ, под собственным
    именем и с объяснением, что именно она обнуляет у пользователя. Так заведены
    canonical_form_version и runner_protocol.
