# Заказы. В версии 0.x только чтение.
#
# Операции записи с денежными последствиями - подтверждение, возврат, выплата -
# в спецификацию не входят и не будут включены без отдельного разбора безопасности.
# Причина в собственном правиле проекта: не гарантировать функцию, корректность
# которой невозможно проверить автоматически.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: orders

operations:

  orders.list:
    summary: Читает список заказов.
    capability: orders.list
    safety: safe
    request_class: interactive
    # Не Order[], и это исправление противоречия внутри спецификации.
    # spec/extraction/orders.yaml в разделе cannot_be_built_from_list прямо
    # говорит: полную запись Order из списка собрать нельзя - нет ни валюты, ни
    # машиночитаемого времени. Реализация, читающая только этот файл, вынуждена
    # выдумать и то и другое.
    # Не голый массив. Открытый список делает неполноту незаметной: вызывающий
    # берёт его и не спрашивает, всё ли прочитано, а неполный список неотличим
    # от полного. Возвращается страница - она несёт полноту, причину и перечень
    # повреждений, а записи отдаёт методом, который отказывается работать с
    # неполнотой без явного признания.
    #
    # Прежде здесь стоял массив записей, и спецификация противоречила сама себе:
    # spec/models уже описывал страницу и уже сверял её с реализацией.
    returns: OrdersPage
    returns_schema: spec/models/orders-page.schema.json
    returns_note: >-
      Страница несёт записи типа OrderListEntry - сокращённой проекции заказа,
      отличимой от Order по типу. Полную запись Order из списка собрать нельзя:
      там нет ни валюты машиночитаемо, ни момента времени, ни разделения
      покупателя и продавца.

      Схема написана по первой реализации: прежде здесь стояло обещание «схема
      появится вместе с первой реализацией», реализация появилась, а обещание
      осталось, и второй SDK писать было не по чему - единственным описанием
      формы был docstring на русском.
    # Разметка постраничной навигации не наблюдалась ни разу, см. not_observed
    # в spec/extraction/orders.yaml. Обещать курсор, которого адаптер выдать не
    # может, опаснее, чем не обещать: цикл по такому курсору корректно
    # завершается на коротком списке и молча теряет всё за границей первой
    # страницы.
    pagination: none
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      # Классификатор переводит 4xx на странице списка в
      # funora.protocol.unexpected_response, и это НЕ потомок protocol.changed,
      # а его сестра под общим ProtocolError. Вызывающий, выписавший except по
      # прежнему перечню, её не ловил.
      - funora.protocol.unexpected_response
      - funora.transport

  orders.refund:
    summary: Возвращает средства покупателю по заказу.
    capability: orders.refund
    safety: unsafe
    request_class: automation
    requires_reconciliation: true
    returns: RefundResult
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, refund.
      rests_on_it: >-
        НЕ ЗАПРОС, А ЧТЕНИЕ ОТВЕТА. Оба поля запроса наблюдены НАМИ: форма
        возврата лежит на странице заказа, и в ней csrf_token и id. Адрес - в
        её же атрибуте action.

        Не наблюдено, ЧЕМ площадка отвечает. Известно от независимой реализации:
        объект с признаком отказа error и сообщением msg.
      why_opt_in: >-
        Деньги уходят покупателю, и площадка не предлагает вернуть их обратно
        ничем. Ошибка здесь - не испорченная запись, а чужие деньги, ушедшие не
        по тому заказу.
    preconditions:
      - id: refund_offered_by_the_page
        required: true
        kind: state
        observed: true
        summary: >-
          Площадка обязана ПОКАЗЫВАТЬ форму возврата на странице этого заказа.

          Признак наш и наблюдён: присутствие формы на странице заказа читается
          с 24.08.2026. Отсутствие означает, что площадка возврата по этому
          заказу не предлагает, и отправлять запрос вслепую незачем.

          Предусловие проверяется чтением страницы ДО отправки. Лишний запрос
          здесь дешевле ошибочного возврата на порядок.
    notes:
      - >-
          ПОВТОРА НЕТ И БЫТЬ НЕ МОЖЕТ. Операция объявлена небезопасной и требует
          сверки вместо повтора: что стало с деньгами при неоднозначном исходе,
          выясняется чтением заказа, а не вторым запросом.
      - >-
          ОТВЕТ БЕЗ ПРИЗНАКА ОТКАЗА ОТВЕРГАЕТСЯ, а не читается успехом. Площадка
          отвечает признаком ОТКАЗА, как и на поднятии; отсутствие поля означает
          не успех, а непонятный ответ.

          Здесь это дороже, чем у поднятия: там молчаливое «получилось» стоило
          суток ожидания, тут - денег, о судьбе которых вызывающий не узнает.
      - >-
          ОТКАЗ ПЛОЩАДКИ - ИСХОД, А НЕ ИСКЛЮЧЕНИЕ. Отказав, она называет причину
          текстом, и текст этот единственное, что о причине известно. Бросить
          здесь исключение значило бы выбросить его вместе с исходом.
      - >-
          СУММА ВОЗВРАТА НЕ НАЗЫВАЕТСЯ НИГДЕ - ни в запросе, ни, по описанию
          стороннего источника, в ответе. Сколько именно вернулось, вызывающий
          узнаёт только чтением заказа.
    errors:
      - funora.capability.unsupported
      - funora.domain.precondition_failed
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  orders.details:
    summary: Читает подробности заказов пачкой, структурно.
    capability: orders.details
    safety: safe
    request_class: interactive
    returns: OrderDetailsBatch
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, get_orders_by_ids.
      rests_on_it: >-
        ВСЁ. Ни адреса, ни полей запроса, ни ключей ответа мы не наблюдали ни
        разу - ни в снимках, ни в записях запросов, ни в пробах.

        Это отличает точку от прочих на вторичном источнике: у поднятия наблюдён
        запрос, у отзыва - два поля из четырёх, у расчёта цены - итог на
        странице. Здесь не наблюдено ничего.
    notes:
      - >-
          ЕДИНСТВЕННАЯ ТОЧКА, ОТДАЮЩАЯ ЗАКАЗ СТРУКТУРНО, а не разметкой. Она
          даёт то, чего страница не даёт ни в каком виде: сумму ЧИСЛОМ, код
          валюты, разделение покупателя и продавца, состояние строкой,
          количество числом и раздел парой «тип - номер».
      - >-
          ЭТО МОГЛО БЫ СОБРАТЬ Order, И НЕ СОБИРАЕТ. Модель Order не строится ни
          одной реализацией из-за трёх причин сразу: сумма текстом, валюта
          знаком, покупатель и продавец неразделимы. Эта точка снимает все три.

          И всё же Order из неё не собирается. Модель контракта, построенная на
          ответе, которого никто не видел, - худший вид обещания: второй SDK
          прочтёт её как описание наблюдённого.

          Возвращается OrderDetails - проекция, отличимая по типу. Так же
          устроены OrderView со страницы заказа и OrderListEntry из списка.

          ПЕРВОЕ ЖИВОЕ НАБЛЮДЕНИЕ ЭТО МЕНЯЕТ. Тогда Order станет собираемым, и
          это будет самая крупная разблокировка контракта.
      - >-
          ЗАЩИТНОГО ТОКЕНА ЗДЕСЬ НЕТ, и это отличает семейство /api/ от форм.
          Тело - JSON, а не поля формы.
      - >-
          СОСТОЯНИЕ ОТДАЁТСЯ СТРОКОЙ И НЕ ПРИВОДИТСЯ К НАШЕМУ ПЕРЕЧНЮ НАСИЛЬНО.
          Сторонний источник называет пять значений; наш перечень знает три - те,
          что НАБЛЮДЕНЫ в разметке списка.

          Совпало со знакомым - отдаётся и строкой, и значением перечня. Не
          совпало - только строкой, а значение перечня остаётся ненаблюдённым.
          Дописать в перечень по чужому слову значило бы выдать чужое знание за
          своё наблюдение.
      - >-
          ПАЧКА ОТ ОДНОГО ДО ДЕСЯТИ. Верхняя граница взята у стороннего
          источника, и откуда она там - из ответа площадки либо из осторожности
          автора - по его коду не видно. Мы её соблюдаем: нарушать неизвестное
          ограничение дороже, чем сделать два запроса вместо одного.
    errors:
      - funora.capability.unsupported
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  orders.get:
    summary: >-
      Читает страницу одного заказа. Возвращает то, что страница вправду
      показывает, - не полный Order: сторон она не разделяет, кода валюты не
      даёт.
    capability: orders.get
    safety: safe
    request_class: interactive
    returns: OrderView
    errors:
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport
    notes:
      - >-
          Обязательный независимый источник истины перед любой выдачей товара.
          Событие оплаты, распознанное по тексту сообщения, основанием не является:
          текст пишет контрагент, и он может его подделать.
