# Операции с отзывами.
#
# safety:        safe | idempotent | unsafe
# request_class: interactive | poll | automation | monitoring
#   Класс проставляет сервис, а не пользователь. Он определяет, кого вытесняют
#   первым при насыщении бюджета.

# Собственной версии у файла нет нарочно. Настоящая ось одна и живёт в
# spec/version.yaml, раздел single_version_axis.

service: reviews

operations:

  reviews.leave:
    summary: Пишет отзыв к заказу либо ответ на чужой отзыв.
    capability: reviews.leave
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, order_id, author_id]
    returns: ReviewResult
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, send_review и delete_review.
      rests_on_it: >-
        Состав полей запроса и форма ответа. Два поля из четырёх - номер заказа
        и идентификатор автора - наблюдены НАМИ: они лежат атрибутами
        data-order и data-author на странице заказа и уже читаются разбором.
        Не наблюдены имена полей запроса, адрес и то, что приходит в ответ.
      why_opt_in: >-
        Отзыв виден покупателю и всем посетителям профиля. Ошибка здесь - это
        публичная оценка, выставленная не той сделке либо не той величины.
    notes:
      - >-
          ОДНА ТОЧКА НА ТРИ ДЕЙСТВИЯ: написать отзыв, ПРАВИТЬ уже написанный и
          ответить на чужой. Различает их сама площадка - по тому, кто автор и
          есть ли оценка. Отдельного адреса у правки нет.

          Отсюда и safety: idempotent. Повтор не создаёт второго отзыва, а
          переписывает тот же самый теми же значениями.
      - >-
          УСПЕХ УСТАНАВЛИВАЕТСЯ ПОЛОЖИТЕЛЬНЫМ ПРИЗНАКОМ, и это расхождение со
          сторонним источником названо нарочно.

          Сторонняя реализация объявляет успехом отсутствие отказа: смотрит код
          ответа и не заглядывает в тело. Тело же несёт ПЕРЕРИСОВАННЫЙ виджет
          отзыва - то есть готовый положительный признак, который остаётся
          только прочитать.

          Реализация читает его тем же разбором, что и отзыв на странице заказа,
          и сверяет оценку с отправленной. Не сошлось - исход неподтверждён, а
          не «успех».
      - >-
          ОЦЕНКА ОТ ОДНОГО ДО ПЯТИ. Наблюдены только такие; что площадка сделает
          с шестёркой либо с нулём, неизвестно, и отправлять непроверенное мы не
          станем. Отказ происходит до обращения к сети.
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  # ИМЯ remove, А НЕ delete, и это не вкусовщина: delete - ключевое слово в
  # TypeScript и в C++, а имя операции попадает в вызов. Экранировать его
  # там негде. Поймали ворота, и поймали правильно.
  reviews.remove:
    summary: Снимает свой отзыв либо свой ответ на чужой.
    capability: reviews.remove
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, order_id, author_id]
    returns: ReviewResult
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, send_review и delete_review.
      rests_on_it: >-
        Состав полей запроса и форма ответа. Два поля из четырёх - номер заказа
        и идентификатор автора - наблюдены НАМИ: они лежат атрибутами
        data-order и data-author на странице заказа и уже читаются разбором.
        Не наблюдены имена полей запроса, адрес и то, что приходит в ответ.
      why_opt_in: >-
        Отзыв виден покупателю и всем посетителям профиля. Ошибка здесь - это
        публичная оценка, выставленная не той сделке либо не той величины.
    notes:
      - >-
          Полей текста и оценки у этой точки нет вовсе - значит снятие не
          выражается отправкой пустого отзыва, у него своя точка.
      - >-
          КТО И ЧТО ВПРАВЕ СНЯТЬ, НЕ НАБЛЮДАЛОСЬ. Авторство задаётся полем
          запроса, а решает площадка. Подставлять туда чужой идентификатор
          реализация не станет: собственный она берёт со страницы сама.
      - >-
          ОТМЕНИТЬ СНЯТИЕ НЕЛЬЗЯ ИНАЧЕ КАК НАПИСАВ ЗАНОВО, а прежнего текста
          нам никто не вернёт. Прочитать отзыв перед снятием - дело
          вызывающего; реализация его не сохраняет, потому что хранить чужой
          текст без спроса хуже, чем потерять его по просьбе.
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  reviews.get:
    summary: >-
      Читает отзывы с профиля продавца. Возвращает те строки, которые страница
      отдала, - не все отзывы продавца: сверить их число не с чем.
    capability: reviews.get
    safety: safe
    request_class: interactive
    returns: ReviewsPage
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport
    notes:
      - >-
        Полнота означает «разобраны все строки страницы». Управления
        постраничным выводом на наблюдённой странице нет ни одного узла, а число
        отзывов в шапке показано локализованным текстом в две строки - см.
        запись reviews_page_totality в реестре неисполненного.
      - >-
        Наблюдался только СОБСТВЕННЫЙ профиль. Разметка отзыва лежит внутри
        таблицы и от владельца профиля не зависит, но утверждать это про чужой
        профиль нельзя, пока чужой не снят.
