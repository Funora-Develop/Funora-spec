# Личная переписка.
#
# Термин «личная переписка» выбран намеренно вместо «секретный чат»: отдельной
# сущности с особым шифрованием протокол не подтверждает, а название, обещающее
# больше, чем есть на самом деле, вводит пользователя в заблуждение о защищённости.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: chats

operations:

  chats.list:
    summary: Читает список переписок.
    capability: chats.list
    safety: safe
    request_class: poll
    # Не Chat[], и это исправление того же противоречия, что уже исправлено у
    # заказов. Полную запись Chat из списка собрать нельзя: у собеседника нет
    # идентификатора - в строке только имя, а имя не идентификатор, - и числа
    # непрочитанных сообщений страница не даёт вовсе.
    #
    # Реализация, читающая только этот файл, была вынуждена выдумать и то и
    # другое.
    # Не голый массив. Открытый список делает неполноту незаметной: вызывающий
    # берёт его и не спрашивает, всё ли прочитано, а неполный список неотличим
    # от полного. Возвращается страница - она несёт полноту, причину и перечень
    # повреждений, а записи отдаёт методом, который отказывается работать с
    # неполнотой без явного признания.
    #
    # Прежде здесь стоял массив записей, и спецификация противоречила сама себе:
    # spec/models уже описывал страницу и уже сверял её с реализацией.
    returns: ChatsPage
    returns_schema: spec/models/chats-page.schema.json
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.protocol.unexpected_response
      - funora.transport

  chats.history:
    summary: Читает недавнюю историю переписки.
    capability: chats.history
    safety: safe
    request_class: interactive
    # Не Message[], и не список вовсе. Возвращается Thread - результат чтения
    # страницы целиком, несущий полноту и повреждения. Голый список сообщений
    # делает неполноту незаметной: вызывающий берёт его и не спрашивает, всё ли
    # прочитано, а неполная переписка неотличима от короткой.
    #
    # Имя ThreadMessage, а не Message: под вторым в spec/models лежит модель
    # другой формы, которую из наблюдённой разметки собрать нельзя.
    returns: Thread
    returns_schema: spec/models/thread.schema.json
    errors:
      - funora.domain.not_found
      - funora.auth.session_expired
      # Страница переписки без опознанного контейнера даёт protocol.changed -
      # он возбуждается реализацией и не был объявлен здесь вовсе.
      - funora.protocol.changed
      - funora.protocol.unexpected_response
      - funora.transport

  chats.history_before:
    summary: Догружает более старые сообщения через курсор, если интерфейс позволяет.
    capability: chats.history_pagination
    safety: safe
    request_class: interactive
    returns: Message[]
    pagination: cursor
    errors:
      - funora.capability.unsupported
      - funora.state.cursor_incompatible
      - funora.transport

  chats.send_text:
    summary: Отправляет текстовое сообщение в переписку.
    capability: chats.send_text
    safety: unsafe
    request_class: interactive
    requires_reconciliation: true
    returns: Message
    governor: outbound_message
    notes:
      - >-
          Операция небезопасна. У отправленного сообщения нет отмены, а повтор при
          неоднозначном исходе означает второе сообщение покупателю.
      - Сверка выполняется по истории переписки, а не по факту отсутствия ошибки.
      - >-
          Проходит через ограничитель исходящих сообщений. Отправка в переписку, по
          которой не было входящего события в окне, требует явного флага и расходует
          отдельную малую квоту. Отсутствие метода массовой рассылки не мешает
          написать цикл в пять строк, а наказание получает продавец: пункт 1.9
          публичных правил площадки прямо запрещает массовую рассылку.
    errors:
      - funora.domain.not_found
      - funora.budget.exhausted
      - funora.auth.session_expired
      - funora.transport.timeout
      - funora.transport

  chats.send_image:
    summary: Отправляет изображение, если возможность подтверждена.
    capability: chats.send_image
    safety: unsafe
    request_class: interactive
    requires_reconciliation: true
    returns: Message
    governor: outbound_message
    notes:
      - Если возможность реализуется через внешний файлообменник, это столкновение
        с пунктом 1.12 публичных правил площадки. Проверить до включения.
    errors:
      - funora.capability.unsupported
      - funora.budget.exhausted
      - funora.transport

  chats.mark_read:
    summary: Отмечает переписку прочитанной, если операция существует.
    capability: chats.mark_read
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, chat_id, up_to_message_id]
    returns: void
    errors:
      - funora.capability.unsupported
      - funora.transport
