# Личная переписка.
#
# Термин «личная переписка» выбран намеренно вместо «секретный чат»: отдельной
# сущности с особым шифрованием протокол не подтверждает, а название, обещающее
# больше, чем есть на самом деле, вводит пользователя в заблуждение о защищённости.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: chats

operations:

  chats.list:
    summary: Читает список переписок.
    capability: chats.list
    safety: safe
    request_class: poll
    # Не Chat[], и это исправление того же противоречия, что уже исправлено у
    # заказов. Полную запись Chat из списка собрать нельзя: у собеседника нет
    # идентификатора - в строке только имя, а имя не идентификатор, - и числа
    # непрочитанных сообщений страница не даёт вовсе.
    #
    # Реализация, читающая только этот файл, была вынуждена выдумать и то и
    # другое.
    # Не голый массив. Открытый список делает неполноту незаметной: вызывающий
    # берёт его и не спрашивает, всё ли прочитано, а неполный список неотличим
    # от полного. Возвращается страница - она несёт полноту, причину и перечень
    # повреждений, а записи отдаёт методом, который отказывается работать с
    # неполнотой без явного признания.
    #
    # Прежде здесь стоял массив записей, и спецификация противоречила сама себе:
    # spec/models уже описывал страницу и уже сверял её с реализацией.
    returns: ChatsPage
    returns_schema: spec/models/chats-page.schema.json
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.protocol.unexpected_response
      - funora.transport

  chats.history:
    summary: Читает недавнюю историю переписки.
    capability: chats.history
    safety: safe
    request_class: interactive
    # Не Message[], и не список вовсе. Возвращается Thread - результат чтения
    # страницы целиком, несущий полноту и повреждения. Голый список сообщений
    # делает неполноту незаметной: вызывающий берёт его и не спрашивает, всё ли
    # прочитано, а неполная переписка неотличима от короткой.
    #
    # Имя ThreadMessage, а не Message: под вторым в spec/models лежит модель
    # другой формы, которую из наблюдённой разметки собрать нельзя.
    returns: Thread
    returns_schema: spec/models/thread.schema.json
    errors:
      - funora.domain.not_found
      - funora.auth.session_expired
      # Страница переписки без опознанного контейнера даёт protocol.changed -
      # он возбуждается реализацией и не был объявлен здесь вовсе.
      - funora.protocol.changed
      - funora.protocol.unexpected_response
      - funora.transport

  chats.history_before:
    summary: Догружает более старые сообщения через курсор, если интерфейс позволяет.
    capability: chats.history_pagination
    safety: safe
    request_class: interactive
    returns: Message[]
    pagination: cursor
    errors:
      - funora.capability.unsupported
      - funora.state.cursor_incompatible
      - funora.transport

  chats.send_text:
    summary: Отправляет текстовое сообщение в переписку.
    capability: chats.send_text
    safety: unsafe
    request_class: interactive
    requires_reconciliation: true
    returns: SendResult
    returns_schema: spec/models/send-result.schema.json
    governor: outbound_message
    notes:
      - >-
          ПОБОЧНОЕ ДЕЙСТВИЕ: отправка ПОМЕЧАЕТ ПЕРЕПИСКУ ПРОЧИТАННОЙ. Запрос
          кладёт узел диалога в подписку канала - иначе ответ не подтвердит
          отправку, канал подтверждает только подписанное, - а подписка на узел
          и есть то, чем помечается прочтение (см. chats.mark_read).

          Объявлено вслух 31.08.2026. Прежде действие происходило и молчало:
          вызывающий, отвечавший автоматом, снимал пометку непрочитанного у
          покупателя, ничего о том не зная.

          Отменить нельзя. Отправить, НЕ пометив, тоже нельзя: без подписки
          исход отправки не подтверждается ничем, а неподтверждённая отправка
          хуже помеченной переписки.
      - >-
          Операция небезопасна. У отправленного сообщения нет отмены, а повтор при
          неоднозначном исходе означает второе сообщение покупателю.
      - Сверка выполняется по истории переписки, а не по факту отсутствия ошибки.
      - >-
          Проходит через ограничитель исходящих сообщений. Отправка в переписку, по
          которой не было входящего события в окне, требует явного флага и расходует
          отдельную малую квоту. Отсутствие метода массовой рассылки не мешает
          написать цикл в пять строк, а наказание получает продавец: пункт 1.9
          публичных правил площадки прямо запрещает массовую рассылку.
    errors:
      - funora.domain.not_found
      - funora.budget.exhausted
      - funora.auth.session_expired
      - funora.transport.timeout
      - funora.transport

  chats.send_image:
    summary: Отправляет изображение, если возможность подтверждена.
    capability: chats.send_image
    safety: unsafe
    request_class: interactive
    requires_reconciliation: true
    returns: SendResult
    returns_schema: spec/models/send-result.schema.json
    governor: outbound_message
    notes:
      - Если возможность реализуется через внешний файлообменник, это столкновение
        с пунктом 1.12 публичных правил площадки. Проверить до включения.
    errors:
      - funora.capability.unsupported
      - funora.budget.exhausted
      - funora.transport

  chats.buyer_viewing:
    summary: Читает, что покупатели смотрят прямо сейчас.
    capability: chats.buyer_viewing
    safety: safe
    request_class: poll
    returns: BuyerViewing[]
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, get_buyers_viewing и
        __parse_buyer_viewing.
      rests_on_it: >-
        ТОЛЬКО ОТВЕТ. Подписка наблюдена НАМИ - объект вида c-p-u лежит в семи
        наших записях канала, и состав его известен: признак, идентификатор из
        восьми цифр, метка из восьми знаков.

        Не наблюдено, ЧТО приходит в ответ на такую подписку. Известно от
        сторонней реализации: при пустом признаке покупатель не смотрит ничего,
        иначе внутри лежит разметка со ссылкой на лот.
    notes:
      - >-
          ЧТЕНИЕ, И СОГЛАСИЯ НЕ СПРАШИВАЕТ. Ошибка чтения на чужом знании видна:
          вернётся не то либо не вернётся ничего.
      - >-
          РАЗМЕТКА ВНУТРИ ОТВЕТА ОТДАЁТСЯ КАК ЕСТЬ, а ссылка и подпись читаются
          из неё отдельными полями. Не разобралась - поля остаются
          ненаблюдёнными, а разметка сохраняется: по ней человек увидит то, чего
          не увидел разбор.
      - >-
          ПУСТОЙ ПРИЗНАК - ЭТО НАБЛЮДЕНИЕ «НЕ СМОТРИТ НИЧЕГО», а не неудача
          чтения. Различать обязательно: первое можно показать продавцу, второе
          означает, что мы не знаем.
      - >-
          ИМЯ ОБЪЕКТА ЗАПИСАНО ДОСЛОВНО и странно выглядит. Что оно означает -
          неизвестно, и догадываться незачем: подписка собирается по имени, а не
          по смыслу.
    errors:
      - funora.capability.unsupported
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  chats.mark_read:
    summary: Отмечает переписку прочитанной.
    capability: chats.mark_read
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, chat_id, up_to_message_id]
    returns: void
    notes:
      - >-
          ОТДЕЛЬНОГО ЗАПРОСА У ЭТОГО ДЕЙСТВИЯ НЕТ, и три недели наблюдения его
          ждали впустую. Прежнее summary так и говорило - «если операция
          существует», - и оговорка эта была честной ровно до тех пор, пока не
          выяснилось, что искали не то.

          Диалог помечается прочитанным тем, что его узел попал в ПОДПИСКУ
          обычного опроса канала обновлений. Страница, открыв переписку,
          опрашивает канал с объектом chat_node и пустым содержимым; подписка
          эта и есть всё действие.
      - >-
          ОТМЕНИТЬ НЕЛЬЗЯ: пометить диалог непрочитанным обратно площадка не
          предлагает нигде. Идемпотентность здесь означает лишь, что повтор не
          добавляет вреда, а не что действие обратимо.
      - >-
          У ОПЕРАЦИИ chats.send_text ЭТО ЖЕ ДЕЙСТВИЕ - ПОБОЧНОЕ. Отправка кладёт
          в подписку тот же объект, потому что канал подтверждает только
          подписанное; значит отправка попутно помечает переписку прочитанной.
          Объявлено у send_text отдельным примечанием.
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, send_message - флаг
        leave_as_unread убирает диалог из подписки, и это единственное, чем он
        отличается.
      rests_on_it: >-
        НЕ форма запроса, а ВЫВОД о его действии. Форма наша: наши записи
        показывают, что страница при открытом диалоге опрашивает канал с
        подпиской на него. Чужое - утверждение, что именно подписка снимает
        пометку непрочитанного.
      why_opt_in: >-
        Проверить вывод мы не могли: непрочитанность видна у ПОКУПАТЕЛЯ, а не у
        нас. Отменить действие нельзя, и ошибка тут снимает пометку у чужой
        переписки без ведома вызывающего.
    errors:
      - funora.capability.unsupported
      - funora.transport
