# Второй рынок площадки: предложения по количеству.
#
# Отделён от market НАРОЧНО. Лот - штучное предложение с описанием; чип -
# предложение по количеству, с ценой за единицу и без описания вовсе. Разметка
# совпадает до класса, а модель - нет: у чипа есть количество и нет описания.
#
# Свести их в одну службу значило бы завести модель с полями «иногда есть
# описание, иногда количество», а такая модель не отвечает ни на один вопрос
# определённо.

service: chips

operations:

  chips.offers:
    summary: Читает публичные предложения раздела чипов.
    capability: chips.offers
    safety: safe
    request_class: monitoring
    transport_lane: public_read
    returns: ChipsPage
    returns_note: >-
      Не голый массив: неполнота иначе незаметна, а по этому списку принимают
      решение о цене - ровно как на рынке лотов.
    cost_hint: 1
    notes:
      - >-
          Цена здесь ЗА ЕДИНИЦУ, а не за предложение целиком. Общей суммы на
          странице нет вовсе: её считает покупатель, выбрав количество.
      - >-
          Описания у предложения нет, и это записано положительно в
          spec/extraction/chips.yaml. Разбор, искавший бы его, объявил бы
          повреждённой каждую строку.
    errors:
      - funora.capability.unsupported
      - funora.protocol.changed
      - funora.transport.rate_limited
      - funora.transport
