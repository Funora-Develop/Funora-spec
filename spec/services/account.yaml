# Операции с аккаунтом и сессией.
#
# safety:        safe | idempotent | unsafe
# request_class: interactive | poll | automation | monitoring
#   Класс проставляет сервис, а не пользователь. Он определяет, кого вытесняют
#   первым при насыщении бюджета: мониторинг отменяем, у interactive и automation
#   есть неотчуждаемый минимум. Без классов собственный мониторинг продавца
#   систематически вытесняет ответы покупателям.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: account

operations:

  account.get:
    summary: Читает профиль аккаунта, от имени которого работает клиент.
    capability: account.profile
    safety: safe
    request_class: interactive
    returns: Account
    notes:
      - >-
        Читает страницу переписки, и выбор не случаен: собственный идентификатор
        лежит в атрибуте data-user, а тот есть только там, где есть виджет
        переписки. На списке продаж и на странице баланса его нет вовсе.
      - >-
        Балансов не читает. Они на другой странице, и брать её ради профиля
        значило бы ходить на площадку дважды за одним ответом; отсутствие поля
        означает «не наблюдали», а не «нулю равно».
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  account.refresh:
    summary: >-
      Перечитывает аккаунт. Делает ровно то же, что account.get: кэша у чтения
      аккаунта нет, а значит и обходить нечего.
    capability: account.profile
    safety: safe
    request_class: interactive
    returns: Account
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  account.switch_currency:
    summary: Меняет валюту, в которой площадка показывает суммы.
    capability: account.switch_currency
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, currency]
    returns: CurrencySwitch
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), account.py, get_exchange_rate.
      rests_on_it: >-
        Адрес, имена полей запроса и ключи ответа. НАБЛЮДЁН НАМИ только сам
        переключатель в шапке: пункты его несут код ISO 4217 в data-cy, и
        перечисляют они ПРОЧИЕ валюты, не текущую. То есть мы видели, какие
        коды бывают, и не видели, как их отправить.
      why_opt_in: >-
        Побочное действие ГЛОБАЛЬНО. После смены каждая страница показывает
        суммы в другой валюте - и всякое последующее чтение вернёт другие числа.

        Особенно дорого это для снимков рынка: сравнение двух снимков,
        снятых по разные стороны от смены, объявит сменившейся КАЖДУЮ цену.
    notes:
      - >-
          ПОДТВЕРЖДЕНИЕ НЕ ДАЁТСЯ ЗА ПОЛЬЗОВАТЕЛЯ. В запросе есть поле
          подтверждения, и реализация всегда шлёт в нём отрицание.

          Площадка отвечает двумя разными ветками: либо валюта сменена сразу,
          либо возвращается окно подтверждения - и тогда смены НЕ БЫЛО. Вторая
          ветка отдаётся исходом, а не проглатывается: решать, соглашаться ли,
          вправе только человек.
      - >-
          КУРС ИЗ ОКНА НЕ РАЗБИРАЕТСЯ, и это прямое следствие правила
          text_is_not_a_signal.

          Сторонняя реализация достаёт курс регулярным выражением из абзаца окна
          - то есть из ТЕКСТА НА ЛОКАЛИ ИНТЕРФЕЙСА. Смена языка аккаунта ломает
          такой разбор молча, а локаль привязана к аккаунту, а не к адресу.

          Текст окна отдаётся как есть. Прочитать его глазами человек может;
          вывести из него число реализация не станет.
      - >-
          СМЕНА ВЛИЯЕТ НЕ НА ВСЁ. Суммы ЗАКАЗОВ за настройкой не следуют: они
          показаны в валюте своих сделок. Наблюдено прямо - два сбора списка
          продаж при разной текущей валюте дали один и тот же набор знаков.
    errors:
      - funora.capability.unsupported
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  account.balance:
    summary: >-
      Читает страницу баланса: балансы по валютам и операции по счёту.
    capability: account.balance
    safety: safe
    request_class: interactive
    returns: BalancePage
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport
    notes:
      - >-
        Возвращает перечень балансов, а не одно значение: страница показывает
        три узла значения, по одному на валюту.
      - >-
        КОД ВАЛЮТЫ ЧИТАЕТСЯ с 31.08.2026, и прежнее утверждение о неоднозначности
        снято. Страница несёт знак, а набор валют площадки замкнут тремя -
        наблюдено дважды независимо, ключами настроек вывода и переключателем,
        всякий раз дающим ровно две альтернативы.
      - >-
        Суммой при этом остаётся ТЕКСТ, и это уже про другое. Перевод «1 234,56»
        в минорные единицы Money зависит от разделителя дробной части и знака
        разряда, а оба они локальны и нами не наблюдались.
      - >-
        Операции по счёту приходят той же операцией чтения, потому что лежат на
        той же странице. Отдельного запроса за ними нет, и делать его значило бы
        ходить на площадку дважды за одним ответом.

  session.health:
    summary: >-
      Проверяет пригодность сессии самым дешёвым доступным способом.
      Не выполняет бизнес-операцию ради проверки: лишний запрос это лишний след.
    capability: account.profile
    safety: safe
    request_class: poll
    returns: SessionHealth
    cost_hint: 1
    errors:
      - funora.auth.session_expired
      - funora.auth.access_blocked
      - funora.auth.challenge_required
      - funora.transport
    notes:
      - Вызывается ядром по расписанию, а не пользователем в цикле.
      - >-
        Результат кэшируется на min_health_interval_ms; повторный вызов раньше
        срока возвращает кэш, а не новый запрос. Ответ помечает это признаком
        from_cache - вызывающий видит, свежий ли перед ним ответ.
      - >-
        ОТЧИТЫВАЕТСЯ, А НЕ ПАДАЕТ. Отказ площадки здесь - это ответ, а не
        происшествие: проверку зовут именно затем, чтобы узнать о нём заранее.
        Годной сессия считается ровно при классе ok.

  capabilities:
    summary: Возвращает профиль возможностей адаптера и аккаунта.
    capability: account.profile
    safety: safe
    request_class: poll
    returns: CapabilityProfile
    # Пусто намеренно, а не по забывчивости. Профиль возможностей собирается из
    # того, что уже наблюдалось, и отдаётся без сети; отказывать тут нечему.
    # Неуспешная проба даёт unknown - это ответ, а не ошибка.
    errors: []
    notes:
      - На вызов действует single-flight.
      - Статические возможности отдаются без сети.
      - Неуспешная проба даёт unknown, а не unsupported.
