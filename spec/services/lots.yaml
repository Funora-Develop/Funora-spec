# Собственные предложения продавца.
#
# Здесь начинаются операции с денежными последствиями. Каждая запись обязана
# отвечать на три вопроса, иначе она не попадает в спецификацию:
#   1. что произойдёт при повторе;
#   2. что произойдёт, если исходное наблюдение было ошибочным;
#   3. как откатить, если сработало не то.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: lots

operations:

  lots.list_own:
    summary: Читает собственные предложения продавца.
    capability: lots.list_own
    safety: safe
    request_class: interactive
    returns: Lot[]
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  lots.activate:
    summary: Включает лот в выдачу.
    capability: lots.activate
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, target_state]
    returns: Lot
    reversible_by: lots.deactivate
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.deactivate:
    summary: Снимает лот с выдачи.
    capability: lots.deactivate
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, target_state]
    returns: Lot
    reversible_by: lots.activate
    guards:
      - id: requires_known_stock
        summary: >-
          Автоматическая деактивация по остатку допустима только при остатке,
          достоверно равном нулю. Состояние «не наблюдалось» обязано давать
          бездействие и диагностическое событие, а не снятие лота. Подстановка
          нуля по умолчанию запрещена: страница может перестать показывать
          остаток, и тогда весь ассортимент снимается за один цикл без единой
          ошибки в телеметрии.
      - id: requires_two_observations
        summary: >-
          Решение подтверждается двумя последовательными наблюдениями из разных
          запросов. Одно распарсенное значение основанием для действия не является.
      - id: fail_closed_on_degraded
        summary: >-
          При состоянии degraded, protocol-changed, rate-limited, challenged или
          blocked автоматика записи приостанавливается. Возобновление только явным
          действием пользователя.
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.update_price:
    summary: Изменяет цену лота.
    capability: lots.update_price
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, expected_revision, new_price]
    preconditions:
      - id: expected_revision
        required: true
        kind: input
        summary: >-
          Обязательное предусловие. Без него параллельная правка - из другого
          процесса, из мобильного приложения, из веб-интерфейса - будет перетёрта
          молча. При расхождении операция завершается PreconditionFailedError.
    returns: Lot
    audit: before_state
    errors:
      - funora.capability.unsupported
      - funora.domain.precondition_failed
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.promote:
    summary: Поднимает лот в выдаче.
    capability: lots.promote
    safety: unsafe
    request_class: automation
    requires_reconciliation: true
    returns: RaiseResult
    notes:
      - >-
          Операция небезопасна. Повтор расходует лимит поднятий, восстановить
          который нельзя. При неоднозначном исходе выполняется сверка фактического
          состояния, а не повтор.
      - >-
          Доступность зависит от времени с прошлого поднятия. Вывод отсюда
          («состояние вычисляется пробой») снят - он повторял поле source
          возможности, у которого есть читатели, и третья копия одного факта
          расходится с двумя первыми молча.
    preconditions:
      - id: cooldown_elapsed
        required: true
        kind: state
        observed: false
        summary: >-
          С прошлого поднятия обязано пройти время, которое площадка отводит
          между поднятиями. Срок не наблюдался: числа у нас нет, и выдумать его
          нельзя - оно решает, сколько ждать перед повтором.

          Предусловие объявлено потому, что операция объявляет отказ
          PreconditionFailedError. Отказ без предусловия оставляет вызывающего
          гадать, что именно не выполнено, и повторять вслепую - а повтор здесь
          тратит невосполнимый лимит поднятий.
    errors:
      - funora.capability.unsupported
      - funora.domain.precondition_failed
      - funora.transport.timeout
      - funora.transport
