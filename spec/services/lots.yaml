# Собственные предложения продавца.
#
# Здесь начинаются операции с денежными последствиями. Каждая запись обязана
# отвечать на три вопроса, иначе она не попадает в спецификацию:
#   1. что произойдёт при повторе;
#   2. что произойдёт, если исходное наблюдение было ошибочным;
#   3. как откатить, если сработало не то.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: lots

operations:

  lots.showcase:
    summary: >-
      Читает публичную витрину продавца с его профиля: разделы и предложения в
      том виде, в каком их видит покупатель.
    capability: lots.showcase
    safety: safe
    request_class: interactive
    returns: ShowcasePage
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport
    notes:
      - >-
        Возвращает НЕ Lot: витрина не даёт ни признака включённости, ни кода
        валюты. Отличается по типу нарочно.
      - >-
        Чтение не объявляется полным ни разу. Признака усечения на странице нет
        ни одного, но у части разделов ровно по двадцать строк - это довод в
        пользу обрезания, а не отсутствие довода против.
      - >-
        Адрес предложения отдаётся целиком, непрозрачной строкой:
        идентификатор лежит в строке запроса, и разобрать его по снимку нельзя.

  lots.list_own:
    summary: Читает собственные предложения продавца.
    capability: lots.list_own
    safety: safe
    request_class: interactive
    returns: OwnLotsPage
    returns_schema: spec/models/own-lots-page.schema.json
    notes:
      - >-
          Возвращается СТРАНИЦА, а не голый массив. Голый массив делает неполноту
          незаметной: половина строк, принятая за целое, выглядит как «у меня
          столько лотов». Тот же довод записан у чтения списка диалогов.
      - >-
          Модель Lot со страницы НЕ СОБИРАЕТСЯ: она требует is_active
          обязательным, а признака показа лота в выдаче на странице нет ни
          одного. Подробности - spec/extraction/lots.yaml, раздел absent.
      - >-
          Читается ради ИДЕНТИФИКАТОРА предложения. Витрина на профиле даёт те же
          лоты и даже больше полей, но идентификатора не даёт: там он лежит в
          строке запроса ссылки.
      - >-
          Отказ unexpected_response объявлен отдельно: он СЕСТРА protocol.changed,
          а не потомок, и старый перехват его не ловит. Тот же довод уже записан у
          чтения списка продаж, и здесь он тот же - страница раздела вправе
          ответить не тем: чужим разделом либо страницей входа.
    errors:
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.protocol.unexpected_response
      - funora.transport

  lots.activate:
    summary: Включает лот в выдачу.
    capability: lots.activate
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, target_state]
    preconditions:
      - id: expected_revision
        required: true
        kind: input
        summary: >-
          Обязательное предусловие, и по той же причине, что у правки цены:
          операция отправляет ПРОЧИТАННУЮ форму целиком, меняя один флажок.
          Без отпечатка параллельная правка - из другого процесса, из
          мобильного приложения, из веб-интерфейса - была бы перетёрта молча,
          и перетёрта не флажком, а описанием лота и сообщением покупателю.
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), types.py, LotFields.renew_fields.
      rests_on_it: >-
        Вид запроса при СНЯТОМ флажке active. Оба наших снимка сохранения сняты
        с отмеченным; сторонний источник шлёт поле всегда, при выключенном лоте
        - пустой строкой, тогда как наше рассуждение говорило, что снятый флажок
        не уходит вовсе.
      why_opt_in: >-
        Ошибка здесь не возвращает пустой результат. Она включает выключенный
        лот либо оставляет включённым тот, который просили снять, - и узнает об
        этом не разработчик, а продавец, из своей же витрины.
    returns: LotForm
    returns_note: >-
      НЕ Lot, и по той же причине, по которой Lot перестал быть итогом правки
      цены. Lot требует обязательным price типа Money, Money требует КОДА
      валюты, а со страницы читается знак. Собрать Lot значило бы выдумать
      валюту чужому лоту.
    reversible_by: lots.deactivate
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.deactivate:
    summary: Снимает лот с выдачи.
    capability: lots.deactivate
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, target_state]
    preconditions:
      - id: expected_revision
        required: true
        kind: input
        summary: >-
          Обязательное предусловие, как у включения и у правки цены: уходит
          прочитанная форма целиком, и без отпечатка параллельная правка была
          бы перетёрта молча.
    request_provenance:
      confidence: third_party_report
      source: >-
        FunPayAPI (бот FunPayCardinal), types.py, LotFields.renew_fields.
      rests_on_it: >-
        Вид запроса при СНЯТОМ флажке active. Оба наших снимка сохранения сняты
        с отмеченным; сторонний источник шлёт поле всегда, при выключенном лоте
        - пустой строкой, тогда как наше рассуждение говорило, что снятый флажок
        не уходит вовсе.
      why_opt_in: >-
        Ошибка здесь не возвращает пустой результат. Она включает выключенный
        лот либо оставляет включённым тот, который просили снять, - и узнает об
        этом не разработчик, а продавец, из своей же витрины.
    returns: LotForm
    returns_note: >-
      НЕ Lot, по той же причине, что у lots.activate и lots.update_price:
      Money требует кода валюты, а страница даёт знак.
    reversible_by: lots.activate
    guards:
      - id: requires_known_stock
        summary: >-
          Автоматическая деактивация по остатку допустима только при остатке,
          достоверно равном нулю. Состояние «не наблюдалось» обязано давать
          бездействие и диагностическое событие, а не снятие лота. Подстановка
          нуля по умолчанию запрещена: страница может перестать показывать
          остаток, и тогда весь ассортимент снимается за один цикл без единой
          ошибки в телеметрии.
      - id: requires_two_observations
        summary: >-
          Решение подтверждается двумя последовательными наблюдениями из разных
          запросов. Одно распарсенное значение основанием для действия не является.
      - id: fail_closed_on_degraded
        summary: >-
          При состоянии degraded, protocol-changed, rate-limited, challenged или
          blocked автоматика записи приостанавливается. Возобновление только явным
          действием пользователя.
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.form:
    summary: Читает форму правки одного предложения.
    capability: lots.form
    safety: safe
    request_class: automation
    returns: LotForm
    returns_note: >-
      Не Lot и не голый набор полей. Возвращается ФОРМА - то, что страница
      отдала, вместе с отпечатком состояния и признаком полноты.

      Голый набор полей делал бы неполноту незаметной: вызывающий собрал бы по
      нему запрос сохранения, а недостающее поле уходит пустым - и пустое поле
      здесь стирает описание лота, которое продавец писал руками.
    cost_hint: 1
    notes:
      - >-
          ЕДИНСТВЕННОЕ МЕСТО, где наблюдается признак показа лота в выдаче.
          Читается он НАЛИЧИЕМ пометки checked у флажка, а не значением.
      - >-
          Цена известна и объявлена: одна страница на предложение. У продавца с
          двумя сотнями лотов это две сотни запросов, и потому lots.list_own
          признака показа по-прежнему не отдаёт.
      - >-
          Отпечаток revision, который несёт форма, - НАШ, а не площадкин:
          площадка версии лота не даёт нигде. Он и подаётся в lots.update_price
          предусловием expected_revision.
    errors:
      - funora.capability.unsupported
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.protocol.changed
      - funora.transport

  lots.update_price:
    summary: Изменяет цену лота.
    capability: lots.update_price
    safety: idempotent
    request_class: automation
    idempotency_key_from: [account_id, lot_id, expected_revision, new_price]
    preconditions:
      - id: expected_revision
        required: true
        kind: input
        summary: >-
          Обязательное предусловие. Без него параллельная правка - из другого
          процесса, из мобильного приложения, из веб-интерфейса - будет перетёрта
          молча. При расхождении операция завершается PreconditionFailedError.
    returns: LotForm
    returns_note: >-
      НЕ Lot, и это исправлено 31.08.2026 по расхождению, найденному воротами.

      Объявлялся Lot, а операция возвращает форму. Lot требует обязательным
      price типа Money, Money требует КОДА валюты, а со страницы читается знак.
      Соответствие знака коду однозначным не наблюдалось - то же, что мешает
      market.offers.

      Собрать Lot из формы значило бы выдумать валюту чужому лоту, и заметил бы
      это не разработчик, а продавец.

      Возвращается ФОРМА, перечитанная ПОСЛЕ сохранения: с новым отпечатком, с
      новой ценой и с признаком показа. Перечитанная, а не собранная из
      отправленного: собранная утверждала бы, что площадка приняла ровно то, что
      мы послали, ни разу её об этом не спросив.
    audit: before_state
    audit_rules:
      requirement: >-
        Состояние лота до правки сохраняется ДОЛГОВЕЧНО и ВПЕРЕДИ отправки.

        Долговечно - потому что у площадки нет ни истории цен, ни отката: «как
        было» знает только наша запись, и запись в памяти процесса перезапуск
        стирает целиком. Впереди отправки - потому что «запишем, когда
        подтвердится» означает не записать ровно те правки, которые могли уйти:
        ответ теряется, процесс падает, а цена на площадке уже новая.

        Требование это единственное в контракте, и единственно оно потому, что
        правка цены - единственная объявленная операция, чей результат нельзя
        узнать у площадки задним числом.
      without_the_journal: fail_closed
      option_name: unsafe_price_changes_without_audit
      mark_name: unsafe_price_changes_without_audit
      mark_is_read_where: >-
        SessionHealth.unsafe_marks. Тот же идиом, что у отправки без
        долговечного реестра: снять защиту можно, снять её незаметно нельзя.
      journal_bound: >-
        Журнал ограничен, и предел объявляется вслух вместе со счётчиком
        вытесненных: переоценщик, ходящий раз в минуту, за год пишет полмиллиона
        записей, а молчаливое усечение читалось бы как «правок было столько».

        ПЕРВАЯ запись о лоте не вытесняется никогда. Промежуточные цены ставил
        тот же бот; первая - та, что стояла до него, и она отвечает на
        единственный вопрос, ради которого журнал заведён.
    errors:
      - funora.capability.unsupported
      - funora.domain.precondition_failed
      - funora.domain.not_found
      - funora.auth.session_expired
      - funora.transport

  lots.promote:
    summary: Поднимает в выдаче ВСЕ предложения раздела.
    capability: lots.promote
    safety: unsafe
    request_class: automation
    requires_reconciliation: true
    returns: RaiseResult
    notes:
      - >-
          Поднимаются ВСЕ предложения раздела разом, а не одно. Запрос несёт
          игру и раздел, идентификатора предложения в нём нет; кнопка на
          странице так и подписана - «Поднять предложения». Имя promote в
          единственном числе не читается, и обёртка «поднять мой лот» поверх
          этой операции была бы ложью.
      - >-
          Операция небезопасна. Повтор расходует лимит поднятий, восстановить
          который нельзя. При неоднозначном исходе выполняется сверка фактического
          состояния, а не повтор.
      - >-
          Доступность зависит от времени с прошлого поднятия. Вывод отсюда
          («состояние вычисляется пробой») снят - он повторял поле source
          возможности, у которого есть читатели, и третья копия одного факта
          расходится с двумя первыми молча.
      - >-
          Площадка отвечает признаком ОТКАЗА, а не успеха: успех читается
          отрицанием поля error. Ответ без этого поля отвергается как изменение
          протокола, а не толкуется успехом: проверить повтором нельзя - повтор
          тратит невосполнимый лимит.
    preconditions:
      - id: cooldown_elapsed
        required: true
        kind: state
        observed: true
        summary: >-
          С прошлого поднятия обязано пройти время, которое площадка отводит
          между поднятиями.

          СРОК НАБЛЮДАЕТСЯ ТОЛЬКО В ОТВЕТЕ НА ПОПЫТКУ - полями unlock_at и wait
          модели RaiseResult. Заранее его не узнать ниоткуда: страница своих
          лотов срока не несёт. Значит, единственный способ проверить
          предусловие - выполнить операцию; отказ и назовёт срок.

          Отсюда и обращение с отказом: он ИСХОД, а не отказ-исключение. Срок
          приходит вместе с ним, и превратить отказ в исключение значило бы
          выбросить единственное, что говорит, когда пробовать снова.
    errors:
      - funora.capability.unsupported
      - funora.transport.timeout
      - funora.transport
    # ОТКАЗА funora.domain.precondition_failed ЗДЕСЬ БОЛЬШЕ НЕТ, и снят он не
    # ради удобства.
    #
    # Он был объявлен, пока срок остывания не наблюдался: отказ казался
    # единственным способом сообщить «рано». Наблюдение показало другое -
    # площадка отвечает обычным ответом, в котором лежит и признак отказа, и
    # срок следующей попытки.
    #
    # Оставить отказ-исключение значило бы выбрасывать срок вместе с ним:
    # вызывающий узнавал бы «рано» и не узнавал бы «насколько», а спросить
    # второй раз стоит невосполнимого лимита.
    #
    # Ломающее изменение: перехватывавший PreconditionFailedError у этой
    # операции обязан читать raised у RaiseResult.
