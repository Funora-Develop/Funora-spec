# Каталог: разделы и схемы полей.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

service: catalog

operations:

  catalog.categories:
    summary: >-
      Читает каталог с корня площадки: игры, их варианты и разделы каждого.
    capability: catalog.categories
    safety: safe
    request_class: interactive
    returns: CatalogPage
    notes:
      - >-
        Возвращает страницу, а не голый перечень. Голый перечень делает
        неполноту незаметной: вызывающий берёт его и не спрашивает, всё ли
        прочитано, а неполный перечень неотличим от полного.
      - >-
        Возвращает НЕ Category: та требует локали отображения, а корень площадки
        её у раздела не показывает - только у страницы целиком.
      - >-
        Читается только основной список. Избранное повторяет его целиком -
        наблюдено, восемь карточек из восьми, - и новых сведений не даёт.
    cacheable:
      ttl_ms: 86400000
      invalidate_on: [adapter_version_change, protocol_changed, session_change]
      notes:
        - Данные из кэша не могут быть основанием для отрицательного вывода в diff.
          Устаревший справочник даёт пустую выдачу, а движок сравнения трактует её
          как исчезновение рынка.
    errors:
      - funora.protocol.changed
      - funora.transport

  catalog.field_schema:
    summary: Читает схему полей подкатегории, если её удаётся достоверно нормализовать.
    capability: catalog.field_schema
    safety: safe
    request_class: interactive
    returns: FieldSchema
    errors:
      - funora.capability.unsupported
      - funora.protocol.changed
      - funora.transport
