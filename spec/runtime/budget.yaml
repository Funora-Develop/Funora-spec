# Бюджет запросов и расписание опроса.
#
# В blueprint словосочетание «rate budget» встречается семь раз как решение, и ни
# разу не сопровождается числом. Ни потолка запросов, ни базового интервала, ни
# предела параллельных соединений, ни размера очереди, ни таймаута обработчика.
# Без чисел каждая из шести реализаций выберет свои совершенно законно, и
# conformance этого не поймает: сравнивать нечего.
#
# ВТОРАЯ, БОЛЕЕ ВАЖНАЯ ОШИБКА, которую здесь исправляем: единица учёта.
# Бюджет привязывался к объекту Client, то есть к аккаунту. Но ограничение
# накладывает площадка, и накладывает она его на СЕТЕВУЮ ИДЕНТИЧНОСТЬ, а не на
# наш объект. Пять клиентов в одном процессе, каждый со «своим» бюджетом, дают
# пятикратную нагрузку с одного адреса при формально соблюдённых правилах.
#
# Числа ниже помечены provisional. Они выбраны консервативно и будут уточнены по
# результатам наблюдений на тестовом аккаунте. Провизорное число лучше отсутствия
# числа: его видно, его можно оспорить и проверить, а отсутствующее нельзя.

# Собственной версии у файла нет нарочно. Их было двадцать две на одну вещь -
# по одной в шапке каждого файла, - и все двадцать две стояли на 0.1.0 при
# версии контракта 0.3.0. Не читал их никто, кроме проверки «поле есть»: они
# отстали на три минора, и отставание молчало.
#
# Настоящая ось одна и живёт в spec/version.yaml. Правило записано там же,
# в разделе single_version_axis.

provisional: true

# --- Область действия ------------------------------------------------------
scope:
  primary: outbound_identity
  definition: >-
    Сетевая идентичность - пара из исходящего адреса и целевого хоста. Именно она
    видна площадке, и именно по ней применяются ограничения.
  nesting: >-
    Бюджет аккаунта вложен в бюджет сетевой идентичности. Запрос расходует оба:
    сначала проверяется общий, потом персональный. Обратный порядок бессмысленен.

  client_default: shared_runtime
  client_rule: >-
    Client без явно переданного runtime присоединяется к общему для процесса.
    Изоляция только явная. Это решение публичного конструктора, и менять его
    после 1.0 будет ломающим изменением, поэтому оно принято сейчас.

# --- Ведро токенов ---------------------------------------------------------
buckets:
  host:
    capacity: 60
    refill_per_second: 1.0
    burst: 10
    summary: Общее ведро на сетевую идентичность.

  account:
    capacity: 30
    refill_per_second: 0.5
    burst: 5
    summary: Вложенное ведро на аккаунт.

  write:
    capacity: 60
    refill_per_second: 0.0167
    burst: 5
    unit: actions_per_hour
    summary: >-
      Отдельное ведро для операций записи. Считается в действиях, а не в запросах:
      одно действие может стоить нескольких запросов, а ограничивать надо именно
      число изменений на площадке.

counting:
  counts_retries: true
  counts_redirects: true
  rule: >-
    Расходуются отправленные запросы, включая повторы и переходы по редиректам.
    Если считать только логические операции, шторм повторов оказывается бесплатным
    ровно в тот момент, когда площадке хуже всего.

  # Что означает false. Прежде не было сказано нигде, а выбор поведенческий:
  # два добросовестных прочтения расходятся ровно в шторме повторов при пустом
  # ведре - в том самом положении, ради которого правило выше и написано.
  false_means: cost_zero
  false_means_note: >-
    Признак управляет СТОИМОСТЬЮ, а не допуском. При false запрос проходит через
    бюджет с нулевой ценой: токенов не тратит, но правило допуска по классу
    соблюдает наравне со всеми и остывание идентичности выжидает.

  why_not_bypass: >-
    Отменять при false сам вызов бюджета нельзя, и это главное здесь. Допуск
    решает не «сколько стоит», а «можно ли вообще сейчас идти»: он держит долю
    более защищённых классов и не пускает никого, пока идентичность остывает
    после ограничения частоты.

    Признак, отменяющий вызов целиком, сделал бы шторм повторов не бесплатным,
    а НЕОСТАНОВИМЫМ: клиент, получивший 429, повторял бы запрос мимо
    собственного отступления. Это ровно тот исход, от которого написано правило
    выше, только хуже - там запросы были бесплатны, здесь они ещё и не ждут.

  scope_note: >-
    Признаки не меняют того, кому принадлежит расход. Запросы, ушедшие вслед за
    первым, относятся к классу вызвавшей операции - см. раздел class_admission,
    пункт debt_belongs_to_the_caller.

exhausted:
  max_wait_ms: 5000
  then: BudgetExhaustedError
  rule: >-
    При исчерпании вызов ждёт не дольше max_wait_ms, затем завершается ошибкой.
    Ошибка намеренно не наследуется от TransportError: это локальное решение SDK
    не отправлять запрос, а не ответ сервера. Пользователь, поймавший
    TransportError, обычно повторяет - повторять исчерпанный бюджет означает
    крутиться вхолостую.

# --- Как именно ждут --------------------------------------------------------
# Предел ожидания объявлен выше числом, а САМО ожидание не было объявлено
# никак: ни сколько раз повторяется попытка, ни как округляется пауза. Шесть
# реализаций написали бы шесть разных, и трасса меток отправки - то самое, что
# набор соответствия сравнивает, - разошлась бы у всех.
waiting:
  attempts: 2
  attempts_note: >-
    Одна пауза и одна повторная попытка, больше нет. Цикл ожидания превратил бы
    предел max_wait_ms в пожелание: каждая итерация ждала бы «не дольше
    предела», а вызов снаружи стал бы неотличим от зависшего процесса.

    Единица здесь означала бы «не ждать вовсе» и отменила бы предел с другой
    стороны, поэтому меньше двух быть не может.

  guard_ms: 1
  guard_note: >-
    Пауза округляется вверх до целых миллисекунд и СТРОГО БОЛЬШЕ точной
    величины: к целой части прибавляется guard_ms. Округление вниз или вровень
    привело бы возобновление ровно на границу, где запаса ещё нет из-за
    последнего бита деления, - и вызов отказал бы, прождав всё положенное.

    Величина нормативна, а не косметична. Без неё трасса меток отправки
    отличалась бы у реализаций на разных языках в последнем знаке, и сравнивать
    её было бы нельзя - а сравнение трассы и есть проверяемое свойство.

  guard_applies_to: >-
    ВСЯКАЯ пауза, вычисленная из монотонных секунд и выданная целыми
    миллисекундами. Их три: ожидание запаса, ожидание права на залп и ожидание
    конца остывания - как у снятого класса, так и у самой идентичности.

    Область объявлена перечнем нарочно. Прежде правило было сформулировано под
    один случай - повторную попытку за бюджетом, - и два других применяли то же
    округление литералом, то есть по совпадению. Правка объявленного числа
    обошла бы их стороной, и половина пауз поехала бы, а половина нет.

    Довод у всех трёх один: после паузы вызывающий возобновляет работу и
    спрашивает то же самое снова. Пауза вровень приводит его туда, где условие
    ещё не выполнено, и отказ приходит после полного ожидания - худший из
    возможных исходов, потому что и время потрачено, и результата нет.

# --- Классы запросов -------------------------------------------------------
# Класс проставляет сервис, а не пользователь. Он определяет, кого вытесняют
# первым при насыщении. Без классов собственный мониторинг продавца систематически
# вытесняет ответы покупателям: планировщик наблюдений создаёт больше запросов и
# просто выигрывает очередь.
classes:
  interactive:
    floor_share: 0.30
    preemptible: false
    summary: Вызовы, инициированные пользователем прямо сейчас.
  automation:
    floor_share: 0.30
    preemptible: false
    summary: Реакции на события - ответы, изменения лотов, поднятия.
  poll:
    floor_share: 0.25
    preemptible: deferrable
    summary: Цикл обновлений. Может быть отложен, но не отменён.
  monitoring:
    floor_share: 0.15
    preemptible: cancellable
    summary: >-
      Наблюдение за рынком. Отменяется первым и уступает всем: пропущенный цикл
      наблюдения стоит задержки в данных, пропущенный ответ покупателю стоит денег.

# --- Что означает burst -----------------------------------------------------
# Поле стояло у всех трёх вёдер голым числом. Ни строки о том, что оно
# ограничивает, за какое окно считается и зачем нужно вместе с capacity - и
# реализация его не читала вовсе.
#
# Решение: ёмкость и залп ограничивают РАЗНОЕ, и потому нужны оба.
#
# capacity - это запас. Он копится в простое и отвечает на вопрос «сколько
# всего можно потратить, если долго не ходил».
#
# burst - это темп. Он отвечает на вопрос «сколько можно отправить подряд, не
# переводя дыхания», и не зависит от того, сколько накопилось.
#
# Без второго предела клиент, простоявший минуту, выпускает шестьдесят запросов
# в одну секунду. Формально он в своём праве - запас накоплен честно, - а
# выглядит это ровно как то, ради чего площадки и заводят ограничение частоты.
# Первым от собственного залпа страдает сам аккаунт.
burst_rule:
  meaning: >-
    Не больше burst запросов в течение burst_window_ms. Предел действует
    независимо от накопленного запаса: исчерпав его, запрос ждёт, даже когда
    ведро полно.

  window_ms: 1000

  window_note: >-
    Секунда, а не минута. Окно должно быть короче любого осмысленного
    отступления, иначе оно сливается с ним и перестаёт быть отдельным пределом.

  recovery: >-
    Право на залп восстанавливается равномерно: burst единиц за окно, то есть
    одна единица за window_ms / burst. Ступеньками восстанавливать нельзя - на
    границе окна получался бы двойной залп, вдвое больший объявленного.

  relation_to_capacity: >-
    Пределы применяются вместе, и ждать приходится дольшего из двух. Запрос
    проходит, только когда хватает и запаса, и права на залп.

  provisional_note: >-
    Числа подобраны, а не измерены, как и прочие числа этого файла. Наблюдения,
    из которого следовало бы именно десять и именно пять, не делалось.

# --- Правило допуска по классу ----------------------------------------------
# Доли объявлены давно, а правила, по которому они применяются, не было. Значит
# шесть реализаций написали бы шесть разных - и разошлись бы ровно там, где
# доли и придуманы: под нагрузкой.
#
# Доля - это ПОЛ, а не потолок. Она не ограничивает класс сверху: пока никто не
# мешает, любой класс вправе израсходовать ведро целиком. Она обещает другое -
# что менее защищённый класс не съест последнюю долю более защищённого.
class_admission:
  order: [interactive, automation, poll, monitoring]
  order_note: >-
    Порядок защищённости объявлен списком, а не выведен из долей. Вывод по долям
    неоднозначен: у interactive и automation доля одна и та же, и две реализации
    отсортировали бы их по-разному - то есть под нагрузкой отвечали бы
    покупателю и поднимали лот в разном порядке.

  rule: >-
    Запрос класса X допускается, если после списания его стоимости в ведре
    останется не меньше, чем сумма долей всех классов, стоящих в order раньше X.

  reserved_above:
    interactive: 0.00
    automation: 0.30
    poll: 0.60
    monitoring: 0.85
  reserved_above_note: >-
    Числа выведены из floor_share сложением и объявлены здесь целиком, а не
    вычисляются на месте: сложение долей с плавающей точкой даёт разный
    последний знак в разных языках, и порог оказался бы разным.

  demand_window_ms: 60000
  demand_note: >-
    Порог складывается только из долей тех классов, которые претендуют на
    ёмкость: класс считается претендующим, если обращался за бюджетом в
    последние demand_window_ms.

    Без этого условия доля превращалась бы из пола в потолок. Пол обещает, что
    менее защищённый не съест последнюю долю более защищённого - но обещание
    имеет смысл, только когда более защищённому вправду есть что съесть.
    Вытеснять некого, когда никто не претендует, и запрещать циклу обновлений
    брать больше четверти ведра на пустой площадке значило бы наказывать его за
    чужое бездействие.

  consequence: >-
    interactive расходует ведро до дна всегда. Прочие уступают ровно тем, кто
    вправду ходит: пока продавец не отвечает покупателям и не меняет лоты, цикл
    обновлений и наблюдение за рынком располагают всем ведром. Стоит появиться
    ответам - наблюдение уступает первым. Это и означает «пропущенный цикл
    наблюдения стоит задержки в данных, пропущенный ответ покупателю стоит
    денег».

  on_refusal:
    non_preemptible: >-
      Классы interactive и automation ждут пополнения. Отказать им нельзя: их
      никто не сможет повторить за пользователя, а ответ покупателю, не
      отправленный из-за собственного мониторинга продавца, - худший исход,
      какой этот раздел вообще может дать.
    deferrable: >-
      Класс poll ждёт пополнения. Отложить цикл обновлений можно, отменить
      нельзя: отменённый цикл означает пропущенные события, а не задержанные.
    cancellable: >-
      Класс monitoring получает BudgetExhaustedError немедленно. Ждать
      бессмысленно: к моменту пополнения наблюдение устареет, а место в очереди
      оно займёт прямо сейчас.

  debt_belongs_to_the_caller: >-
    Запросы, ушедшие вслед за первым - переходы по редиректам и повторы, -
    относятся к классу той операции, которая их вызвала. Иного разумного ответа
    нет: класс есть свойство операции, а переход - её продолжение.

    Правило записано потому, что эталонная реализация списывала этот долг без
    класса и тем самым помечала претендующим самый защищённый класс. Цикл
    обновлений, прошедший через три перехода, на минуту поднимал порог допуска
    себе же и наблюдению за рынком - будто покупателю кто-то отвечал. Ровно то,
    от чего написано условие о спросе.

  what_is_not_done: >-
    Вытеснение УЖЕ ИДУЩЕГО запроса не выполняется: для этого нужна общая
    очередь с приоритетами, а эталонная реализация ходит на площадку по одному
    запросу за раз. Правило допуска работает на входе, а не в середине.

# --- Расписание опроса -----------------------------------------------------
scheduling:
  active_interval_ms: 3000
  idle_step_multiplier: 1.5
  max_interval_ms: 120000
  activity_window_ms: 300000

  min_floor_ms: 2000
  min_floor_rule: >-
    Нижний предел интервала не понижается обычной настройкой. Это единственный
    параметр, который защищает площадку от слишком уверенного пользователя, а
    аккаунт пользователя - от него самого. Понижение возможно только через опцию
    с префиксом unsafe_, и её использование отмечается в состоянии здоровья
    клиента, чтобы это было видно в диагностике при разборе блокировки.

  activity_definition: >-
    Аккаунт считается активным, если в окне activity_window_ms наблюдалось хотя бы
    одно событие данных. Управляющие события активностью не считаются: иначе
    сообщение о деградации само себя продлевает.

# --- Ограничение исходящих сообщений ---------------------------------------
# Анти-спам в blueprint был политикой именования: не добавлять метод broadcast.
# Это не механизм. Отсутствие метода не мешает написать цикл в пять строк, а
# наказание по пункту 1.9 публичных правил площадки получает продавец.
outbound_governor:
  messages_per_hour: 30
  unique_recipients_per_hour: 15
  min_interval_per_chat_ms: 30000
  window_ms: 3600000

  cold_outreach:
    definition: Отправка в переписку, по которой не было входящего события в окне.
    requires_explicit_flag: true
    quota_per_hour: 3
    window_ms: 86400000
    window_rationale: >-
      Сутки. ЧИСЛО ВЫБРАНО, А НЕ НАБЛЮДЕНО, и направление выбора стоит назвать
      прямо, потому что оно обратно ожидаемому.

      Чем окно ШИРЕ, тем дольше переписка считается тёплой, тем меньше обращений
      попадает под квоту холодных - то есть широкое окно ЗАЩИТУ ОСЛАБЛЯЕТ.
      Ограничительным был бы час, а не сутки.

      Сутки выбраны не ради строгости, а ради того, чтобы механизм не мешал
      обычной работе: при часовом окне переписка, по которой ответили вчера
      вечером, оказалась бы холодной, и продавец упирался бы в квоту трёх,
      отвечая своим же покупателям. Отказ на обычной работе - худший способ
      защитить: его обходят, выключая защиту.

      Уточнять число надо не рассуждением, а наблюдением за тем, через сколько
      собеседники вправду отвечают. До тех пор оно помечено провизорным.
    window_is_provisional: true

  # --- Что греет переписку ---------------------------------------------------
  warming:
    events: [message.created]
    direction_required: inbound
    how_direction_is_decided: >-
      СТРУКТУРНО, сравнением адреса профиля автора с адресом СОБСТВЕННОГО
      профиля. Не по имени: имя меняется, и совпадение имён подделывается
      собеседником, назвавшимся как продавец.

      Оба адреса нормализуются перед сравнением: у площадки они наблюдались с
      завершающей косой чертой и без неё.
    why_not_unread_changed: >-
      Событие chat.unread_changed греть НЕ ДОЛЖНО, и это не мелочь. Счётчик
      непрочитанного меняется и от НАШЕЙ отправки тоже - она сдвигает позицию
      диалога. Ограничитель, гревшийся бы на нём, отменял бы сам себя: первая
      отправка в холодную переписку делала бы её тёплой, и квота трёх обращений
      в сутки не сработала бы ни разу.
    why_not_orders: >-
      События заказов не греют. Заказ означает, что собеседник что-то купил, а
      не что он готов к переписке, и причинная связь между ними в контракте уже
      объявлена ненаблюдённой - см. запись ordering_causality.
    default_is_cold: >-
      Переписка считается ХОЛОДНОЙ, пока не доказано обратное. Тепло требует
      положительного свидетельства - наблюдённого входящего сообщения в окне, -
      а не отсутствия свидетельства холода.

      Правило то же, что и во всём проекте: отсутствие объявляется по
      положительному признаку. Ошибка здесь стоит по-разному в две стороны:
      лишний отказ - неудобство, лишняя отправка - наказание продавцу по пункту
      1.9 публичных правил площадки.

  # --- Область действия ------------------------------------------------------
  scope:
    key: account
    key_source: >-
      Собственный идентификатор, наблюдаемый в атрибуте data-user. Не Client и не
      сетевая идентичность: пределы защищают АККАУНТ от наказания, а один процесс
      волен работать несколькими аккаунтами через один выход в сеть.
    order_of_checks: >-
      Ограничитель спрашивается ПЕРВЫМ, до вёдер. Порядок нормативен.

      Причина в стоимости отказа. Ведро отвечает «подождите столько-то» и ждёт;
      ограничитель ждать не может - его пределы часовые при объявленном пределе
      ожидания в пять секунд. Спроси мы ведро первым, клиент прождал бы у ведра,
      а потом всё равно упёрся бы в ограничитель.
    counted: attempt
    counted_rationale: >-
      Считается ПОПЫТКА, а не успех, и запись делается ВПЕРЕДИ запроса.

      Иначе неоднозначный исход не учитывался бы вовсе: форма отказа канала не
      наблюдалась, транспортный отказ объявлен способным иметь последствия, и
      «не засчитаем, раз не подтвердилось» означало бы не считать ровно те
      отправки, которые могли уйти.

  # --- Отказ ------------------------------------------------------------------
  on_refusal:
    order_of_limits:
      normative: true
      order:
        - cold_outreach_not_declared
        - min_interval_per_chat
        - cold_outreach_quota
        - messages_per_hour
        - unique_recipients_per_hour
      why_it_is_normative: >-
        На решении «пропустить или отказать» порядок не сказывается: отказ есть
        отказ. Сказывается он на ИМЕНИ упёршегося предела, а имя - часть ответа:
        по нему вызывающий решает, ждать полминуты или не писать до завтра.

        Две реализации, проверившие пределы в разном порядке, назвали бы разное
        на одной и той же попытке. Расхождение молчаливое: обе отказали, обе
        правы, а совет вызывающему разный.
      why_this_order: >-
        Сперва ошибка вызывающего - она о самом вызове, а не об истории, и
        чинится без ожидания вовсе.

        Дальше от узкого к широкому: пауза на переписку (полминуты), квота
        холодных (сутки), число сообщений в час, число адресатов в час. Так
        названный предел - самый близкий к разрешению из упёршихся.

    waiting: false
    waiting_rationale: >-
      Ждать нельзя и не предлагается. Пределы часового масштаба, а предел
      ожидания у вёдер - пять секунд; ожидание тут либо бессмысленно, либо
      останавливает вызывающего на сорок минут.
    error_for_quota: funora.budget.exhausted
    error_for_missing_flag: funora.usage
    error_rationale: >-
      Новых классов ошибок не заводится. Исчерпанная квота - это ровно
      «бюджет исчерпан, запрос не отправлялся». Холодное обращение без явного
      признака - ровно «SDK использован неверно, исправлять надо вызывающий
      код»: продавец не сказал, что пишет первым.
    names_the_limit: >-
      Отказ обязан назвать, КАКОЙ предел упёрся, и через сколько миллисекунд он
      освободится. Без этого вызывающий не отличит «подожди полминуты» от
      «сегодня больше нельзя», и напишет цикл, упирающийся в стену.

  # --- Переживание перезапуска -------------------------------------------------
  durability:
    required: true
    where: Файл состояния клиента, рядом с гашением повторов.
    stamps: wall_clock_ms_since_epoch
    stamps_rationale: >-
      Метки хранятся стенными миллисекундами от эпохи, а считаются внутри
      монотонными секундами. Приём не выдуман: ровно так уже устроено гашение
      повторов, и его объяснение перечисляет обе ловушки поимённо.

      Сохранённое монотонное показание после перезапуска означает не то, что
      значило при записи. Машину перезагрузили - разность отрицательна, и запись
      не истекает НИКОГДА. Машина работает давно - показание огромно, и весь
      реестр выбрасывается разом.
    without_the_ledger: fail_closed
    without_the_ledger_rule: >-
      Без долговечного реестра отправка ОТКАЗЫВАЕТ. Послабление возможно только
      через опцию с префиксом unsafe_, и её использование отмечается в состоянии
      здоровья клиента - тем же идиомом, что и понижение нижнего предела
      интервала.

      Иначе защита снимается перезапуском процесса: пределы часовые, а память
      обнуляется. Тридцать сообщений в час превращались бы в тридцать на запуск.
    option_name: unsafe_sends_without_ledger
    mark_name: unsafe_sends_without_ledger
    mark_is_read_where: >-
      SessionHealth.unsafe_marks. Отметка объявлена вместе с местом, где её
      читают, и это не формальность: отметка о снятой защите, которую никто не
      читает, - это след, никуда не ведущий. Ровно так и было у понижения
      нижнего предела опроса: расписание ставило пометку с самого своего
      появления, а состав состояния здоровья её не предусматривал.
    refusal_limit_name: no_durable_ledger
    clock_moved_forward: >-
      Часы, переведённые ВПЕРЁД, просрочивают записи раньше срока, и одним
      хранением стенных меток это не закрыть: закрывать нечем, метка на диске
      только стенная.

      Закрывается оно наполовину и там, где это дёшево. Пока процесс работает,
      у каждой записи есть ВТОРАЯ метка - монотонная, - и в пределах одного
      запуска считается по ней. Монотонные часы не идут назад и не прыгают от
      синхронизации времени.

      После перезапуска второй метки нет, и остаётся стенная. Это честная
      половина: перевод часов между запусками обойти защиту позволяет, перевод
      во время работы - нет.

    clock_went_backwards: >-
      Запись с меткой БОЛЬШЕ текущего момента остаётся в окне, а не выбрасывается
      как просроченная. Направление ограничительное: подведённые назад часы не
      должны обнулять квоту.
    clock_went_backwards_asymmetry: >-
      У ДВУХ РЕЕСТРОВ ПРАВИЛО РАЗНОЕ, и это выбор, а не небрежность.

      У отправок метка из будущего считается свежей: запись остаётся в окне, и
      квота не обнуляется.

      У входящих сообщений метка из будущего означает, что переписка НЕ тёплая.
      Тепло требует наблюдённого входящего В ОКНЕ, а запись из будущего в окно
      не попадает, - и переписка возвращается в холодные до тех пор, пока часы
      не догонят метку.

      Направление у обоих одно - к отказу. Подведённые назад часы не возвращают
      ни права на новую отправку, ни тепла переписки. Симметричное правило одно
      из двух ослабило бы, и какое именно - зависело бы лишь от того, какой
      реестр вспомнили первым.

      Проверяется сценарием «часы, переведённые назад, права на отправку не
      возвращают» в наборе векторов.

  conformance:
    vectors: spec/conformance/outbound-governor.vectors.json
    clock: virtual
    what_each_vector_declares: >-
      Начальный реестр, поток попыток с виртуальными метками, и ожидаемое решение
      по каждой: пропустить либо отказать с именем упёршегося предела.
    why_virtual: >-
      Пределы часовые. Набор на настоящих часах шёл бы часами и был бы
      невоспроизводим, а шесть реализаций обязаны сойтись по числам, а не по
      удаче.

# --- Допуск наблюдений -----------------------------------------------------
admission_control:
  enabled: true
  rule: >-
    Регистрация наблюдения проверяет, помещается ли его прогнозируемая стоимость
    в бюджет. Не помещается - BudgetExhaustedError со списком того, что придётся
    снять. Сейчас watch() не умеет отказать, и восемь наблюдений по категориям
    плюс двадцать пять по предложениям дают круглосуточный поток запросов, каждый
    из которых формально безобиден.
  cost_source: adapter_capability_profile
  cost_note: >-
    Стоимость тика публикует адаптер: глубина пагинации - свойство адаптера, а не
    спецификации.
  dry_run: monitoring.plan
  dry_run_note: >-
    Возвращает суммарную стоимость набора наблюдений без их регистрации. Место
    этому вызову в быстром старте, а не в справочнике.

# --- Пределы очереди и обработчиков ----------------------------------------
limits:
  min_health_interval_ms: 60000
  min_health_interval_rule: >-
    Срок, раньше которого повторная проверка сессии возвращает кэш, а не идёт на
    площадку.

    ЧИСЛО ВЫБРАНО, А НЕ ИЗМЕРЕНО, и это разные вещи. Здесь оно и не может быть
    измерено: это наша собственная политика, а не свойство площадки. Минута -
    величина, при которой проверка в цикле ядра перестаёт быть заметной нагрузкой
    и всё ещё замечает истёкшую сессию быстрее, чем это заметит покупатель.

    До 0.14.0 у срока было ИМЯ И НЕ БЫЛО ЧИСЛА: операция обещала кэш, механизма
    не существовало, и договориться о частоте шесть реализаций не смогли бы при
    всём желании.

  max_queue_depth_per_key: 128
  max_concurrent_handlers: 8
  handler_timeout_ms: 30000
  max_connections_per_host: 4
  max_response_bytes: 8388608
  max_decompressed_bytes: 33554432
  max_redirects: 5
  redirect_rule: >-
    Переход на хост за пределами площадки не переносит cookie. Иначе один редирект
    отдаёт сессионный ключ произвольному адресу.

  handler_timeout_rule: >-
    Предел исполняется над ОТМЕНЯЕМЫМ вызовом и только над ним. Отменяемый - тот,
    который вернул ожидаемое: сопрограмму можно снять извне, обычную функцию
    нельзя.

    Признак - вид ВЫЗОВА, а не вид клиента. Асинхронный клиент с обычной функцией
    в обработчиках так же беззащитен, как синхронный: прервать выполняющуюся
    функцию нечем ни в одном из шести языков, кроме как отдельным потоком на
    каждый вызов, а это меняет модель исполнения - обработчик перестаёт
    выполняться в потоке вызывающего.

    Число без правила применения хуже отсутствия числа: реализация, применившая
    его к обычной функции через поток, и реализация, не применившая вовсе, обе
    выглядели бы соблюдающими контракт.

  handler_timeout_note: >-
    Обработчик, ушедший в вечное ожидание и не отменяемый, останавливает цикл
    наблюдения целиком. Ни исключения, ни строки в журнале - клиент просто
    перестаёт ходить на площадку, и внешне это неотличимо от «ничего не
    происходит».

    Отсюда обязанность реализации: если предел над данным вызовом не исполняется,
    об этом сказано в реестре неисполненного, а не умолчано.

# --- Реакция на ограничение ------------------------------------------------
rate_limit_response:
  first: multiply_capacity_by_0_5_and_cooldown
  second_in_window: pause_monitoring_and_automation
  second_note: >-
    Второе ограничение в окне снимает с очереди классы monitoring и automation:
    первый отменяется, второй ждёт. Остаются interactive и poll - то, без чего
    клиент перестаёт быть клиентом.

    Пауза держится до конца остывания идентичности и снимается вместе с ним.
    Ступень выражается именно через классы: без них она была невыполнима, и
    так и стояла невыполненной.

  third_in_window: enter_rate_limited_state
  third_note: >-
    Третье ограничение в окне переводит состояние доступа в rate_limited - см.
    spec/protocol/response-classes.yaml, раздел health. Это уже не про темп, а
    про то, как площадка относится к аккаунту: автоматика записи
    приостанавливается, и возобновляется она не сама.

    Разница со второй ступенью в том, кто решает. Пауза второй ступени
    истекает; состояние третьей - нет.
  recovery: increase_capacity_by_10_percent_per_successful_window

  # Числа. Прежде раздел называл ступени именами и не давал ни одного значения:
  # реализация не могла его выполнить, даже захотев, - «умножить на 0.5» видно
  # из имени, а сколько остывать и что считать окном, не видно ниоткуда.
  capacity_multiplier: 0.5
  min_capacity_factor: 0.125
  min_capacity_note: >-
    Ниже этого ёмкость не опускается. Три ограничения подряд урезают её в восемь
    раз, и дальше урезать бессмысленно: при таком темпе клиент уже почти не
    ходит, а ограничения продолжаются - значит дело не в темпе, и лечится оно
    остановкой, а не дальнейшим замедлением.
  cooldown_ms: 60000
  cooldown_note: >-
    Умножается на номер ограничения в окне: первое даёт минуту, второе две, и
    так далее. Ступенчатость важнее величины - площадка видит, что источник
    отступает всё сильнее.
  window_ms: 900000
  window_note: >-
    Окно учёта ограничений. Ограничение, полученное позже окна, начинает счёт
    заново: иначе счётчик копился бы вечно и первое же ограничение через сутки
    считалось бы третьим подряд.
  successes_per_step: 20
  recovery_multiplier: 1.1
  successes_note: >-
    Ёмкость возвращается по десятой доле за каждые двадцать успешных запросов
    подряд. Любое ограничение обнуляет счёт: восстановление начинается заново.

  asymmetry_rule: >-
    Восстановление медленнее падения намеренно. Симметричное восстановление даёт
    автоколебания: система отступает, тут же возвращается к прежней частоте,
    получает ограничение снова и так по кругу.

# --- Что этим проверяется --------------------------------------------------
conformance:
  suite: rate-budget
  source: spec/conformance/rate-budget.vectors.json
  determinism: virtual_clock
  vectors:
    - >-
        Трасса из логических операций на входе, список виртуальных меток отправки
        на выходе. Сравнимо между языками так же, как решение о повторе.
    - >-
        Десять логических аккаунтов в одном процессе: суммарная трасса не
        превышает ёмкость ведра сетевой идентичности. Это проверка того, что
        единица учёта выбрана правильно.
    - >-
        Насыщенный бюджет и одновременная выдача interactive и monitoring:
        interactive обслуживается раньше независимо от порядка поступления.
